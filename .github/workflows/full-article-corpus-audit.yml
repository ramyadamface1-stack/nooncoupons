name: Full Article Corpus Audit

on:
  workflow_run:
    workflows: ["Deploy Live Worker"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-article-corpus-audit
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Decide authoritative corpus audit impact
        id: impact
        shell: bash
        run: |
          set -euo pipefail
          files=(
            article-corpus-audit.js
            article-quality-runtime.js
            quality-index.js
            article-audit-lock.js
          )
          for f in "${files[@]}"; do test -f "$f" || { echo "MISSING_AUDIT_INPUT=$f"; exit 1; }; done
          current_hash="$(for f in "${files[@]}"; do printf '%s  ' "$f"; sha256sum "$f" | awk '{print $1}'; done | sha256sum | awk '{print $1}')"
          previous_hash="$(jq -r '.auditInputHash // ""' ops/latest-corpus-audit.json 2>/dev/null || true)"
          previous_ok="$(jq -r '((.proofVersion // 0) >= 5) and ((.readFailures // 1) == 0) and (.collisionOwnerAnalysis.done == true) and (.discoveryManifest.complete == true)' ops/latest-corpus-audit.json 2>/dev/null || echo false)"
          run_audit=1
          reason='audit-input-changed-or-proof-missing'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            reason='manual-authoritative-audit'
          elif [ "$previous_ok" = "true" ] && [ -n "$previous_hash" ] && [ "$previous_hash" = "$current_hash" ]; then
            run_audit=0
            reason='authoritative-proof-current'
          fi
          echo "run_audit=$run_audit" >> "$GITHUB_OUTPUT"
          echo "audit_input_hash=$current_hash" >> "$GITHUB_OUTPUT"
          echo "AUDIT_IMPACT run=$run_audit reason=$reason current=$current_hash previous=$previous_hash proof_ok=$previous_ok"

      - name: Reuse current authoritative corpus proof
        if: steps.impact.outputs.run_audit == '0'
        run: |
          echo "CORPUS_AUDIT_REUSED=1"
          jq -c '{proofVersion,auditInputHash,runId,scanned,readFailures,collisionOwnerAnalysis:{done:.collisionOwnerAnalysis.done,scanned:.collisionOwnerAnalysis.scanned},discoveryManifest:{complete:.discoveryManifest.complete,articles:.discoveryManifest.articles,shards:.discoveryManifest.shards}}' ops/latest-corpus-audit.json

      - name: Audit every R2 article
        if: steps.impact.outputs.run_audit == '1'
        env:
          AUDIT_INPUT_HASH: ${{ steps.impact.outputs.audit_input_hash }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
          ACCOUNT_ID: c82274152a942dea53044eae7153cfd7
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://nooncoupons.ramychatgptgcoupons.workers.dev'
          [ -n "${CF_TOKEN:-}" ] || { echo 'MISSING_CF_TOKEN'; exit 10; }
          echo "::add-mask::$CF_TOKEN"
          AUTH="Authorization: Bearer $CF_TOKEN"

          code=$(curl -sS -o /tmp/cf-check.json -w '%{http_code}' -H "$AUTH" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/services/nooncoupons" || true)
          [ "$code" = "200" ] && [ "$(jq -r '.success // false' /tmp/cf-check.json)" = "true" ] || { cat /tmp/cf-check.json; exit 10; }

          reuse_corpus=false
          complete=false
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            if curl -fsS --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 60 \
              -H "$AUTH" "$ORIGIN/api/article-corpus-audit-health?reuse=1" -o /tmp/existing-final.json; then
              if jq -e '.ok==true and .version==4 and .auditModel=="rendered-live-v4" and .promoClaimModel=="block-aware-v1" and .runtimeArticleQualityVersion==6 and .done==true and .scanDone==true and .readFailures==0 and .duplicateListedKeys==0 and (.scanned//0)>0 and .uniqueArticles==.scanned' /tmp/existing-final.json >/dev/null; then
                cp /tmp/existing-final.json /tmp/final.json
                reuse_corpus=true
                complete=true
                echo "ARTICLE_CORPUS_REUSE runId=$(jq -r '.runId' /tmp/final.json) scanned=$(jq -r '.scanned' /tmp/final.json)"
              fi
            fi
          fi
          if [ "$reuse_corpus" != "true" ]; then
          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 60 \
            -X POST -H "$AUTH" -H 'Content-Type: application/json' \
            --data "{\"reset\":true,\"limit\":1000,\"runId\":\"${GITHUB_RUN_ID}\"}" \
            "$ORIGIN/api/internal/article-corpus-audit-step?reset=${GITHUB_RUN_ID}" -o /tmp/start.json
          jq -e '.ok==true and .reset==true and .version==4 and .runId=="'${GITHUB_RUN_ID}'"' /tmp/start.json >/dev/null
          echo "ARTICLE_AUDIT_RESET scanned=$(jq -r '.scanned // 0' /tmp/start.json) version=$(jq -r '.version' /tmp/start.json)"
          echo "ARTICLE_AUDIT_WRITER_DRAIN=2s"
          sleep 2

          complete=false
          transient=0
          for i in $(seq 1 300); do
            [ "$complete" = "true" ] && break
            if ! curl -fsS --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 120 \
              -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              --data "{\"limit\":1000,\"runId\":\"${GITHUB_RUN_ID}\"}" \
              "$ORIGIN/api/internal/article-corpus-audit-step?run=${GITHUB_RUN_ID}-$i" -o /tmp/step.json; then
              transient=$((transient+1))
              echo "ARTICLE_AUDIT_TRANSIENT step=$i count=$transient"
              sleep 5
              continue
            fi
            transient=0
            ok=$(jq -r '.ok // false' /tmp/step.json)
            scanned=$(jq -r '.scanned // 0' /tmp/step.json)
            done=$(jq -r '.done // false' /tmp/step.json)
            readFailures=$(jq -r '.readFailures // 0' /tmp/step.json)
            echo "ARTICLE_AUDIT_PROGRESS step=$i scanned=$scanned readFailures=$readFailures done=$done"
            [ "$ok" = "true" ] || { cat /tmp/step.json; exit 1; }
            if [ "$done" = "true" ]; then complete=true; break; fi
            if [ "$(jq -r '.scanDone // false' /tmp/step.json)" = "true" ] && [ "$readFailures" != "0" ]; then
              echo "ARTICLE_AUDIT_SCAN_FINISHED_WITH_READ_FAILURES=$readFailures"
              break
            fi
            sleep 1
          done

          fi

          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 60 \
            -H "$AUTH" "$ORIGIN/api/article-corpus-audit-health?final=${GITHUB_RUN_ID}" -o /tmp/final.json
          jq -e '.ok==true and .version==4 and .auditModel=="rendered-live-v4" and .promoClaimModel=="block-aware-v1" and .runtimeArticleQualityVersion==6' /tmp/final.json >/dev/null
          CORPUS_RUN_ID="$(jq -r '.runId // ""' /tmp/final.json)"
          [ -n "$CORPUS_RUN_ID" ] || { echo 'CORPUS_RUN_ID_MISSING'; exit 1; }
          jq -c '{
            version,auditModel,promoClaimModel,uniquenessModel,runId,runtimeArticleQualityVersion,runtimeGuarantees,uniqueArticles,scanned,readFailures,bytes,listCalls,listedObjects,htmlObjectsListed,duplicateListedKeys,countSnapshotKey,languages,wordBands,
            duplicateTitles,exactDuplicateContent,semanticSignatureCollisions,
            scoreAverage:(. as $x | reduce (.scoreSums|keys[]) as $k ({}; .[$k]=((($x.scoreSums[$k] / ($x.scanned|if .==0 then 1 else . end))*10|round)/10))),
            scoreHist,issues,samples,scanDone,done,startedAt,completedAt
          }' /tmp/final.json > /tmp/summary.json
          echo "ARTICLE_CORPUS_AUDIT_FINAL=$(cat /tmp/summary.json)"
          [ "$(jq -r '.scanDone // false' /tmp/final.json)" = "true" ] || { echo 'ARTICLE_AUDIT_NOT_FULL_SCAN'; exit 1; }
          [ "$(jq -r '.readFailures // 0' /tmp/final.json)" = "0" ] || { echo 'ARTICLE_AUDIT_HAS_READ_FAILURES'; exit 1; }
          [ "$(jq -r '.duplicateListedKeys // 0' /tmp/final.json)" = "0" ] || { echo 'ARTICLE_AUDIT_DUPLICATE_LIST_KEYS'; exit 1; }
          [ "$(jq -r '.uniqueArticles // 0' /tmp/final.json)" = "$(jq -r '.scanned // 0' /tmp/final.json)" ] || { echo 'ARTICLE_AUDIT_UNIQUE_COUNT_MISMATCH'; exit 1; }
          [ "$complete" = "true" ] || { echo 'ARTICLE_AUDIT_NOT_COMPLETE'; exit 1; }

          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 \
            "$ORIGIN/api/article-count-health?fresh=1&audit=${CORPUS_RUN_ID}" -o /tmp/count.json
          jq -e --argjson scanned "$(jq -r '.scanned' /tmp/final.json)" '.ok==true and .complete==true and .source=="article-corpus-audit-v4" and .auditVersion==4 and .count==$scanned' /tmp/count.json >/dev/null
          echo "ARTICLE_COUNT_AUTHORITATIVE=$(jq -c '{count,countedAt,source,complete,auditVersion,auditModel,runId,listCalls,listedObjects}' /tmp/count.json)"

          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 60 \
            -X POST -H "$AUTH" -H 'Content-Type: application/json' \
            --data "{\"reset\":true,\"limit\":1000,\"runId\":\"${GITHUB_RUN_ID}\"}" \
            "$ORIGIN/api/internal/article-collision-owner-step?reset=${GITHUB_RUN_ID}" -o /tmp/owner-start.json
          jq -e '.ok==true and .reset==true and .runId=="'${GITHUB_RUN_ID}'"' /tmp/owner-start.json >/dev/null
          echo "COLLISION_OWNER_RESET titleTargets=$(jq -r '.titleTargets // 0' /tmp/owner-start.json) semanticTargets=$(jq -r '.semanticTargets // 0' /tmp/owner-start.json)"

          owner_complete=false
          for i in $(seq 1 300); do
            [ "$owner_complete" = "true" ] && break
            curl -fsS --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 120 \
              -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              --data "{\"limit\":1000,\"runId\":\"${GITHUB_RUN_ID}\"}" \
              "$ORIGIN/api/internal/article-collision-owner-step?run=${GITHUB_RUN_ID}-$i" -o /tmp/owner-step.json
            jq -e '.ok==true' /tmp/owner-step.json >/dev/null
            owner_done=$(jq -r '.done // false' /tmp/owner-step.json)
            owner_scanned=$(jq -r '.scanned // 0' /tmp/owner-step.json)
            owner_failures=$(jq -r '.readFailures // 0' /tmp/owner-step.json)
            echo "COLLISION_OWNER_PROGRESS step=$i scanned=$owner_scanned readFailures=$owner_failures done=$owner_done"
            if [ "$owner_done" = "true" ]; then owner_complete=true; break; fi
            sleep 1
          done

          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 60 \
            -H "$AUTH" "$ORIGIN/api/article-collision-owner-health?final=${GITHUB_RUN_ID}" -o /tmp/owner.json
          jq -e --arg owner "${GITHUB_RUN_ID}" --arg source "$CORPUS_RUN_ID" '.ok==true and .version==4 and .done==true and .scanDone==true and .readFailures==0 and .runId==$owner and .sourceAuditRunId==$source and .ownerSnapshotModel=="r2-uploaded-cutoff-v1" and (.skippedMissingUploaded//0)==0' /tmp/owner.json >/dev/null
          [ "$owner_complete" = "true" ] || { echo 'COLLISION_OWNER_ANALYSIS_NOT_COMPLETE'; exit 1; }
          [ "$(jq -r '.scanned // 0' /tmp/owner.json)" = "$(jq -r '.scanned // 0' /tmp/final.json)" ] || { echo 'COLLISION_OWNER_SOURCE_SNAPSHOT_MISMATCH'; exit 1; }
          [ "$(jq -r '.sourceAuditRunId // ""' /tmp/owner.json)" = "$(jq -r '.runId // ""' /tmp/final.json)" ] || { echo 'COLLISION_OWNER_SOURCE_RUN_MISMATCH'; exit 1; }
          echo "COLLISION_OWNER_FINAL=$(jq -c '{version,runId,sourceAuditRunId,sourceAuditScanned,sourceAuditCutoff,ownerSnapshotModel,scanned,readFailures,listedObjects,skippedAfterCutoff,skippedMissingUploaded,titleTargets,contentTargets,semanticTargets,discoveryArticles,discoveryShards,discoveryPolicy,title,semantic,done,completedAt}' /tmp/owner.json)"


          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 60 \
            -H "$AUTH" "$ORIGIN/api/article-discovery-health?final=${GITHUB_RUN_ID}" -o /tmp/discovery.json
          jq -e --arg owner "${GITHUB_RUN_ID}" --arg source "$CORPUS_RUN_ID" --argjson scanned "$(jq -r '.scanned' /tmp/final.json)" '
            .ok==true and .version==1 and .complete==true and .runId==$owner and .sourceAuditRunId==$source and .sourceAuditScanned==$scanned and ((.sourceAuditCutoff|type)=="string") and ((.sourceAuditCutoff|length)>0) and .ownerSnapshotModel=="r2-uploaded-cutoff-v1" and .articles>=0 and .shards>=0
          ' /tmp/discovery.json >/dev/null
          echo "ARTICLE_DISCOVERY_FINAL=$(jq -c '{version,complete,runId,sourceAuditRunId,sourceAuditScanned,sourceAuditCutoff,ownerSnapshotModel,articles,shards,policy,generatedAt}' /tmp/discovery.json)"

          jq -s --arg auditInputHash "$AUDIT_INPUT_HASH" '.[0] + {
            auditInputHash: $auditInputHash,
            authoritativeCount: (.[1] | {count,countedAt,source,complete,auditVersion,auditModel,runId,listCalls,listedObjects}),
            collisionOwnerAnalysis: (.[2] | {version,runId,sourceAuditRunId,sourceAuditVersion,sourceAuditScanned,sourceAuditCutoff,ownerSnapshotModel,scanned,readFailures,listCalls,listedObjects,skippedAfterCutoff,skippedMissingUploaded,titleTargets,contentTargets,semanticTargets,discoveryArticles,discoveryShards,discoveryPolicy,title,semantic,scanDone,done,startedAt,completedAt,stateKey}),
            discoveryManifest: (.[3] | {version,complete,runId,sourceAuditRunId,sourceAuditScanned,sourceAuditCutoff,ownerSnapshotModel,articles,shards,policy,generatedAt,key}),
            proofVersion:5
          }' /tmp/summary.json /tmp/count.json /tmp/owner.json /tmp/discovery.json > /tmp/proof.json

      - name: Persist authoritative corpus audit proof
        if: steps.impact.outputs.run_audit == '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          cp /tmp/proof.json ops/latest-corpus-audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          git add ops/latest-corpus-audit.json
          if git diff --cached --quiet; then
            echo "CORPUS_AUDIT_PROOF_ALREADY_CURRENT=1"
            exit 0
          fi
          git commit -m "Record authoritative corpus audit proof [skip ci]"
          git push origin HEAD:main
          echo "CORPUS_AUDIT_PROOF_RECORDED=1"
