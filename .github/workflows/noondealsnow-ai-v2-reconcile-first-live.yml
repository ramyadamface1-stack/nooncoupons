name: NoonDealsNow AI V2 Reconcile First Live Article
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noondealsnow-ai-v2-reconcile-first-live.yml'
permissions:
  contents: read
jobs:
  one-time-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_PUBLISH_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
    steps:
      - name: Reconcile only the independently LIVE_VERIFIED Ninja article
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SITE_PUBLISH_TOKEN:-}" ] || { echo 'EXISTING_SITE_AUTH_TOKEN_MISSING'; exit 20; }
          code=$(curl -sS --max-time 28 -o /tmp/ndn-ai-v2-ledger-reconcile.json -w '%{http_code}' \
            -H "Authorization: Bearer ${SITE_PUBLISH_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"slug":"uae-ninja-airfryer-capacity-warranty-checklist-2026"}' \
            'https://noondealsnow.com/api/internal/ai-v2/reconcile')
          echo "RECONCILIATION_HTTP=$code"
          if [ "$code" != 200 ]; then
            jq '{ok,reason}' /tmp/ndn-ai-v2-ledger-reconcile.json || true
            exit 21
          fi
          jq -e '.ok == true and .verifiedInR2 == true and .count >= 1' /tmp/ndn-ai-v2-ledger-reconcile.json >/dev/null
          echo 'AI_V2_EXISTING_ARTICLE_R2_METADATA=VERIFIED'
          jq '{ok,recorded,alreadyPresent,count,verifiedInR2}' /tmp/ndn-ai-v2-ledger-reconcile.json
          echo 'No article, title, slug, or provider checkpoint has been modified.' >> "$GITHUB_STEP_SUMMARY"
