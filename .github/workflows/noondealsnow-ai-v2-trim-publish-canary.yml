name: NoonDealsNow AI V2 Trim and Publish Canary
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noondealsnow-ai-v2-trim-publish-canary.yml'
permissions:
  contents: read
concurrency:
  group: noondealsnow-ai-v2-single-site
  cancel-in-progress: false
jobs:
  native-quality-only:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: No provider calls, verify deterministic renderer and security
        run: |
          node --check automation/ai-v2/run.mjs
          node --test tests/ai-v2-native-article.test.mjs tests/ai-v2-guardrails.test.mjs
      - name: Reprocess 2195-word saved UAE draft, native audit and live verification
        shell: bash
        env:
          AI_PREFLIGHT_ONLY: 'false'
          AI_ONE_OFF_CANARY: 'true'
          AI_CANARY_MARKET: 'AE'
          AI_REPROCESS_SAVED_DRAFT: 'true'
          AI_NO_PROVIDER_CALLS: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.NOONDEALSNOW_AI_R2_CHECKPOINT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e4c35f8a50a7b2e4cfb9d6c534962603
          NOONDEALSNOW_AI_FREE_ONLY_APPROVED: ${{ secrets.NOONDEALSNOW_AI_FREE_ONLY_APPROVED }}
          NOONDEALSNOW_AI_SITE_PUBLISH_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo 'R2_CHECKPOINT_TOKEN_MISSING'; exit 13; }
          [ -n "${NOONDEALSNOW_AI_SITE_PUBLISH_TOKEN:-}" ] || { echo 'SITE_PUBLISH_TOKEN_MISSING'; exit 14; }
          npm install --no-audit --no-fund --ignore-scripts
          node automation/ai-v2/run.mjs | tee /tmp/ndn-no-ai-trim.log
          echo '### NoonDealsNow — zero-AI checkpoint repair / native publication gate' >> "$GITHUB_STEP_SUMMARY"
          grep '^AI_V2_REPORT ' /tmp/ndn-no-ai-trim.log >> "$GITHUB_STEP_SUMMARY" || true
          echo 'Zero Gemini/Groq calls. Only LIVE_VERIFIED with public URL response constitutes a published article.' >> "$GITHUB_STEP_SUMMARY"
