name: R2 HEAD Immediate Trend After Fix

on:
  push:
    paths:
      - '.github/workflows/r2-head-postfix-immediate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
    steps:
      - name: Inspect HEAD groups for the previous 60 minutes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN;
          if(!token){console.log('COST_PROBE=missing_cloudflare_token');process.exit(2)}
          const end=new Date(),start=new Date(Date.now()-3600000);
          const query='query($accountTag: string!, $startDate: Time, $endDate: Time, $bucketName: string){viewer{accounts(filter:{accountTag:$accountTag}){r2OperationsAdaptiveGroups(limit:1000,filter:{datetime_geq:$startDate,datetime_leq:$endDate,bucketName:$bucketName,actionType:"HeadObject"}){sum{requests}dimensions{datetimeFiveMinutes actionStatus}}}}}';
          const variables={accountTag:'c82274152a942dea53044eae7153cfd7',startDate:start.toISOString(),endDate:end.toISOString(),bucketName:'nooncoupons-content-v2'};
          const response=await fetch('https://api.cloudflare.com/client/v4/graphql',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({query,variables})});
          const j=await response.json(),rows=j?.data?.viewer?.accounts?.[0]?.r2OperationsAdaptiveGroups;
          if(!response.ok||j.errors?.length||!Array.isArray(rows)){console.log('COST_PROBE=api_unavailable');process.exit(3)}
          const buckets=new Map();
          for(const row of rows){const key=row.dimensions?.datetimeFiveMinutes;if(key)buckets.set(key,(buckets.get(key)||0)+Number(row.sum?.requests||0))}
          const sorted=[...buckets.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
          for(const [k,n] of sorted)console.log('POST_FIX_HEAD_5MIN '+k+' '+n);
          console.log('COST_PROBE_BUCKETS='+sorted.length);
          NODE
