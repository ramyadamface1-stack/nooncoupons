name: Scale Article Output

on:
  push:
    paths:
      - '.github/workflows/scale-article-output.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Enable catch-up production to 8000
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('bulk-generator.js')
          s=p.read_text()
          old="batch=Math.max(1,Math.min(10,Number(batchSize||3)))"
          new="batch=Math.max(1,Math.min(24,Number(batchSize||3)))"
          if old not in s:
              raise SystemExit('bulk batch clamp pattern not found')
          p.write_text(s.replace(old,new,1))

          p=Path('admin-runtime.js')
          s=p.read_text()
          old="const bulk=await runProgrammaticBatch(this.env,cfg,afterLegacy,{dailyTarget:Number(this.env.BULK_DAILY_TARGET||2000),batchSize:Number(this.env.BULK_BATCH_SIZE||2)});"
          new="const catchupGoal=Math.max(0,Number(this.env.BULK_CATCHUP_TOTAL||8000)),publishedTotal=Math.max(0,Number(afterLegacy.bulkPublishedTotal||0)),steadyBatch=Math.max(1,Number(this.env.BULK_BATCH_SIZE||10)),catchupBatch=Math.max(steadyBatch,Number(this.env.BULK_CATCHUP_BATCH_SIZE||18)),effectiveBatch=publishedTotal<catchupGoal?catchupBatch:steadyBatch;\n        const bulk=await runProgrammaticBatch(this.env,cfg,afterLegacy,{dailyTarget:Number(this.env.BULK_DAILY_TARGET||10000),batchSize:effectiveBatch});"
          if old not in s:
              raise SystemExit('admin bulk call pattern not found')
          p.write_text(s.replace(old,new,1))

          p=Path('wrangler.jsonc')
          s=p.read_text()
          replacements={
            '"BULK_DAILY_TARGET": "5000"':'"BULK_DAILY_TARGET": "10000"',
            '"BULK_BATCH_SIZE": "4"':'"BULK_BATCH_SIZE": "10"',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'wrangler pattern not found: {old}')
              s=s.replace(old,new,1)
          marker='"BULK_BATCH_SIZE": "10",'
          extra='"BULK_BATCH_SIZE": "10",\n    "BULK_CATCHUP_TOTAL": "8000",\n    "BULK_CATCHUP_BATCH_SIZE": "18",'
          s=s.replace(marker,extra,1)
          p.write_text(s)
          PY
          git config user.name "nooncoupons-automation"
          git config user.email "actions@users.noreply.github.com"
          git add bulk-generator.js admin-runtime.js wrangler.jsonc
          git diff --cached --check
          git commit -m "Accelerate article production to catch up to 8000"
          git push origin HEAD:main
