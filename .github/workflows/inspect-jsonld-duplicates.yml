name: Inspect Existing JSON-LD Types Before Surgical Deduplication
on:
  push:
    branches: [fix/deduplicate-live-jsonld-20261019]
    paths: ['.github/workflows/inspect-jsonld-duplicates.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read JSON-LD structures and meta summary without changes
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,re,json
          paths=['/','/articles/شراء-الجوالات-من-نون-السعودية-باستخدام-كوبون-لشراء-ذكي','/en/articles/en-noon-uae-coupon-conditions-guide','/saudi/brand/apple']
          for p in paths:
            req=urllib.request.Request('https://noondealsnow.com'+urllib.parse.quote(p,safe='/'),headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=25) as r:body=r.read().decode('utf8','replace')
            rows=[]
            for i,src in enumerate(re.findall(r'<script\\b[^>]*type=["\\\']application/ld\\+json["\\\'][^>]*>([\\s\\S]*?)</script>',body,re.I)):
              try:
                data=json.loads(src)
                nodes=data if isinstance(data,list) else [data]
                out=[]
                for n in nodes:
                  if not isinstance(n,dict):continue
                  out.append({'top_type':n.get('@type'),'graph_types':[x.get('@type') for x in n.get('@graph',[]) if isinstance(x,dict)],'top_keys':list(n.keys())[:8],'datePublished':n.get('datePublished'),'mainEntityOfPage_type':type(n.get('mainEntityOfPage')).__name__})
                rows.extend(out)
              except Exception as e:rows.append({'error':str(e)[:100]})
            print('JSONLD_STRUCTURE='+json.dumps({'path':p,'nodes':rows},ensure_ascii=False)[:4200],flush=True)
          PY
