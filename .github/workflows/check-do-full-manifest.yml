name: DO ControlPlane Full Manifest Readiness Check

on:
  push:
    paths:
      - '.github/workflows/check-do-full-manifest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SRC_ID: ${{ secrets.NOON_OLD_R2_ACCESS_KEY_ID }}
      SRC_SECRET: ${{ secrets.NOON_OLD_R2_SECRET_ACCESS_KEY }}
      DEST_ID: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
      DEST_SECRET: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
    steps:
      - run: python3 -m pip install --quiet boto3
      - name: Check all DO state archive parts and manifests in both accounts
        shell: bash
        run: |
          set -euo pipefail
          python3 -u - <<'PY'
          import boto3,os,json
          from botocore.config import Config
          from botocore.exceptions import ClientError
          def s3(account,a,s):
              return boto3.client('s3',region_name='auto',endpoint_url='https://'+account+'.r2.cloudflarestorage.com',aws_access_key_id=os.environ[a].strip(),aws_secret_access_key=os.environ[s].strip(),config=Config(signature_version='s3v4',read_timeout=30,retries={'max_attempts':3}))
          data=(('SOURCE',s3('c82274152a942dea53044eae7153cfd7','SRC_ID','SRC_SECRET')),
                ('TARGET',s3('e4c35f8a50a7b2e4cfb9d6c534962603','DEST_ID','DEST_SECRET')))
          for label,client in data:
              for typ in ('ControlPlane','GeneratorControl'):
                  prefix='migration/do-state/20261017-baseline/'+typ+'/'
                  count=0;last=None
                  for page in client.get_paginator('list_objects_v2').paginate(Bucket='nooncoupons-content-v2',Prefix=prefix,PaginationConfig={'PageSize':1000}):
                      for obj in page.get('Contents',()):
                          count+=1
                          if last is None or obj['LastModified']>last:last=obj['LastModified']
                  try:
                      marker=client.get_object(Bucket='nooncoupons-content-v2',Key=prefix+'manifest.json')
                      try:manifest=json.loads(marker['Body'].read(20000))
                      finally:marker['Body'].close()
                  except ClientError as e:
                      if str(e.response.get('Error',{}).get('Code','')) not in ('404','NoSuchKey','NotFound'):raise
                      manifest=None
                  print(label+'_'+typ.upper()+'_PARTS_PRESENT='+str(max(0,count-int(bool(manifest))))+';MANIFEST='+str(bool(manifest)).lower()+';LAST_CHANGE='+str(last),flush=True)
                  if manifest:
                      print(label+'_'+typ.upper()+'_MANIFEST_DETAILS='+
                            json.dumps({k:manifest.get(k) for k in ('complete','parts','exported','scanned','completedAt')}),flush=True)
                  if label=='SOURCE' and typ=='ControlPlane' and not manifest:
                      print('CONTROLPLANE_RESTORE_BLOCKED=source_export_in_progress')
          PY
