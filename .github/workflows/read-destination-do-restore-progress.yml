name: Inspect Destination Durable Object Restore Progress

on:
  push:
    paths:
      - '.github/workflows/read-destination-do-restore-progress.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      R2_ID: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
      R2_SECRET: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
    steps:
      - run: python3 -m pip install --quiet boto3
      - name: Inspect private destination R2 restore markers only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,boto3
          from botocore.exceptions import ClientError
          c=boto3.client('s3',region_name='auto',endpoint_url='https://e4c35f8a50a7b2e4cfb9d6c534962603.r2.cloudflarestorage.com',aws_access_key_id=os.environ['R2_ID'].strip(),aws_secret_access_key=os.environ['R2_SECRET'].strip())
          for typ in ('ControlPlane','GeneratorControl'):
              key='migration/restore-progress/20261017-baseline/'+typ+'.json'
              try:r=c.get_object(Bucket='nooncoupons-content-v2',Key=key)
              except ClientError as e:
                  if str(e.response.get('Error',{}).get('Code')) in ('404','NoSuchKey','NotFound'):
                      print('RESTORE_PROGRESS_'+typ+'=not_yet_reported')
                      continue
                  raise
              try:obj=json.loads(r['Body'].read(20000))
              finally:r['Body'].close()
              print('RESTORE_PROGRESS_'+typ+'='+json.dumps({k:obj.get(k) for k in ('complete','partsDone','partsTotal','keysRestored','keysTotal','updatedAt')}),flush=True)
          PY
