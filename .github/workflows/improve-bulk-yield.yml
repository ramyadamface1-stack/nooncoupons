name: Improve Bulk Yield
on:
  push:
    paths:
      - '.github/workflows/improve-bulk-yield.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Optimize yield without changing gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('keyword-strategy.js'); s=p.read_text()
          needle="function market(t){return clean(t.market)}\nfunction cat(t){return clean(t.category)}\n"
          insert="function market(t){return clean(t.market)}\nfunction cat(t){return clean(t.category)}\nfunction specificityParts(t,intent){\n  const u=clean(t.useCase),f=clean(t.factor),parts=['compare','seller','value','finalprice','warranty'].includes(intent)?[f,u]:[u,f];\n  return [...new Set(parts.filter(Boolean))].sort((a,b)=>a.length-b.length);\n}\nfunction addSpecificity(kw,t,intent,s){\n  let out=clean(kw),added=0;\n  for(const part of specificityParts(t,intent)){\n    if(out.includes(part)){added++;continue}\n    const candidate=clean(`${out} ${part}`);\n    if(candidate.length<=70){out=candidate;added++}\n  }\n  if(added)return out;\n  const sc=clean(s);\n  if(sc&&out.includes(sc)){\n    const base=clean(out.replace(sc,' '));\n    for(const part of specificityParts(t,intent)){\n      const candidate=clean(`${base} ${part}`);\n      if(candidate.length<=70)return candidate;\n    }\n  }\n  return out;\n}\n"
          if needle not in s: raise SystemExit('keyword helper anchor not found')
          s=s.replace(needle,insert,1)
          old="const kw=fitKeyword(builder(topic,s),topic,intent,s),slug=slugify(kw),title=kw,words=kw.split(/\\s+/).filter(Boolean).length;"
          new="const baseKw=fitKeyword(builder(topic,s),topic,intent,s),kw=addSpecificity(baseKw,topic,intent,s),slug=slugify(kw),title=kw,words=kw.split(/\\s+/).filter(Boolean).length;"
          if old not in s: raise SystemExit('keyword apply anchor not found')
          s=s.replace(old,new,1).replace("keywordStrategy:'search-intent-v3-sales'","keywordStrategy:'search-intent-v4-longtail'",1).replace("version:'search-intent-v3-sales'","version:'search-intent-v4-longtail'",1)
          p.write_text(s)

          p=Path('quality-index.js'); s=p.read_text()
          old="    if(e.intentKey&&e.intentKey===ik)intentCollision=true;\n    if(!e.intent||e.intent===topic?.intent){const s=keywordSimilarity(article?.primaryKeyword||topic?.kw,e.primaryKeyword||'');if(s>maxKeywordSimilarity){maxKeywordSimilarity=s;nearest=e}}\n    if(e.signature&&audit?.signature){const d=signatureDistance(audit.signature,e.signature);if(d<minDistance){minDistance=d;nearest=e}}\n"
          new="    if(e.intentKey&&e.intentKey===ik)intentCollision=true;\n    const sameContext=(!e.country||e.country===topic?.country)&&(!e.category||e.category===topic?.category);\n    if(sameContext&&(!e.intent||e.intent===topic?.intent)){const s=keywordSimilarity(article?.primaryKeyword||topic?.kw,e.primaryKeyword||'');if(s>maxKeywordSimilarity){maxKeywordSimilarity=s;nearest=e}}\n    if(sameContext&&e.signature&&audit?.signature){const d=signatureDistance(audit.signature,e.signature);if(d<minDistance){minDistance=d;nearest=e}}\n"
          if old not in s: raise SystemExit('semantic anchor not found')
          p.write_text(s.replace(old,new,1))

          p=Path('bulk-generator.js'); s=p.read_text()
          old="const auditRecent=dedupeRecent([...(cluster.entries||[]),...latestRecent]).slice(0,25000),audit=auditSeoArticle(article,topic,{...cfg,minWords:Math.max(1000,Number(cfg.minWords||1000)),threshold:Math.max(95,Number(cfg.qualityThreshold||95)),recent:auditRecent});"
          new="const contextualRecent=latestRecent.filter(x=>(!x?.country||x.country===topic.country)&&(!x?.category||x.category===topic.category)),auditRecent=dedupeRecent([...(cluster.entries||[]),...contextualRecent]).slice(0,25000),audit=auditSeoArticle(article,topic,{...cfg,minWords:Math.max(1000,Number(cfg.minWords||1000)),threshold:Math.max(95,Number(cfg.qualityThreshold||95)),recent:auditRecent});"
          if old not in s: raise SystemExit('audit recent anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check keyword-strategy.js
          node --check quality-index.js
          node --check bulk-generator.js
          node bulk-selftest.js > /tmp/bulk-selftest.log
          tail -n 3 /tmp/bulk-selftest.log
          grep -q 'READY_COUNT=' /tmp/bulk-selftest.log
          git config user.name nooncoupons-automation
          git config user.email actions@users.noreply.github.com
          git add keyword-strategy.js quality-index.js bulk-generator.js
          git diff --cached --check
          git commit -m 'Improve article candidate yield without relaxing quality gates'
          git push origin HEAD:main
