      - 'tests/ai-v2-blog-publication.test.mjs'
  workflow_dispatch:
  schedule:
    # Daily FREE static sitemap refresh using READ ONLY R2 manifests.
    # This does NOT generate, schedule, or publish any article via GitHub.
    # Avoid hourly/zero-minute congestion; GitHub cron is best effort.
    - cron: '27 3 * * *'
permissions: {contents: read}
concurrency:
  group: ndn-new-account-production-prep
  cancel-in-progress: false
jobs:
  safe-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.NOON_NEW_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e4c35f8a50a7b2e4cfb9d6c534962603
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure destination-only production deployment cannot affect old site or DNS
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          python3 - <<'PY'
          import json,re
          txt=open('wrangler.new-account-production.jsonc').read()
          txt=re.sub(r'^\\s*//.*$', '', txt, flags=re.M)
          c=json.loads(txt)
          assert c['name']=='noondealsnow-production-new'
          assert c['main']=='discovery-entry.js'
          assert c['workers_dev'] is False
          assert c['assets']=={'directory':'./.ndn-static-assets','run_worker_first':False}
          assert c.get('assets',{}).get('not_found_handling') is None
          assert c['triggers']['crons']==[]
          assert c['vars']['GLOBAL_PUBLISH_MIN_INTERVAL_SECONDS']=='30'
          assert c['vars']['GLOBAL_PUBLISH_MAX_PER_MINUTE']=='2'
          assert c['vars']['AI_PRIMARY_PROVIDER']=='disabled'
          assert c['vars']['DO_MIGRATION_RESTORE_ENABLED']=='false'
          assert c['r2_buckets']==[{'binding':'CONTENT_FINAL','bucket_name':'nooncoupons-content-v2'}]
          assert all(x.get('script_name')=='noondealsnow-migration-staging' for x in c['durable_objects']['bindings'])
          assert sorted(x.get('name') for x in c['durable_objects']['bindings'])==['CONTROL','GENERATOR_CONTROL']
          print('NEW_ACCOUNT_WORKER=CONFIG_SAFE;NEW_BUCKET=BOUND;DO_STATE=EXISTING;CRON=DISABLED')
          PY
      - name: Install dependencies for approved source and test suite
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Build and validate quota-independent public SEO assets
        run: |
          node scripts/build-ndn-static-seo-assets.mjs
          node scripts/build-ndn-static-market-sitemaps.mjs
          node --test tests/static-seo-assets.test.mjs
      - name: Build quota-independent complete sitemap index from destination R2 READ ONLY
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_ndn_static_root_sitemap.py' -v
          python3 -m pip install --quiet --disable-pip-version-check boto3
          python3 scripts/build-ndn-static-root-sitemap.py
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          root=pathlib.Path('.ndn-static-assets')
          assert sorted(x.name for x in root.iterdir())==['llms.txt','robots.txt','sitemap-core.xml','sitemap-coupons-saudi.xml','sitemap-coupons-uae.xml','sitemap-coupons.xml','sitemap-guides.xml','sitemap-pages.xml','sitemap.xml']
          data=(root/'sitemap.xml').read_text()
          assert ET.fromstring(data).tag.endswith('sitemapindex')
          for suffix in ['/sitemap-core.xml','/sitemap-ai-v2.xml','/sitemap-pages.xml']:
            assert 'https://noondealsnow.com'+suffix in data
          print('ROOT_SITEMAP_SOURCE_AND_FILE_WHITELIST=PASS')
          PY

      - name: Build native AI V2 sitemap index and every published shard without consuming Worker quotas
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_ndn_static_ai_v2_sitemaps.py' -v
          python3 scripts/build-ndn-static-ai-v2-sitemaps.py
          python3 - <<'PY'
          import pathlib,re,xml.etree.ElementTree as ET
          root=pathlib.Path('.ndn-static-assets')
          names={p.name for p in root.iterdir()}
          baseline={'llms.txt','robots.txt','sitemap-core.xml','sitemap-coupons-saudi.xml',
                    'sitemap-coupons-uae.xml','sitemap-coupons.xml','sitemap-guides.xml',
                    'sitemap-pages.xml','sitemap.xml','sitemap-ai-v2.xml'}
          shards=sorted(x for x in names if re.fullmatch(r'sitemap-ai-v2-[1-9]\d{0,3}\.xml',x))
          assert len(shards)>=1, 'NO_NATIVE_PUBLISHED_SHARDS'
          assert names==baseline|set(shards), 'UNEXPECTED_STATIC_ASSETS'
          index=(root/'sitemap-ai-v2.xml').read_text()
          source=ET.fromstring(index)
          assert source.tag.endswith('sitemapindex'), 'AI_SITEMAP_NO_INDEX'
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs=[node.text for node in source.findall('s:sitemap/s:loc',ns)]
          assert len(locs)==len(shards), 'AI_SHARD_COUNT_MISMATCH'
          urls=0
          for path in shards:
            assert 'https://noondealsnow.com/'+path in locs
            leaf=ET.fromstring((root/path).read_text())
            assert leaf.tag.endswith('urlset')
            links=[x.text for x in leaf.findall('s:url/s:loc',ns)]
            assert 1<=len(links)<=2000
            assert all(s.startswith('https://noondealsnow.com/articles/') for s in links)
            assert len(links)==len(set(links))
            urls+=len(links)
          print('NDN_STATIC_AI_V2_XML_PARITY=PASS;SHARDS='+str(len(shards))+';PUBLISHED_URLS='+str(urls))
          PY
      - name: Prebuild all historical canonical bulk article sitemap shards from destination R2 READ ONLY
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_ndn_static_bulk_article_sitemaps.py' -v
          python3 scripts/build-ndn-static-bulk-article-sitemaps.py
          python3 - <<'PY'
          import pathlib, re, xml.etree.ElementTree as ET
          root=pathlib.Path('.ndn-static-assets')
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          canonical=ET.parse(root/'sitemap.xml').getroot()
          expected={x.text.split('/')[-1] for x in canonical.findall('s:sitemap/s:loc',ns)
                    if re.fullmatch(r'https://noondealsnow\.com/sitemap-articles-20\d{2}-\d{2}-\d{2}-\d{1,4}\.xml',x.text or '')}
          actual={x.name for x in root.glob('sitemap-articles-*.xml')}
          assert expected==actual, 'BULK_STATIC_HISTORIC_SITEMAP_INCOMPLETE'
          assert len(list(root.iterdir()))<20000, 'WORKERS_FREE_ASSET_FILE_LIMIT'
          urls=0
          for file in root.glob('sitemap-articles-*.xml'):
            doc=ET.parse(file).getroot()
            assert doc.tag.endswith('urlset'),file
            links=[x.text for x in doc.findall('s:url/s:loc',ns)]
            assert all(url and url.startswith('https://noondealsnow.com/articles/') for url in links),file
            urls+=len(links)
          assert urls>0 or not expected, 'BULK_ALL_REFERENCED_ARTICLE_SHARDS_EMPTY'
          print('NDN_HISTORIC_BULK_STATIC_SHARD_INTEGRITY=PASS;CANONICAL_SHARDS='+str(len(expected))+';ARTICLE_URL_ENTRIES='+str(urls))
          print('R2_OBJECT_LIST_CALLS=0;R2_WRITES=0;ARTICLE_GENERATION=0;WORKERS_FREE_ASSET_FILES='+str(len(list(root.iterdir()))))
          PY

      - name: Prebuild R2 rescue Arabic/English article, image and catalog XML from ORIGINAL renderer
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_ndn_static_rescue_sitemaps.py' -v
          python3 scripts/stage-ndn-static-rescue-inputs.py
          node scripts/render-ndn-static-rescue-sitemaps.mjs
          python3 - <<'PY'
          import pathlib,re,xml.etree.ElementTree as ET
          root=pathlib.Path('.ndn-static-assets')
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          index=ET.parse(root/'sitemap.xml').getroot()
          matcher=r'https://noondealsnow\.com/sitemap-rescue-(?:(?:articles|images|english|english-images)-\d{1,4}|(?:catalog|english-catalog))\.xml'
          expected={x.text.split('/')[-1] for x in index.findall('s:sitemap/s:loc',ns)
                    if re.fullmatch(matcher,x.text or '')}
          actual={x.name for x in root.glob('sitemap-rescue-*.xml')}
          assert expected==actual, 'RESCUE_STATIC_INCOMPLETE_CANONICAL_SET'
          assert 1<=len(actual)<=600, 'RESCUE_STATIC_NO_OR_TOO_MANY_ASSETS'
          assert len(list(root.iterdir()))<20000, 'WORKERS_FREE_STATIC_ASSET_FILE_COUNT_EXCEEDED'
          entries=0
          for filename in actual:
            tree=ET.parse(root/filename).getroot()
            assert tree.tag.endswith('urlset'),filename
            locs=[x.text for x in tree.findall('s:url/s:loc',ns)]
            assert locs and all(x and x.startswith('https://noondealsnow.com/') for x in locs),filename
            entries+=len(locs)
          print('NDN_RESCUE_STATIC_XML_INTEGRITY=PASS;CANONICAL_FILES='+str(len(expected))+
                ';ARTICLE_OR_CATALOG_LOC_ENTRIES='+str(entries)+
                ';WORKERS_FREE_STATIC_FILES='+str(len(list(root.iterdir()))))
          PY

      - name: Build canonical priority, English, hubs, image XML from read-only R2 inputs
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_ndn_static_discovery_sitemaps.py' -v
          python3 scripts/stage-ndn-static-discovery-inputs.py
          node scripts/render-ndn-static-discovery-sitemaps.mjs
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          root=pathlib.Path('.ndn-static-assets')
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          canonical=ET.parse(root/'sitemap.xml').getroot()
          indexed={node.text for node in canonical.findall('s:sitemap/s:loc',ns)}
          files=['sitemap-priority.xml','sitemap-en-articles.xml','sitemap-hubs.xml','sitemap-images.xml']
          all_urls=0
          for name in files:
            assert 'https://noondealsnow.com/'+name in indexed, 'DISCOVERY_NOT_IN_CANONICAL_ROOT_'+name
            tree=ET.parse(root/name).getroot()
            assert tree.tag.endswith('urlset'),name
            urls=[x.text for x in tree.findall('s:url/s:loc',ns)]
            assert urls and all(u and u.startswith('https://noondealsnow.com/') for u in urls),name
            all_urls+=len(urls)
          assert not (root/'sitemap-live-recent.xml').exists(), 'DYNAMIC_LIVE_RECENT_MUST_REMAIN_UNOVERLAID'
          assert len(list(root.iterdir()))<20000, 'CLOUDFLARE_FREE_STATIC_ASSET_COUNT_EXCEEDED'
          print('NDN_STATIC_DISCOVERY_XML_INTEGRITY=PASS;CANONICAL_FILES=4;URL_ENTRIES='+str(all_urls))
          print('DYNAMIC_LIVE_RECENT_PRESERVED=TRUE;R2_SOURCE_WRITES=ZERO;AI_GENERATION=ZERO')
          PY

      - name: Prebuild public HTML recovery pages as quota-free static assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-ndn-quota-static-fallback.mjs
          node --test tests/ndn-quota-static-fallback.test.mjs
          test "$(find .ndn-static-assets -type f -name '*.html' | wc -l)" -eq 27
          test ! -e .ndn-static-assets/admin.html
          test ! -e .ndn-static-assets/api/health.html
          echo 'NDN_PUBLIC_HTML_EMERGENCY_STATIC=READY;API_ADMIN_ARTICLES_UNTOUCHED=TRUE'

      - name: Restore REAL published article cards and emergency article HTML from original R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          python3 scripts/stage-ndn-static-blog-and-articles.py
          node scripts/render-ndn-static-blog-from-r2.mjs
          node --test tests/ndn-static-native-market-coverage.test.mjs
          node scripts/build-ndn-static-archive-and-images.mjs
          python3 scripts/stage-ndn-complete-r2-article-keys.py
          node scripts/render-ndn-complete-r2-archive.mjs
          node scripts/build-ndn-static-trust-pages.mjs
          node scripts/build-ndn-commercial-static.mjs
          node scripts/build-ndn-legacy-conversion-landing-rescue.mjs
          node scripts/build-ndn-static-all-brand-hubs.mjs
          node --test tests/ndn-static-all-brand-hubs.test.mjs
          node --test tests/ndn-legacy-commercial-static.test.mjs
          node scripts/build-ndn-commercial-sitemap.mjs
          node --test tests/ndn-commercial-sitemap.test.mjs
          node --test tests/ndn-commercial-static.test.mjs tests/ndn-static-trust-pages.test.mjs
          node --test tests/ndn-static-blog-from-r2.test.mjs tests/ndn-static-complete-blog.test.mjs tests/ndn-complete-r2-archive.test.mjs
          echo 'LIVE_BLOG_SOURCE=R2_VERIFIED_PUBLICATIONS;NO_FAKE_GUIDE_ONLY_BLOG=TRUE'

      - name: Check native gate and authenticated secret manager regressions
        run: node --test tests/native-bound-ai-v2-fast.test.mjs tests/ai-v2-global-capacity.test.mjs tests/ai-v2-publishing-cadence.test.mjs tests/ai-v2-native-publish-bridge.test.mjs tests/ai-v2-publication-ledger.test.mjs tests/ai-v2-native-arabic-article.test.mjs tests/ai-v2-github-secrets.test.mjs tests/ai-v2-runtime-telemetry.test.mjs tests/ai-v2-admin-console.test.mjs tests/admin-login-credentials.test.mjs tests/system1-admin.test.mjs tests/system1-keyword-index.test.mjs tests/system1-visuals.test.mjs
      - name: Verify live R2 journal discovery is safe, bounded and market-specific
        run: node --test tests/ndn-live-blog-window.test.mjs tests/blog-premium-ui.test.mjs
      - name: Prevent incorrect AI-readable NOV coupon market mappings
        run: node --test tests/nov-llms-canonical-source.test.mjs

      - name: Verify English article NOV metadata, CTA and FAQ match before deploying
        run: node --test tests/english-coupon-consistency.test.mjs

      - name: Guard official Noon store CTA and market attribution on all coupon details
        run: node --test tests/coupon-official-shop-cta.test.mjs

      - name: Verify real NOV copy success and country before deploying
        run: node --test tests/nov-copy-success-analytics.test.mjs

      - name: Validate crawlable canonical coupon links on landing pages
        run: node --test tests/coupon-hub-canonical-links.test.mjs

      - name: Protect public AI code reference source consistency
        run: node --test tests/llms-primary-route.test.mjs

      - name: Guard crawler-facing XML sitemaps against CPU regression
        run: node --test tests/sitemap-crawler-cpu-bounded.test.mjs

      - name: Verify prebuilt rescue sitemap stream ETag guard before production deploy
        run: node --test tests/geo-prebuilt-rescue-serving.test.mjs tests/geo-prebuilt-rescue-xml.test.mjs

      - name: Guard answer completeness on canonical NOV170 and NOV188 URLs
        run: node --test tests/nov-primary-aeo-country-answer.test.mjs

      - name: Test country coupon lists without changing live codes
        run: node --test tests/market-coupon-routes.test.mjs

      - name: Verify on-site coupon attribution cannot invent sales or codes
        run: node --test tests/coupon-funnel-attribution.test.mjs

      - name: Deploy destination script ONLY, without hostname or DNS modification
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config wrangler.new-account-production.jsonc --outdir /tmp/ndn-production-new-dry
          npx wrangler deploy --config wrangler.new-account-production.jsonc
      - name: Verify destination Worker service exists
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/ndn-worker-ready.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/services/noondealsnow-production-new")
          echo "NEW_PRODUCTION_WORKER_SERVICE_HTTP=$code"
          test "$code" = 200
          jq -e '.success==true' /tmp/ndn-worker-ready.json >/dev/null
          echo 'NEW_PRODUCTION_WORKER_DEPLOYED=TRUE'
          echo 'DNS_CHANGED=FALSE;CUSTOM_DOMAIN_ATTACHED=FALSE;OLD_SITE_MODIFIED=FALSE'
      - name: Confirm static SEO remains HTTP 200 under daily Worker quota exhaustion
        shell: bash
        run: |
          set -euo pipefail
          for path in /robots.txt /sitemap-core.xml /llms.txt /sitemap.xml /sitemap-pages.xml /sitemap-guides.xml /sitemap-coupons.xml /sitemap-coupons-saudi.xml /sitemap-coupons-uae.xml /sitemap-priority.xml /sitemap-en-articles.xml /sitemap-hubs.xml /sitemap-images.xml; do
            code=$(curl -sS --max-time 20 -o /tmp/ndn-static-seo-live -w '%{http_code}' \
              -H 'User-Agent: NDN-static-asset-quota-probe' "https://noondealsnow.com$path" || true)
            echo "STATIC_ASSET_LIVE_PATH=$path;HTTP=$code"
            test "$code" = 200
            case "$path" in
              /robots.txt) grep -q 'User-agent: OAI-SearchBot' /tmp/ndn-static-seo-live ;;
              /sitemap-core.xml) grep -q '<urlset' /tmp/ndn-static-seo-live ;;
              /llms.txt) grep -q 'NOV170' /tmp/ndn-static-seo-live ;;
              /sitemap.xml) grep -q '<sitemapindex' /tmp/ndn-static-seo-live ;;
              /sitemap-pages.xml|/sitemap-guides.xml|/sitemap-coupons.xml) grep -q '<urlset' /tmp/ndn-static-seo-live ;;
              /sitemap-coupons-saudi.xml) grep -q '/coupon/nov170' /tmp/ndn-static-seo-live ;;
              /sitemap-coupons-uae.xml) grep -q '/coupon/nov188' /tmp/ndn-static-seo-live ;;
              /sitemap-priority.xml|/sitemap-en-articles.xml|/sitemap-hubs.xml|/sitemap-images.xml) grep -q '<urlset' /tmp/ndn-static-seo-live ;;
            esac
          done
          # Unlike dynamic Worker XML, these native publication-ledger snapshots
          # remain accessible to crawlers during Cloudflare Error 1027.
          for file in .ndn-static-assets/sitemap-ai-v2*.xml; do
            path="/${file##*/}"
            code=$(curl -sS --max-time 20 -o /tmp/ndn-ai-v2-static-xml -w '%{http_code}' \
              -H 'User-Agent: NDN-ai-v2-static-quota-probe' "https://noondealsnow.com$path" || true)
            echo "AI_V2_STATIC_SITEMAP_LIVE_PATH=$path;HTTP=$code"
            test "$code" = 200
            if [ "$path" = "/sitemap-ai-v2.xml" ]; then
              grep -q '<sitemapindex' /tmp/ndn-ai-v2-static-xml
              grep -q '/sitemap-ai-v2-1.xml' /tmp/ndn-ai-v2-static-xml
            else
              grep -q '<urlset' /tmp/ndn-ai-v2-static-xml
              grep -q '/articles/' /tmp/ndn-ai-v2-static-xml
            fi
          done
          echo 'AI_V2_PUBLISHED_ARTICLE_SITEMAPS_FREE_QUOTA_INDEPENDENT=VERIFIED'
          # Assets deploy atomically, but the first edge request may still
          # observe an old 429 during propagation. Retry narrowly; never
          # call a permanent 429 success or hide a broken archive path.
          check_bulk_static_live() {
            local file="$1" status=""
            for attempt in 1 2 3 4 5 6; do
              status=$(curl -sS --max-time 20 -o /tmp/ndn-bulk-static-live-xml -w '%{http_code}' \
                -H 'User-Agent: NDN-bulk-archive-static-probe' "https://noondealsnow.com/$file" || true)
              echo "BULK_STATIC_ARCHIVE_LIVE_FILE=$file;TRY=$attempt;HTTP=$status"
              if [ "$status" = "200" ] && grep -q '<urlset' /tmp/ndn-bulk-static-live-xml; then
                return 0
              fi
              sleep 2
            done
            echo "::error::STATIC_BULK_ASSET_FAILED_AFTER_EDGE_PROPAGATION=$file;HTTP=$status"
            return 1
          }
          # Verify a bounded first/last/periodic sample of historical XML
          # assets live; complete shard+URL parity already validated locally.
          mapfile -t archived < <(find .ndn-static-assets -maxdepth 1 -name 'sitemap-articles-*.xml' -printf '%f\n' | sort)
          total="${#archived[@]}"
          if [ "$total" -gt 0 ]; then
            step=$(( total / 10 ))
            if [ "$step" -lt 1 ]; then step=1; fi
            checked=0
            for ((i=0; i<total; i+=step)); do
              file="${archived[$i]}"
              check_bulk_static_live "$file"
              checked=$((checked+1))
            done
            file="${archived[$((total-1))]}"
            check_bulk_static_live "$file"
            checked=$((checked+1))
            echo "BULK_STATIC_HISTORIC_ARTICLE_SHARDS_LIVE_SAMPLE=PASS;ROOT_SHARDS=$total;SAMPLED_LIVE=$checked"
          else
            echo 'BULK_STATIC_HISTORIC_ARTICLE_SHARDS_LIVE_SAMPLE=NO_BULK_SHARDS_IN_ROOT'
          fi
          # Read back several independently built Arabic, English and image
          # shards from the public domain. Google must see each as XML 200.
          mapfile -t rescue_samples < <(find .ndn-static-assets -maxdepth 1 \
            \( -name 'sitemap-rescue-articles-*.xml' -o -name 'sitemap-rescue-images-*.xml' \
               -o -name 'sitemap-rescue-english-*.xml' -o -name 'sitemap-rescue-english-images-*.xml' \
               -o -name 'sitemap-rescue-catalog.xml' \) -printf '%f\n' | sort)
          rescue_total="${#rescue_samples[@]}"
          if [ "$rescue_total" -gt 0 ]; then
            for index in 0 $((rescue_total / 4)) $((rescue_total / 2)) $((3 * rescue_total / 4)) $((rescue_total - 1)); do
              file="${rescue_samples[$index]}"
              status=0
              for attempt in 1 2 3 4 5 6; do
                status=$(curl -sS --max-time 20 -o /tmp/ndn-rescue-static-live-xml -w '%{http_code}' \
                  -H 'User-Agent: NDN-rescue-archive-static-xml-probe' "https://noondealsnow.com/$file" || true)
                echo "RESCUE_STATIC_XML_LIVE_FILE=$file;TRY=$attempt;HTTP=$status"
                if [ "$status" = 200 ] && grep -q '<urlset' /tmp/ndn-rescue-static-live-xml; then break; fi
                sleep 2
              done
              test "$status" = 200
              grep -q '<urlset' /tmp/ndn-rescue-static-live-xml
            done
            echo "NDN_RESCUE_STATIC_XML_LIVE_CRAWL=PASS;TOTAL_FILES=$rescue_total;SAMPLED=5"
          fi

          echo 'STATIC_SEO_ZERO_WORKER_QUOTA_DEPENDENCE=VERIFIED'
      - name: Smoke test public mobile-critical routes after deployment
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://noondealsnow.com'
          for path in / /coupons /blog /blog/saudi /blog/uae /golden-keywords /saudi/golden-keywords /uae/golden-keywords /saudi/categories /uae/categories /saudi/brand/apple /uae/brand/samsung /en/uae/noon-coupon-code /sitemap-ai-v2.xml; do
            ok=0
            for attempt in 1 2 3; do
              code=$(curl -sS --max-time 22 -o /tmp/ndn-smoke-body -w '%{http_code}' \
                -H 'User-Agent: NoonDealsNow-post-deploy-mobile-smoke' "$BASE$path" || true)
              if [ "$code" = 200 ] && [ -s /tmp/ndn-smoke-body ]; then ok=1;break;fi
              sleep 2
            done
            echo "POST_DEPLOY_SMOKE_PATH=$path;HTTP=$code;PASS=$ok"
            test "$ok" = 1
          done
          # Each keyword page must be the *new* canonical static edition, not
          # the old dynamic internal noindex map or an HTTP 429 Worker quota page.
          for path in /golden-keywords /saudi/golden-keywords /uae/golden-keywords; do
            code=$(curl -sS --max-time 20 -o /tmp/ndn-golden-live -w '%{http_code}' "$BASE$path" || true)
            test "$code" = 200
            grep -Fq '<link rel="canonical" href="https://noondealsnow.com'$path'">' /tmp/ndn-golden-live
            grep -Fq '<meta name="robots" content="index,follow,max-image-preview:large">' /tmp/ndn-golden-live
            if [ "$path" = /golden-keywords ]; then
              grep -Fq 'ndn-public-golden-keywords' /tmp/ndn-golden-live
              grep -Fq 'NOV170' /tmp/ndn-golden-live
              grep -Fq 'NOV188' /tmp/ndn-golden-live
            else
              if [ "$path" = /saudi/golden-keywords ]; then coupon=NOV170; else coupon=NOV188; fi
              grep -Fq 'data-code="'$coupon'"' /tmp/ndn-golden-live
            fi
            echo "PUBLIC_GOLDEN_KEYWORD_STATIC_LIVE=$path;HTTP=$code;CANONICAL=PASS;INDEXABLE=PASS"
          done
          echo 'NEW_PRODUCTION_POST_DEPLOY_SMOKE=PASS'

      - name: Verify new indexable live R2 blog routes after deployment
