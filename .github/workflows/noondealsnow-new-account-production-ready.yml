name: NoonDealsNow New Cloudflare Account Production Worker Prepared (No DNS Cutover)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noondealsnow-new-account-production-ready.yml'
      - 'wrangler.new-account-production.jsonc'
      - 'auto-platform.js'
      - 'admin-page.js'
      - 'system1-control-center.js'
      - 'system1-admin-data.js'
      - 'tests/system1-admin.test.mjs'
      - 'tests/ai-v2-publishing-cadence.test.mjs'
      - 'tests/ai-v2-global-capacity.test.mjs'
      - 'tests/system1-keyword-index.test.mjs'
      - 'automation/ai-v2/system1-visuals.mjs'
      - 'tests/system1-visuals.test.mjs'
      - 'secure-admin-auth.js'
      - 'tests/admin-login-credentials.test.mjs'
      - 'admin-runtime.js'
      - 'ai-v2-github-secrets.js'
      - 'ai-v2-admin-monitor.js'
      - 'automation/ai-v2/key-pool-slots.mjs'
      - 'automation/ai-v2/gemini-key-pool.mjs'
      - 'automation/ai-v2/groq-key-pool.mjs'
      - 'tests/ai-v2-github-secrets.test.mjs'
      - 'tests/ai-v2-runtime-telemetry.test.mjs'
      - 'tests/ai-v2-admin-console.test.mjs'
      - 'package.json'
      - 'tests/public-compact-feed.test.mjs'
      - 'final-platform.js'
      - 'english-canary.js'
      - 'r2-public-manifest.js'
      - 'commerce-pages-v2.js'
      - 'discovery-entry.js'
      - 'article-temporal-freshness.js'
      - 'tests/article-temporal-freshness.test.mjs'
      - 'seo-layer.js'
      - 'tests/mobile-coupon-copy.test.mjs'
      - 'ai-v2-sitemap.js'
      - 'ai-v2-native-publish-bridge.js'
      - 'quality-audit.js'
      - 'tests/ai-v2-native-arabic-article.test.mjs'
      - 'ai-v2-publication-ledger.js'
      - 'tests/ai-v2-publication-ledger.test.mjs'
      - 'tests/ai-v2-native-publish-bridge.test.mjs'
      - 'r2-emergency-readonly.js'
      - 'rescue-article-conversion.js'
      - 'tests/sitemap-crawler-cpu-bounded.test.mjs'
      - 'index.js'
      - 'tests/coupon-hub-canonical-links.test.mjs'
      - 'approved-coupons.js'
      - 'tests/market-coupon-routes.test.mjs'
      - 'tests/remote-existing-r2-binding.test.mjs'
      - 'tests/complete-blog-listing.test.mjs'
      - 'r2-public-cache-policy.js'
      - 'premium-entry.js'
      - 'r2-remote-existing-bucket.js'
      - 'complete-blog-listing.js'
      - 'tests/ai-v2-sitemap.test.mjs'
      - 'tests/sitemap-health-budget.test.mjs'
      - 'tests/mobile-directory-no-heavy-manifest.test.mjs'
      - 'tests/ai-v2-blog-publication.test.mjs'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ndn-new-account-production-prep
  cancel-in-progress: false
jobs:
  safe-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.NOON_NEW_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e4c35f8a50a7b2e4cfb9d6c534962603
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure destination-only production deployment cannot affect old site or DNS
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          python3 - <<'PY'
          import json,re
          txt=open('wrangler.new-account-production.jsonc').read()
          txt=re.sub(r'^\\s*//.*$', '', txt, flags=re.M)
          c=json.loads(txt)
          assert c['name']=='noondealsnow-production-new'
          assert c['main']=='discovery-entry.js'
          assert c['workers_dev'] is False
          assert c['triggers']['crons']==[]
          assert c['vars']['GLOBAL_PUBLISH_MIN_INTERVAL_SECONDS']=='30'
          assert c['vars']['GLOBAL_PUBLISH_MAX_PER_MINUTE']=='2'
          assert c['vars']['AI_PRIMARY_PROVIDER']=='disabled'
          assert c['vars']['DO_MIGRATION_RESTORE_ENABLED']=='false'
          assert c['r2_buckets']==[{'binding':'CONTENT_FINAL','bucket_name':'nooncoupons-content-v2'}]
          assert all(x.get('script_name')=='noondealsnow-migration-staging' for x in c['durable_objects']['bindings'])
          assert sorted(x.get('name') for x in c['durable_objects']['bindings'])==['CONTROL','GENERATOR_CONTROL']
          print('NEW_ACCOUNT_WORKER=CONFIG_SAFE;NEW_BUCKET=BOUND;DO_STATE=EXISTING;CRON=DISABLED')
          PY
      - name: Install dependencies for approved source and test suite
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check native gate and authenticated secret manager regressions
        run: node --test tests/ai-v2-global-capacity.test.mjs tests/ai-v2-publishing-cadence.test.mjs tests/ai-v2-native-publish-bridge.test.mjs tests/ai-v2-publication-ledger.test.mjs tests/ai-v2-native-arabic-article.test.mjs tests/ai-v2-github-secrets.test.mjs tests/ai-v2-runtime-telemetry.test.mjs tests/ai-v2-admin-console.test.mjs tests/admin-login-credentials.test.mjs tests/system1-admin.test.mjs tests/system1-keyword-index.test.mjs tests/system1-visuals.test.mjs
      - name: Prevent incorrect AI-readable NOV coupon market mappings
        run: node --test tests/nov-llms-canonical-source.test.mjs

      - name: Verify English article NOV metadata, CTA and FAQ match before deploying
        run: node --test tests/english-coupon-consistency.test.mjs

      - name: Guard official Noon store CTA and market attribution on all coupon details
        run: node --test tests/coupon-official-shop-cta.test.mjs

      - name: Verify real NOV copy success and country before deploying
        run: node --test tests/nov-copy-success-analytics.test.mjs

      - name: Validate crawlable canonical coupon links on landing pages
        run: node --test tests/coupon-hub-canonical-links.test.mjs

      - name: Protect public AI code reference source consistency
        run: node --test tests/llms-primary-route.test.mjs

      - name: Guard crawler-facing XML sitemaps against CPU regression
        run: node --test tests/sitemap-crawler-cpu-bounded.test.mjs

      - name: Verify prebuilt rescue sitemap stream ETag guard before production deploy
        run: node --test tests/geo-prebuilt-rescue-serving.test.mjs tests/geo-prebuilt-rescue-xml.test.mjs

      - name: Guard answer completeness on canonical NOV170 and NOV188 URLs
        run: node --test tests/nov-primary-aeo-country-answer.test.mjs

      - name: Test country coupon lists without changing live codes
        run: node --test tests/market-coupon-routes.test.mjs

      - name: Verify on-site coupon attribution cannot invent sales or codes
        run: node --test tests/coupon-funnel-attribution.test.mjs

      - name: Deploy destination script ONLY, without hostname or DNS modification
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config wrangler.new-account-production.jsonc --outdir /tmp/ndn-production-new-dry
          npx wrangler deploy --config wrangler.new-account-production.jsonc
      - name: Verify destination Worker service exists
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/ndn-worker-ready.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/services/noondealsnow-production-new")
          echo "NEW_PRODUCTION_WORKER_SERVICE_HTTP=$code"
          test "$code" = 200
          jq -e '.success==true' /tmp/ndn-worker-ready.json >/dev/null
          echo 'NEW_PRODUCTION_WORKER_DEPLOYED=TRUE'
          echo 'DNS_CHANGED=FALSE;CUSTOM_DOMAIN_ATTACHED=FALSE;OLD_SITE_MODIFIED=FALSE'
      - name: Smoke test public mobile-critical routes after deployment
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://noondealsnow.com'
          for path in / /coupons /blog /blog/saudi /blog/uae /saudi/categories /uae/categories /saudi/brand/apple /uae/brand/samsung /en/uae/noon-coupon-code /sitemap-ai-v2.xml; do
            ok=0
            for attempt in 1 2 3; do
              code=$(curl -sS --max-time 22 -o /tmp/ndn-smoke-body -w '%{http_code}' \
                -H 'User-Agent: NoonDealsNow-post-deploy-mobile-smoke' "$BASE$path" || true)
              if [ "$code" = 200 ] && [ -s /tmp/ndn-smoke-body ]; then ok=1;break;fi
              sleep 2
            done
            echo "POST_DEPLOY_SMOKE_PATH=$path;HTTP=$code;PASS=$ok"
            test "$ok" = 1
          done
          echo 'NEW_PRODUCTION_POST_DEPLOY_SMOKE=PASS'

      - name: Check SA and AE native article fast render on real production after deployment
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://noondealsnow.com'
          slugs=(
            'saudi-buyer-baseus-powerbank-multiport-power-budget-sharing-nov170-2026-n6'
            'uae-buyer-baseus-powerbank-multiport-power-budget-sharing-nov188-2026-n6'
          )
          for market in SA AE; do
            if [ "$market" = SA ]; then slug="${slugs[0]}"; coupon='NOV170'; else slug="${slugs[1]}"; coupon='NOV188'; fi
            passed=0
            for attempt in 1 2 3 4 5 6; do
              # Query bypasses prior edge cache, checking the actual deployed Worker
              # and the exact original approved R2 article without any R2 writes.
              code=$(curl -sS --max-time 30 -D /tmp/ndn-native-article.h -o /tmp/ndn-native-article.html \
                -w '%{http_code}' "$ORIGIN/articles/$slug?verify=native-fast-20261108-$attempt" || true)
              if [ "$code" = 200 ] &&
                 grep -Fqi 'x-native-article-renderer: approved-fast-v1' /tmp/ndn-native-article.h &&
                 grep -Fq "$coupon" /tmp/ndn-native-article.html &&
                 grep -Fq 'rel="canonical"' /tmp/ndn-native-article.html; then
                passed=1; break
              fi
              sleep 3
            done
            echo "NATIVE_ARTICLE_MARKET=$market;HTTP=$code;FAST_RENDER=$passed"
            test "$passed" = 1
          done
          echo 'SA_AE_NATIVE_FAST_RENDER=PASS;PUBLIC_HTTP_200=TRUE;R2_WRITES=0'

      - name: Verify SYSTEM1 routing is private, default login works and old admin is preserved
        shell: bash
        run: |
          set -euo pipefail
          for path in /admin /admin/system1 /admin/legacy; do
            status=$(curl -sS --max-time 20 -o /tmp/ndn-system1-html -w '%{http_code}' "https://noondealsnow.com$path")
            case "$path" in
              /admin) test "$status" = 200 ;;
              /admin/system1) test "$status" = 302 ;;
              /admin/legacy) test "$status" = 200 ;;
            esac
            echo "SYSTEM1_AUTH_ROUTE=$path;HTTP=$status"
          done
          for path in /api/admin/system1/summary /api/admin/system1/keywords; do
            status=$(curl -sS --max-time 20 -o /tmp/ndn-system1-anon -w '%{http_code}' "https://noondealsnow.com$path")
            echo "SYSTEM1_ANON_API=$path;HTTP=$status"
            test "$status" = 401
          done
          echo 'SYSTEM1_AUTH_ROUTES=PASS;LEGACY_ADMIN_PRESERVED=TRUE'
      - name: Verify live login page and reject incorrect credentials (never send real password in Actions)
        shell: bash
        run: |
          set -euo pipefail
          public='https://noondealsnow.com'
          code=$(curl -sS --max-time 22 -o /tmp/ndn-admin-login.html -w '%{http_code}' \
            -H 'cache-control: no-cache' "$public/admin")
          echo "ADMIN_LOGIN_PAGE_HTTP=$code"
          test "$code" = 200
          grep -Fq 'id="loginEmail" type="email" autocomplete="username" value="ramyshahin02@gmail.com"' /tmp/ndn-admin-login.html
          grep -Fq 'id="loginPassword" type="password" autocomplete="current-password"' /tmp/ndn-admin-login.html
          code=$(curl -sS --max-time 22 -o /tmp/ndn-invalid-login.json -w '%{http_code}' \
            -X POST -H 'content-type: application/json' \
            -d '{"email":"ramyshahin02@gmail.com","password":"incorrect-fixture-not-a-real-password"}' \
            "$public/api/admin/login")
          echo "INVALID_ADMIN_PASSWORD_HTTP=$code"
          test "$code" = 401
          jq -e '.error=="invalid_credentials"' /tmp/ndn-invalid-login.json >/dev/null
          code=$(curl -sS --max-time 22 -o /tmp/ndn-protected-admin.json -w '%{http_code}' \
            "$public/api/admin/ai-v2-monitor")
          echo "ANONYMOUS_ADMIN_MONITOR_HTTP=$code"
          test "$code" = 401
          echo 'NEW_ADMIN_LOGIN_PAGE=LIVE;INVALID_PASSWORD_REJECTED=TRUE;REAL_PASSWORD_NOT_SENT_TO_ACTIONS=TRUE'
