name: NoonDealsNow New Cloudflare Account Production Worker Prepared (No DNS Cutover)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noondealsnow-new-account-production-ready.yml'
      - 'wrangler.new-account-production.jsonc'
      - 'auto-platform.js'
      - 'admin-page.js'
      - 'admin-runtime.js'
      - 'ai-v2-github-secrets.js'
      - 'ai-v2-admin-monitor.js'
      - 'automation/ai-v2/key-pool-slots.mjs'
      - 'automation/ai-v2/gemini-key-pool.mjs'
      - 'automation/ai-v2/groq-key-pool.mjs'
      - 'tests/ai-v2-github-secrets.test.mjs'
      - 'tests/ai-v2-runtime-telemetry.test.mjs'
      - 'tests/ai-v2-admin-console.test.mjs'
      - 'package.json'
      - 'tests/public-compact-feed.test.mjs'
      - 'final-platform.js'
      - 'english-canary.js'
      - 'r2-public-manifest.js'
      - 'commerce-pages-v2.js'
      - 'discovery-entry.js'
      - 'seo-layer.js'
      - 'tests/mobile-coupon-copy.test.mjs'
      - 'ai-v2-sitemap.js'
      - 'ai-v2-native-publish-bridge.js'
      - 'quality-audit.js'
      - 'tests/ai-v2-native-arabic-article.test.mjs'
      - 'ai-v2-publication-ledger.js'
      - 'tests/ai-v2-publication-ledger.test.mjs'
      - 'tests/ai-v2-native-publish-bridge.test.mjs'
      - 'r2-emergency-readonly.js'
      - 'tests/ai-v2-sitemap.test.mjs'
      - 'tests/sitemap-health-budget.test.mjs'
      - 'tests/mobile-directory-no-heavy-manifest.test.mjs'
      - 'tests/ai-v2-blog-publication.test.mjs'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ndn-new-account-production-prep
  cancel-in-progress: false
jobs:
  safe-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.NOON_NEW_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e4c35f8a50a7b2e4cfb9d6c534962603
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure destination-only production deployment cannot affect old site or DNS
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          python3 - <<'PY'
          import json,re
          txt=open('wrangler.new-account-production.jsonc').read()
          txt=re.sub(r'^\\s*//.*$', '', txt, flags=re.M)
          c=json.loads(txt)
          assert c['name']=='noondealsnow-production-new'
          assert c['main']=='discovery-entry.js'
          assert c['workers_dev'] is False
          assert c['triggers']['crons']==[]
          assert c['vars']['GLOBAL_PUBLISH_MIN_INTERVAL_SECONDS']=='30'
          assert c['vars']['GLOBAL_PUBLISH_MAX_PER_MINUTE']=='2'
          assert c['vars']['AI_PRIMARY_PROVIDER']=='disabled'
          assert c['vars']['DO_MIGRATION_RESTORE_ENABLED']=='false'
          assert c['r2_buckets']==[{'binding':'CONTENT_FINAL','bucket_name':'nooncoupons-content-v2'}]
          assert all(x.get('script_name')=='noondealsnow-migration-staging' for x in c['durable_objects']['bindings'])
          assert sorted(x.get('name') for x in c['durable_objects']['bindings'])==['CONTROL','GENERATOR_CONTROL']
          print('NEW_ACCOUNT_WORKER=CONFIG_SAFE;NEW_BUCKET=BOUND;DO_STATE=EXISTING;CRON=DISABLED')
          PY
      - name: Install dependencies for approved source and test suite
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check native gate and authenticated secret manager regressions
        run: node --test tests/ai-v2-global-capacity.test.mjs tests/ai-v2-native-publish-bridge.test.mjs tests/ai-v2-publication-ledger.test.mjs tests/ai-v2-native-arabic-article.test.mjs tests/ai-v2-github-secrets.test.mjs tests/ai-v2-runtime-telemetry.test.mjs tests/ai-v2-admin-console.test.mjs
      - name: Deploy destination script ONLY, without hostname or DNS modification
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config wrangler.new-account-production.jsonc --outdir /tmp/ndn-production-new-dry
          npx wrangler deploy --config wrangler.new-account-production.jsonc
      - name: Verify destination Worker service exists
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/ndn-worker-ready.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/services/noondealsnow-production-new")
          echo "NEW_PRODUCTION_WORKER_SERVICE_HTTP=$code"
          test "$code" = 200
          jq -e '.success==true' /tmp/ndn-worker-ready.json >/dev/null
          echo 'NEW_PRODUCTION_WORKER_DEPLOYED=TRUE'
          echo 'DNS_CHANGED=FALSE;CUSTOM_DOMAIN_ATTACHED=FALSE;OLD_SITE_MODIFIED=FALSE'
      - name: Smoke test public mobile-critical routes after deployment
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://noondealsnow.com'
          for path in / /coupons /blog /blog/saudi /blog/uae /saudi/categories /uae/categories /saudi/brand/apple /uae/brand/samsung /en/uae/noon-coupon-code /sitemap-ai-v2.xml; do
            ok=0
            for attempt in 1 2 3; do
              code=$(curl -sS --max-time 22 -o /tmp/ndn-smoke-body -w '%{http_code}' \
                -H 'User-Agent: NoonDealsNow-post-deploy-mobile-smoke' "$BASE$path" || true)
              if [ "$code" = 200 ] && [ -s /tmp/ndn-smoke-body ]; then ok=1;break;fi
              sleep 2
            done
            echo "POST_DEPLOY_SMOKE_PATH=$path;HTTP=$code;PASS=$ok"
            test "$ok" = 1
          done
          echo 'NEW_PRODUCTION_POST_DEPLOY_SMOKE=PASS'
