name: NoonDealsNow AI V2 Saudi Quality Recovery Canary
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noondealsnow-ai-v2-saudi-quality-recovery.yml'
permissions:
  contents: read
concurrency:
  group: noondealsnow-ai-v2-single-site
  cancel-in-progress: false
jobs:
  saved-saudi-article:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Tests before allowing any native publication request
        run: |
          node --check automation/ai-v2/run.mjs
          node --test tests/ai-v2-guardrails.test.mjs tests/ai-v2-topic-queue.test.mjs tests/ai-v2-native-arabic-article.test.mjs
      - name: Re-run full native gate for the saved Saudi draft without AI
        shell: bash
        env:
          AI_PREFLIGHT_ONLY: 'false'
          AI_ONE_OFF_CANARY: 'true'
          AI_SA_ONE_OFF: 'true'
          AI_CANARY_MARKET: 'SA'
          AI_REPROCESS_SAVED_DRAFT: 'true'
          AI_NO_PROVIDER_CALLS: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.NOONDEALSNOW_AI_R2_CHECKPOINT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e4c35f8a50a7b2e4cfb9d6c534962603
          NOONDEALSNOW_AI_FREE_ONLY_APPROVED: ${{ secrets.NOONDEALSNOW_AI_FREE_ONLY_APPROVED }}
          NOONDEALSNOW_AI_SITE_PUBLISH_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo 'CHECKPOINT_R2_MISSING'; exit 21; }
          [ -n "${NOONDEALSNOW_AI_SITE_PUBLISH_TOKEN:-}" ] || { echo 'SITE_AUTH_MISSING'; exit 22; }
          npm install --no-audit --no-fund --ignore-scripts
          node automation/ai-v2/run.mjs | tee /tmp/ndn-sa-native-recovery.log
          echo '### NoonDealsNow: Saudi full-quality checkpoint recovery' >> "$GITHUB_STEP_SUMMARY"
          grep '^AI_V2_REPORT ' /tmp/ndn-sa-native-recovery.log >> "$GITHUB_STEP_SUMMARY" || true
          echo 'No Gemini/Groq credentials were provided. Verify LIVE_VERIFIED before counting publication.' >> "$GITHUB_STEP_SUMMARY"
