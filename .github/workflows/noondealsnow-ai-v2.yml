name: NoonDealsNow AI V2 - Safe Checkpoints and Preflight

on:
  push:
    branches: [main]
    paths:
      - 'automation/ai-v2/**'
      - 'ai-scheduler-v2/**'
      - 'tests/ai-v2-scheduler.test.mjs'
      - 'tests/ai-v2-guardrails.test.mjs'
      - 'tests/ai-v2-gemini-key-pool.test.mjs'
      - 'tests/ai-v2-topic-queue.test.mjs'
      - 'tests/ai-v2-native-arabic-article.test.mjs'
      - 'tests/ai-v2-provider-circuit.test.mjs'
      - 'tests/ai-v2-groq-key-pool.test.mjs'
      - 'automation/ai-v2/groq-key-pool.mjs'
      - 'tests/ai-v2-workflow-wiring.test.mjs'
      - '.github/workflows/noondealsnow-ai-v2.yml'
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Check config and secret presence only; never call AI
        required: true
        type: boolean
        default: true
      verify_gemini_metadata:
        description: 'Optional ONE read-only model metadata request; may return quota HTTP 429'
        required: false
        type: boolean
        default: false
      scheduled_ms:
        description: Original Cloudflare Cron scheduledTime in Unix milliseconds
        required: false
        type: string

permissions:
  contents: read

jobs:
  safety-tests:
    concurrency:
      group: noondealsnow-ai-v2-safety
      cancel-in-progress: false
    # A push checks the complete safety suite once per release, not on every
    # minute tick; scheduled generation still performs fast syntax/secret guards.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit secret name presence without revealing values
        shell: bash
        env:
          GEMINI_PRESENT: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_NEW_PRESENT: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_EXTRA_PRESENT: ${{ secrets.GEMINI_API_KEYS_EXTRA }}
          GROQ_PRESENT: ${{ secrets.GROQ_API_KEY }}
          GROQ_POOL_PRESENT: ${{ secrets.GROQ_API_KEYS }}
          GROQ_EXTRA_PRESENT: ${{ secrets.GROQ_API_KEYS_EXTRA }}
          R2_TOKEN_PRESENT: ${{ secrets.NOONDEALSNOW_AI_R2_CHECKPOINT_TOKEN }}
          FREE_APPROVAL_PRESENT: ${{ secrets.NOONDEALSNOW_AI_FREE_ONLY_APPROVED }}
          SITE_PUBLISH_PRESENT: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
        run: |
          for name in GEMINI_PRESENT GEMINI_NEW_PRESENT GEMINI_EXTRA_PRESENT GROQ_PRESENT GROQ_POOL_PRESENT GROQ_EXTRA_PRESENT R2_TOKEN_PRESENT FREE_APPROVAL_PRESENT SITE_PUBLISH_PRESENT; do
            if [ -n "${!name}" ]; then
              echo "AI_V2_SECRET_NAME_STATUS ${name}=PRESENT"
            else
              echo "AI_V2_SECRET_NAME_STATUS ${name}=MISSING"
            fi
          done
      - name: Syntax and entirely token-free regression tests
        run: |
          node --check automation/ai-v2/guardrails.mjs
          node --check automation/ai-v2/providers.mjs
          node --check automation/ai-v2/article-batch.mjs
          node --check automation/ai-v2/gemini-key-pool.mjs
          node --check automation/ai-v2/groq-key-pool.mjs
          node --check automation/ai-v2/check-gemini-model.mjs
          node --check automation/ai-v2/r2-checkpoints.mjs
          node --check automation/ai-v2/topic-expansion.mjs
          node --check automation/ai-v2/topic-refresh.mjs
          node --check automation/ai-v2/run.mjs
          node --check automation/ai-v2/slot-retry.mjs
          node --check automation/ai-v2/native-article.mjs
          node --check automation/ai-v2/native-arabic-article.mjs
          node --check automation/ai-v2/topic-queue.mjs
          node --check automation/ai-v2/provider-circuit.mjs
          node --check automation/ai-v2/attribution.mjs
          node --check ai-scheduler-v2/worker.mjs
          node --test tests/ai-v2-guardrails.test.mjs tests/ai-v2-article-batch.test.mjs tests/ai-v2-scheduler.test.mjs tests/ai-v2-gemini-key-pool.test.mjs tests/ai-v2-native-article.test.mjs tests/ai-v2-topic-queue.test.mjs tests/ai-v2-topic-expansion.test.mjs tests/ai-v2-topic-refresh.test.mjs tests/ai-v2-native-arabic-article.test.mjs tests/ai-v2-provider-circuit.test.mjs tests/ai-v2-groq-key-pool.test.mjs tests/ai-v2-workflow-wiring.test.mjs tests/ai-v2-attribution.test.mjs tests/ai-v2-slot-retry.test.mjs tests/ai-v2-global-capacity.test.mjs tests/ai-v2-native-publish-bridge.test.mjs tests/ai-v2-topic-refresh.test.mjs
      - name: Inspect Gemini secret pool types without exposing any key values
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEYS_EXTRA: ${{ secrets.GEMINI_API_KEYS_EXTRA }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e "import {geminiKeyInventory} from './automation/ai-v2/gemini-key-pool.mjs'; console.log('AI_V2_GEMINI_POOL '+JSON.stringify(geminiKeyInventory(process.env)))"
      - name: Read-only check of one new Gemini auth key against Google model metadata
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_gemini_metadata == true }}
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: node automation/ai-v2/check-gemini-model.mjs
      - name: Verify destination private R2 checkpoint (tiny isolated canary, no AI)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.NOONDEALSNOW_AI_R2_CHECKPOINT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e4c35f8a50a7b2e4cfb9d6c534962603
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo 'AI_V2_R2_CHECKPOINT=MISSING_SECRET'; exit 12
          fi
          npm install --no-audit --no-fund --ignore-scripts
          node automation/ai-v2/smoke-test-r2.mjs
      - name: Probe Cloudflare R2 REST checkpoint using existing private R2 token without calling AI
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.NOONDEALSNOW_AI_R2_CHECKPOINT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e4c35f8a50a7b2e4cfb9d6c534962603
        run: |
          set -euo pipefail
          node --check automation/ai-v2/r2-checkpoints-http.mjs
          node --check automation/ai-v2/smoke-test-r2-http.mjs
          node automation/ai-v2/smoke-test-r2-http.mjs
      - name: Safe runtime dry-run with no provider credentials or R2 access
        env:
          AI_PREFLIGHT_ONLY: 'true'
        run: node automation/ai-v2/run.mjs

  preflight-or-generate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        market: [SA, AE]
    name: preflight-or-generate (${{ matrix.market }})
    concurrency:
      group: noondealsnow-ai-v2-publisher-${{ matrix.market }}
      cancel-in-progress: false
    timeout-minutes: 20
    env:
      AI_QUEUE_MARKET: ${{ matrix.market }}
      AI_PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
      AI_SCHEDULED_MS: ${{ inputs.scheduled_ms }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_API_KEYS_EXTRA: ${{ secrets.GEMINI_API_KEYS_EXTRA }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      GROQ_API_KEYS_EXTRA: ${{ secrets.GROQ_API_KEYS_EXTRA }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.NOONDEALSNOW_AI_R2_CHECKPOINT_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e4c35f8a50a7b2e4cfb9d6c534962603
      NOONDEALSNOW_AI_FREE_ONLY_APPROVED: ${{ secrets.NOONDEALSNOW_AI_FREE_ONLY_APPROVED }}
      NOONDEALSNOW_AI_SITE_PUBLISH_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Scheduled path uses built-in Node fetch with verified R2 REST readback;
      # do not spend ~5s reinstalling Wrangler every one-minute dispatch.
      - name: Safe preflight or checkpointed draft run
        shell: bash
        run: |
          set -euo pipefail
          node --check automation/ai-v2/run.mjs
          node --check automation/ai-v2/slot-retry.mjs
          node --check automation/ai-v2/guardrails.mjs
          node --check automation/ai-v2/r2-checkpoints.mjs
          node automation/ai-v2/run.mjs | tee /tmp/noondealsnow-ai-v2-report.txt
          echo '### NoonDealsNow AI V2' >> "$GITHUB_STEP_SUMMARY"
          echo 'Publication is confirmed only when AI_V2_REPORT.status=LIVE_VERIFIED and the public article URL is verified; PREFLIGHT, CHECKPOINTED, BLOCKED, and SKIPPED are not publications.' >> "$GITHUB_STEP_SUMMARY"
          grep '^AI_V2_REPORT ' /tmp/noondealsnow-ai-v2-report.txt >> "$GITHUB_STEP_SUMMARY" || true
