name: Audit Coupon Codes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify owner allowlist and source hygiene
        shell: bash
        run: |
          set -euo pipefail
          APPROVED='NOV170 NOV188 NOV174 NOV157 NOV177 NOV186 NOV163 NOV153 NOV195 NOV161'

          node --input-type=module - <<'NODE'
          import {APPROVED_COUPON_CODES} from './approved-coupons.js';
          const expected=['NOV170','NOV188','NOV174','NOV157','NOV177','NOV186','NOV163','NOV153','NOV195','NOV161'];
          if(JSON.stringify(APPROVED_COUPON_CODES)!==JSON.stringify(expected)){
            console.error('OWNER_ALLOWLIST_MISMATCH',APPROVED_COUPON_CODES);
            process.exit(1);
          }
          console.log('OWNER_ALLOWLIST_OK='+APPROVED_COUPON_CODES.join(','));
          NODE

          node scripts/coupon-code-gate.mjs

          unexpected="$(grep -RIlE 'OPS[0-9]+' --exclude-dir=.git . | grep -Ev '^./approved-coupons\.js$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'UNEXPECTED_LEGACY_COUPON_SOURCE'
            echo "$unexpected"
            exit 1
          fi

          for file in router.js public-entry.js network-entry.js visual-platform.js svg-engine.js site.js commerce-pages-v2.js platform.js coupon-registry.js english-canary.js; do
            if grep -Eq 'OPS[0-9]+' "$file"; then
              echo "LEGACY_COUPON_IN_PUBLIC_RUNTIME=$file"
              exit 1
            fi
          done

      - name: Audit live home and blog coupon codes
        shell: bash
        run: |
          set -euo pipefail
          APPROVED='NOV170 NOV188 NOV174 NOV157 NOV177 NOV186 NOV163 NOV153 NOV195 NOV161'
          ORIGIN='https://noondealsnow.com'

          curl -fsS --retry 4 --retry-delay 2 "$ORIGIN/?coupon-audit=3" -o /tmp/home.html
          curl -fsS --retry 4 --retry-delay 2 "$ORIGIN/blog?coupon-audit=3" -o /tmp/blog.html

          ! grep -Eq 'OPS[0-9]+' /tmp/home.html
          ! grep -Eq 'OPS[0-9]+' /tmp/blog.html

          for file in /tmp/home.html /tmp/blog.html; do
            for code in $(grep -oE 'NOV[0-9]+' "$file" | sort -u); do
              grep -qw "$code" <<<"$APPROVED" || {
                echo "UNAPPROVED_LIVE_CODE=$code"
                exit 1
              }
            done
          done

          for code in $APPROVED; do
            grep -Fq "$code" /tmp/home.html || {
              echo "APPROVED_CODE_MISSING_FROM_HOME=$code"
              exit 1
            }
          done

          ARTICLE_PATH="$(grep -oE 'href="/articles/[^"]+"' /tmp/blog.html | head -n1 | sed -E 's/^href="([^"]+)"$/\1/' || true)"
          if [ -n "$ARTICLE_PATH" ]; then
            curl -fsS --retry 4 --retry-delay 2 "$ORIGIN$ARTICLE_PATH?coupon-audit=3" -o /tmp/article.html
            ! grep -Eq 'OPS[0-9]+' /tmp/article.html
            for code in $(grep -oE 'NOV[0-9]+' /tmp/article.html | sort -u); do
              grep -qw "$code" <<<"$APPROVED" || {
                echo "UNAPPROVED_LIVE_ARTICLE_CODE=$code"
                exit 1
              }
            done
            echo "LIVE_ARTICLE_AUDITED=$ARTICLE_PATH"
          fi

          curl -fsS --retry 3 --retry-delay 2 "$ORIGIN/api/coupon-migration-health" -o /tmp/migration.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/migration.json','utf8'));
          if(x.ok!==true) process.exit(1);
          console.log('COUPON_R2_MIGRATION='+JSON.stringify({
            scanned:x.scanned||0,
            updated:x.updated||0,
            replaced:x.replaced||0,
            failedKeys:Array.isArray(x.failedKeys)?x.failedKeys.length:0,
            scanDone:Boolean(x.scanDone),
            done:Boolean(x.done)
          }));
          NODE

          echo 'LIVE_HOME_CODES'
          grep -oE 'NOV[0-9]+' /tmp/home.html | sort -u
          echo OWNER_COUPON_AUDIT=PASS
