name: Test Bounded ControlPlane Export Acceleration

on:
  push:
    paths:
      - '.github/workflows/test-controlplane-export-acceleration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify migration snapshot JS and Wrangler flags
        shell: bash
        run: |
          node --check do-migration-state.js
          node --test tests/do-migration-state.test.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8').split(String.fromCharCode(10)).filter(x=>!x.trimStart().startsWith('//')).join(String.fromCharCode(10)));
          if(c.vars.DO_MIGRATION_EXPORT_PAGES_PER_TICK!=='6')throw Error('unexpected migration batch');
          if(c.vars.DO_MIGRATION_EXPORT_ENABLED!=='true')throw Error('source export disabled');
          if(c.vars.GLOBAL_PUBLISH_MIN_INTERVAL_SECONDS!=='60')throw Error('publish pacing changed');
          if(c.triggers.crons[0]!=='* * * * *')throw Error('unexpected cron schedule');
          console.log('DO_EXPORT_ACCELERATION_SAFETY=PASS');
          NODE
