name: NoonDealsNow AI V2 — safe key quota census to private dashboard
on:
  push:
    branches: [main]
    paths: ['.github/workflows/noondealsnow-ai-v2-key-dashboard-snapshot.yml']
permissions: {contents: read}
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.NOONDEALSNOW_AI_R2_CHECKPOINT_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e4c35f8a50a7b2e4cfb9d6c534962603
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_API_KEYS_EXTRA: ${{ secrets.GEMINI_API_KEYS_EXTRA }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      GROQ_API_KEYS_EXTRA: ${{ secrets.GROQ_API_KEYS_EXTRA }}
      NDN_GEMINI_POOL_01: ${{ secrets.NDN_GEMINI_POOL_01 }}
      NDN_GEMINI_POOL_02: ${{ secrets.NDN_GEMINI_POOL_02 }}
      NDN_GEMINI_POOL_03: ${{ secrets.NDN_GEMINI_POOL_03 }}
      NDN_GEMINI_POOL_04: ${{ secrets.NDN_GEMINI_POOL_04 }}
      NDN_GEMINI_POOL_05: ${{ secrets.NDN_GEMINI_POOL_05 }}
      NDN_GEMINI_POOL_06: ${{ secrets.NDN_GEMINI_POOL_06 }}
      NDN_GEMINI_POOL_07: ${{ secrets.NDN_GEMINI_POOL_07 }}
      NDN_GEMINI_POOL_08: ${{ secrets.NDN_GEMINI_POOL_08 }}
      NDN_GEMINI_POOL_09: ${{ secrets.NDN_GEMINI_POOL_09 }}
      NDN_GEMINI_POOL_10: ${{ secrets.NDN_GEMINI_POOL_10 }}
      NDN_GEMINI_POOL_11: ${{ secrets.NDN_GEMINI_POOL_11 }}
      NDN_GEMINI_POOL_12: ${{ secrets.NDN_GEMINI_POOL_12 }}
      NDN_GROQ_POOL_01: ${{ secrets.NDN_GROQ_POOL_01 }}
      NDN_GROQ_POOL_02: ${{ secrets.NDN_GROQ_POOL_02 }}
      NDN_GROQ_POOL_03: ${{ secrets.NDN_GROQ_POOL_03 }}
      NDN_GROQ_POOL_04: ${{ secrets.NDN_GROQ_POOL_04 }}
      NDN_GROQ_POOL_05: ${{ secrets.NDN_GROQ_POOL_05 }}
      NDN_GROQ_POOL_06: ${{ secrets.NDN_GROQ_POOL_06 }}
      NDN_GROQ_POOL_07: ${{ secrets.NDN_GROQ_POOL_07 }}
      NDN_GROQ_POOL_08: ${{ secrets.NDN_GROQ_POOL_08 }}
      NDN_GROQ_POOL_09: ${{ secrets.NDN_GROQ_POOL_09 }}
      NDN_GROQ_POOL_10: ${{ secrets.NDN_GROQ_POOL_10 }}
      NDN_GROQ_POOL_11: ${{ secrets.NDN_GROQ_POOL_11 }}
      NDN_GROQ_POOL_12: ${{ secrets.NDN_GROQ_POOL_12 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect provider cooldowns without provider calls or raw secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          node --input-type=module <<'NODE'
          import {buildSafeMonitor,writeSafeMonitor} from './automation/ai-v2/runtime-telemetry.mjs';
          for(const market of ['SA','AE']){
            const report=await buildSafeMonitor(process.env,{market});
            if(report.keyMaterialIncluded!==false)throw Error('RAW_KEY_EXPOSURE_RISK');
            const safe=JSON.stringify(report);
            for(const source of ['GEMINI_API_KEYS','GEMINI_API_KEYS_EXTRA','GEMINI_API_KEY',
                                   'GROQ_API_KEYS','GROQ_API_KEYS_EXTRA','GROQ_API_KEY']){
              const values=String(process.env[source]||'').split(/[\\s,;]+/).filter(x=>x.length>16);
              if(values.some(x=>safe.includes(x)))throw Error('RAW_KEY_EXPOSURE_RISK');
            }
            const written=await writeSafeMonitor(report);
            if(!written.ok)throw Error('PRIVATE_MONITOR_WRITE_FAILED_'+written.reason);
            const g=report.providers.gemini,q=report.providers.groq;
            console.log('PRIVATE_KEY_CENSUS '+JSON.stringify({
              market,updated:true,geminiCount:g.total,groqCount:q.total,
              geminiNotBlockedUnverified:g.counts.eligibleUnverified,
              groqNotBlockedUnverified:q.counts.eligibleUnverified,
              geminiQuotaWait:g.counts.quotaWait,groqQuotaWait:q.counts.quotaWait,
              geminiTemporarilyPaused:g.counts.providerWait,groqTemporarilyPaused:q.counts.providerWait,
              uninspected:g.counts.notInspected+q.counts.notInspected,providerCalls:0
            }));
          }
          NODE
          echo 'GEMINI_PROVIDER_REQUESTS=0;GROQ_PROVIDER_REQUESTS=0;PRIVATE_R2_METADATA_WRITES=2'
