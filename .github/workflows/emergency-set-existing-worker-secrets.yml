name: Install Emergency R2 Read Credentials on Existing Worker
on:
  push:
    branches: [fix/emergency-article-availability-20261019]
    paths: ['.github/workflows/emergency-set-existing-worker-secrets.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nooncoupons-production-v3
  cancel-in-progress: false
jobs:
  provision-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
      CLOUDFLARE_ACCOUNT_ID: c82274152a942dea53044eae7153cfd7
      NOON_NEW_R2_ACCESS_KEY_ID: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
      NOON_NEW_R2_SECRET_ACCESS_KEY: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Wrangler
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Ensure existing Worker and credentials are present
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$NOON_NEW_R2_ACCESS_KEY_ID" ] && [ -n "$NOON_NEW_R2_SECRET_ACCESS_KEY" ]
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/nooncoupons/settings" -o /tmp/existing-settings.json
          jq -e '.success == true' /tmp/existing-settings.json >/dev/null
          echo 'EXISTING_WORKER=VERIFIED'
      - name: Install two secrets on the existing old Worker without changing its DNS, schedules, or DO namespace
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$NOON_NEW_R2_ACCESS_KEY_ID" | npx wrangler secret put NOON_RESCUE_R2_ACCESS_KEY_ID --name nooncoupons
          printf '%s' "$NOON_NEW_R2_SECRET_ACCESS_KEY" | npx wrangler secret put NOON_RESCUE_R2_SECRET_ACCESS_KEY --name nooncoupons
          echo 'R2_RESCUE_SECRETS_CONFIGURED=true'
      - name: Confirm only secret names (never values)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/nooncoupons/settings" -o /tmp/after-settings.json
          jq -e '.success==true' /tmp/after-settings.json >/dev/null
          jq -e '[.result.bindings[]?|select(.name=="NOON_RESCUE_R2_ACCESS_KEY_ID" or .name=="NOON_RESCUE_R2_SECRET_ACCESS_KEY")]|length==2' /tmp/after-settings.json >/dev/null
          echo 'R2_RESCUE_SECRET_NAMES_PRESENT=true'
