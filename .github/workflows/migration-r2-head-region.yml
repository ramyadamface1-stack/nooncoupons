name: Inspect R2 HEAD Request Regions and Status
on:
  push:
    branches: [migration/preflight-inspection-20261018]
    paths: ['.github/workflows/migration-r2-head-region.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
    steps:
      - name: Aggregate R2 HEAD requests by region and HTTP status read only
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,datetime
          end=datetime.datetime.now(datetime.timezone.utc)
          start=end-datetime.timedelta(hours=1)
          vars={'accountTag':'c82274152a942dea53044eae7153cfd7','startDate':start.isoformat().replace('+00:00','Z'),'endDate':end.isoformat().replace('+00:00','Z'),'bucketName':'nooncoupons-content-v2'}
          query='query R2RequestRegions($accountTag: string!, $startDate: Time, $endDate: Time, $bucketName: string) { viewer { accounts(filter:{accountTag:$accountTag}) { r2OperationsAdaptiveGroups(limit:1000,orderBy:[sum_requests_DESC],filter:{datetime_geq:$startDate,datetime_leq:$endDate,bucketName:$bucketName,actionType:"HeadObject"}) { sum { requests } dimensions { eyeballRegion responseStatusCode tag } } } } }'
          req=urllib.request.Request('https://api.cloudflare.com/client/v4/graphql',method='POST',data=json.dumps({'query':query,'variables':vars}).encode(),headers={'Authorization':'Bearer '+os.environ['TOKEN'].strip(),'Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=20) as r:result=json.load(r);status=r.status
          except urllib.error.HTTPError as e:
              status=e.code
              try:result=json.loads(e.read(15000))
              except:result={}
          print('R2_STATUS_REGION_HTTP='+str(status))
          if result.get('errors'):print('R2_QUERY_ERRORS='+json.dumps([x.get('message') for x in result['errors'][:5]]))
          account=((result.get('data') or {}).get('viewer') or {}).get('accounts') or []
          rows=(account[0].get('r2OperationsAdaptiveGroups') or []) if account else []
          summary={}
          for row in rows:
              d=row.get('dimensions') or {}
              key=(str(d.get('eyeballRegion') or 'unknown'),str(d.get('responseStatusCode') or 'unknown'),str(d.get('tag') or 'none'))
              summary[key]=summary.get(key,0)+int((row.get('sum') or {}).get('requests') or 0)
          print('R2_HEAD_REGION_GROUPS='+str(len(summary)))
          for (region,code,tag),num in sorted(summary.items(),key=lambda x:-x[1])[:24]:
              print('R2_HEAD_GROUP='+json.dumps({'region':region,'status':code,'tag':tag,'count':num}))
          print('R2_HEAD_AGGREGATE='+str(sum(summary.values())))
          print('READ_ONLY=true')
          PY
