name: Verify Direct Old-DO Backup into Existing New R2
# The old account's R2 is permanently NotEntitled (10042).
# The ACTIVE source Worker now exports source DO directly into destination R2.
# This workflow is READ ONLY. It never contacts the disabled old R2.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-do-backups-new-account.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DEST_ACCESS: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
      DEST_SECRET: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - run: python3 -m pip install --quiet boto3
      - name: Verify fresh source ControlPlane/GeneratorControl backup lands in new R2 (no writes)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import boto3,os,json,datetime
          from botocore.config import Config
          s=boto3.client('s3',region_name='auto',endpoint_url='https://e4c35f8a50a7b2e4cfb9d6c534962603.r2.cloudflarestorage.com',
            aws_access_key_id=os.environ['DEST_ACCESS'].strip(),aws_secret_access_key=os.environ['DEST_SECRET'].strip(),
            config=Config(connect_timeout=10,read_timeout=25,retries={'max_attempts':2,'mode':'standard'}))
          b='nooncoupons-content-v2'
          state={}
          for kind in ('ControlPlane','GeneratorControl'):
            prefix='migration/do-state/20261020-old-do-recovery/'+kind+'/'
            items=[]
            for page in s.get_paginator('list_objects_v2').paginate(Bucket=b,Prefix=prefix,PaginationConfig={'PageSize':1000}):
              items.extend(page.get('Contents',[]))
            parts=[x for x in items if '/part-' in x['Key']]
            done=next((x for x in items if x['Key'].endswith('/manifest.json')),None)
            info={'partCount':len(parts),'manifestComplete':bool(done),'lastModified':max((x['LastModified'].isoformat() for x in items),default=None)}
            if done:
              data=json.loads(s.get_object(Bucket=b,Key=done['Key'])['Body'].read())
              info.update({'exportedKeys':data.get('exported'),'expectedParts':data.get('parts'),'complete':data.get('complete') is True})
              if data.get('complete') is not True or data.get('parts')!=len(parts):raise RuntimeError('incomplete_source_do_backup_manifest_'+kind)
            else:
              if not parts:print('::warning::SOURCE_DO_EXPORT_NOT_STARTED='+kind)
              else:
                delta=(datetime.datetime.now(datetime.timezone.utc)-max(x['LastModified'] for x in items)).total_seconds()/60
                if delta>95:print('::warning::SOURCE_DO_EXPORT_STALLED='+kind+';minutes='+str(round(delta)))
            state[kind]=info
            print('DIRECT_NEW_R2_OLD_DO_BACKUP='+json.dumps({'kind':kind,**info}),flush=True)
          if not state['ControlPlane']['partCount']:raise RuntimeError('source_DO_direct_backup_missing_from_destination')
          print('DISABLED_OLD_R2_READS=ZERO',flush=True)
          print('NO_NEW_RESOURCES_OR_DELETES=true')
          PY
