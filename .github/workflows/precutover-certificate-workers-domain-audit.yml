name: Check Existing New Zone Certificates and Worker Domains Read Only
on:
  push:
    branches: [ops/revive-existing-do-restore-20261020]
    paths: ['.github/workflows/precutover-certificate-workers-domain-audit.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEW_API_TOKEN: ${{ secrets.NOON_NEW_CF_API_TOKEN }}
      OLD_API_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
    steps:
      - name: Inspect SSL certificate packs, custom hostname and Worker routes, no modifications
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          for label,aid,zid in [('OLD','c82274152a942dea53044eae7153cfd7','3032a311856f82908a53f0b19b0ffcf8'),('NEW','e4c35f8a50a7b2e4cfb9d6c534962603','c09077a581adc7aa11d6de0c121e179d')]:
            for name,url in [
              ('packs',f'/zones/{zid}/ssl/certificate_packs?per_page=30'),
              ('worker_domains',f'/accounts/{aid}/workers/domains'),
              ('script_bindings',f'/accounts/{aid}/workers/scripts/'+('nooncoupons' if label=='OLD' else 'noondealsnow-migration-staging')+'/settings'),
              ('new_zone_setting',f'/zones/{zid}/settings/ssl')]:
              req=urllib.request.Request('https://api.cloudflare.com/client/v4'+url,headers={'Authorization':'Bearer '+os.environ[label+'_API_TOKEN'].strip(),'Accept':'application/json'})
              try:
                with urllib.request.urlopen(req,timeout=16) as r:data=json.load(r);code=r.status
              except urllib.error.HTTPError as e:
                code=e.code
                try:data=json.loads(e.read(10000))
                except:data={}
              except Exception as e:code=0;data={'errors':[{'code':type(e).__name__}]}
              out={'account':label,'category':name,'status':code,'success':data.get('success'),'error_codes':[x.get('code') for x in data.get('errors',[])[:3]]}
              r=data.get('result') or []
              if name=='packs' and isinstance(r,list):
                out['packs']=[{'type':x.get('type'),'status':x.get('status'),'hosts':x.get('hosts'),'validation_method':x.get('validation_method')} for x in r[:10]]
              elif name=='worker_domains' and isinstance(r,list):
                out['domains']=[{'hostname':x.get('hostname'),'zone_id':x.get('zone_id'),'service':x.get('service'),'environment':x.get('environment')} for x in r if 'noondealsnow.com' in str(x.get('hostname'))]
              elif name=='script_bindings' and isinstance(r,dict):
                out['binding_names']=[x.get('name') for x in r.get('bindings',[]) if x.get('type')!='secret_text']
                out['secret_text_count']=sum(x.get('type')=='secret_text' for x in r.get('bindings',[]))
              elif isinstance(r,dict):out['setting']=r.get('value')
              print('PRECUTOVER_CERT_WORKER='+json.dumps(out),flush=True)
          print('PRECUTOVER_READONLY_NO_CHANGES=true')
          PY
