name: Deploy NoonDealsNow AI V2 Scheduler (manual, disabled)

on:
  workflow_dispatch:
    inputs:
      confirm_disabled_scheduler_deploy:
        description: "I approve deploying an INERT Worker Cron while v2 is disabled"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: noondealsnow-ai-scheduler-v2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_disabled_scheduler_deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.NOON_NEW_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e4c35f8a50a7b2e4cfb9d6c534962603
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify NO AI dispatch is enabled and no paid change is requested
        shell: bash
        run: |
          set -euo pipefail
          node -e "const c=require('./automation/ai-v2/config.json');if(c.enabled || c.publicationMode!=='checkpoint_only'){process.exit(10)}"
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_DEPLOY_TOKEN_MISSING'; exit 11; }
          node --test tests/ai-v2-guardrails.test.mjs tests/ai-v2-scheduler.test.mjs
      - name: Install pinned Wrangler
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Build scheduler without network requests
        run: npx wrangler deploy --dry-run --config ai-scheduler-v2/wrangler.jsonc --outdir /tmp/ai-v2-dry
      - name: Deploy INERT scheduler only after manual opt-in
        run: npx wrangler deploy --config ai-scheduler-v2/wrangler.jsonc
      - name: Summarize accurately
        run: |
          echo 'Independent AI scheduler deployed, but central enabled=false: no GitHub dispatch and no Gemini/Groq calls.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production site Cron and article publishing remain unchanged.' >> "$GITHUB_STEP_SUMMARY"
