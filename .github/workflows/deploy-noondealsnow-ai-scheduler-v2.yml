name: Deploy NoonDealsNow AI V2 Scheduler (manual, disabled)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-noondealsnow-ai-scheduler-v2.yml'
      - 'ai-scheduler-v2/**'
      - 'tests/ai-v2-scheduler.test.mjs'
  workflow_dispatch:
    inputs:
      confirm_disabled_scheduler_deploy:
        description: 'Deploy isolated INERT scheduler only after token and account checks'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: noondealsnow-ai-scheduler-v2-deploy
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_DISPATCH_TOKEN: ${{ secrets.NOONDEALSNOW_GITHUB_DISPATCH_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.NOON_NEW_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e4c35f8a50a7b2e4cfb9d6c534962603
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Token-free scheduler regression tests
        run: |
          node --check ai-scheduler-v2/worker.mjs
          node --test tests/ai-v2-scheduler.test.mjs
      - name: Check isolated credentials by NAME only
        shell: bash
        run: |
          if [ -n "${GH_DISPATCH_TOKEN:-}" ]; then echo 'GITHUB_DISPATCH_TOKEN=PRESENT'; else echo 'GITHUB_DISPATCH_TOKEN=MISSING'; fi
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then echo 'DESTINATION_CF_DEPLOY_TOKEN=PRESENT'; else echo 'DESTINATION_CF_DEPLOY_TOKEN=MISSING'; fi
          echo 'EXPECTED_CLOUDFLARE_ACCOUNT=destination'
      - name: Verify GitHub fine-grained token can READ target workflow runs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_disabled_scheduler_deploy }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${GH_DISPATCH_TOKEN:-}" ] || { echo 'DISPATCH_TOKEN_MISSING'; exit 21; }
          code=$(curl -sS -o /tmp/ndn-gh-runs.json -w '%{http_code}' --retry 1 \
            -H "Authorization: Bearer $GH_DISPATCH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/ramyadamface1-stack/nooncoupons/actions/workflows/noondealsnow-ai-v2.yml/runs?per_page=1')
          echo "GITHUB_WORKFLOW_READ_HTTP=$code"
          case "$code" in
            200) jq -e '(.workflow_runs | type) == "array"' /tmp/ndn-gh-runs.json >/dev/null || { echo 'INVALID_GITHUB_API_RESULT'; exit 22; };;
            401) echo 'GITHUB_DISPATCH_TOKEN_INVALID_OR_EXPIRED'; exit 23;;
            403) echo 'GITHUB_DISPATCH_TOKEN_ACTIONS_READ_FORBIDDEN'; exit 24;;
            404) echo 'GITHUB_WORKFLOW_NOT_FOUND_OR_TOKEN_HAS_NO_REPO_ACCESS'; exit 25;;
            *) echo 'GITHUB_API_UNAVAILABLE'; exit 26;;
          esac
          echo 'GITHUB_DISPATCH_READ=PREFLIGHT_PASS'
      - name: Verify deployment permission for DESTINATION Cloudflare account
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_disabled_scheduler_deploy }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo 'DESTINATION_CF_TOKEN_MISSING'; exit 31; }
          status=$(curl -sS -o /tmp/ndn-cf-workers.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts")
          echo "DESTINATION_CLOUDFLARE_WORKERS_HTTP=$status"
          if [ "$status" != 200 ] || [ "$(jq -r '.success // false' /tmp/ndn-cf-workers.json)" != true ]; then
            echo 'DESTINATION_CLOUDFLARE_ACCESS_NOT_VERIFIED'; exit 32
          fi
          echo 'DESTINATION_CLOUDFLARE_WORKERS_READ=PASS'

  deploy:
    needs: preflight
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_disabled_scheduler_deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_DISPATCH_TOKEN: ${{ secrets.NOONDEALSNOW_GITHUB_DISPATCH_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.NOON_NEW_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e4c35f8a50a7b2e4cfb9d6c534962603
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed unless AI remains disabled and no existing publish system is changed
        shell: bash
        run: |
          set -euo pipefail
          node -e "const c=require('./automation/ai-v2/config.json');if(c.enabled!==false || c.publicationMode!=='checkpoint_only' || c.safety.keepLegacyCron!==true)process.exit(10)"
          [ -n "${GH_DISPATCH_TOKEN:-}" ] || { echo 'DISPATCH_TOKEN_MISSING'; exit 11; }
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo 'DESTINATION_CF_TOKEN_MISSING'; exit 12; }
      - name: Install existing Wrangler version without modifying project
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Build and audit isolated Worker
        run: npx wrangler deploy --dry-run --config ai-scheduler-v2/wrangler.jsonc --outdir /tmp/ndn-ai-v2-dry
      - name: Deploy INERT new-account scheduler (does not touch original Worker)
        run: npx wrangler deploy --config ai-scheduler-v2/wrangler.jsonc
      - name: Store site-specific GitHub Dispatch Token in Cloudflare Worker secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_DISPATCH_TOKEN" | npx wrangler secret put GITHUB_DISPATCH_TOKEN --config ai-scheduler-v2/wrangler.jsonc
          npx wrangler secret list --config ai-scheduler-v2/wrangler.jsonc | tee /tmp/ndn-secret-names.json >/dev/null
          jq -e 'map(select(.name == "GITHUB_DISPATCH_TOKEN")) | length == 1' /tmp/ndn-secret-names.json >/dev/null
          echo 'WORKER_GITHUB_DISPATCH_SECRET=VERIFIED_NAME_ONLY'
      - name: Verify Cloudflare Cron trigger exists (does not claim a tick or publication)
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/ndn-crons.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/noondealsnow-ai-scheduler-v2/schedules")
          echo "CLOUDFLARE_CRON_READ_HTTP=$status"
          [ "$status" = 200 ] || { echo 'CRON_READ_FAILED'; exit 41; }
          jq -e '.success==true and any(.result.schedules[]?; .cron == "* * * * *")' /tmp/ndn-crons.json >/dev/null || { echo 'CRON_TRIGGER_NOT_CONFIRMED'; exit 42; }
          echo 'CLOUDFLARE_CRON_CONFIGURED=TRUE'
          echo 'CRON_EVENT_DELIVERY=NOT_YET_PROVEN'
          echo 'WORKFLOW_DISPATCH_FROM_CLOUDFLARE=NOT_YET_PROVEN'
          echo 'AI_GENERATION=NOT_STARTED; LIVE_ARTICLE=NOT_VERIFIED'
      - name: Report distinct verification states
        run: |
          echo '### NoonDealsNow AI V2 — isolated scheduler' >> "$GITHUB_STEP_SUMMARY"
          echo 'GitHub token READ passed, Worker deployed, Worker secret name and Cron configuration verified.' >> "$GITHUB_STEP_SUMMARY"
          echo 'IMPORTANT: Scheduler enabled=false; no Cron-to-GitHub dispatch or live article has been proven.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Original production Worker and publication pipeline were not changed.' >> "$GITHUB_STEP_SUMMARY"
