name: Diagnose Production Article and Archive Outage
on:
  push:
    branches: [fix/emergency-article-availability-20261019]
    paths: ['.github/workflows/emergency-article-diagnosis.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
      CLOUDFLARE_ACCOUNT_ID: c82274152a942dea53044eae7153cfd7
      NOON_OLD_R2_ACCESS_KEY_ID: ${{ secrets.NOON_OLD_R2_ACCESS_KEY_ID }}
      NOON_OLD_R2_SECRET_ACCESS_KEY: ${{ secrets.NOON_OLD_R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Compare HTTPS site route codes, workers.dev routes, and selected R2 HTML objects
        shell: bash
        run: |
          set +e
          for host in 'https://noondealsnow.com' 'https://nooncoupons.ramychatgptgcoupons.workers.dev'; do
            echo "PROBE_HOST=$host"
            for path in '/' '/blog' '/blog?page=2' '/blog/archive' '/blog/archive/all' '/blog/archive/full' '/blog/archive/2026-10-18' '/api/revision' '/api/health' '/sitemap.xml' '/articles/شراء-الجوالات-من-نون-السعودية-باستخدام-كوبون-لشراء-ذكي'; do
              code=$(curl -g -sS --connect-timeout 8 --max-time 15 -o /tmp/article_probe.txt -w '%{http_code}' "$host$path?probe=${GITHUB_RUN_ID}" || true)
              bytes=$(wc -c < /tmp/article_probe.txt 2>/dev/null || echo 0)
              echo "PROBE=$path HTTP=$code BYTES=$bytes"
            done
          done
          python3 -m pip install --quiet boto3
          python3 - <<'PY'
          import os,boto3,json,hashlib
          s=boto3.client('s3',region_name='auto',endpoint_url='https://c82274152a942dea53044eae7153cfd7.r2.cloudflarestorage.com',
             aws_access_key_id=os.environ['NOON_OLD_R2_ACCESS_KEY_ID'].strip(),aws_secret_access_key=os.environ['NOON_OLD_R2_SECRET_ACCESS_KEY'].strip())
          b='nooncoupons-content-v2'
          keys=['articles/شراء-الجوالات-من-نون-السعودية-باستخدام-كوبون-لشراء-ذكي.html','bulk/latest.json','bulk/days.json','maintenance/article-discovery-v1/current.json','maintenance/article-discovery-v1/current/index.json']
          for key in keys:
            try:
              obj=s.get_object(Bucket=b,Key=key)
              data=obj['Body'].read(300000)
              obj['Body'].close()
              print('R2_OBJECT='+json.dumps({'key':key,'status':'readable','size':obj['ContentLength'],'sample_bytes':len(data),'type':obj.get('ContentType'),'first':data[:75].decode(errors='replace') if not key.startswith('articles/') else '(html)'},ensure_ascii=False),flush=True)
            except Exception as e:
              print('R2_OBJECT='+json.dumps({'key':key,'status':'error','error_type':type(e).__name__,'message':str(e)[:180]},ensure_ascii=False),flush=True)
          PY
      - name: Capture representative live exceptions from current Worker for 70 seconds
        shell: bash
        run: |
          set +e
          timeout 75s npx wrangler tail nooncoupons --format json >/tmp/worker_tail.log 2>/tmp/worker_tail_error.log &
          tailpid=$!
          sleep 10
          for path in '/blog/archive/all' '/blog/archive/2026-10-18' '/articles/شراء-الجوالات-من-نون-السعودية-باستخدام-كوبون-لشراء-ذكي' '/articles/شراء-الجوالات-من-نون-الإمارات-باستخدام-كوبون-مع-سلة-من-عدة-بائعين'; do
            curl -g -sS --connect-timeout 10 --max-time 12 -o /dev/null -w 'TAIL_PROBE_HTTP=%{http_code}\n' "https://noondealsnow.com$path?diag=${GITHUB_RUN_ID}" || true
          done
          wait "$tailpid"
          python3 - <<'PY'
          import json
          raw=open('/tmp/worker_tail.log',errors='replace').read()
          decoder=json.JSONDecoder()
          i=0;n=0
          while i<len(raw):
            j=raw.find('{',i)
            if j<0:break
            try:x,i=decoder.raw_decode(raw,j)
            except json.JSONDecodeError:i=j+1;continue
            if not isinstance(x,dict):continue
            n+=1
            evt=x.get('event') or {}
            url=str((evt.get('request') or {}).get('url','')).split('?')[0] if isinstance(evt,dict) else ''
            code=x.get('outcome')
            errors=x.get('exceptions') or []
            if errors or '/articles/' in url or '/blog/archive/' in url:
              print('TRACE='+json.dumps({'path':url.replace('https://noondealsnow.com',''),'outcome':code,'exception':[{'name':e.get('name'),'message':str(e.get('message',''))[:280]} for e in errors[:2]],'logs':str(x.get('logs') or [])[:450]},ensure_ascii=False)[:900],flush=True)
          print('TAIL_EVENTS='+str(n),flush=True)
          print('TAIL_STDERR='+open('/tmp/worker_tail_error.log',errors='replace').read()[-700:],flush=True)
          PY
