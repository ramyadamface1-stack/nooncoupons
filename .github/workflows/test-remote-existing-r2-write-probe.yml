name: Test Existing NEW R2 as Replacement for Disabled OLD R2
on:
  push:
    branches: [fix/remote-r2-existing-bucket-recovery-20261020]
    paths:
      - 'r2-remote-existing-bucket.js'
      - 'discovery-entry.js'
      - 'platform.js'
      - 'admin-runtime.js'
      - 'tests/remote-existing-r2-binding.test.mjs'
      - '.github/workflows/test-remote-existing-r2-write-probe.yml'
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      NOON_RESCUE_R2_ACCESS_KEY_ID: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
      NOON_RESCUE_R2_SECRET_ACCESS_KEY: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
      REMOTE_EXISTING_R2_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Node tests on remote S3 signature policy
        run: |
          set -euo pipefail
          node --check r2-remote-existing-bucket.js
          node --check discovery-entry.js
          node --check platform.js
          node --check admin-runtime.js
          node --test tests/remote-existing-r2-binding.test.mjs
      - name: Validate old/new Worker bundle without deployment
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --ignore-scripts
          npx wrangler deploy --dry-run --outdir /tmp/old-worker-remote-write
          npx wrangler deploy --dry-run --config wrangler.migration-staging.jsonc --outdir /tmp/new-worker-remote-r2
      - name: Probe WRITE/GET/HEAD/LIST in EXISTING destination R2 under isolated migration/probes key
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {existingDestinationR2Binding} from './r2-remote-existing-bucket.js';
          const env={NOON_RESCUE_R2_ACCESS_KEY_ID:process.env.NOON_RESCUE_R2_ACCESS_KEY_ID,NOON_RESCUE_R2_SECRET_ACCESS_KEY:process.env.NOON_RESCUE_R2_SECRET_ACCESS_KEY};
          const r2=existingDestinationR2Binding(env);
          const key='migration/probes/remote-existing-bucket-'+process.env.GITHUB_RUN_ID+'.json';
          const sample={kind:'read-write-probe',no_new_resources:true,run:process.env.GITHUB_RUN_ID};
          const str=JSON.stringify(sample);
          const written=await r2.put(key,str,{httpMetadata:{contentType:'application/json; charset=utf-8'},customMetadata:{probe:'noondealsnow'}});
          const received=await r2.get(key);
          const read=await received.json();
          if(JSON.stringify(read)!==str||received.customMetadata.probe!=='noondealsnow')throw Error('REMOTE_R2_WRITE_READ_FAILED');
          const info=await r2.head(key);
          if(!info||info.size!==new TextEncoder().encode(str).length)throw Error('REMOTE_R2_HEAD_MISMATCH');
          const list=await r2.list({prefix:'migration/probes/',limit:30});
          if(!list.objects.some(x=>x.key===key))throw Error('REMOTE_R2_LIST_MISMATCH');
          console.log('EXISTING_NEW_R2_REMOTE_WRITE=PASS');
          console.log('EXISTING_NEW_R2_REMOTE_GET=PASS');
          console.log('EXISTING_NEW_R2_REMOTE_HEAD=PASS');
          console.log('EXISTING_NEW_R2_REMOTE_LIST=PASS');
          console.log('EXISTING_NEW_R2_PROBE_KEY='+key);
          console.log('PROD_UNCHANGED=true');
          NODE
