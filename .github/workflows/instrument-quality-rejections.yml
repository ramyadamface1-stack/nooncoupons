name: Instrument Quality Rejections

on:
  push:
    paths:
      - '.github/workflows/instrument-quality-rejections.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add rejection reason telemetry without changing gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('bulk-generator.js')
          s=p.read_text()
          old="let cursor=Math.max(V2_CURSOR_START,Number(status.bulkCursorV2||0)),tries=0,rejectedQuality=0,rejectedDuplicate=0,rejectedGlobal=0,rejectedCoupon=0,rejectedLinks=0,rejectedSchema=0,rejectedIndexation=0;const records=[];"
          new="let cursor=Math.max(V2_CURSOR_START,Number(status.bulkCursorV2||0)),tries=0,rejectedQuality=0,rejectedDuplicate=0,rejectedGlobal=0,rejectedCoupon=0,rejectedLinks=0,rejectedSchema=0,rejectedIndexation=0,qualityRejectReasons={};const records=[];"
          if old not in s: raise SystemExit('counter pattern not found')
          s=s.replace(old,new,1)
          old="if(!audit.productionReady){rejectedQuality++;continue}"
          new="if(!audit.productionReady){rejectedQuality++;const reasons=(audit.p0?.length?audit.p0:(audit.failed||[])).slice(0,10);for(const reason of reasons)qualityRejectReasons[reason]=(qualityRejectReasons[reason]||0)+1;continue}"
          if old not in s: raise SystemExit('audit rejection pattern not found')
          s=s.replace(old,new,1)
          old="bulkRejectedQuality:Number(status.bulkRejectedQuality||0)+rejectedQuality,bulkRejectedDuplicate:"
          new="bulkLastQualityRejectReasons:qualityRejectReasons,bulkRejectedQuality:Number(status.bulkRejectedQuality||0)+rejectedQuality,bulkRejectedDuplicate:"
          if old not in s: raise SystemExit('patch pattern not found')
          s=s.replace(old,new,1)
          old="records,tries,rejectedQuality,rejectedDuplicate,rejectedGlobal"
          new="records,tries,rejectedQuality,qualityRejectReasons,rejectedDuplicate,rejectedGlobal"
          if old not in s: raise SystemExit('return pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check bulk-generator.js
          git config user.name "nooncoupons-automation"
          git config user.email "actions@users.noreply.github.com"
          git add bulk-generator.js
          git diff --cached --check
          git commit -m "Track quality rejection reasons without relaxing gates"
          git push origin HEAD:main
