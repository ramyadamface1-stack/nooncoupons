name: Inventory Mirrored English Article Keys Read Only
on:
  push:
    branches: [fix/english-sitemap-rescue-20261019]
    paths: ['.github/workflows/inspect-english-rescue-keys.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      NOON_NEW_R2_ACCESS_KEY_ID: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
      NOON_NEW_R2_SECRET_ACCESS_KEY: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - run: python3 -m pip install --quiet boto3
      - name: Inspect count and first few R2 metadata examples, no writes
        run: |
          python3 -u - <<'PY'
          import os,boto3,json
          s=boto3.client('s3',endpoint_url='https://e4c35f8a50a7b2e4cfb9d6c534962603.r2.cloudflarestorage.com',region_name='auto',aws_access_key_id=os.environ['NOON_NEW_R2_ACCESS_KEY_ID'].strip(),aws_secret_access_key=os.environ['NOON_NEW_R2_SECRET_ACCESS_KEY'].strip())
          keys=[]
          for pg in s.get_paginator('list_objects_v2').paginate(Bucket='nooncoupons-content-v2',Prefix='articles/en-',PaginationConfig={'PageSize':1000}):
            keys += [x['Key'] for x in pg.get('Contents',[]) if x['Key'].endswith('.html')]
          print('ENGLISH_ARTICLE_KEY_COUNT='+str(len(keys)),flush=True)
          for key in keys[:8]:
            o=s.head_object(Bucket='nooncoupons-content-v2',Key=key)
            m=o.get('Metadata',{})
            print('ENGLISH_ARTICLE_SAMPLE='+json.dumps({'slug':key[:105],'bytes':o['ContentLength'],'status':m.get('status'),'country':m.get('c'),'quality':m.get('q'),'qualityFloor':m.get('qf'),'date':m.get('at'),'language':m.get('lang')},ensure_ascii=False),flush=True)
          print('ENGLISH_READ_ONLY=true',flush=True)
          PY
