name: Verify English UAE Sitemap and Image Shards in Real Worker
on:
  push:
    branches: [fix/english-sitemap-rescue-20261019]
    paths: ['.github/workflows/verify-english-rescue-workerd.yml','r2-emergency-readonly.js']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NOON_NEW_R2_ACCESS_KEY_ID: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
      NOON_NEW_R2_SECRET_ACCESS_KEY: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          set -euo pipefail
          npm install --no-audit --no-fund --ignore-scripts
          node --check r2-emergency-readonly.js
          npx wrangler deploy --dry-run --outdir /tmp/english-sitemaps-dry
      - name: Confirm English sitemap index 21k URLs and image endpoints in actual Workerd
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8794 --log-level error \
            --var "NOON_RESCUE_R2_ACCESS_KEY_ID:$NOON_NEW_R2_ACCESS_KEY_ID" \
            --var "NOON_RESCUE_R2_SECRET_ACCESS_KEY:$NOON_NEW_R2_SECRET_ACCESS_KEY" >/tmp/english-sitemaps.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30};do if curl -fsS --max-time 3 http://127.0.0.1:8794/api/revision -o /dev/null;then break;fi;sleep 2;done
          node --input-type=module <<'NODE'
          const root='http://127.0.0.1:8794';
          for(const p of ['/sitemap.xml','/sitemap-en-articles.xml','/sitemap-rescue-english-0.xml','/sitemap-rescue-english-10.xml','/sitemap-rescue-english-images-0.xml','/sitemap-rescue-english-images-10.xml']){
            const res=await fetch(root+p),body=await res.text(),loc=(body.match(/<loc>/g)||[]).length;
            const image=(body.match(/<image:image>/g)||[]).length;
            console.log('ENGLISH_SITEMAP_TEST='+p+' HTTP='+res.status+' LOCS='+loc+' IMAGES='+image+' BYTES='+body.length);
            if(res.status!==200||loc<100||!res.headers.get('content-type')?.includes('xml'))process.exitCode=1;
            if(p==='/sitemap.xml'&&(!body.includes('sitemap-rescue-english-10.xml')||loc<200))process.exitCode=1;
            if(p.includes('english')&&!p.includes('images')&&!body.includes('/en/articles/'))process.exitCode=1;
            if(p.includes('images')&&!image)process.exitCode=1;
          }
          NODE
