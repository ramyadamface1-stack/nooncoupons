name: Check Cutover DNS Zone Readiness

on:
  push:
    paths:
      - '.github/workflows/check-cutover-zone-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OLD_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
      NEW_TOKEN: ${{ secrets.NOON_NEW_CF_API_TOKEN }}
    steps:
      - name: Inspect old/new zone visibility without modifications
        shell: bash
        run: |
          set -euo pipefail
          for label in OLD NEW; do
            if [ "$label" = OLD ]; then token="$OLD_TOKEN"; account=c82274152a942dea53044eae7153cfd7; else token="$NEW_TOKEN"; account=e4c35f8a50a7b2e4cfb9d6c534962603; fi
            if [ -z "$token" ]; then echo "ZONE_TOKEN_MISSING=$label"; continue; fi
            http=$(curl -sS --get --data-urlencode 'name=noondealsnow.com' --data-urlencode "account.id=$account" -o /tmp/zones.json -w '%{http_code}' -H "Authorization: Bearer $token" 'https://api.cloudflare.com/client/v4/zones')
            echo "ZONE_QUERY_HTTP=$label:$http"
            if [ "$http" = 200 ]; then
              jq -r --arg label "$label" '"ZONE_"+$label+"_VISIBLE_COUNT="+((.result//[])|length|tostring)' /tmp/zones.json
              jq -r --arg label "$label" '.result[]? | "ZONE_"+$label+"_STATUS="+(.status//"unknown")+";NAME="+(.name//"unknown")' /tmp/zones.json
            else
              echo "ZONE_QUERY_UNAVAILABLE=$label"
            fi
          done
