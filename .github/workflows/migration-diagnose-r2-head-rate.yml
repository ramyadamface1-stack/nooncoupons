name: Diagnose NoonDealsNow HEAD Requests Against Worker Traffic
on:
  push:
    branches: [migration/preflight-inspection-20261018]
    paths: ['.github/workflows/migration-diagnose-r2-head-rate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
    steps:
      - name: Read Cloudflare old Worker hourly requests and R2 HEAD stats only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,datetime
          end=datetime.datetime.now(datetime.timezone.utc)
          start=end-datetime.timedelta(hours=2)
          variables={'accountTag':'c82274152a942dea53044eae7153cfd7','startDate':start.isoformat().replace('+00:00','Z'),'endDate':end.isoformat().replace('+00:00','Z')}
          queries={
          'worker': 'query WorkerLoad($accountTag: string!, $startDate: Time!, $endDate: Time!) { viewer { accounts(filter:{accountTag:$accountTag}) { workersInvocationsAdaptive(limit:1000,filter:{datetime_geq:$startDate,datetime_leq:$endDate,scriptName:"nooncoupons"}) { sum { requests errors } dimensions { datetimeHour status } } } } }',
          'r2': 'query R2HeadLoad($accountTag: string!, $startDate: Time, $endDate: Time, $bucketName: string) { viewer { accounts(filter:{accountTag:$accountTag}) { r2OperationsAdaptiveGroups(limit:1000, filter:{datetime_geq:$startDate, datetime_leq:$endDate, bucketName:$bucketName, actionType:"HeadObject"}) { sum { requests } dimensions { datetimeFiveMinutes actionStatus } } } } }'
          }
          def fetch(query,variables):
              data=json.dumps({'query':query,'variables':variables}).encode()
              request=urllib.request.Request('https://api.cloudflare.com/client/v4/graphql',data=data,method='POST',headers={'Authorization':'Bearer '+os.environ['CF_TOKEN'].strip(),'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(request,timeout=20) as r:
                      return r.status,json.load(r)
              except urllib.error.HTTPError as e:
                  try:return e.code,json.loads(e.read(9000))
                  except:return e.code,{}
          for label,q in queries.items():
              v={**variables}
              if label=='r2':v['bucketName']='nooncoupons-content-v2'
              status,payload=fetch(q,v)
              print(label.upper()+'_HTTP='+str(status))
              if payload.get('errors'):
                  print(label.upper()+'_ERRORS='+json.dumps([x.get('message','')[:160] for x in payload['errors'][:3]]))
                  continue
              accounts=((payload.get('data') or {}).get('viewer') or {}).get('accounts') or []
              rows=(accounts[0].get('workersInvocationsAdaptive') if label=='worker' else accounts[0].get('r2OperationsAdaptiveGroups')) if accounts else []
              if not isinstance(rows,list):
                  print(label.upper()+'_NO_ROWS');continue
              now=end.timestamp()
              cutoff=now-3600
              count=0
              for row in rows:
                  dims=row.get('dimensions') or {}
                  bucket=dims.get('datetimeHour') if label=='worker' else dims.get('datetimeFiveMinutes')
                  try:stamp=datetime.datetime.fromisoformat(bucket.replace('Z','+00:00')).timestamp()
                  except:continue
                  sumdata=row.get('sum') or {}
                  n=int(sumdata.get('requests') or 0)
                  if stamp>=cutoff:count+=n
              print(label.upper()+'_ROWS='+str(len(rows)))
              print(label.upper()+'_APPROX_LAST_HOUR_REQUESTS='+str(count))
              for row in sorted(rows,key=lambda x:str((x.get('dimensions') or {}).get('datetimeHour') or (x.get('dimensions') or {}).get('datetimeFiveMinutes')))[-12:]:
                  print(label.upper()+'_SAMPLE='+json.dumps({'d':row.get('dimensions'),'requests':row.get('sum',{}).get('requests')},ensure_ascii=False)[:400])
          print('READ_ONLY=true')
          PY
