name: Verify Mobile Coupon CTA (diagnostic)

on:
  workflow_dispatch:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Source checks
        run: |
          node --check public-entry.js
          grep -Fq 'id="mobile-coupon-bar"' public-entry.js
          grep -Fq "x-mobile-coupon-cta','v1" public-entry.js
          grep -Fq "x-noon-market-route" public-entry.js
          grep -Fq 'https://www.noon.com/saudi-ar/' public-entry.js
          grep -Fq 'https://www.noon.com/uae-ar/' public-entry.js
          grep -Fq 'navigator.clipboard.writeText' public-entry.js
          grep -Fq 'PUBLIC_ENTRY_INFO={version:5' public-entry.js
          grep -Fq 'marketAwareNoonLinks:true' public-entry.js
      - name: Live mobile CTA checks
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="https://noondealsnow.com"
          echo "PRODUCTION_ORIGIN $ORIGIN"
          ready=0
          for i in $(seq 1 12); do
            health="$(curl -fsS --max-time 15 "$ORIGIN/api/generator-health" || true)"
            slug="$(python -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("bulk",{}).get("lastSlug") or "")' "$health" 2>/dev/null || true)"
            [ -n "$slug" ] || { sleep 5; continue; }
            urlslug="$(python -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe="-"))' "$slug")"
            code="$(curl -sS -o /tmp/article.html -D /tmp/article.headers -w '%{http_code}' --max-time 20 "$ORIGIN/articles/$urlslug?mobile-cta=v3" || true)"
            if [ "$code" = "200" ] && grep -Fqi 'x-mobile-coupon-cta: v1' /tmp/article.headers && grep -Fq 'id="mobile-coupon-bar"' /tmp/article.html; then ready=1; break; fi
            sleep 5
          done
          [ "$ready" = 1 ]
          grep -Eq 'data-sticky-copy="OPS[0-9]{2}"' /tmp/article.html
          grep -Fq 'فتح نون' /tmp/article.html
          grep -Fq 'navigator.clipboard.writeText' /tmp/article.html
          grep -Fq '@media(max-width:760px)' /tmp/article.html
          lang="$(tr -d '\r' </tmp/article.headers | awk -F': ' 'tolower($1)=="content-language"{print $2}' | tail -1)"
          market="$(tr -d '\r' </tmp/article.headers | awk -F': ' 'tolower($1)=="x-noon-market-route"{print $2}' | tail -1)"
          if [ "$lang" = "ar-AE" ]; then
            [ "$market" = "AE" ]
            grep -Fq 'https://www.noon.com/uae-ar/' /tmp/article.html
          else
            [ "$market" = "SA" ]
            grep -Fq 'https://www.noon.com/saudi-ar/' /tmp/article.html
          fi
          if grep -Fq 'href="https://www.noon.com/"' /tmp/article.html; then exit 1; fi
          if grep -Fq 'class="quality-meta"' /tmp/article.html; then exit 1; fi
          echo MOBILE_COUPON_CTA_LIVE_PASS
