name: Verify Mobile Coupon CTA (diagnostic)

on:
  workflow_run:
    workflows: ["Deploy Live Worker"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Source checks for current v2 contract
        shell: bash
        run: |
          set -euo pipefail
          node --check public-entry.js
          node --check r2-emergency-readonly.js
          grep -Fq 'id="mobile-coupon-bar"' public-entry.js
          grep -Fq "x-mobile-coupon-cta','v2" public-entry.js
          grep -Fq 'PUBLIC_ENTRY_INFO={version:11' public-entry.js
          grep -Fq 'marketAwareNoonLinks:true' public-entry.js
          grep -Fq 'rescue-mobile-offer' r2-emergency-readonly.js

      - name: Check real mobile CTA on a stable existing rescue article
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://noondealsnow.com'
          ARTICLE='en-noon-coupon-eligibility-saudi-arabia-travel-guide'
          code=$(curl -sS -L -o /tmp/article.html -D /tmp/article.headers -w '%{http_code}' --max-time 30 "$ORIGIN/articles/$ARTICLE")
          [ "$code" = '200' ] || { echo "ARTICLE_HTTP=$code"; exit 4; }
          if grep -Fq 'id="mobile-coupon-bar"' /tmp/article.html; then
            grep -Fiq 'x-mobile-coupon-cta: v2' /tmp/article.headers
            grep -Eq 'data-sticky-copy="NOV[0-9]+"' /tmp/article.html
          elif grep -Fq 'class="rescue-mobile-offer"' /tmp/article.html; then
            grep -Fiq 'x-r2-rescue-object: articles' /tmp/article.headers
            grep -Eq 'data-rescue-copy="NOV[0-9]+"' /tmp/article.html
            grep -Fq 'id="rescue-coupon-copy"' /tmp/article.html
          else
            echo 'MOBILE_COUPON_ACTION_MISSING'; exit 4
          fi
          grep -Fq 'https://www.noon.com/uae-ar/' /tmp/article.html
          if grep -Fq 'href="https://www.noon.com/"' /tmp/article.html; then exit 4; fi
          echo MOBILE_COUPON_CTA_LIVE_PASS
