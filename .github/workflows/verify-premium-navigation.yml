name: Verify Premium Navigation (diagnostic)

# Evaluate production only after a successful deploy, not while the new code is pending.
on:
  workflow_run:
    workflows: ["Deploy Live Worker"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check sources
        run: |
          set -euo pipefail
          node --check premium-entry.js
          node --check r2-emergency-readonly.js
          grep -Fq 'premium-blog-browser' premium-entry.js
          grep -Fq 'premium-blog-browser' r2-emergency-readonly.js
          grep -Fq 'article-topic-path' r2-emergency-readonly.js
      - name: Check current production including R2-rescue pages
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://noondealsnow.com'
          ARTICLE='en-noon-coupon-eligibility-saudi-arabia-travel-guide'
          curl -fsSL --max-time 30 "$ORIGIN/articles/$ARTICLE" -o /tmp/article.html
          grep -Fq 'id="article-topic-path"' /tmp/article.html
          grep -Eq '/topics/(buying-guides|coupon-help|saudi|uae)' /tmp/article.html
          curl -fsSL --max-time 30 "$ORIGIN/blog" -o /tmp/blog.html
          grep -Fq 'id="premium-blog-browser"' /tmp/blog.html
          grep -Fq 'market=SA' /tmp/blog.html
          grep -Fq 'market=AE' /tmp/blog.html
          grep -Fq 'topic=buying' /tmp/blog.html
          grep -Fq 'topic=coupon' /tmp/blog.html
          curl -fsSL -D /tmp/filter.headers --max-time 30 "$ORIGIN/blog?market=SA&topic=buying" -o /tmp/filtered.html
          grep -Fiq 'x-robots-tag: noindex, follow' /tmp/filter.headers
          grep -Fq 'id="premium-blog-browser"' /tmp/filtered.html
          echo 'PREMIUM_RESCUE_NAVIGATION_LIVE_PASS'
