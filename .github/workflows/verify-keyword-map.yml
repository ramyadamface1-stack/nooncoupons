name: Verify Keyword Intent Map

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-keywords:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Source invariants
        run: |
          set -euo pipefail
          node --check keyword-pages.js
          node --check premium-entry.js
          node --check discovery-entry.js
          node --check brand-runtime.js
          grep -Fq "2026-09-18-v2-golden-hub" keyword-pages.js
          grep -Fq "GOLDEN_KEYWORD_ROUTES" keyword-pages.js
          grep -Fq "goldenKeywordsHub" keyword-pages.js
          grep -Fq "كود خصم نون 2026" keyword-pages.js
          grep -Fq "كود خصم نون السعودية 2026" keyword-pages.js
          grep -Fq "كود خصم نون الإمارات 2026" keyword-pages.js
          grep -Fq "noon-discount-50" keyword-pages.js
          grep -Fq "noon-yellow-friday" keyword-pages.js
          grep -Fq '"main": "discovery-entry.js"' wrangler.jsonc
          grep -Fq "import app from './brand-runtime.js'" discovery-entry.js
          echo 'KEYWORD_MAP_SOURCE=PASS'
      - name: Verify live keyword architecture when current runtime is deployed
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="https://noondealsnow.com"
          curl -sS -D /tmp/live_headers --max-time 20 "$ORIGIN/" -o /tmp/home || true
          if ! grep -Fqi 'x-brand-layer: v1' /tmp/live_headers; then
            echo 'KEYWORD_MAP_LIVE=BLOCKED_BY_CLOUDFLARE_DEPLOY'
            echo 'SOURCE_REMAINS_PASS; deploy-live.yml is the authoritative production gate.'
            exit 0
          fi
          home="$(cat /tmp/home)"
          grep -Fq '<title>كود خصم نون 2026 | أكواد خصم نون السعودية والإمارات</title>' <<<"$home"
          grep -Fq 'كود خصم نون: أكواد نون للسعودية والإمارات' <<<"$home"
          grep -Fq 'id="search-intent-hubs"' <<<"$home"

          sa="$(curl -fsS -L --max-time 20 "$ORIGIN/saudi-arabia")"
          ae="$(curl -fsS --max-time 20 "$ORIGIN/uae")"
          grep -Fq '<link rel="canonical" href="' <<<"$sa"
          grep -Fq '/saudi' <<<"$sa"
          grep -Fq 'نسخ الكود' <<<"$sa"
          grep -Fq '<link rel="canonical" href="' <<<"$ae"
          grep -Fq '/uae' <<<"$ae"
          grep -Fq 'نسخ الكود' <<<"$ae"

          p50="$(curl -fsS --max-time 20 "$ORIGIN/coupon/noon-discount-50")"
          yellow="$(curl -fsS --max-time 20 "$ORIGIN/guide/noon-yellow-friday")"
          grep -Fq 'كود خصم نون 50: ماذا يعني البحث وكيف تتحقق؟' <<<"$p50"
          grep -Fq 'قاعدة التحرير' <<<"$p50"
          grep -Fq 'الجمعة الصفراء نون: كيف تتابع الأكواد والعروض بأمان؟' <<<"$yellow"
          grep -Fq 'قاعدة التحرير' <<<"$yellow"

          pages="$(curl -fsS --max-time 20 "$ORIGIN/sitemap-pages.xml")"
          grep -Fq '/coupon/noon-discount-50' <<<"$pages"
          grep -Fq '/guide/noon-yellow-friday' <<<"$pages"
          grep -Fq '/golden-keywords' <<<"$pages"
          golden="$(curl -fsS --max-time 20 "$ORIGIN/golden-keywords")"
          grep -Fq 'الكلمات والصفحات الذهبية لنون' <<<"$golden"
          grep -Fq '"@type":"CollectionPage"' <<<"$golden"
          echo 'KEYWORD_MAP_LIVE=PASS'
