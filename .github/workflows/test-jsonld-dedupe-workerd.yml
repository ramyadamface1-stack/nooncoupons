name: Validate Deduplicated Homepage and Article JSON-LD in Workerd
on:
  push:
    branches: [fix/deduplicate-live-jsonld-20261019]
    paths: ['.github/workflows/test-jsonld-dedupe-workerd.yml','brand-directory-schema.js','r2-emergency-readonly.js','discovery-entry.js']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOON_NEW_R2_ACCESS_KEY_ID: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
      NOON_NEW_R2_SECRET_ACCESS_KEY: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Dry run and Node pure function regression
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --ignore-scripts
          node --check brand-directory-schema.js
          node --check r2-emergency-readonly.js
          node --check discovery-entry.js
          npx wrangler deploy --dry-run --outdir /tmp/dedupe-schema
          node --input-type=module <<'NODE'
          import {removeRedundantSourceArticleJsonLd} from './r2-emergency-readonly.js';
          const input='<div>safe</div><script type="application/ld+json">'+JSON.stringify({'@context':'https://schema.org','@graph':[{'@type':'Article',headline:'a'},{'@type':'FAQPage',mainEntity:[]},{'@type':'BreadcrumbList',itemListElement:[]}]})+'</script>';
          const output=removeRedundantSourceArticleJsonLd(input);
          const graph=JSON.parse(output.match(/<script[^>]*>([\s\S]*?)<\/script>/)[1])['@graph'];
          if(graph.length!==2||graph.some(x=>x['@type']==='Article')||!output.includes('<div>safe</div>'))process.exit(1);
          console.log('UNIT_DEDUPE_PRESERVES_FAQ_BREADCRUMB=true');
          NODE
      - name: Verify live-sized pages and schema graph in actual local Workerd with real NEW R2 reads
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8797 --log-level error \
            --var "NOON_RESCUE_R2_ACCESS_KEY_ID:$NOON_NEW_R2_ACCESS_KEY_ID" \
            --var "NOON_RESCUE_R2_SECRET_ACCESS_KEY:$NOON_NEW_R2_SECRET_ACCESS_KEY" >/tmp/workerd-dedupe.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30};do if curl -fsS --max-time 3 http://127.0.0.1:8797/api/revision -o /dev/null;then break;fi;sleep 2;done
          node --input-type=module <<'NODE'
          const host='http://127.0.0.1:8797';
          for(const path of ['/','/articles/شراء-الجوالات-من-نون-السعودية-باستخدام-كوبون-لشراء-ذكي','/en/articles/en-noon-uae-coupon-conditions-guide']){
            const r=await fetch(host+path),html=await r.text();
            const nodes=[...html.matchAll(/<script\b[^>]*type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi)].flatMap(x=>{
              const a=JSON.parse(x[1]);return Array.isArray(a)?a:[a];
            });
            const all=nodes.flatMap(n=>n?.['@graph']?[n,...n['@graph']]:[n]).flatMap(n=>Array.isArray(n?.['@type'])?n['@type']:[n?.['@type']]).filter(Boolean);
            const types=Object.fromEntries([...new Set(all)].map(k=>[k,all.filter(v=>v===k).length]));
            console.log('WORKER_DEDUPE='+path+' HTTP='+r.status+' TYPES='+JSON.stringify(types)+' SOCIAL_BRAND='+html.includes('/assets/featured/brands.svg')+' ORIG_DATE='+(html.match(/"datePublished":"[^"]+"/)||[])[0]);
            if(r.status!==200)process.exitCode=1;
            if(path==='/'){
              for(const type of ['Organization','WebSite','WebPage'])if(types[type]!==1)process.exitCode=1;
              if(!html.includes('property="og:image" content="https://noondealsnow.com/assets/featured/brands.svg"'))process.exitCode=1;
            }else{
              if(types.Article!==1||types.FAQPage!==1||!html.includes('property="og:image"'))process.exitCode=1;
              if(path.includes('/articles/')&&!path.includes('/en/')&&types.BreadcrumbList!==1)process.exitCode=1;
              if(path.includes('/en/')&&!html.includes('"datePublished":"2026-09-28'))process.exitCode=1;
            }
          }
          NODE
