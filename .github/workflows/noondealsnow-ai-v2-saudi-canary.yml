name: NoonDealsNow AI V2 Saudi Quality Canary
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noondealsnow-ai-v2-saudi-canary.yml'
permissions:
  contents: read
concurrency:
  group: noondealsnow-ai-v2-single-site
  cancel-in-progress: false
jobs:
  isolated-saudi-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Saudi SEO and safety before invoking any AI
        run: |
          node --check automation/ai-v2/run.mjs
          node --check automation/ai-v2/native-arabic-article.mjs
          node --test tests/ai-v2-guardrails.test.mjs tests/ai-v2-native-arabic-article.test.mjs tests/ai-v2-topic-queue.test.mjs
      - name: Generate one checkpointed Saudi article with full native quality gate
        shell: bash
        env:
          AI_PREFLIGHT_ONLY: 'false'
          AI_ONE_OFF_CANARY: 'true'
          AI_SA_ONE_OFF: 'true'
          AI_CANARY_MARKET: 'SA'
          AI_PROVIDER_OVERRIDE: 'groq'
          AI_RESUME_PAUSED_QUOTA: 'true'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.NOONDEALSNOW_AI_R2_CHECKPOINT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e4c35f8a50a7b2e4cfb9d6c534962603
          NOONDEALSNOW_AI_FREE_ONLY_APPROVED: ${{ secrets.NOONDEALSNOW_AI_FREE_ONLY_APPROVED }}
          NOONDEALSNOW_AI_SITE_PUBLISH_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
        run: |
          set -euo pipefail
          [ "${NOONDEALSNOW_AI_FREE_ONLY_APPROVED:-}" = 'true' ] || { echo 'FREE_ONLY_REQUIRED'; exit 18; }
          [ -n "${GROQ_API_KEY:-}" ] || { echo 'GROQ_MISSING'; exit 19; }
          npm install --no-audit --no-fund --ignore-scripts
          node automation/ai-v2/run.mjs | tee /tmp/ndn-sa-canary.log
          echo '### NoonDealsNow Saudi native quality canary' >> "$GITHUB_STEP_SUMMARY"
          grep '^AI_V2_REPORT ' /tmp/ndn-sa-canary.log >> "$GITHUB_STEP_SUMMARY" || true
          echo 'Saudi Cron still disabled; only LIVE_VERIFIED on a public article URL is success.' >> "$GITHUB_STEP_SUMMARY"
