name: Diagnose Current English Canary HTML, Publishing and DO Restore
on:
  push:
    branches: [fix/oct21-live-canary-publishing-diagnostics]
    paths: ['.github/workflows/oct21-diagnose-canary-publication.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NEW_KEY: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
      NEW_SECRET: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - name: Read only live canary page headers, SEO markup and publishing counters
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,re,urllib.parse,datetime
          origin='https://noondealsnow.com'
          def get(path):
            req=urllib.request.Request(origin+urllib.parse.quote(path,safe='/?=&%'),headers={'User-Agent':'Mozilla/5.0'})
            try:
              with urllib.request.urlopen(req,timeout=22) as r:return r.status,r.read(450000).decode('utf8','replace'),dict(r.headers)
            except urllib.error.HTTPError as e:return e.code,e.read(4000).decode('utf8','replace'),dict(e.headers)
          h=0
          try:
            code,txt,_=get('/api/english-canary-health');d=json.loads(txt);records=d.get('records') or []
            print('CANARY_STATE='+json.dumps({'http':code,'target':d.get('target'),'published':d.get('published'),'count':len(records),'paths':[r.get('urlPath') for r in records[:2]]}),flush=True)
            for record in records[:2]:
              p=record['urlPath'];code,txt,headers=get(p)
              country=record.get('country');market='en-AE' if country=='AE' else 'en-SA';ar='ar-AE' if country=='AE' else 'ar-SA';ar_path='/uae' if country=='AE' else '/saudi'
              assertions={
               'http200':code==200,
               'content_lang_en':'content-language' in {k.lower() for k in headers} and next((v for k,v in headers.items() if k.lower()=='content-language'),'').startswith('en'),
               'x_english_canary':next((v for k,v in headers.items() if k.lower()=='x-english-canary'),None)=='v1',
               'lang_html':f'<html lang="{market}" dir="ltr">' in txt,
               'canonical':f'<link rel="canonical" href="{origin+p}">' in txt,
               'hreflang_en':f'hreflang="{market}" href="{origin+p}"' in txt,
               'hreflang_ar':f'hreflang="{ar}" href="{origin+ar_path}"' in txt,
               'hreflang_default':f'hreflang="x-default" href="{origin+p}"' in txt,
               'copy_code':'data-copy-code=' in txt,
               'Copy':'Copy ' in txt,
               'noon_link':'href="https://www.noon.com/' in txt,
               'meta_desc':bool(re.search(r'<meta[^>]+name="description"[^>]+content="[^"]+"',txt,re.I)),
               'no_guide_guide':not bool(re.search(r'guide\s+guide',txt,re.I)),
               'no_unverified_pct':not bool(re.search(r'(save|discount)\s+(up to\s+)?[0-9]{1,3}%',txt,re.I))
              }
              print('CANARY_PAGE_CHECK='+json.dumps({'path':p,'status':code,'headers':{'content-language':headers.get('content-language'),'x-english-canary':headers.get('x-english-canary'),'x-r2-rescue':headers.get('x-r2-rescue')},'assert':assertions,'head':txt[:370].replace('\n',' ')}),flush=True)
          except Exception as e:print('CANARY_INSPECTION_ERROR='+type(e).__name__+':'+str(e)[:120],flush=True)
          for p in ['/api/generation-freshness','/api/health','/api/bulk-status','/api/english-canary-health']:
            try:
              c,t,_=get(p);d=json.loads(t)
              out={'path':p,'status':c}
              for k in ['ok','lastSuccessfulPublishAt','minutesSinceLastSuccessfulPublish','bulkLastError','bulkLastTickPublished','bulkNoPassStreak','bulkLastQualityRejectReasons','bulkLastGlobalRejectReasons','bulkLastPreflightGlobalRejectReasons','r2','publishedLastHour','count','english']:
                if k in d:out[k]=d[k]
              print('LIVE_STATUS='+json.dumps(out,ensure_ascii=False)[:1000],flush=True)
            except Exception as e:print('LIVE_STATUS_ERROR='+p+' '+str(e)[:80],flush=True)
          PY
      - name: Existing new-account DO restore state and article backup
        shell: bash
        run: |
          python3 -m pip install -q boto3
          python3 - <<'PY'
          import boto3,os,json
          c=boto3.client('s3',region_name='auto',endpoint_url='https://e4c35f8a50a7b2e4cfb9d6c534962603.r2.cloudflarestorage.com',aws_access_key_id=os.environ['NEW_KEY'].strip(),aws_secret_access_key=os.environ['NEW_SECRET'].strip())
          for tag in ['20261017-baseline','20261020-old-do-recovery']:
            for typ in ['ControlPlane','GeneratorControl']:
              k=f'migration/restore-progress/{tag}/{typ}.json'
              try:
                d=json.load(c.get_object(Bucket='nooncoupons-content-v2',Key=k)['Body'])
                print('DO_RESTORE='+json.dumps({'tag':tag,'type':typ,**{x:d.get(x) for x in ['partsDone','partsTotal','keysRestored','keysTotal','complete','updatedAt']}}),flush=True)
              except Exception as e:print('DO_RESTORE_UNAVAILABLE='+tag+' '+typ+' '+type(e).__name__,flush=True)
          PY
