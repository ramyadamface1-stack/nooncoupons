name: One Shot R2 Counter
on:
  push:
    paths:
      - '.github/workflows/one-shot-r2-counter.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch live R2 counter and always-on generation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('commerce-entry.js')
          s=p.read_text()
          needle="async function r2json(env,key,fallback){try{const o=env.CONTENT_FINAL?await env.CONTENT_FINAL.get(key):null;return o?await o.json():fallback}catch{return fallback}}"
          add=needle+"\nasync function countR2ArticleHtml(env){if(!env.CONTENT_FINAL)return null;let cursor=null,count=0,pages=0;do{const page=await env.CONTENT_FINAL.list({prefix:'articles/',limit:1000,...(cursor?{cursor}:{})});count+=(page.objects||[]).filter(o=>String(o.key||'').endsWith('.html')).length;pages++;if(!page.truncated)break;cursor=page.cursor||null}while(cursor&&pages<100);return count}"
          assert needle in s
          s=s.replace(needle,add,1)
          needle2="  const bulk=generator?.bulk||{};"
          repl2="  const r2Uploaded=await countR2ArticleHtml(env);\n  const bulk=generator?.bulk||{};"
          assert needle2 in s
          s=s.replace(needle2,repl2,1)
          needle3="    ok:true,total:arabic+englishTotal,arabic,english:englishTotal,"
          repl3="    ok:true,total:arabic+englishTotal,r2Uploaded,arabic,english:englishTotal,"
          assert needle3 in s
          s=s.replace(needle3,repl3,1)
          p.write_text(s)

          p=Path('admin-page.js')
          s=p.read_text()
          s=s.replace('كل المقالات<div class="n" id="metricArticles">-</div><div class="sub">Control Plane</div>','المقالات المرفوعة على R2<div class="n" id="metricArticles">-</div><div class="sub">R2 actual HTML</div>',1)
          s=s.replace('<button class="danger" id="pauseBtn">إيقاف مؤقت</button>','<button class="danger" id="pauseBtn" disabled title="التوليد مضبوط على تشغيل دائم">التوليد دائم</button>',1)
          s=s.replace("const [d,h]=await Promise.all([api('/api/admin/status'),api('/api/generator-health')]);","const [d,h,c]=await Promise.all([api('/api/admin/status'),api('/api/generator-health'),api('/api/content-stats')]);",1)
          s=s.replace("$('metricArticles').textContent=h.articleCount??d.articleCount??'-';","$('metricArticles').textContent=c.r2Uploaded??c.total??h.articleCount??d.articleCount??'-';",1)
          s=s.replace("$('resumeBtn').onclick=()=>setGenerator(true);$('pauseBtn').onclick=()=>setGenerator(false);","$('resumeBtn').onclick=()=>setGenerator(true);$('pauseBtn').onclick=()=>{};",1)
          p.write_text(s)

          p=Path('admin-runtime.js')
          s=p.read_text()
          needle="    if(!c){c={...GENERATOR_DEFAULTS,createdAt:now()};dirty=true}"
          repl=needle+"\n    if(c.enabled!==true){c.enabled=true;dirty=true}"
          assert needle in s
          s=s.replace(needle,repl,1)
          s=s.replace("if('enabled' in b)next.enabled=Boolean(b.enabled);","if('enabled' in b)next.enabled=true;",1)
          s=s.replace("for(const k of ['enabled','targetWords','minWords','qualityThreshold'])if(k in b)allowed[k]=b[k];","for(const k of ['enabled','targetWords','minWords','qualityThreshold'])if(k in b)allowed[k]=k==='enabled'?true:b[k];",1)
          p.write_text(s)
          PY
          node --check commerce-entry.js
          node --check admin-page.js
          node --check admin-runtime.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add commerce-entry.js admin-page.js admin-runtime.js
          git commit -m "Add live R2 article counter and keep generator always on"
          git push
