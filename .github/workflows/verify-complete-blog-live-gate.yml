name: NoonDealsNow Blog — read-only Cloudflare live release gate
on:
  push:
    branches:
      - fix/noondealsnow-complete-blog-r2-pagination-20261107
    paths:
      - .github/workflows/verify-complete-blog-live-gate.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  review-live-gates:
    if: github.repository == 'ramyadamface1-stack/nooncoupons'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEW_CF_TOKEN: ${{ secrets.NOON_NEW_CF_API_TOKEN }}
      OLD_CF_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
    steps:
      - name: Fresh read-only zone delegation + production Worker access assessment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          def request(url,token=None):
            headers={'Accept':'application/json','User-Agent':'NoonDealsNow-Blog-ReadOnly-Release-Gate'}
            if token:headers['Authorization']='Bearer '+token
            req=urllib.request.Request(url,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=18) as response:
                return response.status,json.load(response)
            except urllib.error.HTTPError as e:
              try:json.load(e)
              except:pass
              return e.code,{}
            except Exception as e:return 0,{'transportError':type(e).__name__}
          newToken=str(os.environ.get('NEW_CF_TOKEN') or '').strip()
          oldToken=str(os.environ.get('OLD_CF_TOKEN') or '').strip()
          zoneId='c09077a581adc7aa11d6de0c121e179d'
          newAccount='e4c35f8a50a7b2e4cfb9d6c534962603'
          oldAccount='c82274152a942dea53044eae7153cfd7'
          code,zone=request('https://api.cloudflare.com/client/v4/zones/'+zoneId,newToken)
          z=zone.get('result') or {}
          assigned=sorted(x.lower().rstrip('.') for x in z.get('name_servers',[]))
          status=str(z.get('status') or 'unknown')
          dnsCode,dns=request('https://dns.google/resolve?name=noondealsnow.com&type=NS')
          delegated=sorted(x.get('data','').lower().rstrip('.') for x in dns.get('Answer',[]) if x.get('type')==2)
          delegatedMatch=bool(assigned) and assigned==delegated
          oldCode,old=request('https://api.cloudflare.com/client/v4/accounts/'+oldAccount+'/workers/services/nooncoupons',oldToken)
          newCode,new=request('https://api.cloudflare.com/client/v4/accounts/'+newAccount+'/workers/services/noondealsnow-production-new',newToken)
          gate={
            'checkedAt':'2026-11-07',
            'newZoneHTTP':code,'newZoneStatus':status,'assignedNS':assigned,
            'publicDNSHTTP':dnsCode,'delegatedNS':delegated,'delegatedNSMatch':delegatedMatch,
            'oldWorkerServiceHTTP':oldCode,'oldWorkerDeployAccessible':oldCode==200 and old.get('success') is True,
            'newProductionWorkerHTTP':newCode,'newProductionWorkerExists':newCode==200 and new.get('success') is True,
            'doFreshRestorationParityProved':False,
            'safeToMovePublicDNS':False,
            'publicBlogMayBeRedeployedOnOld':oldCode==200 and old.get('success') is True
          }
          print('LIVE_BLOG_RELEASE_GATE='+json.dumps(gate,separators=(',',':'),ensure_ascii=False),flush=True)
          print('GATE_READ_ONLY=TRUE;DNS_WRITES=0;WORKER_DEPLOYS=0;R2_WRITES=0',flush=True)
          PY
