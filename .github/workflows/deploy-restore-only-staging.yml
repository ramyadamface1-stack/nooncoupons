name: Restore-Only Staging Worker on NEW Cloudflare

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-restore-only-staging.yml'
      - 'wrangler.migration-staging.jsonc'
      - 'do-migration-state.js'
      - 'admin-runtime.js'
      - 'publication-rate-limit.js'
      - 'tests/ai-v2-publishing-cadence.test.mjs'
      - 'brand-runtime.js'
      - 'wrangler.new-account-production.jsonc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noondealsnow-new-account-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.NOON_NEW_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e4c35f8a50a7b2e4cfb9d6c534962603
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed if staging could publish or expose production routes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const j=JSON.parse(fs.readFileSync('wrangler.migration-staging.jsonc','utf8'));
          const vars=j.vars||{};
          const good=(j.name==='noondealsnow-migration-staging'
            && j.workers_dev===false
            && (!j.routes||j.routes.length===0)
            && j.triggers?.crons?.length===1
            && j.triggers.crons[0]==='*/3 * * * *'
            && vars.DO_MIGRATION_RESTORE_ENABLED==='true'
            && vars.DO_MIGRATION_RESTORE_PARTS_PER_TICK==='1'
            && vars.DO_MIGRATION_EXPORT_ENABLED==='false'
            && vars.BULK_DAILY_TARGET==='0'
            && vars.ENGLISH_DAILY_TARGET==='0'
            && vars.INDEXNOW_ENABLED==='false'
            && !j.ai
            && j.r2_buckets?.some(b=>b.binding==='CONTENT_FINAL'&&b.bucket_name==='nooncoupons-content-v2'));
          if(!good)throw Error('unsafe_migration_staging_config');
          const source=fs.readFileSync('brand-runtime.js','utf8');
          const restoreAt=source.indexOf("if(String(env.DO_MIGRATION_RESTORE_ENABLED||'')==='true')");
          const normalAt=source.indexOf('if(app.scheduled)return app.scheduled(event,env,ctx);',restoreAt);
          if(restoreAt<0||normalAt<restoreAt||!source.slice(restoreAt,normalAt).includes('      return;'))
            throw Error('staging_must_return_before_publisher_cron');
          console.log('NEW_ACCOUNT_RESTORE_ONLY_ISOLATION=PASS');
          NODE
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "NEW_CF_DEPLOY_TOKEN=missing"; exit 2; fi
      - name: Cloudflare new-account credential check
        shell: bash
        run: |
          set -euo pipefail
          http=$(curl -sS -o /tmp/verify.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
          if [ "$http" != 200 ]; then echo "NEW_CF_VERIFY_HTTP=$http"; exit 3; fi
          jq -e '.success==true and .result.status=="active"' /tmp/verify.json >/dev/null
          echo "NEW_CF_DEPLOY_TOKEN=active"
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: node --test tests/do-migration-state.test.mjs
      - name: Verify native publication cadence on the actual DO owner script before deploying
        run: node --test tests/ai-v2-publishing-cadence.test.mjs tests/ai-v2-global-capacity.test.mjs
      - run: npx wrangler deploy --dry-run --config wrangler.migration-staging.jsonc --outdir /tmp/new-stage
      - name: Deploy isolated restore-only Worker and native publication gate owner
        run: npx wrangler deploy --config wrangler.migration-staging.jsonc
      - name: Confirm the DO owner script includes native AI V2 publish control source
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('wrangler.migration-staging.jsonc','utf8'));
          const production=JSON.parse(fs.readFileSync('wrangler.new-account-production.jsonc','utf8'));
          if(config.name!=='noondealsnow-migration-staging')process.exit(1);
          const bindings=production.durable_objects?.bindings||[];
          if(!bindings.some(x=>x.name==='GENERATOR_CONTROL'&&x.script_name===config.name))process.exit(2);
          const source=fs.readFileSync('admin-runtime.js','utf8');
          if(!source.includes("ai-v2-publication-permit-v1")||!source.includes('publishingIntervalMinutes'))process.exit(3);
          console.log('AI_V2_PUBLISHING_DO_OWNER_SOURCE_AND_BINDING=VERIFIED');
          NODE
      - name: Verify Worker exists on NEW account via API
        shell: bash
        run: |
          set -euo pipefail
          http=$(curl -sS -o /tmp/workers.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")
          echo "NEW_ACCOUNT_WORKERS_HTTP=$http"
          test "$http" = 200
          jq -e --arg worker noondealsnow-migration-staging \
            '.success==true and any(.result[]?; .id==$worker or .name==$worker)' /tmp/workers.json >/dev/null
          echo "NEW_RESTORE_ONLY_WORKER=deployed"
          echo "NEW_WORKER_PUBLIC_ROUTE=none"
          echo "NEW_WORKER_PUBLISHING=disabled"
          echo "NEW_WORKER_RESTORE=manifest-gated"
      - name: Read-only check of destination DNS zone ownership
        shell: bash
        run: |
          set -euo pipefail
          http=$(curl -sS -o /tmp/zone.json -w '%{http_code}' -G \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data-urlencode 'name=noondealsnow.com' \
            --data-urlencode "account.id=$CLOUDFLARE_ACCOUNT_ID" \
            'https://api.cloudflare.com/client/v4/zones' || true)
          echo "DESTINATION_DNS_ZONE_QUERY_HTTP=$http"
          if [ "$http" = 200 ] && jq -e '.success==true' /tmp/zone.json >/dev/null; then
            count=$(jq '[.result[]?|select(.name=="noondealsnow.com")]|length' /tmp/zone.json)
            echo "DESTINATION_DNS_ZONE_COUNT=$count"
            jq -rc '.result[]?|select(.name=="noondealsnow.com")|{name,status,paused,type,name_servers}' /tmp/zone.json | sed 's/^/DESTINATION_DNS_ZONE_STATUS=/'
          else
            echo 'DESTINATION_DNS_ZONE_QUERY=NOT_AUTHORIZED_OR_UNAVAILABLE'
          fi
          echo 'DNS_CUTOVER_CHANGES=NONE'

  deploy-hidden-production:
    name: New account candidate - no DNS, no public route, no Cron
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.NOON_NEW_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e4c35f8a50a7b2e4cfb9d6c534962603
      DEST_ACCESS: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
      DEST_SECRET: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed if new production candidate can publish before migration verification
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('wrangler.new-account-production.jsonc','utf8'));
          const b=c.durable_objects?.bindings||[];
          if(c.name!=='noondealsnow-production-new'||c.main!=='discovery-entry.js'||
             c.workers_dev!==false||c.routes?.length||c.triggers?.crons?.length!==0||
             c.r2_buckets?.length!==1||c.r2_buckets[0].binding!=='CONTENT_FINAL'||
             c.r2_buckets[0].bucket_name!=='nooncoupons-content-v2'||
             b.length!==2||b.some(x=>x.script_name!=='noondealsnow-migration-staging')||
             c.ai||c.migrations||c.vars?.BULK_DAILY_TARGET!=='0'||
             c.vars?.ENGLISH_DAILY_TARGET!=='0'||c.vars?.INDEXNOW_ENABLED!=='false'||
             c.vars?.DO_MIGRATION_EXPORT_ENABLED!=='false'||
             c.vars?.DO_MIGRATION_RESTORE_ENABLED!=='false')throw Error('UNSAFE_NEW_ACCOUNT_PRODUCTION_CANDIDATE');
          console.log('NEW_ACCOUNT_CANDIDATE_ISOLATED=true');
          console.log('NEW_ACCOUNT_CANDIDATE_R2_NATIVE=true');
          console.log('NEW_ACCOUNT_CANDIDATE_DO_OWNER=noondealsnow-migration-staging');
          NODE
      - name: Verify restored baseline in existing new-account R2 before deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet boto3
          python3 - <<'PY'
          import boto3,json,os
          from botocore.config import Config
          s=boto3.client('s3',region_name='auto',endpoint_url='https://e4c35f8a50a7b2e4cfb9d6c534962603.r2.cloudflarestorage.com',aws_access_key_id=os.environ['DEST_ACCESS'].strip(),aws_secret_access_key=os.environ['DEST_SECRET'].strip(),config=Config(connect_timeout=10,read_timeout=25,retries={'max_attempts':2,'mode':'standard'}))
          b='nooncoupons-content-v2'
          for kind in ('ControlPlane','GeneratorControl'):
            pre='migration/do-state/20261017-baseline/'+kind+'/manifest.json'
            post='migration/restore-progress/20261017-baseline/'+kind+'.json'
            src=json.loads(s.get_object(Bucket=b,Key=pre)['Body'].read())
            dst=json.loads(s.get_object(Bucket=b,Key=post)['Body'].read())
            if not(src.get('complete') is True and dst.get('complete') is True and dst.get('keysRestored')==src.get('exported') and dst.get('partsDone')==src.get('parts')):raise RuntimeError('unsafe_incomplete_baseline_restore_'+kind)
            print('NEW_ACCOUNT_BASELINE_RESTORE='+json.dumps({'kind':kind,'keys':dst['keysRestored'],'complete':True}))
          print('NEWER_BACKUP_AND_FRESH_CUTOVER_STILL_REQUIRE_INDEPENDENT_VERIFICATION=true')
          PY
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Cloudflare new-account production candidate dry-run
        run: npx wrangler deploy --dry-run --config wrangler.new-account-production.jsonc --outdir /tmp/new-prod-candidate
      - name: Deploy inert new-account production candidate (no routes or Cron)
        run: npx wrangler deploy --config wrangler.new-account-production.jsonc
      - name: Read-only verify new-account candidate script exists
        shell: bash
        run: |
          set -euo pipefail
          http=$(curl -sS -o /tmp/new-worker.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")
          test "$http" = 200
          jq -e '.success==true and any(.result[]?; .id=="noondealsnow-production-new" or .name=="noondealsnow-production-new")' /tmp/new-worker.json >/dev/null
          echo 'NEW_ACCOUNT_HIDDEN_PRODUCTION_WORKER=deployed'
          echo 'DNS_CUTOVER=not_performed'
          echo 'PUBLIC_ROUTES=none'
          echo 'AUTOMATIC_PUBLISHING=disabled_until_verified_data_cutover'
