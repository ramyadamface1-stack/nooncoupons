name: Verify Rescued NoonDealsNow Live Articles
on:
  push:
    branches: [audit/noonrescue-liveverify-20261019]
    paths: ['.github/workflows/noonrescue-live-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
    steps:
      - name: Check production, Worker direct domain, and secret names without modifying resources
        shell: bash
        run: |
          set -euo pipefail
          for host in 'https://noondealsnow.com' 'https://nooncoupons.ramychatgptgcoupons.workers.dev'; do
            echo "LIVE_RESCUE_HOST=$host"
            for path in '/articles/شراء-الجوالات-من-نون-السعودية-باستخدام-كوبون-لشراء-ذكي' '/blog' '/blog/archive/all' '/blog/archive/2026-10-18' '/blog/archive'; do
              code=$(curl -sS --connect-timeout 10 --max-time 30 -D /tmp/rescue-headers -o /tmp/rescue-body -w '%{http_code}' "$host$path?rescue_audit=${GITHUB_RUN_ID}" || true)
              rescue=$(grep -i '^x-r2-rescue:' /tmp/rescue-headers | head -n1 | tr -d '\r' || true)
              bytes=$(wc -c </tmp/rescue-body || echo 0)
              echo "LIVE_RESCUE_PATH=$path HTTP=$code BYTES=$bytes HEADER=$rescue"
              if [ "$code" != '200' ]; then echo "::error::LIVE_RESCUE_ROUTE_FAILED=$path"; exit 1; fi
              if [ "$rescue" != 'x-r2-rescue: new-account-readonly-v1' ] && [[ "$rescue" != *"new-account-readonly-v1"* ]]; then echo "::error::LIVE_RESCUE_HEADER_MISSING=$path"; exit 1; fi
            done
          done
          curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/c82274152a942dea53044eae7153cfd7/workers/scripts/nooncoupons/settings" > /tmp/rescue-bindings.json
          jq -e '.success==true and ([.result.bindings[]?|select(.name=="NOON_RESCUE_R2_ACCESS_KEY_ID" or .name=="NOON_RESCUE_R2_SECRET_ACCESS_KEY")]|length==2)' /tmp/rescue-bindings.json >/dev/null
          echo 'PRODUCTION_RESCUE_READONLY_VERIFIED=true'
