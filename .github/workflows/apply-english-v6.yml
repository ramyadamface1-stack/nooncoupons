name: Apply English V6 structural blueprints
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-english-v6.yml']
permissions:
  contents: write
jobs:
  apply-v6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply V6 migration
        run: node english-v6-migrate.mjs
      - name: Syntax check
        run: node --check bulk-content-engine.js
      - name: Commit V6 generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bulk-content-engine.js
          git diff --cached --quiet && exit 0
          git commit -m "Diversify English articles by intent category and market"
          git push origin HEAD:main
