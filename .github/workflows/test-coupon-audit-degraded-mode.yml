name: Test Coupon Audit During Old R2 Entitlement Suspension
on:
  push:
    branches: [fix/coupon-audit-disabled-old-r2-20261019]
    paths: ['.github/workflows/test-coupon-audit-degraded-mode.yml','.github/workflows/audit-coupon-codes.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Reuse precise production auditing steps
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml
          with open('.github/workflows/audit-coupon-codes.yml') as f:doc=yaml.safe_load(f)
          jobs=doc['jobs']['audit']['steps']
          for item in jobs:
            if item.get('name')=='Audit live home and blog coupon codes':
              open('/tmp/audit-live-coupons.sh','w').write(item['run'])
              break
          else:raise RuntimeError('live coupon audit step not present')
          PY
          bash -e -o pipefail /tmp/audit-live-coupons.sh
          echo 'COUPON_DEGRADED_AUDIT_PASS=true'
