name: Verify Conversion Contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify source conversion contract
        run: |
          set -euo pipefail
          node --check network-entry.js
          node --check approved-coupons.js
          grep -Fq "marketAwareConversionAnalytics:true" network-entry.js
          grep -Fq "x-conversion-market-source','article-metadata'" network-entry.js
          grep -Fq "conversionDispatch:'single-v3'" network-entry.js
          grep -Fq "conversionEvents:['coupon_view','copy_code','shop_click']" network-entry.js
          node --check router.js
          grep -Fq "function modernSearchPage(url)" router.js
          grep -Fq "data-placement=\"home_coupon_grid\"" router.js
          grep -Fq "fire('copy_code'" router.js
          grep -Fq "fire('coupon_view'" router.js
          grep -Fq "x-robots-tag':'noindex, follow'" router.js
          grep -Fq "const articleMarket=rec.country==='AE'?'AE':'SA'" network-entry.js
          grep -Fq "const market=marketHint||(location.pathname.startsWith('/uae')?'AE':'SA')" network-entry.js
          grep -Fq "APPROVED_COUPON_CODES" network-entry.js
          grep -Fq "'OPS32','OPS56','OPS47','OPS48','OPS43','OPS41','OPS38','OPS58'" approved-coupons.js
          if grep -E -n '\bNOV[0-9]+\b' approved-coupons.js; then
            echo UNAPPROVED_NOV_CODE_IN_APPROVED_REGISTRY
            exit 1
          fi
          echo CONVERSION_CONTRACT_PASS
