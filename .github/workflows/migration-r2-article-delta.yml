name: Hourly Missing Article Delta to New R2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migration-r2-article-delta.yml'
      - '.github/scripts/migrate-r2-article-delta.py'
  workflow_dispatch:
  schedule:
    - cron: '43 * * * *'

permissions:
  contents: read

concurrency:
  group: noondealsnow-r2-source-to-destination-copy
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NOON_OLD_R2_ACCESS_KEY_ID: ${{ secrets.NOON_OLD_R2_ACCESS_KEY_ID }}
      NOON_OLD_R2_SECRET_ACCESS_KEY: ${{ secrets.NOON_OLD_R2_SECRET_ACCESS_KEY }}
      NOON_NEW_R2_ACCESS_KEY_ID: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
      NOON_NEW_R2_SECRET_ACCESS_KEY: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install dependency and run offline integrity tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check boto3
          python3 -m py_compile .github/scripts/migrate-r2-article-delta.py
          python3 -m unittest discover -s tests -p 'test_r2_article_delta.py' -v
      - name: Copy missing only and verify SHA256 plus metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 -u .github/scripts/migrate-r2-article-delta.py
