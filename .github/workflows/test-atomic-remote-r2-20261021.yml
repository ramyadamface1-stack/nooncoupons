name: Validate Atomic Conditional Writes to Existing New R2
on:
  push:
    branches: [fix/atomic-conditional-remote-r2-20261021]
    paths:
      - 'r2-remote-existing-bucket.js'
      - 'tests/remote-existing-r2-binding.test.mjs'
      - '.github/workflows/test-atomic-remote-r2-20261021.yml'
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOON_RESCUE_R2_ACCESS_KEY_ID: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
      NOON_RESCUE_R2_SECRET_ACCESS_KEY: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: All remote R2 regression tests (mock only)
        run: |
          set -euo pipefail
          node --check r2-remote-existing-bucket.js
          node --test tests/remote-existing-r2-binding.test.mjs
      - name: Real S3 atomic create-once and conditional replace on existing destination bucket
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {existingDestinationR2Binding} from './r2-remote-existing-bucket.js';
          const r=existingDestinationR2Binding(process.env);
          const key='maintenance/remote-conditional-probe-'+process.env.GITHUB_RUN_ID+'.txt';
          const a=await r.put(key,'first',{onlyIf:{etagDoesNotMatch:'*'},httpMetadata:{contentType:'text/plain'},customMetadata:{probe:'20261021'}});
          assert.ok(a&&a.etag,'create-once must succeed with returned ETag');
          const exists=await r.put(key,'should-not-write',{onlyIf:{etagDoesNotMatch:'*'}});
          assert.equal(exists,null,'second create-once must fail with native null');
          const obj=await r.get(key);
          assert.equal(await obj.text(),'first','failed conditional must not overwrite first object');
          const c=await r.put(key,'second',{onlyIf:{etagMatches:a.etag},httpMetadata:{contentType:'text/plain'}});
          assert.ok(c&&c.etag,'compare-and-swap update must succeed with fresh ETag');
          const stale=await r.put(key,'stale',{onlyIf:{etagMatches:a.etag}});
          assert.equal(stale,null,'stale ETag must not overwrite');
          assert.equal(await (await r.get(key)).text(),'second');
          console.log('REAL_EXISTING_R2_CONDITIONAL_ATOMICITY=PASS');
          console.log('REAL_R2_PRECONDITION_FAILURE_RETURNS_NULL=true');
          NODE
      - name: Cleanup ONLY temporary probe object, never any article or user content
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet boto3
          python3 - <<'PY'
          import boto3,os
          s=boto3.client('s3',region_name='auto',endpoint_url='https://e4c35f8a50a7b2e4cfb9d6c534962603.r2.cloudflarestorage.com',
            aws_access_key_id=os.environ['NOON_RESCUE_R2_ACCESS_KEY_ID'].strip(),
            aws_secret_access_key=os.environ['NOON_RESCUE_R2_SECRET_ACCESS_KEY'].strip())
          key='maintenance/remote-conditional-probe-'+os.environ['GITHUB_RUN_ID']+'.txt'
          s.delete_object(Bucket='nooncoupons-content-v2',Key=key)
          print('TEMP_PROBE_CLEANED=true')
          PY
