name: NoonDealsNow AI V2 Groq Resume Canary
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noondealsnow-ai-v2-groq-resume-canary.yml'
permissions:
  contents: read
concurrency:
  group: noondealsnow-ai-v2-single-site
  cancel-in-progress: false
jobs:
  resume-existing-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Safety tests before no-retry Groq resume
        run: |
          node --check automation/ai-v2/run.mjs
          node --test tests/ai-v2-guardrails.test.mjs tests/ai-v2-native-article.test.mjs
      - name: Resume exactly the paused UAE draft; never retry Gemini
        shell: bash
        env:
          AI_PREFLIGHT_ONLY: 'false'
          AI_ONE_OFF_CANARY: 'true'
          AI_CANARY_MARKET: 'AE'
          AI_RESUME_PAUSED_QUOTA: 'true'
          AI_PROVIDER_OVERRIDE: 'groq'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.NOONDEALSNOW_AI_R2_CHECKPOINT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e4c35f8a50a7b2e4cfb9d6c534962603
          NOONDEALSNOW_AI_FREE_ONLY_APPROVED: ${{ secrets.NOONDEALSNOW_AI_FREE_ONLY_APPROVED }}
          NOONDEALSNOW_AI_SITE_PUBLISH_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
        run: |
          set -euo pipefail
          [ "${NOONDEALSNOW_AI_FREE_ONLY_APPROVED:-}" = 'true' ] || { echo 'FREE_ONLY_APPROVAL_REQUIRED'; exit 11; }
          [ -n "${GROQ_API_KEY:-}" ] || { echo 'GROQ_API_KEY_MISSING'; exit 12; }
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo 'R2_CHECKPOINT_TOKEN_MISSING'; exit 13; }
          npm install --no-audit --no-fund --ignore-scripts
          node automation/ai-v2/run.mjs | tee /tmp/ndn-groq-resume.log
          echo '### NoonDealsNow — controlled Groq resume of existing checkpoint' >> "$GITHUB_STEP_SUMMARY"
          grep '^AI_V2_REPORT ' /tmp/ndn-groq-resume.log >> "$GITHUB_STEP_SUMMARY" || true
          echo 'Only LIVE_VERIFIED with a real public article URL proves publication.' >> "$GITHUB_STEP_SUMMARY"
