name: NoonDealsNow R2 Copy to New Cloudflare (Safe Resume)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migration-r2-full-copy.yml'
      - '.github/scripts/migrate-r2-resumable.py'
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: noondealsnow-r2-source-to-destination-copy
  cancel-in-progress: false

jobs:
  source-to-new-r2:
    name: Copy source keys, SHA256-verify all, no delete or overwrite
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      NOON_OLD_R2_ACCESS_KEY_ID: ${{ secrets.NOON_OLD_R2_ACCESS_KEY_ID }}
      NOON_OLD_R2_SECRET_ACCESS_KEY: ${{ secrets.NOON_OLD_R2_SECRET_ACCESS_KEY }}
      NOON_NEW_R2_ACCESS_KEY_ID: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
      NOON_NEW_R2_SECRET_ACCESS_KEY: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install boto3 and validate migration script
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check boto3
          python3 -m py_compile .github/scripts/migrate-r2-resumable.py
      - name: Resumable full bucket transfer from old to new
        shell: bash
        run: |
          set -euo pipefail
          python3 -u .github/scripts/migrate-r2-resumable.py
