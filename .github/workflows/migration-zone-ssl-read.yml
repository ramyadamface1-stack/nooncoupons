name: Check New Cloudflare Zone DNS SSL and Worker Route Permissions
on:
  push:
    branches: [migration/preflight-inspection-20261018]
    paths: ['.github/workflows/migration-zone-ssl-read.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OLD_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
      NEW_TOKEN: ${{ secrets.NOON_NEW_CF_API_TOKEN }}
    steps:
      - name: Read selected Cloudflare settings and permission errors without changing them
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          root='https://api.cloudflare.com/client/v4'
          ids={'NEW':'c09077a581adc7aa11d6de0c121e179d'}
          toks={'NEW':os.environ['NEW_TOKEN'].strip(),'OLD':os.environ['OLD_TOKEN'].strip()}
          endpoints={'dns':'/dns_records?per_page=1','ssl':'/settings/ssl','universal_ssl':'/ssl/universal/settings','dnssec':'/dnssec','worker_routes':'/workers/routes'}
          for label,zid in ids.items():
              for subject,path in endpoints.items():
                  try:
                      req=urllib.request.Request(root+'/zones/'+zid+path,headers={'Authorization':'Bearer '+toks[label],'Content-Type':'application/json'})
                      with urllib.request.urlopen(req,timeout=20) as resp:
                          obj=json.load(resp); status=resp.status
                  except urllib.error.HTTPError as e:
                      status=e.code
                      try:obj=json.loads(e.read(8000))
                      except:obj={}
                  except Exception as e:
                      print(label+'_'+subject+'_ERROR='+type(e).__name__,flush=True);continue
                  result=obj.get('result')
                  print(label+'_'+subject+'_HTTP='+str(status),flush=True)
                  if status==200 and obj.get('success'):
                      if subject=='dns': print(label+'_DNS_PAGE_COUNT='+str(len(result or [])),flush=True)
                      elif subject=='ssl':print(label+'_SSL_MODE='+str((result or {}).get('value')),flush=True)
                      elif subject=='universal_ssl':print(label+'_UNIVERSAL_SSL_ENABLED='+str((result or {}).get('enabled')),flush=True)
                      elif subject=='dnssec':print(label+'_DNSSEC_STATUS='+str((result or {}).get('status')),flush=True)
                      elif subject=='worker_routes':print(label+'_WORKER_ROUTE_COUNT='+str(len(result or [])),flush=True)
                  else:
                      print(label+'_'+subject+'_API_CODES='+json.dumps([x.get('code') for x in obj.get('errors',[])]),flush=True)
          print('ALL_SETTINGS_READ_ONLY=true',flush=True)
          PY
