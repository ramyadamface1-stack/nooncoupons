name: Fix Arabic Uniqueness Regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-arabic-uniqueness-regression.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore Arabic signature distance and preserve English Jaccard gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('quality-audit.js')
          s = p.read_text()
          old = "addCheck(checks,'uniqueness','semantic_distance',minJaccardDistance>=.18,5,{critical:minJaccardDistance<.10,note:minJaccardDistance.toFixed(3)});"
          new = "addCheck(checks,'uniqueness','semantic_distance',minSignatureDistance>=4,5,{critical:minSignatureDistance<2,note:String(minSignatureDistance)});"
          if s.count(old) < 2:
              raise SystemExit(f'expected Arabic+English Jaccard lines before repair, found {s.count(old)}')
          s = s.replace(old, new, 1)
          if s.count(new) != 1:
              raise SystemExit('Arabic signature-distance repair did not apply exactly once')
          if s.count(old) != 1:
              raise SystemExit('English Jaccard production gate was not preserved exactly once')
          if 'englishJaccardDistance' not in s:
              raise SystemExit('English lexical distance helper missing')
          p.write_text(s)
          PY
      - name: Regression verification
        run: |
          node --check quality-audit.js
          node bulk-selftest.js
          node english-quality-selftest.mjs
      - name: Commit repair
        run: |
          if git diff --quiet -- quality-audit.js; then
            echo 'No repair needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quality-audit.js
          git commit -m 'Restore Arabic semantic uniqueness gate'
          git push origin HEAD:main
