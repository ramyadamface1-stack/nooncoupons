name: Validate Old R2 Entitlement and New R2 Emergency Article Backup
on:
  push:
    branches: [fix/emergency-article-availability-20261019]
    paths: ['.github/workflows/emergency-test-new-r2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OLD_API_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
      NEW_API_TOKEN: ${{ secrets.NOON_NEW_CF_API_TOKEN }}
      NOON_OLD_R2_ACCESS_KEY_ID: ${{ secrets.NOON_OLD_R2_ACCESS_KEY_ID }}
      NOON_OLD_R2_SECRET_ACCESS_KEY: ${{ secrets.NOON_OLD_R2_SECRET_ACCESS_KEY }}
      NOON_NEW_R2_ACCESS_KEY_ID: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
      NOON_NEW_R2_SECRET_ACCESS_KEY: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - run: python3 -m pip install --quiet --disable-pip-version-check boto3
      - name: Verify article HTML actual bytes in new Cloudflare and identify old R2 entitlement
        shell: bash
        run: |
          python3 - <<'PY'
          import os,boto3,json,urllib.request,urllib.error
          from botocore.config import Config
          key="articles/شراء-الجوالات-من-نون-السعودية-باستخدام-كوبون-لشراء-ذكي.html"
          for label,aid in [("OLD","c82274152a942dea53044eae7153cfd7"),("NEW","e4c35f8a50a7b2e4cfb9d6c534962603")]:
              token=os.environ[label+"_API_TOKEN"].strip()
              endpoint="https://api.cloudflare.com/client/v4/accounts/"+aid+"/r2/buckets/nooncoupons-content-v2"
              req=urllib.request.Request(endpoint,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=15) as f:code=f.status;body=json.load(f)
              except urllib.error.HTTPError as e:
                  code=e.code
                  try:body=json.loads(e.read(9000))
                  except:body={}
              print(label+"_R2_BUCKET_API_HTTP="+str(code),flush=True)
              print(label+"_R2_BUCKET_API_SUCCESS="+str(body.get('success',False)).lower(),flush=True)
              if not body.get('success'):
                  print(label+"_R2_BUCKET_API_ERRORS="+json.dumps([{"code":x.get("code"),"message":str(x.get('message',''))[:140]} for x in (body.get('errors') or [])[:3]]),flush=True)
              client=boto3.client('s3',region_name='auto',endpoint_url='https://'+aid+'.r2.cloudflarestorage.com',aws_access_key_id=os.environ["NOON_"+label+"_R2_ACCESS_KEY_ID"].strip(),aws_secret_access_key=os.environ["NOON_"+label+"_R2_SECRET_ACCESS_KEY"].strip(),config=Config(connect_timeout=10,read_timeout=15,retries={'max_attempts':1,'mode':'standard'}))
              try:
                  r=client.get_object(Bucket="nooncoupons-content-v2",Key=key)
                  data=r['Body'].read(300)
                  r['Body'].close()
                  print(label+"_R2_SAMPLE_READ=OK CONTENT_LENGTH="+str(r['ContentLength'])+" HTML_PREFIX_VALID="+str(data.lstrip().startswith((b'<',b'<!doctype'))).lower(),flush=True)
              except Exception as e:
                  code=(getattr(e,'response',{}) or {}).get('Error',{}).get('Code',type(e).__name__)
                  print(label+"_R2_SAMPLE_READ=FAILED CODE="+str(code)+" MESSAGE="+str(e)[:180],flush=True)
          print("READ_ONLY=true",flush=True)
          PY
