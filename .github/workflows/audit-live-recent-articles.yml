name: Audit New R2 Recent Published Articles Without Writes
on:
  push:
    branches: [fix/fresh-recent-blog-r2-20261021]
    paths: ['.github/workflows/audit-live-recent-articles.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      NEW_ID: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
      NEW_SECRET: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - run: python3 -m pip install --quiet boto3
      - name: Compare stale bulk index and newest published R2 article objects safely
        run: |
          python3 -u - <<'PY'
          import boto3,os,json,heapq
          s=boto3.client('s3',region_name='auto',endpoint_url='https://e4c35f8a50a7b2e4cfb9d6c534962603.r2.cloudflarestorage.com',aws_access_key_id=os.environ['NEW_ID'].strip(),aws_secret_access_key=os.environ['NEW_SECRET'].strip())
          bucket='nooncoupons-content-v2'
          obj=s.get_object(Bucket=bucket,Key='bulk/latest.json')
          snapshot=json.loads(obj['Body'].read())
          data=snapshot.get('articles') or []
          print('STALE_BLOG_SOURCE='+json.dumps({'entries':len(data),'last_modified':obj['LastModified'].isoformat(),'fields':list(snapshot)[:20],'sample':[{k:v for k,v in row.items() if k in ('slug','country','title','status','quality','wordCount','createdAt','publishedAt','updatedAt','coupon')} for row in data[:3]]},ensure_ascii=False)[:2800],flush=True)
          recent=[];total=0
          for page in s.get_paginator('list_objects_v2').paginate(Bucket=bucket,Prefix='articles/',PaginationConfig={'PageSize':1000}):
            for obj in page.get('Contents',[]):
              if not obj['Key'].endswith('.html'):continue
              total+=1
              val=(obj['LastModified'].timestamp(),obj['Key'],obj['Size'])
              if len(recent)<50:heapq.heappush(recent,val)
              elif val[0]>recent[0][0]:heapq.heapreplace(recent,val)
            if total and total%30000<1000:print('RECENT_R2_SCAN='+str(total),flush=True)
          recent.sort(reverse=True)
          print('LIVE_NEW_R2_ARTICLES_TOTAL='+str(total),flush=True)
          for i,(ts,key,sz) in enumerate(recent[:30]):
            head=s.head_object(Bucket=bucket,Key=key)
            meta=head.get('Metadata') or {}
            print('RECENT_R2_ARTICLE='+json.dumps({'rank':i+1,'key':key[:140],'size':sz,'modified':head['LastModified'].isoformat(),'meta':{k:meta.get(k) for k in ['status','c','lang','q','qf','wc','at','cp','title'] if k in meta}},ensure_ascii=False)[:1000],flush=True)
          print('READ_ONLY_RECENT_AUDIT_COMPLETE=true',flush=True)
          PY
