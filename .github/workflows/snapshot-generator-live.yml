name: Snapshot Live Generator

on:
  push:
    paths:
      - '.github/workflows/snapshot-generator-live.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read live generator only
        shell: bash
        run: |
          set -euo pipefail
          URL="https://noondealsnow.com/api/generator-health?snapshot=${GITHUB_RUN_ID}-$(date +%s%N)"
          STATS="https://noondealsnow.com/api/content-stats?snapshot=${GITHUB_RUN_ID}-$(date +%s%N)"
          curl -fsS --retry 4 --retry-all-errors --retry-delay 1 --connect-timeout 8 --max-time 20 "$URL" -o /tmp/g.json
          curl -fsS --retry 4 --retry-all-errors --retry-delay 1 --connect-timeout 8 --max-time 20 "$STATS" -o /tmp/s.json
          jq -c '{ok,generatedAt:(.time // null),providers,bulk:{dailyTarget:.bulk.dailyTarget,batchSize:.bulk.batchSize,publishedToday:.bulk.publishedToday,publishedTotal:.bulk.publishedTotal,lastRun:.bulk.lastRun,lastError:.bulk.lastError,lastQuality:.bulk.lastQuality,lastQualityFloor:.bulk.lastQualityFloor,lastWordCount:.bulk.lastWordCount,lastSlug:.bulk.lastSlug,catchupPlan:.bulk.catchupPlan},runtime:{bulkRunningAt:.status.bulkRunningAt,bulkAutoPauseUntil:.status.bulkAutoPauseUntil,bulkNoPassStreak:.status.bulkNoPassStreak,bulkCursorV2:.status.bulkCursorV2,bulkRejectedQuality:.status.bulkRejectedQuality,bulkRejectedDuplicate:.status.bulkRejectedDuplicate,bulkRejectedGlobal:.status.bulkRejectedGlobal,bulkRejectedCoupon:.status.bulkRejectedCoupon,bulkRejectedLinks:.status.bulkRejectedLinks,bulkRejectedSchema:.status.bulkRejectedSchema,bulkRejectedIndexation:.status.bulkRejectedIndexation,bulkLastQualityRejectReasons:.status.bulkLastQualityRejectReasons,legacyUpgradePausedForConsolidation:.status.legacyUpgradePausedForConsolidation}}' /tmp/g.json
          jq -c '{ok,total,arabic,english,r2Uploaded,dailyTargetArabic,last}' /tmp/s.json
          jq -e '.ok==true and .providers.external==false and (.bulk.lastQuality|tonumber)>=95 and (.bulk.catchupPlan.target|tonumber)==30000 and (.bulk.catchupPlan.catchupBatchSize|tonumber)==48 and (.bulk.catchupPlan.windowHours|tonumber)==8 and (.bulk.catchupPlan.qualityThresholdFloor|tonumber)>=95' /tmp/g.json >/dev/null
          jq -e '.ok==true and (.dailyTargetArabic|tonumber)==32000' /tmp/s.json >/dev/null
