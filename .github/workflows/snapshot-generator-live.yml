name: Snapshot Live Generator

on:
  push:
    paths:
      - '.github/workflows/snapshot-generator-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read live generator only
        shell: bash
        run: |
          set -euo pipefail
          URL="https://noondealsnow.com/api/generator-health?snapshot=${GITHUB_RUN_ID}-$(date +%s%N)"
          curl -fsS --retry 4 --retry-all-errors --retry-delay 1 --connect-timeout 8 --max-time 20 "$URL" -o /tmp/g.json
          jq -c '{ok,generatedAt:(.time // null),providers,bulk:{dailyTarget:.bulk.dailyTarget,batchSize:.bulk.batchSize,publishedToday:.bulk.publishedToday,publishedTotal:.bulk.publishedTotal,lastRun:.bulk.lastRun,lastError:.bulk.lastError,lastQuality:.bulk.lastQuality,lastQualityFloor:.bulk.lastQualityFloor,lastWordCount:.bulk.lastWordCount,lastSlug:.bulk.lastSlug},runtime:{bulkRunningAt:.status.bulkRunningAt,bulkAutoPauseUntil:.status.bulkAutoPauseUntil,bulkNoPassStreak:.status.bulkNoPassStreak,bulkCursorV2:.status.bulkCursorV2,bulkRejectedQuality:.status.bulkRejectedQuality,bulkRejectedDuplicate:.status.bulkRejectedDuplicate,bulkRejectedGlobal:.status.bulkRejectedGlobal,bulkRejectedCoupon:.status.bulkRejectedCoupon,bulkRejectedLinks:.status.bulkRejectedLinks,bulkRejectedSchema:.status.bulkRejectedSchema,bulkRejectedIndexation:.status.bulkRejectedIndexation,bulkLastQualityRejectReasons:.status.bulkLastQualityRejectReasons,legacyUpgradePausedForConsolidation:.status.legacyUpgradePausedForConsolidation}}' /tmp/g.json
          jq -e '.ok==true and .providers.external==false and (.bulk.lastQuality|tonumber)>=95' /tmp/g.json >/dev/null
