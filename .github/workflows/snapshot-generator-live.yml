name: NoonDealsNow Live Native Generation and Publication Monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ndn_verified_publication_monitor.py'
      - 'tests/test_ndn_verified_publication_monitor.py'
      - '.github/workflows/snapshot-generator-live.yml'
  pull_request:
    paths:
      - 'scripts/ndn_verified_publication_monitor.py'
      - 'tests/test_ndn_verified_publication_monitor.py'
      - '.github/workflows/snapshot-generator-live.yml'

permissions:
  contents: read

concurrency:
  group: ndn-native-hourly-readonly-monitor
  cancel-in-progress: false

jobs:
  pure-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Prove snapshot is based on Cloudflare direct + actual R2 ledger (no provider calls)
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ndn_verified_publication_monitor.py
          python3 -m unittest discover -s tests -p 'test_ndn_verified_publication_monitor.py' -v
  live-native-snapshot:
    if: github.event_name != 'pull_request'
    needs: pure-contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      R2_ACCESS: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
      R2_SECRET: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install read-only R2 client
        run: python3 -m pip install --quiet --disable-pip-version-check boto3
      - name: Verify HTTP, main coupons, live blog, latest published native HTML, and real 1h/24h cadence
        run: python3 scripts/ndn_verified_publication_monitor.py
