name: NoonDealsNow CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runtime-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate package
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json ok')"
      - name: R2 Class B savings regression tests
        run: node --test tests/r2-saver.test.mjs tests/r2-head-health.test.mjs tests/remote-r2-subrequest-budget.test.mjs tests/ai-v2-native-publish-bridge.test.mjs tests/ai-v2-publication-ledger.test.mjs tests/coupon-case-urls.test.mjs tests/stale-legacy-bulk-recovery.test.mjs

      - name: Verify daily SigV4 signing cache against independent AWS HMAC reference
        run: |
          node --test tests/remote-existing-r2-binding.test.mjs tests/remote-r2-signature-cache.test.mjs tests/r2-rescue-retry.test.mjs tests/native-article-rescue-fast.test.mjs tests/native-bound-ai-v2-fast.test.mjs

      - name: Test real coupon funnel events (no fake attribution)
        run: node --test tests/coupon-funnel-attribution.test.mjs

      - name: Validate rescue archive and cache revisions
        run: node --test tests/archive-catalog.test.mjs

      - name: Verify market-specific coupon landing pages
        run: node --test tests/market-coupon-routes.test.mjs

      - name: Verify market-specific coupon answer pages
        run: node --test tests/nov-coupon-answer-market.test.mjs

      - name: Verify crawler-safe bounded sitemap and approved NOV discovery
        run: node --test tests/sitemap-crawler-cpu-bounded.test.mjs

      - name: Confirm single canonical URL per NOV coupon and no duplicate sitemap entries
        run: node --test tests/nov-canonical-owner.test.mjs

      - name: Syntax-check runtime
        shell: bash
        run: |
          set -euo pipefail
          files=(
            index.js
            site.js
            seo-layer.js
            commerce-pages-v2.js
            commerce-entry.js
            network-entry.js
            brand-runtime.js
            rescue-article-conversion.js
            discovery-entry.js
            r2-public-manifest.js
            r2-public-cache-policy.js
            r2-health-head-cache.js
            english-canary.js
            quality-index.js
            bulk-content-engine.js
            bulk-content-engine-base.js
          )
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              echo "Checking $f"
              node --check "$f"
            fi
          done
