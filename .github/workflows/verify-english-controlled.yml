name: Verify Controlled English Expansion
on:
  push:
    branches: [main]
    paths: ['wrangler.jsonc','approved-coupons.js','quality-audit.js','english-canary.js','english-canary-repair.js','bulk-content-engine.js','bulk-content-engine-base.js','commerce-entry.js','discovery-entry.js','.github/workflows/verify-english-controlled.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controlled-expansion-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static controlled-expansion contract
        run: |
          set -euo pipefail
          node --check english-canary.js
          node --check discovery-entry.js
          node --check commerce-entry.js
          grep -Fq "englishSchedulerOwner:true" discovery-entry.js
          grep -Fq "runEnglishCanaryBatch(env)" discovery-entry.js
          grep -Fq "englishSchedulerOwner:false" commerce-entry.js
          node --check english-canary-repair.js
          node --check bulk-content-engine.js
          node --check bulk-content-engine-base.js
          grep -Fq '"ENGLISH_CANARY_TOTAL": "2"' wrangler.jsonc
          grep -Fq '"ENGLISH_CONTROLLED_TOTAL": "50000"' wrangler.jsonc
          grep -Fq '"ENGLISH_DAILY_TARGET": "8640"' wrangler.jsonc
          grep -Fq '"ENGLISH_MIN_INTERVAL_MINUTES": "1"' wrangler.jsonc
          grep -Fq '"ENGLISH_BATCH_SIZE": "6"' wrangler.jsonc
          grep -Fq 'function batchSizeFromEnv(env)' english-canary.js
          grep -Fq 'defaultBatchPerTick:6' english-canary.js
          grep -Fq 'const MAX_CONTROLLED_TOTAL=50000;' english-canary.js
          grep -Fq 'const PROFILE_DIVERSITY_SLOTS=16;' english-canary.js
          grep -Fq 'const PROFILE_MAX_PER_BATCH=10;' english-canary.js
          grep -Fq 'const INTENT_MAX_PER_BATCH=6;' english-canary.js
          grep -Fq 'const DIVERSITY_WINDOW=24;' english-canary.js
          grep -Fq 'const MAX_SCAN=5000;' english-canary.js
          grep -Fq "const TARGET_MARKET='AE';" english-canary.js
          grep -Fq "marketPolicy:'uae-only-new-v5-batch6'" english-canary.js
          grep -Fq 'uae-golden-commercial-v1' bulk-content-engine.js
          grep -Fq 'uae-high-demand-product-v2' bulk-content-engine.js
          grep -Fq 'UAE_POPULAR_SEARCHES' bulk-content-engine.js
          grep -Fq "'Noon discount code UAE'" bulk-content-engine.js
          grep -Fq "'Noon promo code UAE'" bulk-content-engine.js
          grep -Fq "'Noon first order coupon UAE'" bulk-content-engine.js
          grep -Fq "h2>=6&&h2<=18" quality-audit.js
          grep -Fq "const CODES=['NOV170','NOV188','NOV174','NOV157','NOV177','NOV186','NOV163','NOV153','NOV195','NOV161'];" bulk-content-engine-base.js
          grep -Fq "'NOV170','NOV188','NOV174','NOV157','NOV177','NOV186','NOV163','NOV153','NOV195','NOV161'" approved-coupons.js
          grep -Fq "normalizeApprovedCoupon(rawCandidate.code" english-canary.js
          grep -Fq "repairCouponWhitelist" english-canary-repair.js
          grep -Fq "audit.minJaccardDistance<0.18" english-canary.js
          grep -Fq "provider:isCanary?'programmatic-cloudflare:english-v6-canary':'programmatic-cloudflare:english-v6-controlled'" english-canary.js
          grep -Fq "export * from './bulk-content-engine-base.js';" bulk-content-engine.js
          grep -Fq "nativeVariant='checkout checklist'" bulk-content-engine.js
          grep -Fq "coupon timing guide" bulk-content-engine.js
          grep -Fq 'const metaLead=/\bguide$/i.test(kw)?kw:`${kw} guide`;' bulk-content-engine.js
          grep -Fq "QUALITY_MARKER_KEY='english-canary/quality-copy-v2.json'" english-canary-repair.js
      - name: Verify persistent English copy repair in R2 and state
        run: |
          set -euo pipefail
          ORIGIN="https://noondealsnow.com"
          ok=0
          for i in $(seq 1 36); do
            curl -fsS --max-time 20 "$ORIGIN/api/english-canary-repair-health" -o /tmp/repair.json || true
            if node - <<'NODE'
          const fs=require('fs');
          try{
            const x=JSON.parse(fs.readFileSync('/tmp/repair.json','utf8'));
            const q=x.qualityMarker||{};
            const pass=x.ok===true && x.version==='english-copy-v2' && Number(x.totalStateRecords)>=20 &&
              x.controlledQualityClean===true && x.stateClean===true && x.r2MetadataClean===true &&
              Array.isArray(x.unexpectedEnglishRecords) && x.unexpectedEnglishRecords.length===0 &&
              Array.isArray(x.unapprovedCouponRecords) && x.unapprovedCouponRecords.length===0 &&
              Array.isArray(x.unexpectedR2Objects) && x.unexpectedR2Objects.length===0 &&
              q.complete===true && q.version==='english-copy-v2' && Number(q.droppedCount||0)>=0 &&
              Array.isArray(q.dropped) && !(Array.isArray(x.state)?x.state:[]).some(r=>r?.slug==='en-best-time-to-try-a-noon-coupon-uae-office-cart-test');
            process.exit(pass?0:1);
          }catch{process.exit(1)}
          NODE
            then ok=1; break; fi
            sleep 10
          done
          cat /tmp/repair.json || true
          test "$ok" = 1
      - name: Verify paced controlled expansion is active and healthy
        run: |
          set -euo pipefail
          ORIGIN="https://noondealsnow.com"
          ok=0
          for i in $(seq 1 120); do
            curl -fsS --max-time 20 "$ORIGIN/api/english-canary-health" -o /tmp/controlled.json || true
            if node - <<'NODE'
          const fs=require('fs');
          try{
            const x=JSON.parse(fs.readFileSync('/tmp/controlled.json','utf8'));
            const c=x.controlled||{};
            const rows=Array.isArray(c.records)?c.records:[];
            const slugs=rows.map(r=>r.slug);
            const keywords=rows.map(r=>String(r.primaryKeyword||'').trim().toLowerCase());
            const canaries=rows.filter(r=>r.canary===true && (!r.phase || r.phase==='canary'));
            const expanded=rows.filter(r=>r.canary===false && r.phase==='controlled');
            const validGroups=r=>Object.values(r.qualityGroups||{}).every(v=>Number(v)>=95);
            const copyClean=r=>{
              const meta=String(r.metaDescription||'').trim();
              const identity=[r.slug,r.title,r.primaryKeyword,meta].join(' ');
              return meta.length>0 && meta.length<=155 && /[.!?]$/.test(meta) &&
                !/\bguide\s+guide\b/i.test(meta) && !/\bcart\s+test\b/i.test(identity);
            };
            const profileCounts=new Map(),intentCounts=new Map();
            for(const r of rows){
              if(r.profileKey)profileCounts.set(r.profileKey,(profileCounts.get(r.profileKey)||0)+1);
              if(r.intent)intentCounts.set(r.intent,(intentCounts.get(r.intent)||0)+1);
            }
            const pass=x.builder===6 && x.target===2 && x.complete===true && x.published===2 &&
              c.target===50000 && c.targetMarket==='AE' && c.marketPolicy==='uae-only-new-v5-batch6' && Number(c.published)>=20 && Number(c.published)<=50000 &&
              Number(c.remaining)===50000-Number(c.published) && Number(c.dailyTarget)===8640 &&
              Number(c.minIntervalMinutes)===1 && Number(c.batchSize)===6 && Number(c.publishedToday)>=0 && Number(c.publishedToday)<=8640 &&
              rows.length===Number(c.published) && Number(c.uniqueProfiles)>=10 &&
              new Set(slugs).size===rows.length && new Set(keywords).size===rows.length && canaries.length===2 && expanded.length===rows.length-2 &&
              !slugs.includes('en-best-time-to-try-a-noon-coupon-uae-office-cart-test') &&
              rows.every(r=>r.r2Present===true && r.status==='published' && r.indexable===true &&
                r.language==='en' && r.languageIntent==='en' && r.languageSource==='native-intent-v6-canary' &&
                Number(r.quality)>=95 && Number(r.qualityFloor)>=95 && Number(r.wordCount)>=1000 &&
                Number(r.minJaccardDistance)>=0.18 && ['NOV170','NOV188','NOV174','NOV157','NOV177','NOV186','NOV163','NOV153','NOV195','NOV161'].includes(String(r.coupon||'').toUpperCase()) && validGroups(r) && copyClean(r)) &&
              canaries.every(r=>r.provider==='programmatic-cloudflare:english-v6-canary') &&
              expanded.every(r=>r.provider==='programmatic-cloudflare:english-v6-controlled');
            process.exit(pass?0:1);
          }catch{process.exit(1)}
          NODE
            then ok=1; break; fi
            sleep 10
          done
          cat /tmp/controlled.json || true
          test "$ok" = 1
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/controlled.json','utf8'));
          const rows=x.controlled.records||[];const sample=[...rows.slice(0,2),...rows.slice(-24)].filter((r,i,a)=>a.findIndex(x=>x.slug===r.slug)===i);
          fs.writeFileSync('/tmp/paths.tsv',sample.map(r=>[r.urlPath,r.marketPath,r.categoryKey||'',r.slug].join('\t')).join('\n'));
          NODE
      - name: Audit live English canaries and newest controlled sample
        run: |
          set -euo pipefail
          ORIGIN="https://noondealsnow.com"
          while IFS=$'\t' read -r path market category slug; do
            test -n "$path"
            curl -fsS -D /tmp/page.h --max-time 20 "$ORIGIN$path" -o /tmp/page.html
            grep -Fiq 'HTTP/2 200' /tmp/page.h || grep -Fiq 'HTTP/1.1 200' /tmp/page.h
            grep -Fiq 'content-language: en' /tmp/page.h
            grep -Fiq 'x-english-canary: v1' /tmp/page.h
            grep -Fq '<html lang="en" dir="ltr">' /tmp/page.html
            grep -Fq '<meta name="robots" content="index,follow,max-image-preview:large">' /tmp/page.html
            grep -Fq "<link rel=\"canonical\" href=\"$ORIGIN$path\">" /tmp/page.html
            grep -Fq "hreflang=\"en\" href=\"$ORIGIN$path\"" /tmp/page.html
            grep -Fq "hreflang=\"x-default\" href=\"$ORIGIN$path\"" /tmp/page.html
            if grep -Eiq 'hreflang="ar([_-][A-Za-z]+)?"' /tmp/page.html; then echo "UNMAPPED_AR_HREFLANG $slug"; exit 1; fi
            grep -Fq 'data-copy-code=' /tmp/page.html
            grep -Fq 'Copy ' /tmp/page.html
            grep -Fq 'href="https://www.noon.com/' /tmp/page.html
            grep -Fq 'FAQPage' /tmp/page.html
            grep -Fq 'data-schema="article"' /tmp/page.html
            grep -Eiq '<meta[^>]+name="description"[^>]+content="[^"]+"' /tmp/page.html
            if grep -Eiq 'guide[[:space:]]+guide|cart[[:space:]]+test' /tmp/page.html; then echo "ENGLISH_COPY_DEFECT $slug"; exit 1; fi
            python - <<'PY'
          import re,html
          s=open('/tmp/page.html',encoding='utf-8').read()
          m=re.search(r'<meta[^>]+name="description"[^>]+content="([^"]+)"',s,re.I)
          assert m, 'meta description missing'
          v=html.unescape(m.group(1)).strip()
          assert 1 <= len(v) <= 155, (len(v),v)
          assert v[-1] in '.!?', v
          PY
            if grep -Eiq "(save|discount)[[:space:]]+(up to[[:space:]]+)?[0-9]{1,3}%" /tmp/page.html; then echo "UNSUPPORTED_PERCENT $slug"; exit 1; fi
            if grep -Eiq '\bOPS[0-9]+\b' /tmp/page.html; then echo "LEGACY_OPS_LIVE $slug"; exit 1; fi
            python - <<'PY'
          import re
          s=open('/tmp/page.html',encoding='utf-8').read()
          allowed={'NOV170','NOV188','NOV174','NOV157','NOV177','NOV186','NOV163','NOV153','NOV195','NOV161'}
          found=set(re.findall(r'\bNOV\d+\b',s,re.I))
          bad={x.upper() for x in found if x.upper() not in allowed}
          assert not bad, bad
          PY
            if [ -n "$category" ]; then
              curl -fsS -D /tmp/cat.h --max-time 20 "$ORIGIN$market/category/$category" -o /tmp/cat.html
              ev="$(awk -F': ' 'tolower($1)=="x-english-evidence"{gsub("\r","",$2);print $2}' /tmp/cat.h)"
              rb="$(awk -F': ' 'tolower($1)=="x-robots-tag"{gsub("\r","",$2);print $2}' /tmp/cat.h)"
              if [ "$ev" = "insufficient" ]; then grep -Fqi 'noindex' <<<"$rb"; fi
            fi
          done < /tmp/paths.tsv
          old_code="$(curl -sS -o /tmp/old-weak.html -w '%{http_code}' --max-time 20 "$ORIGIN/en/articles/en-best-time-to-try-a-noon-coupon-uae-office-cart-test")"
          test "$old_code" != "200"
      - name: Verify sitemap, hubs, and indexation readiness
        run: |
          set -euo pipefail
          ORIGIN="https://noondealsnow.com"
          curl -fsS --max-time 20 "$ORIGIN/sitemap-en-articles.xml" -o /tmp/en-sitemap.xml
          count="$(grep -o '<url>' /tmp/en-sitemap.xml | wc -l | tr -d ' ')"
          test "$count" -ge "20"
          test "$count" -le "10000"
          ! grep -Fq 'en-best-time-to-try-a-noon-coupon-uae-office-cart-test' /tmp/en-sitemap.xml
          cut -f1 /tmp/paths.tsv | while IFS= read -r path; do grep -Fq "$ORIGIN$path" /tmp/en-sitemap.xml; done
          curl -fsS --max-time 20 "$ORIGIN/sitemap.xml" -o /tmp/main-sitemap.xml
          grep -Fq "$ORIGIN/sitemap-en-articles.xml" /tmp/main-sitemap.xml
          curl -fsS --max-time 20 "$ORIGIN/en/saudi" -o /tmp/saudi.html
          curl -fsS --max-time 20 "$ORIGIN/en/uae" -o /tmp/uae.html
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/controlled.json','utf8'));
          for(const r of x.controlled.records){
            const h=fs.readFileSync(r.country==='SA'?'/tmp/saudi.html':'/tmp/uae.html','utf8');
            if(!h.includes(r.urlPath)) process.exit(1);
          }
          NODE
          curl -fsS --max-time 20 "$ORIGIN/robots.txt" -o /tmp/robots.txt
          if grep -Eiq '^Disallow:[[:space:]]*/en([/[:space:]]|$)' /tmp/robots.txt; then exit 1; fi
      - name: Verify Cloudflare-only runtime and Arabic bulk remain healthy
        run: |
          set -euo pipefail
          ORIGIN="https://noondealsnow.com"
          curl -fsS --max-time 20 "$ORIGIN/api/platform-health" -o /tmp/platform.json
          curl -fsS --max-time 20 "$ORIGIN/api/generator-health" -o /tmp/generator.json
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/platform.json','utf8'));
          const g=JSON.parse(fs.readFileSync('/tmp/generator.json','utf8'));
          const b=g.bulk||{};
          if(!p.ok||p.ai?.provider!=='workers-ai'||p.ai?.externalProviders!==false||!p.r2) process.exit(1);
          if(!g.ok||g.legacyProvidersRemoved!==true||g.providers?.external!==false||g.preferredProvider!=='workers-ai'||!g.r2Ready) process.exit(1);
          if(b.enabled!==true||b.lastError!==null||Number(b.lastQuality||0)<95||Number(b.lastWordCount||0)<1000) process.exit(1);
          console.log('CONTROLLED_ENGLISH_PACED_V3=PASS',JSON.stringify({published:g.bulk?.publishedTotal,publishedToday:g.bulk?.publishedToday,lastQuality:b.lastQuality,lastWordCount:b.lastWordCount}));
          NODE
