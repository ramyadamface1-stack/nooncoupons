name: Controlled English Expansion Paused
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controlled-expansion-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm controlled expansion is still closed
        run: |
          set -euo pipefail
          grep -Fq '"ENGLISH_CANARY_TOTAL": "2"' wrangler.jsonc
          grep -Fq '"ENGLISH_CONTROLLED_TOTAL": "2"' wrangler.jsonc
          echo ENGLISH_CONTROLLED_EXPANSION=PAUSED
