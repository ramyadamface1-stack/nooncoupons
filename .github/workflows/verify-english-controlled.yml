name: Verify Controlled English Expansion
on:
  push:
    branches: [main]
    paths: ['wrangler.jsonc','.github/workflows/verify-english-controlled.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controlled-expansion-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static controlled-expansion contract
        run: |
          set -euo pipefail
          node --check english-canary.js
          node --check bulk-content-engine.js
          grep -Fq '"ENGLISH_CANARY_TOTAL": "2"' wrangler.jsonc
          grep -Fq '"ENGLISH_CONTROLLED_TOTAL": "10"' wrangler.jsonc
          grep -Fq 'const MAX_CONTROLLED_TOTAL=10;' english-canary.js
          grep -Fq "audit.minJaccardDistance<0.18" english-canary.js
          grep -Fq "provider:isCanary?'programmatic-cloudflare:english-v6-canary':'programmatic-cloudflare:english-v6-controlled'" english-canary.js
          grep -Fq 'const metaLead=/\bguide$/i.test(kw)?kw:`${kw} guide`;' bulk-content-engine.js
      - name: Wait for controlled batch to complete and audit state
        run: |
          set -euo pipefail
          ORIGIN="https://noondealsnow.com"
          ok=0
          for i in $(seq 1 90); do
            curl -fsS --max-time 20 "$ORIGIN/api/english-canary-health" -o /tmp/controlled.json || true
            if node - <<'NODE'
          const fs=require('fs');
          try{
            const x=JSON.parse(fs.readFileSync('/tmp/controlled.json','utf8'));
            const c=x.controlled||{};
            const rows=Array.isArray(c.records)?c.records:[];
            const slugs=rows.map(r=>r.slug);
            const keywords=rows.map(r=>String(r.primaryKeyword||'').trim().toLowerCase());
            const canaries=rows.filter(r=>r.canary===true && (!r.phase || r.phase==='canary'));
            const expanded=rows.filter(r=>r.canary===false && r.phase==='controlled');
            const validGroups=r=>Object.values(r.qualityGroups||{}).every(v=>Number(v)>=95);
            const pass=x.builder===6 && x.target===2 && x.complete===true && x.published===2 &&
              c.target===10 && c.published===10 && c.remaining===0 && c.complete===true && c.status==='complete' &&
              rows.length===10 && c.sa===5 && c.ae===5 && c.uniqueProfiles===10 &&
              new Set(slugs).size===10 && new Set(keywords).size===10 && canaries.length===2 && expanded.length===8 &&
              rows.every(r=>r.r2Present===true && r.status==='published' && r.indexable===true &&
                r.language==='en' && r.languageIntent==='en' && r.languageSource==='native-intent-v6-canary' &&
                Number(r.quality)>=95 && Number(r.qualityFloor)>=95 && Number(r.wordCount)>=1000 &&
                Number(r.minJaccardDistance)>=0.18 && validGroups(r) &&
                !/\bguide\s+guide\b/i.test(String(r.metaDescription||''))) &&
              canaries.every(r=>r.provider==='programmatic-cloudflare:english-v6-canary') &&
              expanded.every(r=>r.provider==='programmatic-cloudflare:english-v6-controlled');
            process.exit(pass?0:1);
          }catch{process.exit(1)}
          NODE
            then ok=1; break; fi
            sleep 10
          done
          cat /tmp/controlled.json || true
          test "$ok" = 1
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/controlled.json','utf8'));
          const rows=x.controlled.records;
          fs.writeFileSync('/tmp/paths.tsv',rows.map(r=>[r.urlPath,r.marketPath,r.categoryKey||'',r.slug].join('\t')).join('\n'));
          NODE
      - name: Audit all 10 live English pages
        run: |
          set -euo pipefail
          ORIGIN="https://noondealsnow.com"
          while IFS=$'\t' read -r path market category slug; do
            test -n "$path"
            curl -fsS -D /tmp/page.h --max-time 20 "$ORIGIN$path" -o /tmp/page.html
            grep -Fiq 'HTTP/2 200' /tmp/page.h || grep -Fiq 'HTTP/1.1 200' /tmp/page.h
            grep -Fiq 'content-language: en' /tmp/page.h
            grep -Fiq 'x-english-canary: v1' /tmp/page.h
            grep -Fq '<html lang="en" dir="ltr">' /tmp/page.html
            grep -Fq '<meta name="robots" content="index,follow,max-image-preview:large">' /tmp/page.html
            grep -Fq "<link rel=\"canonical\" href=\"$ORIGIN$path\">" /tmp/page.html
            grep -Fq "hreflang=\"en\" href=\"$ORIGIN$path\"" /tmp/page.html
            grep -Fq "hreflang=\"x-default\" href=\"$ORIGIN$path\"" /tmp/page.html
            if grep -Eiq 'hreflang="ar([_-][A-Za-z]+)?"' /tmp/page.html; then echo "UNMAPPED_AR_HREFLANG $slug"; exit 1; fi
            grep -Fq 'data-copy-code=' /tmp/page.html
            grep -Fq 'Copy ' /tmp/page.html
            grep -Fq 'href="https://www.noon.com/' /tmp/page.html
            grep -Fq 'FAQPage' /tmp/page.html
            grep -Fq 'data-schema="article"' /tmp/page.html
            grep -Eiq '<meta[^>]+name="description"[^>]+content="[^"]+"' /tmp/page.html
            if grep -Eiq 'guide[[:space:]]+guide' /tmp/page.html; then echo "GUIDE_GUIDE $slug"; exit 1; fi
            if grep -Eiq "(save|discount)[[:space:]]+(up to[[:space:]]+)?[0-9]{1,3}%" /tmp/page.html; then echo "UNSUPPORTED_PERCENT $slug"; exit 1; fi
            if [ -n "$category" ]; then
              curl -fsS -D /tmp/cat.h --max-time 20 "$ORIGIN$market/category/$category" -o /tmp/cat.html
              ev="$(awk -F': ' 'tolower($1)=="x-english-evidence"{gsub("\r","",$2);print $2}' /tmp/cat.h)"
              rb="$(awk -F': ' 'tolower($1)=="x-robots-tag"{gsub("\r","",$2);print $2}' /tmp/cat.h)"
              if [ "$ev" = "insufficient" ]; then grep -Fqi 'noindex' <<<"$rb"; fi
            fi
          done < /tmp/paths.tsv
      - name: Verify sitemap, hubs, and indexation readiness
        run: |
          set -euo pipefail
          ORIGIN="https://noondealsnow.com"
          curl -fsS --max-time 20 "$ORIGIN/sitemap-en-articles.xml" -o /tmp/en-sitemap.xml
          count="$(grep -o '<url>' /tmp/en-sitemap.xml | wc -l | tr -d ' ')"
          test "$count" = "10"
          cut -f1 /tmp/paths.tsv | while IFS= read -r path; do grep -Fq "$ORIGIN$path" /tmp/en-sitemap.xml; done
          curl -fsS --max-time 20 "$ORIGIN/sitemap.xml" -o /tmp/main-sitemap.xml
          grep -Fq "$ORIGIN/sitemap-en-articles.xml" /tmp/main-sitemap.xml
          curl -fsS --max-time 20 "$ORIGIN/en/saudi" -o /tmp/saudi.html
          curl -fsS --max-time 20 "$ORIGIN/en/uae" -o /tmp/uae.html
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/controlled.json','utf8'));
          for(const r of x.controlled.records){
            const html=fs.readFileSync(r.country==='SA'?'/tmp/saudi.html':'/tmp/uae.html','utf8');
            if(!html.includes(r.urlPath)) process.exit(1);
          }
          NODE
          curl -fsS --max-time 20 "$ORIGIN/robots.txt" -o /tmp/robots.txt
          if grep -Eiq '^Disallow:[[:space:]]*/en([/[:space:]]|$)' /tmp/robots.txt; then exit 1; fi
      - name: Verify Cloudflare-only runtime and Arabic bulk remain healthy
        run: |
          set -euo pipefail
          ORIGIN="https://noondealsnow.com"
          curl -fsS --max-time 20 "$ORIGIN/api/platform-health" -o /tmp/platform.json
          curl -fsS --max-time 20 "$ORIGIN/api/generator-health" -o /tmp/generator.json
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/platform.json','utf8'));
          const g=JSON.parse(fs.readFileSync('/tmp/generator.json','utf8'));
          const b=g.bulk||{};
          if(!p.ok||p.ai?.provider!=='workers-ai'||p.ai?.externalProviders!==false||!p.r2) process.exit(1);
          if(!g.ok||g.legacyProvidersRemoved!==true||g.providers?.external!==false||g.preferredProvider!=='workers-ai'||!g.r2Ready) process.exit(1);
          if(b.enabled!==true||b.lastError!==null||Number(b.lastQuality||0)<95||Number(b.lastWordCount||0)<1000) process.exit(1);
          console.log('CONTROLLED_ENGLISH_10=PASS',JSON.stringify({published:g.bulk?.publishedTotal,publishedToday:g.bulk?.publishedToday,lastQuality:b.lastQuality,lastWordCount:b.lastWordCount}));
          NODE
