name: NoonDealsNow - Diagnose Cloudflare Worker 1027 Quota (Read Only)

on:
  workflow_dispatch:
  schedule:
    # Four free read-only probes daily; no Cloudflare Cron or AI generation.
    - cron: '12 0 * * *'
    - cron: '20 1,7,13,19 * * *'
  push:
    paths:
      - '.github/workflows/diagnose-ndn-workers-1027.yml'
      - 'scripts/ndn-quota-triage.mjs'

permissions:
  contents: read

jobs:
  quotas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT: e4c35f8a50a7b2e4cfb9d6c534962603
      CF_TOKEN: ${{ secrets.NOON_NEW_CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Examine zone Worker routes, request mix and top autonomous clients (read only)
        run: node scripts/ndn-quota-triage.mjs
      - name: Read Cloudflare request use and diagnose public Error 1027 (no mutations)
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const summary=process.env.GITHUB_STEP_SUMMARY;
          const note=s=>{console.log(s);if(summary)appendFileSync(summary,s+'\n')};
          note('## Cloudflare Workers Free plan - read-only quota diagnosis');
          if(!process.env.CF_TOKEN){note('Cloudflare token missing: cannot inspect current account usage');process.exit(0)}
          const now=new Date(),start=new Date(now);start.setUTCHours(0,0,0,0);
          note('UTC window: '+start.toISOString()+' to '+now.toISOString());
          note('The documented 1027 error means Workers daily request quota exhausted; quota resets at 00:00 UTC.');
          const query=`query Invocations($accountTag: string, $from: string, $to: string, $script: string) {
            viewer { accounts(filter: {accountTag: $accountTag}) {
              workersInvocationsAdaptive(limit: 5000,filter:{scriptName:$script,datetime_geq:$from,datetime_leq:$to}) {
                dimensions { scriptName status }
                sum { requests errors subrequests }
              }
            }}
          }`;
          const names=['noondealsnow-production-new','noondealsnow-ai-direct-r2','noondealsnow-ai-scheduler-v2','noondealsnow-migration-staging'];
          note('| Worker | Requests in returned analytics rows | Errors | Rows |');
          note('|---|---:|---:|---:|');
          for(const script of names){
            try{
              const response=await fetch('https://api.cloudflare.com/client/v4/graphql',{method:'POST',
                headers:{authorization:'Bearer '+process.env.CF_TOKEN,'content-type':'application/json'},
                body:JSON.stringify({query,variables:{accountTag:process.env.CF_ACCOUNT,from:start.toISOString(),to:now.toISOString(),script}}),
                signal:AbortSignal.timeout(15000)});
              const json=await response.json();
              if(!response.ok||json.errors?.length)throw Error('analytics API blocked or unlicensed HTTP '+response.status+' '+String(json.errors?.[0]?.message||'').slice(0,70));
              const rows=json?.data?.viewer?.accounts?.[0]?.workersInvocationsAdaptive;
              if(!Array.isArray(rows))throw Error('no account analytics visible');
              const n=rows.reduce((acc,x)=>acc+Number(x.sum?.requests||0),0);
              const e=rows.reduce((acc,x)=>acc+Number(x.sum?.errors||0),0);
              note('| '+script+' | '+n.toLocaleString('en-US')+' | '+e.toLocaleString('en-US')+' | '+rows.length+' |');
              if(script==='noondealsnow-production-new'&&n>=80000)
                note('::warning::NDN_WORKER_REQUEST_BUDGET_HIGH='+n+' reported today UTC (sampled analytics); investigate before 100k/day Free plan cap');
              if(rows.length===5000)note('WARNING '+script+' is capped at 5000 rows, not an exact full-day total');
            }catch(err){note('| '+script+' | unavailable | unavailable | '+String(err.message).slice(0,95)+' |')}
          }
          note('Worker invoice/usage total across the whole account must be checked in Cloudflare dashboard; row-level analytics may be sampled or truncated.');
          JS
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const log=s=>{console.log(s);if(process.env.GITHUB_STEP_SUMMARY)appendFileSync(process.env.GITHUB_STEP_SUMMARY,s+'\n')};
          try{
            const token=process.env.CF_TOKEN;
            if(!token)throw Error('Cloudflare token not configured');
            const rz=await fetch('https://api.cloudflare.com/client/v4/zones?name=noondealsnow.com',{
              headers:{authorization:'Bearer '+token},signal:AbortSignal.timeout(12000)});
            const zoneData=await rz.json();
            const z=(zoneData?.result||[]).find(x=>x?.account?.id===process.env.CF_ACCOUNT);
            if(!rz.ok||!z?.id)throw Error('Zone read unavailable on this token');
            const now=new Date(),start=new Date(now);start.setUTCHours(0,0,0,0);
            const query=`query PathCounts($zoneTag: string,$start: string,$end: string) {
              viewer {zones(filter:{zoneTag:$zoneTag}) {
                topPaths:httpRequestsAdaptiveGroups(limit:40,orderBy:[count_DESC],
                  filter:{datetime_geq:$start,datetime_leq:$end}) {
                    count
                    dimensions {clientRequestPath}
                  }
              }}
            }`;
            const r=await fetch('https://api.cloudflare.com/client/v4/graphql',{
              method:'POST',headers:{authorization:'Bearer '+token,'content-type':'application/json'},
              body:JSON.stringify({query,variables:{zoneTag:z.id,start:start.toISOString(),end:now.toISOString()}}),
              signal:AbortSignal.timeout(18000)});
            const data=await r.json();
            if(!r.ok||data.errors?.length)throw Error('Top-path zone analytics unavailable: '+String(data.errors?.[0]?.message||r.status).slice(0,70));
            const rows=data?.data?.viewer?.zones?.[0]?.topPaths;
            if(!Array.isArray(rows))throw Error('Zone path dataset not returned');
            log('### Top public request paths (sampled/aggregated zone analytics, diagnostic only)');
            log('| Path | Count |');log('|---|---:|');
            for(const x of rows.slice(0,25)){
              const path=String(x.dimensions?.clientRequestPath||'').replace(/\|/g,'%7C').slice(0,160);
              log('| '+path+' | '+Number(x.count||0).toLocaleString('en-US')+' |');
            }
          }catch(e){log('::warning::ZONE_TOP_PATHS_UNAVAILABLE '+String(e.message).slice(0,120))}
          JS
          problem=0
          for path in / /blog /coupon/nov170 /coupon/nov188 /sitemap-core.xml; do
            code=$(curl -sS --max-time 18 -o /tmp/ndn-public-smoke -w '%{http_code}' \
              -H 'User-Agent: NDN-live-read-only-health-check' "https://noondealsnow.com$path" || true)
            echo "PUBLIC_LIVE_SMOKE=$path;HTTP=$code"
            echo "Public smoke $path: HTTP $code" >> "$GITHUB_STEP_SUMMARY"
            if [ "$code" != 200 ]; then
              problem=1
              if [ "$code" = 429 ] || grep -qi 'Error 1027' /tmp/ndn-public-smoke; then
                echo "::error::NDN_PUBLIC_WORKER_QUOTA_EXHAUSTED $path HTTP=$code"
              else
                echo "::error::NDN_PUBLIC_ROUTE_UNHEALTHY $path HTTP=$code"
              fi
            fi
          done
          if [ "$problem" != 0 ]; then exit 1;fi
          echo 'NDN_PUBLIC_POST_RESET_CORE_ROUTES=ALL_200'
