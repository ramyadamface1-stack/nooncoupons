name: Verify Commerce Landing Network (diagnostic)

on:
  push:
    branches: [main]
    paths: ['topic-hubs.js','commerce-entry.js','commerce-taxonomy.js','commerce-generator-taxonomy.js','landing-content-v3.js','landing-quality-selftest.mjs','.github/workflows/verify-commerce-network.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Static architecture checks
        run: |
          set -euo pipefail
          node --check topic-hubs.js
          node --check commerce-entry.js
          node --check commerce-taxonomy.js
          node --check commerce-generator-taxonomy.js
          node --check landing-content-v3.js
          node landing-quality-selftest.mjs >/tmp/landing-audit.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/landing-audit.json'))
          assert d['routes']>=110
          assert d['uniqueRenders']==d['routes']
          assert d['minWords']>=5000
          PY
      - name: Live spider network checks
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="https://noondealsnow.com"
          echo "PRODUCTION_ORIGIN $ORIGIN"
          fetch(){ curl -fsS --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 25 "$1" -o "$2"; }
          ready=0
          for i in $(seq 1 25); do
            if fetch "$ORIGIN/saudi/category/mobiles?v=final7" /tmp/mobiles.html 2>/dev/null && grep -Fq 'landing-depth-v3' /tmp/mobiles.html; then ready=1; break; fi
            sleep 5
          done
          [ "$ready" = 1 ]
          fetch "$ORIGIN/saudi/categories?v=final7" /tmp/saudi.html
          fetch "$ORIGIN/uae/categories?v=final7" /tmp/uae.html
          fetch "$ORIGIN/uae/category/electronics?v=final7" /tmp/electronics.html
          fetch "$ORIGIN/saudi/brand/apple?v=final7" /tmp/apple.html
          fetch "$ORIGIN/uae/brand/samsung?v=final7" /tmp/samsung.html
          fetch "$ORIGIN/saudi/compare/iphone-vs-galaxy?v=final7" /tmp/compare.html
          fetch "$ORIGIN/sitemap-commerce.xml?v=final7" /tmp/commerce.xml
          echo CHECK_SAUDI_CATEGORIES; grep -Eq 'أقسام.*نون.*السعودية|نون.*السعودية.*أقسام' /tmp/saudi.html
          echo CHECK_UAE_CATEGORIES; grep -Eq 'أقسام.*نون.*الإمارات|نون.*الإمارات.*أقسام' /tmp/uae.html
          echo CHECK_ELECTRONICS; grep -Eq 'الإلكترونيات.*نون الإمارات|نون الإمارات.*الإلكترونيات' /tmp/electronics.html
          echo CHECK_APPLE; grep -Fq 'Apple' /tmp/apple.html
          echo CHECK_SAMSUNG; grep -Fq 'Samsung' /tmp/samsung.html
          echo CHECK_COMPARE; grep -Eq 'آيفون.*Samsung Galaxy|iPhone.*Galaxy|Galaxy.*iPhone' /tmp/compare.html
          echo CHECK_COLLECTION_SCHEMA; grep -Fq 'CollectionPage' /tmp/mobiles.html
          echo CHECK_BREADCRUMB; grep -Fq 'BreadcrumbList' /tmp/mobiles.html
          echo CHECK_APPROVED_COUPON; grep -Eq 'NOV(170|188|174|157|177|186|163|153|195|161)' /tmp/mobiles.html
          echo CHECK_NO_LEGACY_OPS; ! grep -Eq 'OPS[0-9]+' /tmp/mobiles.html
          echo CHECK_FAQ_SCHEMA; grep -Fq 'FAQPage' /tmp/mobiles.html
          echo CHECK_METHODOLOGY; grep -Eq 'منهجية التحرير والتحقق|منهجية التحقق|التحرير والتحقق' /tmp/mobiles.html
          echo CHECK_NOON_OFFICIAL; grep -Fq 'https://www.noon.com/saudi-ar/' /tmp/mobiles.html
          for needle in '/saudi/category/mobiles' '/uae/category/mobiles' '/saudi/brand/apple' '/uae/brand/samsung' '/saudi/model/apple/iphone-pro' '/saudi/compare/iphone-vs-galaxy' '/saudi/category/shoes' '/uae/category/bags'; do echo "CHECK_SITEMAP $needle"; grep -Fq "$needle" /tmp/commerce.xml; done
          health="$(curl -fsS --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 25 "$ORIGIN/api/generator-health?v=final7")"
          echo CHECK_GENERATOR_HEALTH
          slug="$(python -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("bulk",{}).get("lastSlug") or "")' "$health")"
          [ -n "$slug" ]
          urlslug="$(python -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe="-"))' "$slug")"
          echo CHECK_LATEST_ARTICLE; fetch "$ORIGIN/articles/$urlslug?v=final7" /tmp/article.html
          grep -Eq '/(saudi|uae)/category/' /tmp/article.html
          grep -Eq '/(saudi|uae)/categories' /tmp/article.html
          grep -Fq 'الرئيسية' /tmp/article.html
          echo COMMERCE_NETWORK_LIVE_PASS
