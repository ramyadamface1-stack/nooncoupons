name: Optimize Sitemap Discovery

on:
  push:
    paths:
      - '.github/workflows/optimize-sitemap-discovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch sitemap discovery
        run: node scripts/patch-sitemap-discovery.mjs
      - name: Validate source
        run: |
          node --check auto-platform.js
          grep -Fq 'items.push({loc:' auto-platform.js
          grep -Fq '<lastmod>' auto-platform.js
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auto-platform.js
          if git diff --cached --quiet; then
            echo NO_CHANGES
            exit 0
          fi
          git commit -m "Prioritize fresh article sitemaps for discovery"
          git push origin HEAD:main
