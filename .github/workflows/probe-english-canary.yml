name: Probe English Canary Runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-english-canary.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe canary and generator health
        run: |
          set +e
          ORIGIN="https://nooncoupons.ramychatgptgcoupons.workers.dev"
          echo '=== ENGLISH CANARY ==='
          curl -sS -D /tmp/canary.h --max-time 20 "$ORIGIN/api/english-canary-health" -o /tmp/canary.json
          cat /tmp/canary.h
          cat /tmp/canary.json
          echo
          echo '=== GENERATOR HEALTH ==='
          curl -sS --max-time 20 "$ORIGIN/api/generator-health" -o /tmp/generator.json
          cat /tmp/generator.json
          echo
          exit 0
