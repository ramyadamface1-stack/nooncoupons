name: NoonDealsNow SYSTEM1 — curated keyword index
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noondealsnow-system1-keyword-index.yml'
      - 'automation/ai-v2/topics.json'
      - 'automation/ai-v2/topic-expansion.mjs'
      - 'automation/ai-v2/topic-refresh*.mjs'
      - 'automation/ai-v2/system1-keyword-index.mjs'
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
permissions: {contents: read}
concurrency:
  group: ndn-system1-keyword-index
  cancel-in-progress: false
jobs:
  refresh-existing-topic-index:
    if: github.repository == 'ramyadamface1-stack/nooncoupons'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      R2_ACCESS: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
      R2_SECRET: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Deterministic deduped keyword scoring, no AI requests
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > /tmp/system1-keyword-index.json
          import {buildFromProject} from './automation/ai-v2/system1-keyword-index.mjs';
          process.stdout.write(JSON.stringify(buildFromProject()));
          NODE
          python3 - <<'PY'
          import json,os
          with open('/tmp/system1-keyword-index.json','rb') as f:raw=f.read()
          x=json.loads(raw)
          assert x['version']==1 and x['site']=='noondealsnow'
          assert len(x['items'])<=240 and len(raw)<180000,(len(raw),len(x['items']))
          assert x['demandMeasured'] is False and x['canDirectlyApproveOrIgnore'] is False
          assert len(set((e['country'],e['slug']) for e in x['items']))==len(x['items'])
          print('SYSTEM1_INDEX_VALID=yes;totalCurated=%s;indexedSample=%s;providerCalls=0'%(x['total'],len(x['items'])))
          PY
      - name: Store only approved keyword snapshot in existing R2
        shell: bash
        run: |
          set -euo pipefail
          test -n "${R2_ACCESS:-}"
          test -n "${R2_SECRET:-}"
          python3 -m pip install --quiet --disable-pip-version-check boto3
          python3 - <<'PY'
          import boto3,os
          from botocore.config import Config
          obj=open('/tmp/system1-keyword-index.json','rb').read()
          s3=boto3.client('s3',endpoint_url='https://e4c35f8a50a7b2e4cfb9d6c534962603.r2.cloudflarestorage.com',
            aws_access_key_id=os.environ['R2_ACCESS'],aws_secret_access_key=os.environ['R2_SECRET'],
            region_name='auto',config=Config(connect_timeout=12,read_timeout=20,retries={'max_attempts':2,'mode':'standard'}))
          bucket='nooncoupons-content-v2';key='_ops/system1/keyword-opportunities-v1.json'
          s3.put_object(Bucket=bucket,Key=key,Body=obj,ContentType='application/json')
          verified=s3.get_object(Bucket=bucket,Key=key)['Body'].read()
          assert verified==obj,'R2_SNAPSHOT_READBACK_MISMATCH'
          print('SYSTEM1_KEYWORDS_R2_WRITTEN=yes;readback=PASS;noOldContentDeleted=yes')
          PY
