name: Article Audit Progress Probe

on:
  push:
    branches: [intent-owner-policy-v4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read current audit health only
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
        run: |
          set -euo pipefail
          ORIGIN='https://nooncoupons.ramychatgptgcoupons.workers.dev'
          [ -n "${CF_TOKEN:-}" ] || { echo 'MISSING_CF_TOKEN'; exit 10; }
          echo "::add-mask::$CF_TOKEN"
          AUTH="Authorization: Bearer $CF_TOKEN"
          curl -fsS --connect-timeout 10 --max-time 30 -H "$AUTH" "$ORIGIN/api/article-corpus-audit-health" -o /tmp/audit.json
          echo "AUDIT_PROGRESS=$(jq -c '{ok,version,auditModel,uniquenessModel,runId,scanned,uniqueArticles,readFailures,duplicateListedKeys,scanDone,done,wordBands,duplicateTitles,exactDuplicateContent,semanticSignatureCollisions,issues,samples,lastBatchAt,startedAt,completedAt}' /tmp/audit.json)"
          curl -fsS --connect-timeout 10 --max-time 30 -H "$AUTH" "$ORIGIN/api/article-collision-owner-health" -o /tmp/owner.json || true
          if [ -s /tmp/owner.json ]; then
            echo "OWNER_PROGRESS=$(jq -c '{ok,version,runId,sourceAuditRunId,sourceAuditScanned,sourceAuditCutoff,ownerSnapshotModel,scanned,readFailures,listCalls,listedObjects,skippedAfterCutoff,skippedMissingUploaded,scanDone,done,titleTargets,contentTargets,semanticTargets,discoveryArticles,discoveryShards,discoveryPolicy,title,semantic,startedAt,completedAt}' /tmp/owner.json)"
          fi
          curl -fsS --connect-timeout 10 --max-time 30 -H "$AUTH" "$ORIGIN/api/article-discovery-health" -o /tmp/discovery.json
          echo "DISCOVERY_HEALTH=$(jq -c '{ok,version,complete,runId,sourceAuditRunId,sourceAuditScanned,articles,shards,policy,generatedAt,key}' /tmp/discovery.json)"
          curl -fsS --connect-timeout 10 --max-time 30 "$ORIGIN/sitemap.xml" -o /tmp/sitemap.xml
          audit_refs=$( (grep -o 'sitemap-audit-articles-' /tmp/sitemap.xml || true) | wc -l | tr -d ' ')
          fresh_refs=$( (grep -o 'sitemap-fresh-articles-' /tmp/sitemap.xml || true) | wc -l | tr -d ' ')
          bulk_refs=$( (grep -o 'sitemap-articles-' /tmp/sitemap.xml || true) | wc -l | tr -d ' ')
          echo "SITEMAP_MODE audit=$audit_refs fresh=$fresh_refs bulk=$bulk_refs"
          TARGET=$(python -c "import urllib.parse;print(urllib.parse.quote('/articles/طريقة-استخدام-كود-نون-الإمارات-عند-شراء-الجوالات-مع-مقارنة-الأسعار',safe='/'))")
          for BASE in "$ORIGIN" "https://noondealsnow.com"; do
            tag=$(echo "$BASE" | sed 's#https://##;s#[^A-Za-z0-9]#_#g')
            code=$(curl -L -sS --connect-timeout 10 --max-time 30 -o "/tmp/claim-$tag.html" -w '%{http_code}' "$BASE$TARGET" || true)
            bytes=$(wc -c < "/tmp/claim-$tag.html" 2>/dev/null || echo 0)
            echo "CLAIM_PAGE_FETCH base=$BASE status=$code bytes=$bytes"
            TAG="$tag" python -c "import os,re,html; p='/tmp/claim-'+os.environ['TAG']+'.html'; s=open(p,encoding='utf-8').read() if os.path.exists(p) else ''; title=(re.search(r'<title[^>]*>(.*?)</title>',s,re.I|re.S) or [None,''])[1]; plain=html.unescape(re.sub(r'<[^>]+>',' ',s)); plain=re.sub(r'\\s+',' ',plain); pat=re.compile(r'(?:خصم|توفير)\\s*(?:حتى\\s*)?\\d{1,3}\\s*[%٪]|\\d{1,4}\\s*(?:ريال|درهم)\\s*(?:خصم|توفير)|(?:مضمون|مؤكد)\\s*(?:الخصم|الكود|القسيمة)',re.I); m=pat.search(plain); print('CLAIM_PAGE_TITLE='+re.sub(r'\\s+',' ',html.unescape(title)).strip()[:180]); print('UNSUPPORTED_CLAIM_PROBE='+((plain[max(0,m.start()-80):m.end()+80] if m else 'NONE').replace('\\n',' ')))"
          done
          TAG="noondealsnow_com" python -c "import os,re; p='/tmp/claim-'+os.environ['TAG']+'.html'; s=open(p,encoding='utf-8').read() if os.path.exists(p) else ''; m=re.search(r'145\s*درهم',s); print('RAW_CLAIM_HTML='+((s[max(0,m.start()-220):m.end()+300] if m else 'NONE').replace('\\n',' ')[:700]))"
