name: Hourly 1000 Publish SLA

on:
  push:
    branches: [main]
    paths: ['.github/workflows/generation-burst-550.yml']
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: read

concurrency:
  group: hourly-1000-publish
  cancel-in-progress: true

env:
  ORIGIN: https://nooncoupons.ramychatgptgcoupons.workers.dev
  STATS: https://noondealsnow.com/api/content-stats
  RELEASE: 2026-10-14-hourly-1000-r10

jobs:
  saudi-burst:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Wait for hourly-1000 runtime
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CF_TOKEN:-}" ] || { echo MISSING_CF_TOKEN; exit 10; }
          echo "::add-mask::$CF_TOKEN"
          for i in $(seq 1 90); do
            release="$(curl -fsS --max-time 20 "$ORIGIN/api/revision?hourly1000=$i" | jq -r '.release // ""' || true)"
            echo "WAIT_RELEASE attempt=$i release=$release"
            [ "$release" = "$RELEASE" ] && exit 0
            sleep 10
          done
          echo RELEASE_NOT_LIVE
          exit 1

      - name: Publish at least 800 Saudi Arabic articles
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CF_TOKEN"
          DAY="$(TZ=Africa/Cairo date +%F)"
          curl -fsS --max-time 30 "$STATS?sa-baseline=${GITHUB_RUN_ID}" -o /tmp/base.json
          base_ar="$(jq -r '.arabic|tonumber' /tmp/base.json)"
          base_total="$(jq -r '.total|tonumber' /tmp/base.json)"
          echo "SA_BASE day=$DAY arabic=$base_ar total=$base_total"
          started=$SECONDS
          step=0
          while (( SECONDS - started < 3300 )); do
            step=$((step+1))
            code="$(curl -sS -o /tmp/step.json -w '%{http_code}' --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 100               -X POST -H "$AUTH" -H 'Content-Type: application/json'               --data '{"runEnglish":false,"runBulk":true,"forceBulk":true,"forceSaudi":true}'               "$ORIGIN/api/internal/generation-burst-step?saudi=${GITHUB_RUN_ID}-$step" || true)"
            echo "SA_STEP step=$step http=$code published=$(jq -r '.bulk.bulk.records|length // .bulk.summary.bulkLastTickPublished // 0' /tmp/step.json 2>/dev/null || echo 0)"
            if (( step % 2 == 0 )); then
              curl -fsS --max-time 30 "$STATS?sa-progress=${GITHUB_RUN_ID}-$step" -o /tmp/sa-now.json
              now_ar="$(jq -r '.arabic|tonumber' /tmp/sa-now.json)"
              delta=$((now_ar-base_ar))
              echo "SA_PROGRESS step=$step arabic=$now_ar delta=$delta forceSaudi=true"
              if (( delta >= 800 )); then
                echo "SAUDI_ARABIC_800_TARGET_REACHED delta=$delta elapsed=$((SECONDS-started))"
                exit 0
              fi
            fi
            sleep 1
          done
          curl -fsS --max-time 30 "$STATS?sa-final=${GITHUB_RUN_ID}" -o /tmp/sa-final.json
          final_ar="$(jq -r '.arabic|tonumber' /tmp/sa-final.json)"
          delta=$((final_ar-base_ar))
          echo "SA_FINAL arabic=$final_ar delta=$delta forceSaudi=true"
          [ "$delta" -ge 800 ] || { echo SAUDI_ARABIC_800_NOT_REACHED_WITHIN_HOUR; exit 2; }

  english-burst:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Wait for hourly-1000 runtime
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CF_TOKEN:-}" ] || { echo MISSING_CF_TOKEN; exit 10; }
          echo "::add-mask::$CF_TOKEN"
          for i in $(seq 1 90); do
            release="$(curl -fsS --max-time 20 "$ORIGIN/api/revision?hourly1000-en=$i" | jq -r '.release // ""' || true)"
            echo "WAIT_RELEASE attempt=$i release=$release"
            [ "$release" = "$RELEASE" ] && exit 0
            sleep 10
          done
          echo RELEASE_NOT_LIVE
          exit 1

      - name: Publish at least 200 UAE English articles
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CF_TOKEN"
          curl -fsS --max-time 30 "$STATS?en-baseline=${GITHUB_RUN_ID}" -o /tmp/base.json
          base_en="$(jq -r '.english|tonumber' /tmp/base.json)"
          base_total="$(jq -r '.total|tonumber' /tmp/base.json)"
          echo "EN_BASE english=$base_en total=$base_total"
          started=$SECONDS
          step=0
          while (( SECONDS - started < 3300 )); do
            step=$((step+1))
            code="$(curl -sS -o /tmp/step.json -w '%{http_code}' --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 100               -X POST -H "$AUTH" -H 'Content-Type: application/json'               --data '{"runEnglish":true,"englishMax":24,"englishCycles":4,"englishBudgetMs":15000,"runBulk":false}'               "$ORIGIN/api/internal/generation-burst-step?english=${GITHUB_RUN_ID}-$step" || true)"
            delta_step="$(jq -r '.englishDelta // 0' /tmp/step.json 2>/dev/null || echo 0)"
            echo "EN_STEP step=$step http=$code deltaStep=$delta_step"
            curl -fsS --max-time 30 "$STATS?en-progress=${GITHUB_RUN_ID}-$step" -o /tmp/en-now.json
            now_en="$(jq -r '.english|tonumber' /tmp/en-now.json)"
            delta=$((now_en-base_en))
            echo "EN_PROGRESS step=$step english=$now_en delta=$delta"
            if (( delta >= 200 )); then
              echo "ENGLISH_200_TARGET_REACHED delta=$delta elapsed=$((SECONDS-started))"
              exit 0
            fi
            sleep 1
          done
          curl -fsS --max-time 30 "$STATS?en-final=${GITHUB_RUN_ID}" -o /tmp/en-final.json
          final_en="$(jq -r '.english|tonumber' /tmp/en-final.json)"
          delta=$((final_en-base_en))
          echo "EN_FINAL english=$final_en delta=$delta"
          [ "$delta" -ge 200 ] || { echo ENGLISH_200_NOT_REACHED_WITHIN_HOUR; exit 3; }

  verify:
    needs: [saudi-burst, english-burst]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live counters, freshness and discovery
        shell: bash
        run: |
          set -euo pipefail
          DAY="$(TZ=Africa/Cairo date +%F)"
          curl -fsS --max-time 30 "$STATS?hourly1000-final=${GITHUB_RUN_ID}" -o /tmp/stats.json
          curl -fsS --max-time 30 "https://noondealsnow.com/api/generation-freshness?hourly1000-final=${GITHUB_RUN_ID}" -o /tmp/fresh.json
          curl -fsS --max-time 40 "https://noondealsnow.com/api/daily-publish-report?from=$DAY&hourly1000-final=${GITHUB_RUN_ID}" -o /tmp/day.json
          curl -fsS --max-time 30 "https://noondealsnow.com/blog?hourly1000-final=${GITHUB_RUN_ID}" -o /tmp/blog.html
          echo "FINAL total=$(jq -r '.total' /tmp/stats.json) ar=$(jq -r '.arabic' /tmp/stats.json) en=$(jq -r '.english' /tmp/stats.json)"
          echo "TODAY sa=$(jq -r '.days[0].saudiArabic' /tmp/day.json) uae=$(jq -r '.days[0].uaeTotal' /tmp/day.json) total=$(jq -r '.days[0].total' /tmp/day.json)"
          jq -e '.ok == true and .withinOneHour == true' /tmp/fresh.json >/dev/null
          grep -qi '<html' /tmp/blog.html
          echo "HOURLY_1000_SLA_VERIFIED"

# Policy: every hourly run must add >=800 Saudi Arabic + >=200 UAE English = >=1000 total, quality gates remain enabled.
