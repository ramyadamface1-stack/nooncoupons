name: Deploy NoonDealsNow Direct R2 Groq Three-Key Auth Canary (Cloudflare only)
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-ai-direct/**'
      - '.github/workflows/deploy-noondealsnow-cloudflare-direct-r2.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noondealsnow-direct-ai-canary
  cancel-in-progress: false
jobs:
  deploy-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.NOON_NEW_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e4c35f8a50a7b2e4cfb9d6c534962603
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify three-key Groq authentication stage and destination API token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || exit 20
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('cloudflare-ai-direct/wrangler.jsonc','utf8')); if(c.name!=='noondealsnow-ai-direct-r2'||c.vars.DIRECT_AI_STAGE!=='canary-groq-generation'||c.triggers.crons.length!==1||c.triggers.crons[0]!=='* * * * *')process.exit(21)"
          node --check cloudflare-ai-direct/engine.mjs
          node --check cloudflare-ai-direct/provider-window.mjs
          node --check cloudflare-ai-direct/keys.mjs
          node --check cloudflare-ai-direct/pack-existing-keys.mjs
          node --check cloudflare-ai-direct/rpc-entry.mjs
          if grep -Eq 'api.github.com|GITHUB_DISPATCH_TOKEN|actions/workflows' cloudflare-ai-direct/engine.mjs cloudflare-ai-direct/keys.mjs cloudflare-ai-direct/rpc-entry.mjs; then exit 22; fi
          echo 'CLOUDFLARE_DIRECT_R2_PREFLIGHT=PASS'
      - name: Mandatory zero-network direct publication safety tests before Cloudflare deploy
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/cloudflare-ai-direct-canary.test.mjs
          echo 'DIRECT_NATIVE_PILOT_TESTS=PASS;NO_PROVIDER_CALLS=TRUE'
      - name: Build and deploy isolated direct R2 Worker
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npx wrangler deploy --dry-run --config cloudflare-ai-direct/wrangler.jsonc --outdir /tmp/ndn-direct
          npx wrangler deploy --config cloudflare-ai-direct/wrangler.jsonc
      - name: Preserve existing encryption master or create a new master for new R2 key imports
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --config cloudflare-ai-direct/wrangler.jsonc > /tmp/ndn-direct-secret-names.json
          if jq -e 'any(.[]; .name=="NDN_KEYS_MASTER")' /tmp/ndn-direct-secret-names.json >/dev/null; then
            echo 'R2_ENCRYPTION_KEY=PRESERVED'
          else
            openssl rand -base64 32 | tr -d '\n' |
              npx wrangler secret put NDN_KEYS_MASTER --config cloudflare-ai-direct/wrangler.jsonc >/dev/null
            echo 'R2_ENCRYPTION_KEY=CONFIGURED'
          fi
      - name: Provision missing direct Worker credentials from existing user-provided deploy secrets (no AI/GitHub runtime)
        shell: bash
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEYS_EXTRA: ${{ secrets.GEMINI_API_KEYS_EXTRA }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GROQ_API_KEYS_EXTRA: ${{ secrets.GROQ_API_KEYS_EXTRA }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NDN_GEMINI_POOL_01: ${{ secrets.NDN_GEMINI_POOL_01 }}
          NDN_GEMINI_POOL_02: ${{ secrets.NDN_GEMINI_POOL_02 }}
          NDN_GEMINI_POOL_03: ${{ secrets.NDN_GEMINI_POOL_03 }}
          NDN_GEMINI_POOL_04: ${{ secrets.NDN_GEMINI_POOL_04 }}
          NDN_GEMINI_POOL_05: ${{ secrets.NDN_GEMINI_POOL_05 }}
          NDN_GEMINI_POOL_06: ${{ secrets.NDN_GEMINI_POOL_06 }}
          NDN_GEMINI_POOL_07: ${{ secrets.NDN_GEMINI_POOL_07 }}
          NDN_GEMINI_POOL_08: ${{ secrets.NDN_GEMINI_POOL_08 }}
          NDN_GEMINI_POOL_09: ${{ secrets.NDN_GEMINI_POOL_09 }}
          NDN_GEMINI_POOL_10: ${{ secrets.NDN_GEMINI_POOL_10 }}
          NDN_GEMINI_POOL_11: ${{ secrets.NDN_GEMINI_POOL_11 }}
          NDN_GEMINI_POOL_12: ${{ secrets.NDN_GEMINI_POOL_12 }}
          NDN_GROQ_POOL_01: ${{ secrets.NDN_GROQ_POOL_01 }}
          NDN_GROQ_POOL_02: ${{ secrets.NDN_GROQ_POOL_02 }}
          NDN_GROQ_POOL_03: ${{ secrets.NDN_GROQ_POOL_03 }}
          NDN_GROQ_POOL_04: ${{ secrets.NDN_GROQ_POOL_04 }}
          NDN_GROQ_POOL_05: ${{ secrets.NDN_GROQ_POOL_05 }}
          NDN_GROQ_POOL_06: ${{ secrets.NDN_GROQ_POOL_06 }}
          NDN_GROQ_POOL_07: ${{ secrets.NDN_GROQ_POOL_07 }}
          NDN_GROQ_POOL_08: ${{ secrets.NDN_GROQ_POOL_08 }}
          NDN_GROQ_POOL_09: ${{ secrets.NDN_GROQ_POOL_09 }}
          NDN_GROQ_POOL_10: ${{ secrets.NDN_GROQ_POOL_10 }}
          NDN_GROQ_POOL_11: ${{ secrets.NDN_GROQ_POOL_11 }}
          NDN_GROQ_POOL_12: ${{ secrets.NDN_GROQ_POOL_12 }}
          NOONDEALSNOW_AI_SITE_PUBLISH_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
        run: |
          set -euo pipefail
          # Never overwrite keys already configured directly in Cloudflare.
          # GitHub is used ONCE as a deployment credential source; no AI work runs here.
          npx wrangler secret list --config cloudflare-ai-direct/wrangler.jsonc > /tmp/ndn-direct-secret-before.json
          if jq -e 'any(.[]; .name=="GEMINI_KEYS_JSON")' /tmp/ndn-direct-secret-before.json >/dev/null; then
            echo 'DIRECT_GEMINI_POOL=PRESERVED'
          else
            gemini_json="$(node cloudflare-ai-direct/pack-existing-keys.mjs gemini)"
            test -n "$gemini_json"
            printf '%s' "$gemini_json" | npx wrangler secret put GEMINI_KEYS_JSON --config cloudflare-ai-direct/wrangler.jsonc >/dev/null
            unset gemini_json
            echo 'DIRECT_GEMINI_POOL=MIGRATED_TO_CLOUDFLARE_SECRET'
          fi
          if jq -e 'any(.[]; .name=="GROQ_KEYS_JSON")' /tmp/ndn-direct-secret-before.json >/dev/null; then
            echo 'DIRECT_GROQ_POOL=PRESERVED'
          else
            groq_json="$(node cloudflare-ai-direct/pack-existing-keys.mjs groq)"
            test -n "$groq_json"
            printf '%s' "$groq_json" | npx wrangler secret put GROQ_KEYS_JSON --config cloudflare-ai-direct/wrangler.jsonc >/dev/null
            unset groq_json
            echo 'DIRECT_GROQ_POOL=MIGRATED_TO_CLOUDFLARE_SECRET'
          fi
          if jq -e 'any(.[]; .name=="SITE_PUBLISH_TOKEN")' /tmp/ndn-direct-secret-before.json >/dev/null; then
            echo 'DIRECT_NATIVE_PUBLISH_TOKEN=PRESERVED'
          else
            test -n "${NOONDEALSNOW_AI_SITE_PUBLISH_TOKEN:-}" || { echo 'DIRECT_NATIVE_PUBLISH_TOKEN_SOURCE_MISSING'; exit 43; }
            printf '%s' "$NOONDEALSNOW_AI_SITE_PUBLISH_TOKEN" | npx wrangler secret put SITE_PUBLISH_TOKEN --config cloudflare-ai-direct/wrangler.jsonc >/dev/null
            echo 'DIRECT_NATIVE_PUBLISH_TOKEN=MIGRATED_TO_CLOUDFLARE_SECRET'
          fi
          npx wrangler secret list --config cloudflare-ai-direct/wrangler.jsonc > /tmp/ndn-direct-secret-after.json
          for name in NDN_KEYS_MASTER GEMINI_KEYS_JSON GROQ_KEYS_JSON SITE_PUBLISH_TOKEN; do
            jq -e --arg n "$name" 'any(.[]; .name == $n)' /tmp/ndn-direct-secret-after.json >/dev/null || { echo "DIRECT_REQUIRED_SECRET_MISSING=$name"; exit 44; }
          done
          echo 'DIRECT_CLOUDFLARE_CREDENTIAL_NAMES=VERIFIED;GITHUB_GENERATION=DISABLED_IN_DIRECT_ENGINE'
          echo 'DIRECT_BULK_PUBLISHING=DISABLED;GROQ_CANARY_PROVIDER_CALL_CAP=3'
      - name: Validate canary stage and no runtime GitHub usage
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            code=$(curl -sS --max-time 20 -o /tmp/direct-r2-health.json -w '%{http_code}' 'https://noondealsnow-ai-direct-r2.ndn-e4c35f8a50.workers.dev/health' || true)
            if [ "$code" = 200 ] && jq -e '.ok==true and .schedulerEnabled==false and .githubRuntime==false and .directStage=="canary-groq-generation" and .groqCanaryEnabled==true and .canaryPublishingEnabled==false' /tmp/direct-r2-health.json >/dev/null; then
              echo 'DIRECT_CLOUDFLARE_R2_CANARY=VERIFIED'
              exit 0
            fi
            sleep 4
          done
          echo 'DIRECT_CLOUDFLARE_R2_CANARY=NOT_VERIFIED'
          exit 31
      - name: Verify one-article Cloudflare-only publication pilot Cron and unchanged legacy scheduler
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 20 -o /tmp/ndn-direct-cron.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/noondealsnow-ai-direct-r2/schedules")
          test "$code" = 200 || { echo "DIRECT_CANARY_CRON_READ_FAILED"; exit 51; }
          jq -e '.success==true and any(.result.schedules[]?; .cron=="* * * * *")' /tmp/ndn-direct-cron.json >/dev/null || { echo "DIRECT_CANARY_CRON_MISSING"; exit 52; }
          echo 'DIRECT_CLOUDFLARE_CRON=ONE_MINUTE_BOUNDED_GROQ_CANARY'
          echo 'DIRECT_BULK_PUBLISH=DISABLED;THREE_DISTINCT_GROQ_KEYS_MAX;LEGACY_PUBLISHER=UNCHANGED'
          echo 'CANARY_GROQ=AT_MOST_THREE_DISTINCT_PROVIDER_POSTS;NO_PUBLICATION'
