name: NoonDealsNow Full Blog — private existing new-account Worker preview
on:
  push:
    branches:
      - fix/noondealsnow-complete-blog-r2-pagination-20261107
    paths:
      - .github/workflows/verify-complete-blog-native-preview.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ndn-complete-blog-existing-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.repository == 'ramyadamface1-stack/nooncoupons'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.NOON_NEW_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e4c35f8a50a7b2e4cfb9d6c534962603
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify old preview Worker ALREADY exists and is safe to reuse
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          CODE=$(curl -sS -o /tmp/ndn-preview-exists.json -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/services/noondealsnow-cutover-preview")
          echo "EXISTING_PRIVATE_PREVIEW_HTTP=${CODE}"
          test "${CODE}" = 200
          jq -e '.success==true' /tmp/ndn-preview-exists.json >/dev/null
          echo 'NEW_WORKERS_CREATED=0;PRODUCTION_WORKERS_TOUCHED=0'
      - name: Generate read-only, isolated preview configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          with open('wrangler.new-account-production.jsonc') as handle:
            text=re.sub(r'^\s*//.*$', '', handle.read(),flags=re.M)
          cfg=json.loads(text)
          assert cfg['r2_buckets']==[{'binding':'CONTENT_FINAL','bucket_name':'nooncoupons-content-v2'}]
          assert all(b.get('script_name')=='noondealsnow-migration-staging' for b in cfg['durable_objects']['bindings'])
          assert cfg['triggers']['crons']==[]
          cfg['name']='noondealsnow-cutover-preview'
          cfg['main']='.ndn-full-blog-preview.mjs'
          cfg['workers_dev']=True
          cfg['vars'].update({
            'AI_PRIMARY_PROVIDER':'disabled','WORKERS_AI_DAILY_CAP':'0',
            'WORKERS_AI_DAILY_CALL_CAP':'0','BULK_DAILY_TARGET':'0',
            'ENGLISH_DAILY_TARGET':'0','R2_RESCUE_READONLY_ENABLED':'false',
            'REMOTE_EXISTING_R2_ENABLED':'false','PUBLICATION_FEED_ENABLED':'false',
            'DO_MIGRATION_EXPORT_ENABLED':'false','DO_MIGRATION_RESTORE_ENABLED':'false',
            'INDEXNOW_ENABLED':'false'
          })
          with open('.ndn-full-blog-preview.json','w') as f:json.dump(cfg,f)
          PY
          cat > .ndn-full-blog-preview.mjs <<'JS'
          import app from './discovery-entry.js';
          const READ_ONLY=new Set(['/blog','/blog/saudi','/blog/uae','/blog/archive/all']);
          export default {
            async fetch(request,env,ctx){
              if(!env.CUTOVER_PREVIEW_TOKEN||
                 request.headers.get('x-ndn-preview-token')!==env.CUTOVER_PREVIEW_TOKEN)
                return new Response('Private preview',{status:403,headers:{'cache-control':'no-store','x-robots-tag':'noindex,nofollow'}});
              if(request.method!=='GET')return new Response('Read-only',{status:405});
              if(!READ_ONLY.has(new URL(request.url).pathname))
                return new Response('Not exposed in private preview',{status:404});
              const r=await app.fetch(request,env,ctx),h=new Headers(r.headers);
              h.set('x-robots-tag','noindex,nofollow');
              h.set('cache-control','no-store');
              return new Response(r.body,{status:r.status,statusText:r.statusText,headers:h});
            }
          };
          JS
          node --check .ndn-full-blog-preview.mjs
          node --check complete-blog-listing.js
          echo 'CRON=OFF;GENERATORS=OFF;WRITE_ROUTES=BLOCKED;ONLY_FOUR_PUBLIC_READ_PAGES=ALLOWED'
      - name: Deploy to the SAME EXISTING private preview Worker (never production)
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --ignore-scripts
          npx wrangler deploy --dry-run --config .ndn-full-blog-preview.json --outdir /tmp/ndn-blog-preview-dry
          npx wrangler deploy --config .ndn-full-blog-preview.json
      - name: Protect preview with new ephemeral secret, never print it
        run: |
          set -euo pipefail
          openssl rand -hex 24 > /tmp/ndn-blog-preview-key
          token=$(cat /tmp/ndn-blog-preview-key)
          echo "::add-mask::$token"
          printf '%s' "$token" | npx wrangler secret put CUTOVER_PREVIEW_TOKEN --config .ndn-full-blog-preview.json
      - name: Test real native R2 blog after deployment, without public DNS changes
        shell: bash
        run: |
          set -euo pipefail
          export TOKEN=$(cat /tmp/ndn-blog-preview-key)
          python3 - <<'PY'
          import os,time,re,urllib.request,urllib.error,html,json
          base='https://noondealsnow-cutover-preview.ndn-e4c35f8a50.workers.dev'
          token=os.environ['TOKEN']
          def get(path,authorized=True):
            headers={'User-Agent':'NoonDealsNow-private-readonly-check'}
            if authorized:headers['x-ndn-preview-token']=token
            req=urllib.request.Request(base+path,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=26) as response:
                return response.status,response.read().decode('utf-8','replace'),dict(response.headers)
            except urllib.error.HTTPError as e:return e.code,e.read().decode('utf-8','replace'),dict(e.headers)
          denied=0
          for i in range(10):
            denied,_,_=get('/blog',False)
            if denied==403:break
            time.sleep(2)
          assert denied==403, 'PREVIEW_MUST_NOT_ALLOW_ANONYMOUS'
          print('PUBLIC_PREVIEW_ACCESS=403')
          for path in ['/blog','/blog/saudi','/blog/uae']:
            result=None
            for i in range(5):
              result=get(path)
              if result[0]==200:break
              time.sleep(2)
            code,body,headers=result
            assert code==200, (path,code,body[:180])
            cards=body.count('class="article-card"')
            assert cards==15, (path,'WRONG_PAGE_SIZE',cards)
            assert '133746' in body or '١٣٣٬٧٤٦' in body, 'SNAPSHOT_COUNTER_MISSING'
            normalizedHeaders={k.lower():v for k,v in headers.items()}
            assert normalizedHeaders.get('x-full-blog-r2')=='read-only-cursor-v1', (path,'R2_ROUTE_NOT_USED',list(normalizedHeaders))
            assert normalizedHeaders.get('x-robots-tag')=='noindex,nofollow', 'PREVIEW_MUST_NOT_BE_INDEXABLE'
            print('PREVIEW_R2_BLOG='+json.dumps({'path':path,'http':code,'articleCards':cards,'fromNativeR2':True},ensure_ascii=False))
            if path=='/blog':
              m=re.search(r'href="([^"]+)"[^>]*>المقالات التالية',body)
              assert m, 'NEXT_PAGE_LINK_MISSING'
              nextLink=html.unescape(m.group(1))
              code2,page2,h2=get(nextLink)
              assert code2==200
              assert page2.count('class="article-card"')==15
              assert 'class="article-card"' in page2
              assert 'x-full-blog-r2' in {k.lower():v for k,v in h2.items()}
              print('NEXT_R2_PAGE='+json.dumps({'http':code2,'articleCards':15,'cursorFollowed':True}))
          print('EXISTING_PREVIEW_VERIFIED=TRUE;LIVE_PRODUCTION_UNTOUCHED=TRUE;PUBLIC_DNS_WRITES=0;R2_WRITES=0')
          PY
