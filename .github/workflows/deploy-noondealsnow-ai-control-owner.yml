name: NoonDealsNow AI V2 — in-place DO owner control upgrade (existing account)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-noondealsnow-ai-control-owner.yml']
permissions: {contents: read}
concurrency:
  group: ndn-existing-do-owner-ai-v2-control-upgrade
  cancel-in-progress: false
jobs:
  upgrade-existing-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.NOON_NEW_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e4c35f8a50a7b2e4cfb9d6c534962603
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed unless EXACT existing DO owner, namespace and Cron remain intact
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          python3 - <<'PY'
          import os,json,re,urllib.request
          acct=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN'].strip()
          def get(path):
            req=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/'+acct+path,
              headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=20) as response:
              obj=json.load(response)
              if obj.get('success') is not True:raise RuntimeError('OWNER_API_NOT_SUCCESS')
              return obj.get('result')
          script='noondealsnow-migration-staging'
          service=get('/workers/services/'+script)
          settings=get('/workers/scripts/'+script+'/settings')
          schedules=get('/workers/scripts/'+script+'/schedules')
          b=settings.get('bindings') or []
          found=[v.get('name') for v in b if v.get('type')=='durable_object_namespace']
          assert sorted(found)==['CONTROL','GENERATOR_CONTROL'],found
          if isinstance(schedules,dict):cron=schedules.get('schedules') or []
          else:cron=schedules or []
          active=[v.get('cron') for v in cron if isinstance(v,dict)]
          assert active==['*/3 * * * *'],active
          # Same existing script, class names, DO migration tags and R2 bucket.
          raw=open('wrangler.migration-staging.jsonc').read()
          cfg=json.loads(re.sub(r'^\s*//.*$','',raw,flags=re.M))
          assert cfg['name']==script and cfg['main']=='discovery-entry.js'
          assert sorted(x['name'] for x in cfg['durable_objects']['bindings'])==found
          assert cfg['r2_buckets']==[{'binding':'CONTENT_FINAL','bucket_name':'nooncoupons-content-v2'}]
          assert cfg['triggers']['crons']==active
          assert len(cfg['migrations'])==2
          assert cfg['workers_dev'] is False
          # The original migration restore flag is a legacy emergency feature.
          # This update must never reactivate restoration while changing code.
          cfg['vars']['DO_MIGRATION_RESTORE_ENABLED']='false'
          cfg['vars']['DO_MIGRATION_EXPORT_ENABLED']='false'
          with open('.ndn-ai-v2-existing-do-owner.json','w') as handle:json.dump(cfg,handle)
          print('EXISTING_DO_OWNER=VERIFIED;NAMESPACE=UNCHANGED;CRON_PRESERVED='+active[0])
          print('DO_RESTORE=DISABLED;DO_EXPORT=DISABLED;R2_WRITES=0;DNS_WRITES=0')
          PY
      - name: Credential-free UI and DO control regression
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          node --test tests/ai-v2-control-policy.test.mjs tests/ai-v2-admin-console.test.mjs tests/ai-v2-github-secrets.test.mjs
      - name: Preflight existing owner bundle
        run: |
          npx wrangler deploy --dry-run --config .ndn-ai-v2-existing-do-owner.json --outdir /tmp/ndn-do-owner-ai-control-dry
          echo 'DRY_RUN=PASS;NO_NEW_DO_NAMESPACE=TRUE;NO_NEW_WORKER=TRUE'
      - name: Deploy code to SAME existing DO owner without changes to public routes, bucket, or cron
        run: |
          npx wrangler deploy --config .ndn-ai-v2-existing-do-owner.json
          echo 'DO_OWNER_SCRIPT_UPDATED=TRUE;PUBLIC_ROUTES_UNCHANGED=TRUE;CRON_UNCHANGED=TRUE'
      - name: Inspect public control policy and independent scheduler safely
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS --max-time 25 -o /tmp/ndn-ai-v2-policy.json -w '%{http_code}' \
              -H 'cache-control: no-store' 'https://noondealsnow.com/api/ai-v2-control-policy' || true)
            health=$(curl -sS --max-time 25 -o /tmp/ndn-ai-v2-health.json -w '%{http_code}' \
              -H 'cache-control: no-store' \
              'https://noondealsnow-ai-scheduler-v2.ndn-e4c35f8a50.workers.dev/health' || true)
            if [ "$health" = 200 ] && jq -e '.controlStatus=="POLICY_VERIFIED" and .source=="admin-do-policy-plus-explicit-runtime-secret" and (.intervalMinutes|IN(1,5,10,15,30,60))' /tmp/ndn-ai-v2-health.json >/dev/null;then
              echo "CONTROL_PUBLIC_POLICY_HTTP=$code"
              jq -c '{ok,enabled,intervalMinutes}' /tmp/ndn-ai-v2-policy.json 2>/dev/null || true
              jq -c '{schedulerEnabled,intervalMinutes,controlStatus,source}' /tmp/ndn-ai-v2-health.json
              echo 'PRODUCTION_ADMIN_SCHEDULER_POLICY=VERIFIED;PUBLIC_DNS_WRITES=0;DO_RESTORES=0'
              exit 0
            fi
            sleep 4
          done
          echo "CONTROL_OWNER_UPDATED_BUT_POLICY_NOT_VERIFIED;LAST_HEALTH_HTTP=$health;LAST_PUBLIC_HTTP=$code"
          jq -c '{controlStatus,schedulerEnabled,intervalMinutes}' /tmp/ndn-ai-v2-health.json || true
          exit 51
