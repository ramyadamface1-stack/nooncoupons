name: Verify Commerce Network V2

on:
  push:
    branches: [main]
    paths:
      - "commerce-taxonomy.js"
      - "commerce-generator-taxonomy.js"
      - "commerce-pages-v2.js"
      - "commerce-entry.js"
      - "bulk-generator.js"
      - "generator-core-v2.js"
      - "wrangler.jsonc"
      - ".github/workflows/verify-commerce-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Static checks
        run: |
          set -euo pipefail
          node --check commerce-taxonomy.js
          node --check commerce-generator-taxonomy.js
          node --check commerce-pages-v2.js
          node --check commerce-entry.js
          node --check bulk-generator.js
          node --check generator-core-v2.js
          grep -Fq '"main": "discovery-entry.js"' wrangler.jsonc
          grep -Fq "import app from './brand-runtime.js'" discovery-entry.js
          grep -Fq "import app from './network-entry.js'" brand-runtime.js
          grep -Fq "import app from './commerce-entry.js'" network-entry.js
          grep -Fq "architecture:'market-city-category-brand-model-comparison-article'" commerce-taxonomy.js
          grep -Fq 'CITIES' commerce-taxonomy.js
          grep -Fq 'CATEGORY_VISUALS' commerce-taxonomy.js
          grep -Fq "mode:'explicit-generator-taxonomy'" commerce-generator-taxonomy.js
          grep -Fq 'categoryKey' bulk-generator.js
          grep -Fq 'landingPath' generator-core-v2.js
      - name: Wait for deployed commerce network
        run: |
          set -euo pipefail
          ORIGIN="https://noondealsnow.com"
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 20 "$ORIGIN/api/commerce-health?v=4" -o /tmp/health.json && node - <<'NODE'
          const fs=require('fs');
          try{
            const x=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
            const pass=x.ok===true && Number(x.routes)>=110 &&
              x.architecture==='market-city-category-brand-model-comparison-article' &&
              x.generatorTaxonomy?.mode==='explicit-generator-taxonomy' &&
              Number(x.generatorTaxonomy?.version)>=6;
            process.exit(pass?0:1);
          }catch{process.exit(1)}
          NODE
            then ready=1; break; fi
            sleep 6
          done
          cat /tmp/health.json || true
          [ "$ready" = 1 ]
          curl -fsS --max-time 20 "$ORIGIN/saudi/categories?v=4" -o /tmp/categories.html
          curl -fsS --max-time 20 "$ORIGIN/saudi/category/shoes?v=4" -o /tmp/shoes.html
          curl -fsS --max-time 20 "$ORIGIN/uae/category/bags?v=4" -o /tmp/bags.html
          curl -fsS --max-time 20 "$ORIGIN/saudi/brand/apple?v=4" -o /tmp/brand.html
          curl -fsS --max-time 20 "$ORIGIN/saudi/model/apple/iphone-pro?v=4" -o /tmp/model.html
          curl -fsS --max-time 20 "$ORIGIN/saudi/compare/iphone-vs-galaxy?v=4" -o /tmp/compare.html
          curl -fsS --max-time 20 "$ORIGIN/sitemap-commerce.xml?v=4" -o /tmp/sitemap.xml
          grep -Fq '/saudi/category/shoes' /tmp/sitemap.xml
          grep -Fq '/uae/category/bags' /tmp/sitemap.xml
          grep -Fq '/saudi/model/apple/iphone-pro' /tmp/sitemap.xml
          grep -Fq '/saudi/compare/iphone-vs-galaxy' /tmp/sitemap.xml
