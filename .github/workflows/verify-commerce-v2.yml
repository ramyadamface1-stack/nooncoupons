name: Verify Commerce Network V2

on:
  push:
    branches: [main]
    paths:
      - "commerce-taxonomy.js"
      - "commerce-generator-taxonomy.js"
      - "commerce-pages-v2.js"
      - "commerce-entry.js"
      - "bulk-generator.js"
      - "generator-core-v2.js"
      - "wrangler.jsonc"
      - ".github/workflows/verify-commerce-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Static checks
        run: |
          set -euo pipefail
          node --check commerce-taxonomy.js
          node --check commerce-generator-taxonomy.js
          node --check commerce-pages-v2.js
          node --check commerce-entry.js
          node --check bulk-generator.js
          node --check generator-core-v2.js
          grep -Fq '"main": "commerce-entry.js"' wrangler.jsonc
          grep -Fq "architecture:'market-city-category-brand-model-comparison-article'" commerce-taxonomy.js
          grep -Fq 'CITIES' commerce-taxonomy.js
          grep -Fq 'CATEGORY_VISUALS' commerce-taxonomy.js
          grep -Fq "mode:'explicit-generator-taxonomy'" commerce-generator-taxonomy.js
          grep -Fq 'categoryKey' bulk-generator.js
          grep -Fq 'landingPath' generator-core-v2.js
      - name: Wait for deployed commerce network
        run: |
          set -euo pipefail
          ORIGIN="https://noondealsnow.com"
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 20 "$ORIGIN/api/commerce-health?v=3" -o /tmp/health.json && grep -Fq '"routes": 110' /tmp/health.json && grep -Fq '"generatorTaxonomy"' /tmp/health.json && grep -Fq '"explicit-generator-taxonomy"' /tmp/health.json; then ready=1; break; fi
            sleep 6
          done
          [ "$ready" = 1 ]
          curl -fsS --max-time 20 "$ORIGIN/saudi/categories?v=3" -o /tmp/categories.html
          curl -fsS --max-time 20 "$ORIGIN/saudi/category/shoes?v=3" -o /tmp/shoes.html
          curl -fsS --max-time 20 "$ORIGIN/uae/category/bags?v=3" -o /tmp/bags.html
          curl -fsS --max-time 20 "$ORIGIN/saudi/brand/apple?v=3" -o /tmp/brand.html
          curl -fsS --max-time 20 "$ORIGIN/saudi/model/apple/iphone-pro?v=3" -o /tmp/model.html
          curl -fsS --max-time 20 "$ORIGIN/saudi/compare/iphone-vs-galaxy?v=3" -o /tmp/compare.html
          curl -fsS --max-time 20 "$ORIGIN/sitemap-commerce.xml?v=3" -o /tmp/sitemap.xml
          grep -Fq '/saudi/category/shoes' /tmp/sitemap.xml
          grep -Fq '/uae/category/bags' /tmp/sitemap.xml
          grep -Fq '/saudi/model/apple/iphone-pro' /tmp/sitemap.xml
          grep -Fq '/saudi/compare/iphone-vs-galaxy' /tmp/sitemap.xml
