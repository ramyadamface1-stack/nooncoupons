name: Verify Rescue Sitemap Index and Images Before Deploy
on:
  push:
    branches: [fix/rescue-sitemap-sources-20261019]
    paths: ['r2-sitemap-rescue.js','discovery-entry.js','.github/workflows/test-r2-rescue-sitemaps.yml']
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOON_RESCUE_R2_ACCESS_KEY_ID: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
      NOON_RESCUE_R2_SECRET_ACCESS_KEY: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
      R2_RESCUE_READONLY_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify R2-backed XML maps have published article and image URL content
        run: |
          set -euo pipefail
          node --check r2-sitemap-rescue.js
          node --check discovery-entry.js
          node --input-type=module <<'NODE'
          import {rescueSitemapResponse} from './r2-sitemap-rescue.js';
          const env=process.env;
          for(const path of ['/sitemap-rescue-recent.xml','/sitemap-images.xml']){
            const response=await rescueSitemapResponse(new Request('https://noondealsnow.com'+path),env);
            const xml=await response.text();
            const count=(xml.match(/<url>/g)||[]).length;
            const imageCount=(xml.match(/<image:image>/g)||[]).length;
            console.log('SITEMAP_TEST='+JSON.stringify({path,status:response.status,count,imageCount,type:response.headers.get('content-type'),size:xml.length}));
            if(response.status!==200||count<10||imageCount!==count||!xml.startsWith('<?xml'))process.exitCode=1;
            if(xml.includes('/en/articles/')&&path==='/sitemap-images.xml')console.log('SITEMAP_CONTAINS_EN=true');
          }
          NODE
      - name: Verify Worker build without deploying or altering namespaces
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npx wrangler deploy --dry-run --outdir /tmp/r2-sitemap-worker-verify
