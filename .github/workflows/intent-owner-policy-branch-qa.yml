name: Intent Owner Policy Branch QA

on:
  push:
    branches: [intent-owner-policy-v4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate branch-only corpus and sitemap changes
        run: |
          set -euo pipefail
          node --check article-corpus-audit.js
          node --check auto-platform.js
          node --check discovery-entry.js
          node --check commerce-entry.js
          node --check admin-page.js
          node --check bulk-content-engine-base.js
          node -e "import('./bulk-content-engine-base.js').then(m=>{const x=m.bulkTitleCollisionSelftest();console.log('BULK_TITLE_SELFTEST_PASS='+x.pass,JSON.stringify(x));if(!x.pass)process.exit(1)})"
          node -e "Promise.all([import('./bulk-content-engine-base.js'),import('./article-quality-runtime.js')]).then(([b,r])=>{const x=b.bulkTitleCollisionSelftest();const rows=x.rows.map(t=>r.normalizeRuntimeTitle(t,{keyword:t,market:'السعودية'}));const pass=x.pass&&new Set(rows).size===rows.length&&rows.every(t=>t.length>=28&&t.length<=72);console.log('RUNTIME_TITLE_DIFFERENTIATION_PASS='+pass,JSON.stringify(rows));if(!pass)process.exit(1)})"
          grep -Fq "same-intent-exact-title-stable-owner-v1" article-corpus-audit.js
          grep -Fq "article-collision-owner-v4.json" article-corpus-audit.js
          grep -Fq "same-intent-semantic-family-stable-owner-v1" article-corpus-audit.js
          grep -Fq "globallyActionableOwner" article-corpus-audit.js
          grep -Fq "contentTarget)return false" article-corpus-audit.js
          grep -Fq "PROMO_CLAIM_MODEL='block-aware-v1'" article-corpus-audit.js
          grep -Fq "hasUnsupportedPromoClaim" article-corpus-audit.js
          node -e "import('./article-corpus-audit.js').then(m=>{const x=m.promoClaimAuditSelftest();console.log('PROMO_AUDIT_SELFTEST_PASS='+x.pass,JSON.stringify(x));if(!x.pass)process.exit(1)})"
          node -e "import('./article-corpus-audit.js').then(m=>{const x=m.ownerSnapshotCutoffSelftest();console.log('OWNER_SNAPSHOT_CUTOFF_SELFTEST_PASS='+x.pass,JSON.stringify(x));if(!x.pass)process.exit(1)})"
          grep -Fq "owner_source_snapshot_mismatch" article-corpus-audit.js
          grep -Fq "r2-uploaded-cutoff-v1" article-corpus-audit.js
          grep -Fq "const t=Date.parse(a.createdAt||'')" auto-platform.js
          grep -Fq "published-ar-rendered95-unique-or-resolved-owner-v2" article-corpus-audit.js
          grep -Fq "DISCOVERY_CURRENT_KEY" article-corpus-audit.js
          grep -Fq "AUDIT_DISCOVERY_CURRENT_KEY" auto-platform.js
          grep -Fq "sitemap-audit-articles-" auto-platform.js
          grep -Fq "sitemap-fresh-articles-" auto-platform.js
          grep -Fq "x-audit-archive" auto-platform.js
          grep -Fq "/blog/archive" auto-platform.js
          grep -Fq "metricQualified" admin-page.js
          grep -Fq "auditQualified" commerce-entry.js
          grep -Fq "t>cut&&sitemapEligible(a)" auto-platform.js
          grep -Fq "discovery_source_snapshot_mismatch" article-corpus-audit.js
          grep -Fq "proofVersion:5" .github/workflows/full-article-corpus-audit.yml
          grep -Fq "CORPUS_AUDIT_REUSED=1" .github/workflows/full-article-corpus-audit.yml
          grep -Fq "auditInputHash" .github/workflows/full-article-corpus-audit.yml
          grep -Fq "authoritative-proof-current" .github/workflows/full-article-corpus-audit.yml
          grep -Fq "ARTICLE_CORPUS_REUSE" .github/workflows/full-article-corpus-audit.yml
          grep -Fq "ownerSnapshotModel==\"r2-uploaded-cutoff-v1\"" .github/workflows/full-article-corpus-audit.yml
          grep -Fq "ARTICLE_DISCOVERY_FINAL=" .github/workflows/full-article-corpus-audit.yml
          grep -Fq "/api/article-discovery-health" discovery-entry.js
          echo "BRANCH_QA=PASS"
