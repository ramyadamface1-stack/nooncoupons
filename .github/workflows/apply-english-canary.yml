name: Apply isolated English canary integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-english-canary.yml']
permissions:
  contents: write
jobs:
  apply-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply canary integration
        run: node english-canary-migrate.mjs
      - name: Syntax and contract checks
        run: |
          set -euo pipefail
          node --check english-canary.js
          node --check commerce-entry.js
          node --check commerce-pages-v2.js
          node --check public-entry.js
          node --check bulk-generator.js
          grep -Fq "ENGLISH_CANARY_TOTAL\": \"2" wrangler.jsonc
          grep -Fq "native-intent-v6-canary" english-canary.js
          grep -Fq "englishCanarySitemap" commerce-entry.js
          grep -Fq "englishMarketRows" commerce-pages-v2.js
          grep -Fq "languageSource:'arabic-primary'" bulk-generator.js
      - name: Commit integrated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commerce-entry.js commerce-pages-v2.js public-entry.js bulk-generator.js wrangler.jsonc
          git diff --cached --quiet && exit 0
          git commit -m "Gate English publishing behind two-article canary"
          git push origin HEAD:main
