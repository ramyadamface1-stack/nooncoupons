name: R2 Class B Cost Watch

on:
  push:
    branches: [main]
    paths: [.github/workflows/r2-cost-watch.yml]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  r2-class-b:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check R2 24h totals and 5-minute HEAD trend
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const token=process.env.CF_TOKEN;
          if(!token){console.log('::warning::R2_COST_WATCH_UNAVAILABLE: Cloudflare token missing');process.exit(0)}
          const end=new Date(),start=new Date(end.getTime()-86400000);
          const query='query R2Watch($accountTag: string!, $startDate: Time, $endDate: Time, $bucketName: string) { viewer { accounts(filter: {accountTag: $accountTag}) { r2OperationsAdaptiveGroups(limit: 1000, filter: {datetime_geq: $startDate, datetime_leq: $endDate, bucketName: $bucketName}) { sum { requests } dimensions { actionType } } } } }';
          const variables={accountTag:'c82274152a942dea53044eae7153cfd7',bucketName:'nooncoupons-content-v2',startDate:start.toISOString(),endDate:end.toISOString()};
          let payload;
          try{
            const res=await fetch('https://api.cloudflare.com/client/v4/graphql',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({query,variables})});
            payload=await res.json();
            if(!res.ok||payload.errors?.length)throw new Error('Cloudflare GraphQL denied or unavailable (HTTP '+res.status+')');
          }catch(err){console.log('::warning::R2_COST_WATCH_UNVERIFIED: '+err.message+'; existing token may need Account Analytics Read');process.exit(0)}
          const groups=payload?.data?.viewer?.accounts?.[0]?.r2OperationsAdaptiveGroups;
          if(!Array.isArray(groups)){console.log('::warning::R2_COST_WATCH_NO_DATA');process.exit(0)}
          const rows=groups.map(g=>({type:String(g.dimensions?.actionType||''),count:Number(g.sum?.requests||0)})).sort((a,b)=>b.count-a.count);
          for(const row of rows.slice(0,20))console.log('R2_OPERATION '+row.type+' '+row.count);
          const reads=rows.filter(r=>/^(GetObject|HeadObject)$/i.test(r.type)).reduce((s,r)=>s+r.count,0);
          const total=rows.reduce((s,r)=>s+r.count,0);
          // Diagnostic sample: identify which object names are repeatedly HEAD-ed, never disclose secrets.
          try{
            const byNameQuery='query R2Heads($accountTag: string!, $startDate: Time, $endDate: Time, $bucketName: string) { viewer { accounts(filter: {accountTag: $accountTag}) { r2OperationsAdaptiveGroups(limit: 1000, orderBy: [sum_requests_DESC], filter: {datetime_geq: $startDate, datetime_leq: $endDate, bucketName: $bucketName, actionType: "HeadObject"}) { sum { requests } dimensions { objectName } } } } }';
            const headResponse=await fetch('https://api.cloudflare.com/client/v4/graphql',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({query:byNameQuery,variables})});
            const headData=await headResponse.json();
            const sample=headData?.data?.viewer?.accounts?.[0]?.r2OperationsAdaptiveGroups;
            if(!headResponse.ok||headData.errors?.length||!Array.isArray(sample))throw new Error('object-name breakdown query unavailable');
            const groups=new Map();
            for(const row of sample){
              const name=String(row.dimensions?.objectName||''),kind=name.startsWith('articles/')?'articles':name.startsWith('bulk/')?'bulk':name.startsWith('quality/')?'quality':name.startsWith('_ops/')?'ops':'other';
              groups.set(kind,(groups.get(kind)||0)+Number(row.sum?.requests||0));
            }
            console.log('R2_HEAD_TOP_1000_PREFIX_SAMPLE='+JSON.stringify(Object.fromEntries(groups)));
            for(const row of sample.slice(0,12))console.log('R2_HOT_HEAD '+String(row.dimensions?.objectName||'').slice(0,140)+' '+Number(row.sum?.requests||0));
          }catch(e){console.log('::warning::R2_HEAD_OBJECTNAME_BREAKDOWN_UNAVAILABLE '+e.message)}
          console.log('R2_24H_GET_HEAD='+reads+' R2_24H_TOTAL='+total);
          // Measure post-deploy changes in short windows; 24h totals retain pre-fix history.
          let lastHourHead=null;
          try{
            const q='query R2HeadSeries($accountTag: string!, $startDate: Time, $endDate: Time, $bucketName: string) { viewer { accounts(filter: {accountTag: $accountTag}) { r2OperationsAdaptiveGroups(limit: 1000, filter: {datetime_geq: $startDate, datetime_leq: $endDate, bucketName: $bucketName, actionType: "HeadObject"}) { sum { requests } dimensions { datetimeFiveMinutes actionStatus } } } } }';
            const bounds={...variables,startDate:new Date(end.getTime()-2*3600000).toISOString()};
            const response=await fetch('https://api.cloudflare.com/client/v4/graphql',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({query:q,variables:bounds})});
            const json=await response.json();
            const buckets=json?.data?.viewer?.accounts?.[0]?.r2OperationsAdaptiveGroups;
            if(!response.ok||json.errors?.length||!Array.isArray(buckets))throw Error('5-minute HEAD series not available');
            const cutoff=end.getTime()-3600000;
            lastHourHead=0;
            const statuses=new Map();
            const series=new Map();
            for(const row of buckets){
              const when=String(row.dimensions?.datetimeFiveMinutes||''),status=String(row.dimensions?.actionStatus||'unknown'),count=Number(row.sum?.requests||0);
              statuses.set(status,(statuses.get(status)||0)+count);
              series.set(when,(series.get(when)||0)+count);
              if(Date.parse(when)>=cutoff)lastHourHead+=count;
            }
            console.log('R2_HEAD_2H_BY_STATUS='+JSON.stringify(Object.fromEntries(statuses)));
            for(const [when,count] of [...series].sort((a,b)=>a[0].localeCompare(b[0])))console.log('R2_HEAD_5MIN '+when+' '+count);
            console.log('R2_HEAD_LAST_HOUR='+lastHourHead);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\nHEAD last hour: '+lastHourHead+'\nHEAD two-hour statuses: '+JSON.stringify(Object.fromEntries(statuses))+'\n');
          }catch(err){console.log('::warning::R2_HEAD_SERIES_UNAVAILABLE '+err.message)}
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### R2 Cost Watch\nBucket: nooncoupons-content-v2\nGetObject + HeadObject (24h): '+reads+'\nAll operations (24h): '+total+'\nTarget <= 12,500 HEAD/hour; critical > 42,000 HEAD/hour. 24h historical total reported separately.\n');
          if(lastHourHead!==null && lastHourHead>42000){console.error('::error::R2_CLASS_B_HOURLY_HEAD_SPIKE '+lastHourHead+' HeadObject operations in last hour');process.exitCode=1}
          else if(lastHourHead!==null && lastHourHead>12500)console.log('::warning::R2_CLASS_B_HOURLY_HEAD_ELEVATED '+lastHourHead);
          if(reads>1000000)console.log('::warning::R2_CLASS_B_24H_HISTORY_HIGH '+reads+' (may include pre-fix operations)');
          else if(reads>300000)console.log('::warning::R2_CLASS_B_24H_HISTORY_ELEVATED '+reads);
          if(process.exitCode!==1)console.log('R2_HOURLY_COST_WATCH=PASS');
          NODE
