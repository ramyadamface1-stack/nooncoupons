name: Validate Recently Published Noon Articles in Live Blog
on:
  push:
    branches: [audit/live-blog-after-merge-20261021]
    paths: ['.github/workflows/audit-live-20261021-blog.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live latest Saudi/Emirati articles on exact production paths
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,re,json,sys
          pmap={
            '/blog':['كود-خصم-نون-السعودية-اللابتوبات-مع-مقارنة-البائعين','كود-خصم-نون-الإمارات-اللابتوبات-بدون-شراء-زائد'],
            '/blog/saudi':['كود-خصم-نون-السعودية-اللابتوبات-مع-مقارنة-البائعين'],
            '/blog/uae':['كود-خصم-نون-الإمارات-اللابتوبات-بدون-شراء-زائد']
          }
          failed=[]
          for path,slugs in pmap.items():
            url='https://noondealsnow.com'+path+'?check=post-deploy'
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 NoonDealsNow-Live-SEO-QA'})
            with urllib.request.urlopen(req,timeout=25) as res:
              body=res.read(900000).decode('utf8','replace')
              http=res.status
            image=re.search(r'<img [^>]*src="([^"]+)"',body)
            facts={'path':path,'http':http,'cards':body.count('<article class="card"'),'images':body.count('<img '),
              'latestSlugs':{slug:slug in body for slug in slugs},'hasItemList':'ItemList' in body}
            if image:
              img=image.group(1).replace('&amp;','&')
              try:
                imageReq=urllib.request.Request('https://noondealsnow.com'+img,headers={'User-Agent':'Mozilla/5.0'})
                with urllib.request.urlopen(imageReq,timeout=15) as response:facts['firstImageHttp']=response.status
              except Exception as e:facts['firstImageHttp']='ERROR:'+type(e).__name__
            print('LIVE_RECENT_BLOG='+json.dumps(facts,ensure_ascii=False),flush=True)
            if http!=200 or facts['cards']!=15 or not facts['hasItemList'] or not all(facts['latestSlugs'].values()):
              failed.append(facts)
          print('LIVE_BLOG_VERIFICATION_PASS='+str(not failed).lower(),flush=True)
          if failed:sys.exit(1)
          PY
