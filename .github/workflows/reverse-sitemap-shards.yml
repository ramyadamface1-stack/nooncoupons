name: Reverse Sitemap Shards

on:
  push:
    paths:
      - '.github/workflows/reverse-sitemap-shards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reverse article sitemap shards
        run: node scripts/reverse-sitemap-shards.mjs
      - name: Validate sitemap source
        run: |
          node --check auto-platform.js
          grep -Fq 'for(let i=Number(d.shards||0)-1;i>=0;i--)' auto-platform.js
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auto-platform.js
          if git diff --cached --quiet; then
            echo NO_CHANGES
            exit 0
          fi
          git commit -m "Serve freshest article sitemap shards first"
          git push origin HEAD:main
