name: Verify Legacy Upgrade V2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-legacy-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Static safety checks
        run: |
          node --check legacy-upgrader-v2.js
          node --check admin-runtime.js
          grep -Fq "runLegacyUpgradeBatchV2" admin-runtime.js
          grep -Fq "const MAX_PASSES=4" legacy-upgrader-v2.js
          grep -Fq "const RECOVERY_PASS=4" legacy-upgrader-v2.js
          grep -Fq "legacyUpgradePausedForConsolidation" legacy-upgrader-v2.js
          grep -Fq "legacyUpgradePausedForConsolidation" admin-runtime.js
          grep -Fq "programmatic-cloudflare:v2-legacy-upgrade" legacy-upgrader-v2.js
          if grep -E -n 'generativelanguage\.googleapis\.com|api\.x\.ai|api\.groq\.com|GEMINI_API_KEY|XAI_API_KEY|GROQ_API_KEY' legacy-upgrader-v2.js admin-runtime.js; then
            exit 1
          fi
      - name: Verify legacy compatibility on current production
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="https://noondealsnow.com"
          echo "PRODUCTION_ORIGIN $ORIGIN"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 "$ORIGIN/api/generator-health?v=legacy-contract" >/tmp/health.json
          python - <<'PY' /tmp/health.json
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('ok') is True
          text=json.dumps(d)
          assert 'bulk' in text.lower() or 'generator' in text.lower()
          print('LEGACY_RUNTIME_HEALTH_PASS')
          PY
          echo CHECK_PUBLIC_ARTICLES
          curl -fsS --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 "$ORIGIN/api/articles?limit=20&v=legacy-contract" >/tmp/articles.json
          python - <<'PY' /tmp/articles.json
          import json,sys
          d=json.load(open(sys.argv[1])); arts=d.get('articles') or []
          assert arts
          for a in arts:
            assert a.get('slug') or a.get('path')
          print('PUBLIC_ARTICLE_COMPAT_PASS',len(arts))
          PY
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-v2-diagnostics
          path: |
            /tmp/health.json
            /tmp/state.json
            /tmp/article.html
            /tmp/article.headers
          if-no-files-found: ignore
          retention-days: 1
