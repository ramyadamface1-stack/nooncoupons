name: Verify Legacy Upgrade V2 (diagnostic)

on:
  push:
    branches: [main]
    paths: ['legacy-upgrader-v2.js','admin-runtime.js','.github/workflows/verify-legacy-v2.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-legacy-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Static safety checks
        run: |
          node --check legacy-upgrader-v2.js
          node --check admin-runtime.js
          grep -Fq "runLegacyUpgradeBatchV2" admin-runtime.js
          grep -Fq "const MAX_PASSES=4" legacy-upgrader-v2.js
          grep -Fq "const RECOVERY_PASS=4" legacy-upgrader-v2.js
          grep -Fq "legacyUpgradePausedForConsolidation" legacy-upgrader-v2.js
          grep -Fq "legacyUpgradePausedForConsolidation" admin-runtime.js
          grep -Fq "programmatic-cloudflare:v2-legacy-upgrade" legacy-upgrader-v2.js
          if grep -E -n 'generativelanguage\.googleapis\.com|api\.x\.ai|api\.groq\.com|GEMINI_API_KEY|XAI_API_KEY|GROQ_API_KEY' legacy-upgrader-v2.js admin-runtime.js; then
            exit 1
          fi
      - name: Verify legacy compatibility on current production
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="https://noondealsnow.com"
          echo "PRODUCTION_ORIGIN $ORIGIN"
          echo CHECK_BLOG
          curl -fsS --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 "$ORIGIN/blog?v=legacy-contract" >/tmp/blog.html
          grep -Eq '<html|<!doctype' /tmp/blog.html
          echo CHECK_SITEMAP
          curl -fsS --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 "$ORIGIN/sitemap.xml?v=legacy-contract" >/tmp/sitemap.xml
          grep -Fq '<urlset' /tmp/sitemap.xml
          echo LEGACY_PUBLIC_COMPAT_PASS
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-v2-diagnostics
          path: |
            /tmp/health.json
            /tmp/state.json
            /tmp/article.html
            /tmp/article.headers
          if-no-files-found: ignore
          retention-days: 1
