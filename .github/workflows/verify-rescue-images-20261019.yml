name: Verify Rescue Images and Article Schema in Real Workerd
on:
  push:
    branches: [fix/restore-images-ai-schema-20261019]
    paths: ['r2-emergency-readonly.js','.github/workflows/verify-rescue-images-20261019.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOON_NEW_R2_ACCESS_KEY_ID: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
      NOON_NEW_R2_SECRET_ACCESS_KEY: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test module and compile Workerd
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --ignore-scripts
          node --check r2-emergency-readonly.js
          node --check discovery-entry.js
          npx wrangler deploy --dry-run --outdir /tmp/workerd-images-test
      - name: Check images schema navigation and actual image URLs from local worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8789 --log-level error \
            --var "NOON_RESCUE_R2_ACCESS_KEY_ID:$NOON_NEW_R2_ACCESS_KEY_ID" \
            --var "NOON_RESCUE_R2_SECRET_ACCESS_KEY:$NOON_NEW_R2_SECRET_ACCESS_KEY" >/tmp/workerd-rescue-images.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..35}; do if curl -fsS --max-time 3 http://127.0.0.1:8789/api/revision -o /dev/null; then break; fi; sleep 2; done
          node --input-type=module <<'NODE'
          const host='http://127.0.0.1:8789';
          const paths=['/blog','/blog/archive/all','/blog/archive/2026-10-18','/articles/شراء-الجوالات-من-نون-السعودية-باستخدام-كوبون-لشراء-ذكي','/en/articles/en-noon-uae-coupon-conditions-guide'];
          for(const path of paths){
            const response=await fetch(host+path),html=await response.text();
            const imgs=[...html.matchAll(/<img\b[^>]*src="([^"]+)"/g)].map(x=>x[1]);
            console.log('CHECK_PATH='+path+' HTTP='+response.status+' IMAGE_COUNT='+imgs.length+' JSONLD_COUNT='+(html.match(/application\/ld\+json/g)||[]).length+' OG_IMAGE='+html.includes('property="og:image"'));
            if(response.status!==200||imgs.length===0)process.exitCode=1;
            if(path.includes('/articles/')){
              if(!html.includes('property="og:image"')||!html.includes('twitter:card')||!html.includes('related-links'))process.exitCode=1;
            }
            const first=imgs[0];
            if(first){
              const picture=await fetch(host+first.replaceAll('&amp;','&'));
              const txt=await picture.text();
              console.log('IMAGE_STATUS='+picture.status+' IMAGE_MIME='+picture.headers.get('content-type')+' BYTES='+txt.length+' SVG='+txt.includes('<svg'));
              if(picture.status!==200||!txt.includes('<svg'))process.exitCode=1;
            }
          }
          NODE
