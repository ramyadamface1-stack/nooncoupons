name: Test Bounded Emergency R2 Read Retry without External Calls
on:
  push:
    branches: [fix/oct21-rescue-r2-transient-retry]
    paths: ['r2-emergency-readonly.js','tests/r2-rescue-retry.test.mjs','.github/workflows/oct21-test-rescue-retry.yml']
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Confirm R2 read-only retry is bounded and production Worker builds
        shell: bash
        run: |
          set -euo pipefail
          node --check r2-emergency-readonly.js
          node --test tests/r2-rescue-retry.test.mjs
          npm install --no-audit --no-fund --ignore-scripts
          npx wrangler deploy --dry-run --outdir /tmp/rescue-retry-dry-run
          echo BOUNDED_R2_RETRY_TEST_PASS=true
