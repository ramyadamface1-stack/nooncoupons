name: Raise Catchup 48

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/raise-catchup-48.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  raise:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Raise temporary catch-up throughput
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('wrangler.jsonc'); s=p.read_text()
          assert '"BULK_CATCHUP_BATCH_SIZE": "24"' in s
          p.write_text(s.replace('"BULK_CATCHUP_BATCH_SIZE": "24"','"BULK_CATCHUP_BATCH_SIZE": "48"',1))

          p=Path('bulk-generator.js'); s=p.read_text()
          assert 'Math.min(24,Number(batchSize||3))' in s
          p.write_text(s.replace('Math.min(24,Number(batchSize||3))','Math.min(48,Number(batchSize||3))',1))
          PY
          node --check bulk-generator.js
          node bulk-selftest.js | tee /tmp/bulk-selftest.log
          grep -Fq '"BULK_CATCHUP_BATCH_SIZE": "48"' wrangler.jsonc
          grep -Fq 'Math.min(48,Number(batchSize||3))' bulk-generator.js

      - name: Commit throughput increase
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wrangler.jsonc bulk-generator.js
          git commit -m 'Raise temporary catch-up batch to 48'
          git push origin HEAD:main
