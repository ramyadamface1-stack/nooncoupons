name: NDN Commercial Static Fast Render Smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ndn-commercial-static-fast-render.yml'
      - 'scripts/build-ndn-commercial-static.mjs'
      - 'scripts/build-ndn-legacy-conversion-landing-rescue.mjs'
      - 'scripts/build-ndn-static-all-brand-hubs.mjs'
      - 'tests/ndn-static-all-brand-hubs.test.mjs'
      - 'tests/ndn-legacy-commercial-static.test.mjs'
      - 'scripts/build-ndn-commercial-sitemap.mjs'
      - 'tests/ndn-commercial-sitemap.test.mjs'
      - 'scripts/build-ndn-static-trust-pages.mjs'
      - 'tests/ndn-static-trust-pages.test.mjs'
  pull_request:
    paths:
      - 'scripts/build-ndn-commercial-static.mjs'
      - 'scripts/build-ndn-commercial-sitemap.mjs'
      - 'scripts/build-ndn-static-all-brand-hubs.mjs'
      - 'tests/ndn-commercial-static.test.mjs'
      - 'tests/ndn-commercial-sitemap.test.mjs'
      - '.github/workflows/ndn-commercial-static-fast-render.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  fast-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build independent commercial pages without R2 network access
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-ndn-quota-static-fallback.mjs > /tmp/builder.log
          node scripts/build-ndn-static-seo-assets.mjs > /tmp/seo.log
          printf '<?xml version="1.0" encoding="UTF-8"?><sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><sitemap><loc>https://noondealsnow.com/sitemap-core.xml</loc></sitemap></sitemapindex>' > .ndn-static-assets/sitemap.xml
          mkdir -p .ndn-blog-staging
          printf '{"objects":{"_ops/ai-v2-publication-ledger-v1.json":{"articles":[]}},"cachedArticleSlugs":[]}' > .ndn-blog-staging/public-snapshot.json
          node scripts/build-ndn-static-trust-pages.mjs
          node scripts/build-ndn-commercial-static.mjs
          node scripts/build-ndn-legacy-conversion-landing-rescue.mjs
          node scripts/build-ndn-static-all-brand-hubs.mjs
          node --test tests/ndn-static-all-brand-hubs.test.mjs
          node --test tests/ndn-legacy-commercial-static.test.mjs
          node scripts/build-ndn-commercial-sitemap.mjs
          node --test tests/ndn-commercial-sitemap.test.mjs
          node --test tests/ndn-static-trust-pages.test.mjs
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync} from 'node:fs';
          import {PUBLIC_CATEGORIES} from './index.js';
          const r=JSON.parse(readFileSync('.ndn-blog-staging/market-seo-report.json','utf8'));
          if(r.generatedPages!==110||r.keywordGuides!==10||r.categoryPages!==84)throw Error(JSON.stringify(r));
          for(const p of ['/saudi/categories','/uae/categories','/saudi/noon-coupon-code','/uae/noon-coupon-code',
                          '/saudi/buying-guide/mobile-phones','/uae/buying-guide/beauty',
                          '/golden-keywords','/saudi/golden-keywords','/uae/golden-keywords',
                          '/saudi/buying-guide/samsung-s26-ultra','/uae/buying-guide/mini-led-tv']){
            const path='.ndn-static-assets'+p+'.html';
            if(!existsSync(path))throw Error('MISSING '+path);
            const html=readFileSync(path,'utf8');
            if(!html.includes('id="ndn-static-ga4"')||!html.includes('<h1>'))throw Error('BAD_HTML '+p);
          }
          for(const [m,c,other] of [['saudi','NOV170','NOV188'],['uae','NOV188','NOV170']]){
            const html=readFileSync('.ndn-static-assets/'+m+'/golden-keywords.html','utf8');
            if(!html.includes('data-code="'+c+'"')||html.includes('data-code="'+other+'"'))throw Error('GOLDEN_CROSS_MARKET_COUPON_'+m);
            const specialist=m==='saudi'?'samsung-s26-ultra':'mini-led-tv';
            if(!html.includes('/'+m+'/buying-guide/'+specialist)||!existsSync('.ndn-static-assets/'+m+'/buying-guide/'+specialist+'.html'))throw Error('GOLDEN_GUIDE_MISSING_'+m);
          }
          const gold=readFileSync('.ndn-static-assets/golden-keywords.html','utf8');
          if(!gold.includes('ndn-public-golden-keywords')||!gold.includes('index,follow,max-image-preview:large'))throw Error('GOLDEN_LEGACY_NOINDEX_OVERRIDE');
          const home=readFileSync('.ndn-static-assets/index.html','utf8');
          if(!home.includes('id="commercial-buying-intent"'))throw Error('MISSING_HOME_SECTION');
          console.log('NDN_FAST_MARKET_BUILD_PASS='+JSON.stringify(r));
          NODE
