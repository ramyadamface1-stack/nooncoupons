name: NoonDealsNow AI V2 Short Draft Recovery Canary
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noondealsnow-ai-v2-short-draft-recovery.yml'
permissions:
  contents: read
concurrency:
  group: noondealsnow-ai-v2-single-site
  cancel-in-progress: false
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate zero-AI content repair and Saudi safety tests
        run: |
          node --check automation/ai-v2/run.mjs
          node --test tests/ai-v2-guardrails.test.mjs tests/ai-v2-native-article.test.mjs tests/ai-v2-native-arabic-article.test.mjs tests/ai-v2-topic-queue.test.mjs
      - name: Resume exactly saved 1330-word UAE draft without any provider calls
        shell: bash
        env:
          AI_PREFLIGHT_ONLY: 'false'
          AI_ONE_OFF_CANARY: 'true'
          AI_REPROCESS_SAVED_DRAFT: 'true'
          AI_NO_PROVIDER_CALLS: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.NOONDEALSNOW_AI_R2_CHECKPOINT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e4c35f8a50a7b2e4cfb9d6c534962603
          NOONDEALSNOW_AI_FREE_ONLY_APPROVED: ${{ secrets.NOONDEALSNOW_AI_FREE_ONLY_APPROVED }}
          NOONDEALSNOW_AI_SITE_PUBLISH_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo 'CHECKPOINT_R2_MISSING'; exit 22; }
          [ -n "${NOONDEALSNOW_AI_SITE_PUBLISH_TOKEN:-}" ] || { echo 'SITE_AUTH_MISSING'; exit 23; }
          npm install --no-audit --no-fund --ignore-scripts
          node automation/ai-v2/run.mjs | tee /tmp/ndn-second-recover.log
          echo '### NoonDealsNow AI V2: checkpoint-only short-draft repair' >> "$GITHUB_STEP_SUMMARY"
          grep '^AI_V2_REPORT ' /tmp/ndn-second-recover.log >> "$GITHUB_STEP_SUMMARY" || true
          echo 'No Gemini or Groq credentials are provided. Only LIVE_VERIFIED proves a new published URL.' >> "$GITHUB_STEP_SUMMARY"
