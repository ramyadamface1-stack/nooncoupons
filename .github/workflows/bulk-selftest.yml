name: Bulk Quality Selftest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Repair stale Arabic coupon and Saudi path checks
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quality-audit.js')
          s=p.read_text()
          old_codes="const codes=[...new Set((plain.match(/\\bNOV\\d{3}\\b/gi)||[]).map(x=>x.toUpperCase()))],targetCode=String(topic?.code||article?.coupon||'').toUpperCase();"
          new_codes="const codes=[...new Set((plain.match(/\\b[A-Z]{2,8}\\d{1,6}\\b/g)||[]).map(x=>x.toUpperCase()))],targetCode=String(topic?.code||article?.coupon||'').toUpperCase();"
          old_path="addCheck(checks,'geo','market_internal_link',country==='SA'?/href=[\"']\\/saudi-arabia/i.test(html):/href=[\"']\\/uae/i.test(html),2);"
          new_path="addCheck(checks,'geo','market_internal_link',country==='SA'?/href=[\"']\\/saudi(?:[\"']|\\/)/i.test(html):/href=[\"']\\/uae(?:[\"']|\\/)/i.test(html),2);"
          if s.count(old_codes)!=1:
              raise SystemExit(f'expected one stale NOV coupon extractor, found {s.count(old_codes)}')
          if s.count(old_path)!=1:
              raise SystemExit(f'expected one stale Saudi path check, found {s.count(old_path)}')
          s=s.replace(old_codes,new_codes,1).replace(old_path,new_path,1)
          p.write_text(s)
          PY
      - name: Syntax checks
        run: |
          node --check quality-criteria.js
          node --check quality-audit.js
          node --check quality-index.js
          node --check coupon-registry.js
          node --check schema-validator.js
          node --check indexation-gate.js
          node --check editorial-trust-layer.js
          node --check bulk-content-engine.js
          node --check bulk-generator.js
          node --check bulk-selftest.js
      - name: Audit 40 diversified Arabic bulk samples
        shell: bash
        run: |
          set -o pipefail
          node bulk-selftest.js | tee /tmp/bulk-selftest.log
      - name: Re-verify 24 native English samples
        shell: bash
        run: |
          set -o pipefail
          node english-quality-selftest.mjs | tee /tmp/english-quality.log
      - name: Commit verified audit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quality-audit.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Arabic coupon and Saudi quality gates'
          git push origin HEAD:main
