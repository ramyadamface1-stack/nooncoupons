name: Bulk Quality Selftest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          node --check quality-criteria.js
          node --check quality-audit.js
          node --check quality-index.js
          node --check coupon-registry.js
          node --check schema-validator.js
          node --check bulk-content-engine.js
          node --check bulk-generator.js
          node --check bulk-selftest.js
          grep -Fq "global-quality-v1" bulk-generator.js
          grep -Fq "coupon_registry_stale" coupon-registry.js
          grep -Fq "global_semantic_collision" quality-index.js
          grep -Fq "contextual-links" quality-index.js
          grep -Fq "invalid_jsonld" schema-validator.js
          grep -Fq "bulk_auto_brake_engaged" bulk-generator.js
          grep -Fq "bulkSchemaGateVersion" bulk-generator.js
      - name: Audit 40 diversified bulk samples
        run: node bulk-selftest.js
