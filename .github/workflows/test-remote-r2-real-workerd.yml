name: Verify Old Worker with New R2 Replacement in Real Workerd
on:
  push:
    branches: [fix/remote-r2-existing-bucket-recovery-20261020]
    paths: ['.github/workflows/test-remote-r2-real-workerd.yml']
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEW_R2_ID: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
      NEW_R2_SECRET: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install same Worker code as production
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Run safe local Workerd with new remote R2, NO cron trigger and NO real Durable Object writes
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8799 --log-level error             --var "REMOTE_EXISTING_R2_ENABLED:true"             --var "NOON_RESCUE_R2_ACCESS_KEY_ID:$NEW_R2_ID"             --var "NOON_RESCUE_R2_SECRET_ACCESS_KEY:$NEW_R2_SECRET"             --var 'BULK_DAILY_TARGET:0' --var 'ENGLISH_DAILY_TARGET:0'             --var 'DO_MIGRATION_EXPORT_ENABLED:false' >/tmp/remote-workerd.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do if curl -fsS --max-time 2 http://127.0.0.1:8799/api/revision >/dev/null;then break;fi;sleep 2;done
          node --input-type=module <<'NODE'
          const root='http://127.0.0.1:8799';
          for(const p of ['/api/platform-health','/blog','/articles/شراء-الجوالات-من-نون-السعودية-باستخدام-كوبون-لشراء-ذكي','/sitemap-rescue-articles-0.xml']){
            const r=await fetch(root+p);
            const body=await r.text();
            console.log('REMOTE_R2_WORKER='+p+' HTTP='+r.status+' BYTES='+body.length+' IMAGES='+(body.match(/<img /g)||[]).length);
            if(r.status!==200)process.exitCode=1;
            if(p==='/api/platform-health'){
              let j;try{j=JSON.parse(body)}catch{j={}}
              console.log('REMOTE_R2_WORKER_HEALTH='+JSON.stringify({r2:j.r2,r2Ready:j.r2Ready,healthy:j.ok}));
              if(j.r2!==true)process.exitCode=1;
            }
            if(p==='/blog'&&!(body.match(/<img /g)||[]).length)process.exitCode=1;
            if(p.includes('/articles/')&&!body.includes('og:image'))process.exitCode=1;
            if(p.endsWith('.xml')&&!body.includes('<urlset'))process.exitCode=1;
          }
          NODE
          echo 'REAL_WORKER_REMOTE_EXISTING_R2_SMOKE_PASS=true'
