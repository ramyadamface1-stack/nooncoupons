name: Add Homepage Discovery Hub
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-home-discovery-hub.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Add strong internal discovery links
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site.js')
          s=p.read_text()
          if 'id="discovery-hub"' not in s:
              marker='function trustBar(){'
              block='''function discoveryHub(){return `<section id="discovery-hub" style="padding:38px 0;background:#f7f7fb"><div class="nc-wrap"><div class="nc-title"><div><h2>ابدأ من الصفحات الأكثر فائدة</h2><p>روابط مباشرة للأسواق وصفحات الشراء والأدلة التي تساعدك على الوصول للكود المناسب بسرعة.</p></div></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px"><a class="nc-code" href="/saudi-arabia"><b style="font-family:inherit;letter-spacing:0">🇸🇦 نون السعودية</b><span>الأكواد والصفحات الخاصة بالسعودية</span></a><a class="nc-code" href="/uae"><b style="font-family:inherit;letter-spacing:0">🇦🇪 نون الإمارات</b><span>الأكواد والصفحات الخاصة بالإمارات</span></a><a class="nc-code" href="/coupon/best-noon-coupon-today"><b style="font-family:inherit;letter-spacing:0">أفضل كود نون اليوم</b><span>طريقة اختيار الكود الأنسب للسلة</span></a><a class="nc-code" href="/coupon/noon-new-subscribers-2026"><b style="font-family:inherit;letter-spacing:0">الطلب الأول</b><span>دليل العملاء الجدد والأهلية</span></a><a class="nc-code" href="/coupon/noon-mobiles-coupon-2026"><b style="font-family:inherit;letter-spacing:0">الموبايلات</b><span>صفحة شراء للموبايلات والإلكترونيات</span></a><a class="nc-code" href="/coupon/noon-fashion-clothing-coupon"><b style="font-family:inherit;letter-spacing:0">الأزياء</b><span>كوبونات نون للأزياء والملابس</span></a><a class="nc-code" href="/coupon/noon-beauty-perfumes-coupon-2026"><b style="font-family:inherit;letter-spacing:0">الجمال والعطور</b><span>صفحة موجهة للجمال والعطور</span></a><a class="nc-code" href="/guide/how-to-use-noon-coupon"><b style="font-family:inherit;letter-spacing:0">طريقة استخدام الكود</b><span>خطوات النسخ والتجربة قبل الدفع</span></a><a class="nc-code" href="/guide/coupon-not-working"><b style="font-family:inherit;letter-spacing:0">الكود لا يعمل؟</b><span>تشخيص أسباب رفض الكوبون</span></a><a class="nc-code" href="/en/saudi"><b style="font-family:inherit;letter-spacing:0">English · Saudi</b><span>Saudi English buying guides</span></a><a class="nc-code" href="/en/uae"><b style="font-family:inherit;letter-spacing:0">English · UAE</b><span>UAE English buying guides</span></a></div></div></section>`}\n'''
              if marker not in s:
                  raise SystemExit('trustBar marker not found')
              s=s.replace(marker,block+marker,1)
          old="if(path==='/'&&!html.includes('id=\"all-current-codes\"'))html=html.replace('</body>',allCodes()+'</body>');"
          new="if(path==='/'&&!html.includes('id=\"discovery-hub\"'))html=html.replace('</body>',discoveryHub()+'</body>');if(path==='/'&&!html.includes('id=\"all-current-codes\"'))html=html.replace('</body>',allCodes()+'</body>');"
          if old in s:
              s=s.replace(old,new,1)
          elif 'discoveryHub()' not in s.split('async function enhance',1)[-1]:
              raise SystemExit('enhance insertion point not found')
          p.write_text(s)
          PY
          grep -F 'id="discovery-hub"' site.js
          grep -F "discoveryHub()" site.js
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site.js
          git commit -m 'Strengthen homepage discovery links'
          git push origin HEAD:main
