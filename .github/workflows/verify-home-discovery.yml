name: Verify Homepage Discovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-home-discovery.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production homepage discovery links
        run: |
          set -euo pipefail
          ORIGIN='https://noondealsnow.com'
          curl -fsSL --max-time 30 "$ORIGIN/" -o /tmp/home.html
          grep -Fq 'id="discovery-hub"' /tmp/home.html
          for path in \
            '/saudi-arabia' \
            '/uae' \
            '/coupon/best-noon-coupon-today' \
            '/coupon/noon-new-subscribers-2026' \
            '/coupon/noon-mobiles-coupon-2026' \
            '/coupon/noon-fashion-clothing-coupon' \
            '/coupon/noon-beauty-perfumes-coupon-2026' \
            '/guide/how-to-use-noon-coupon' \
            '/guide/coupon-not-working' \
            '/en/saudi' \
            '/en/uae'; do
            grep -Fq "href=\"$path\"" /tmp/home.html || { echo "Missing $path"; exit 1; }
          done
          echo 'Homepage discovery hub and all priority links are live.'
