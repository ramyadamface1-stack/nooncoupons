name: Fix UAE English Deploy Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-uae-deploy-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nooncoupons-uae-deploy-gate-fix
  cancel-in-progress: true

jobs:
  deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate current UAE English source
        shell: bash
        run: |
          set -euo pipefail
          node --check discovery-entry.js
          grep -Fq "if(path==='/uae'||path.startsWith('/uae/'))return 'AE'" discovery-entry.js
          grep -Fq "return sorted.filter(a=>a.country===market).slice(0,8)" discovery-entry.js
          grep -Fq "englishCanaryRecords(env)" discovery-entry.js
          grep -Fq "...(english||[])" discovery-entry.js
          grep -Fq "x-crawl-discovery-links','v2'" discovery-entry.js
          grep -Fq "x-discovery-market-mix','balanced-sa-ae-with-english'" discovery-entry.js
          grep -Fq "'/en/articles/'+enc(a.slug)" discovery-entry.js
          grep -Fq "sitemap-en-articles.xml" discovery-entry.js
          echo 'UAE_ENGLISH_SOURCE_GATE=PASS'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Validate dedicated Cloudflare token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
          ACCOUNT_ID: c82274152a942dea53044eae7153cfd7
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CF_TOKEN:-}" ] || { echo 'MISSING_CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1=1'; exit 10; }
          echo "::add-mask::$CF_TOKEN"
          code=$(curl -sS -o /tmp/cf-check.json -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/services/nooncoupons" || true)
          success=$(jq -r '.success // false' /tmp/cf-check.json 2>/dev/null || echo false)
          echo "CLOUDFLARE_TOKEN_HTTP=$code success=$success"
          [ "$code" = '200' ] && [ "$success" = 'true' ]
          echo "CLOUDFLARE_API_TOKEN=$CF_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy current worker source
        run: npx wrangler deploy

      - name: Verify canonical UAE English production
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://noondealsnow.com'
          token="uae-gate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          verify_get(){
            local path="$1" body="$2" headers="$3"
            local ok=0
            for i in $(seq 1 8); do
              code=$(curl -sS --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 40 -A 'Mozilla/5.0 nooncoupons-uae-live-gate' -D "$headers" -o "$body" -w '%{http_code}' "$ORIGIN$path?verify=$token-$i" || true)
              if [ "$code" = '200' ]; then ok=1; break; fi
              sleep 5
            done
            [ "$ok" = 1 ] || { echo "LIVE_ROUTE_FAILED path=$path"; exit 1; }
          }

          verify_get '/en/uae' /tmp/en-uae.html /tmp/en-uae.h
          grep -Fqi 'x-content-language: en' /tmp/en-uae.h
          grep -Fq 'data-schema="english-collection"' /tmp/en-uae.html
          grep -Fq 'hreflang="en-AE"' /tmp/en-uae.html
          grep -Fq 'hreflang="ar-AE"' /tmp/en-uae.html

          verify_get '/sitemap-priority.xml' /tmp/priority.xml /tmp/priority.h
          grep -Fq '/en/uae' /tmp/priority.xml
          grep -Fq '/en/articles/' /tmp/priority.xml
          grep -Fqi 'x-english-priority-count:' /tmp/priority.h

          verify_get '/sitemap-en-articles.xml' /tmp/en-sitemap.xml /tmp/en-sitemap.h
          grep -Fq '/en/articles/' /tmp/en-sitemap.xml

          verify_get '/robots.txt' /tmp/robots.txt /tmp/robots.h
          grep -Fq 'Sitemap: https://noondealsnow.com/sitemap-en-articles.xml' /tmp/robots.txt

          verify_get '/api/english-canary-health' /tmp/english-health.json /tmp/english-health.h
          jq -e '.ok==true and .controlled.targetMarket=="AE" and ((.controlled.ae // 0)|tonumber)>0 and ((.controlled.published // 0)|tonumber)>0' /tmp/english-health.json >/dev/null

          verify_get '/uae' /tmp/uae.html /tmp/uae.h
          grep -Fqi 'x-crawl-discovery-links: v2' /tmp/uae.h
          grep -Fqi 'x-discovery-market-mix: balanced-sa-ae-with-english' /tmp/uae.h
          grep -Fq 'id="crawl-discovery-links"' /tmp/uae.html
          grep -Fq '/en/articles/' /tmp/uae.html

          verify_get '/' /tmp/home.html /tmp/home.h
          grep -Fqi 'x-crawl-discovery-links: v2' /tmp/home.h
          grep -Fqi 'x-discovery-market-mix: balanced-sa-ae-with-english' /tmp/home.h
          grep -Fq '/en/articles/' /tmp/home.html
          grep -Fq '/articles/' /tmp/home.html

          echo "UAE_ENGLISH_CANONICAL_LIVE=$(jq -c '{ok,controlled:{published:.controlled.published,ae:.controlled.ae,sa:.controlled.sa,publishedToday:.controlled.publishedToday,target:.controlled.target,targetMarket:.controlled.targetMarket,batchSize:.controlled.batchSize},scheduler:{completedAt:.scheduler.completedAt,published:.scheduler.published,lastError:.scheduler.lastError}}' /tmp/english-health.json)"
          echo 'UAE_ENGLISH_DEPLOY_AND_CANONICAL_VERIFY=PASS'
