name: Fix UAE English Deploy Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-uae-deploy-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nooncoupons-uae-deploy-gate-fix
  cancel-in-progress: false

jobs:
  fix-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch stale deploy assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-live.yml')
          s=p.read_text()
          replacements={
              "grep -Fq 'discoveryLinkCount:12' discovery-entry.js":"grep -Fq 'discoveryLinkCount:8' discovery-entry.js",
              "grep -Fqi 'x-crawl-discovery-links: v1' /tmp/mh":"grep -Fqi 'x-crawl-discovery-links: v2' /tmp/mh",
          }
          for old,new in replacements.items():
              count=s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one stale assertion: {old!r}; found={count}')
              s=s.replace(old,new)
          p.write_text(s)
          d=Path('discovery-entry.js').read_text()
          required=[
              "x-crawl-discovery-links','v2'",
              "x-discovery-market-mix','balanced-sa-ae-with-english'",
              "return sorted.filter(a=>a.country===market).slice(0,8)",
              "...(english||[])"
          ]
          missing=[x for x in required if x not in d]
          if missing:
              raise SystemExit('discovery source does not match intended UAE mix: '+repr(missing))
          print('UAE_DEPLOY_GATE_PATCH=PASS')
          PY
          git diff --check
          grep -Fq "discoveryLinkCount:8" .github/workflows/deploy-live.yml
          grep -Fq "x-crawl-discovery-links: v2" .github/workflows/deploy-live.yml
          if grep -Fq "discoveryLinkCount:12" .github/workflows/deploy-live.yml; then exit 1; fi
          if grep -Fq "x-crawl-discovery-links: v1" .github/workflows/deploy-live.yml; then exit 1; fi

      - name: Commit repaired deploy gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-live.yml
          if git diff --cached --quiet; then
            echo 'DEPLOY_GATE_ALREADY_CURRENT=1'
          else
            git commit -m 'Align deploy gate with UAE English discovery v2 [skip ci]'
            git push origin HEAD:main
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Validate dedicated Cloudflare token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
          ACCOUNT_ID: c82274152a942dea53044eae7153cfd7
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CF_TOKEN:-}" ] || { echo 'MISSING_CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1=1'; exit 10; }
          echo "::add-mask::$CF_TOKEN"
          code=$(curl -sS -o /tmp/cf-check.json -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/services/nooncoupons" || true)
          success=$(jq -r '.success // false' /tmp/cf-check.json 2>/dev/null || echo false)
          [ "$code" = '200' ] && [ "$success" = 'true' ]
          echo "CLOUDFLARE_API_TOKEN=$CF_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy repaired UAE discovery runtime
        run: npx wrangler deploy

      - name: Verify canonical UAE English production
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://noondealsnow.com'
          token="uae-gate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsS --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 10 --max-time 40 "$ORIGIN/en/uae?verify=$token" -D /tmp/en-uae.h -o /tmp/en-uae.html
          grep -Fqi 'x-content-language: en' /tmp/en-uae.h
          grep -Fq 'data-schema="english-collection"' /tmp/en-uae.html
          grep -Fq 'hreflang="en-AE"' /tmp/en-uae.html
          grep -Fq 'hreflang="ar-AE"' /tmp/en-uae.html

          curl -fsS --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 10 --max-time 40 "$ORIGIN/sitemap-priority.xml?verify=$token" -D /tmp/priority.h -o /tmp/priority.xml
          grep -Fq '/en/uae' /tmp/priority.xml
          grep -Fq '/en/articles/' /tmp/priority.xml
          grep -Fqi 'x-english-priority-count:' /tmp/priority.h

          curl -fsS --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 10 --max-time 40 "$ORIGIN/sitemap-en-articles.xml?verify=$token" -o /tmp/en-sitemap.xml
          grep -Fq '/en/articles/' /tmp/en-sitemap.xml

          curl -fsS --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 10 --max-time 40 "$ORIGIN/robots.txt?verify=$token" -o /tmp/robots.txt
          grep -Fq 'Sitemap: https://noondealsnow.com/sitemap-en-articles.xml' /tmp/robots.txt

          curl -fsS --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 10 --max-time 40 "$ORIGIN/api/english-canary-health?verify=$token" -o /tmp/english-health.json
          jq -e '.ok==true and .controlled.targetMarket=="AE" and ((.controlled.ae // 0)|tonumber)>0 and ((.controlled.published // 0)|tonumber)>0' /tmp/english-health.json >/dev/null

          curl -fsS --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 10 --max-time 40 "$ORIGIN/uae?verify=$token" -D /tmp/uae.h -o /tmp/uae.html
          grep -Fqi 'x-crawl-discovery-links: v2' /tmp/uae.h
          grep -Fqi 'x-discovery-market-mix: balanced-sa-ae-with-english' /tmp/uae.h
          grep -Fq 'id="crawl-discovery-links"' /tmp/uae.html
          grep -Fq '/en/articles/' /tmp/uae.html

          curl -fsS --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 10 --max-time 40 "$ORIGIN/?verify=$token" -D /tmp/home.h -o /tmp/home.html
          grep -Fqi 'x-crawl-discovery-links: v2' /tmp/home.h
          grep -Fqi 'x-discovery-market-mix: balanced-sa-ae-with-english' /tmp/home.h
          grep -Fq '/en/articles/' /tmp/home.html
          grep -Fq '/articles/' /tmp/home.html

          echo "UAE_ENGLISH_CANONICAL_LIVE=$(jq -c '{ok,controlled:{published:.controlled.published,ae:.controlled.ae,sa:.controlled.sa,publishedToday:.controlled.publishedToday,target:.controlled.target,targetMarket:.controlled.targetMarket,batchSize:.controlled.batchSize}}' /tmp/english-health.json)"
          echo 'UAE_ENGLISH_DEPLOY_GATE_AND_CANONICAL_VERIFY=PASS'
