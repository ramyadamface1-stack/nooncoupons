name: Verify Recovered English Canary Contract in Actual Workerd
on:
  push:
    branches: [fix/oct21-live-canary-publishing-diagnostics]
    paths:
      - 'r2-emergency-readonly.js'
      - '.github/workflows/oct21-test-canary-r2-rescue.yml'
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      R2_KEY: ${{ secrets.NOON_NEW_R2_ACCESS_KEY_ID }}
      R2_SECRET: ${{ secrets.NOON_NEW_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate Worker build and semantics without touching production
        shell: bash
        run: |
          set -euo pipefail
          node --check r2-emergency-readonly.js
          npm install --no-audit --no-fund --ignore-scripts
          npx wrangler deploy --dry-run --outdir /tmp/r2-english-recovery-build
      - name: Confirm both genuine baseline articles from NEW R2 in real Workerd
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8796 --log-level error \
            --var "NOON_RESCUE_R2_ACCESS_KEY_ID:$R2_KEY" \
            --var "NOON_RESCUE_R2_SECRET_ACCESS_KEY:$R2_SECRET" >/tmp/canary-workerd.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for n in {1..32};do if curl -fsS --max-time 3 http://127.0.0.1:8796/api/revision -o /dev/null;then break;fi;sleep 2;done
          node --input-type=module <<'NODE'
          const origin='http://127.0.0.1:8796';
          const canonical='https://noondealsnow.com';
          for(const slug of ['en-skincare-noon-uae-shopping-guide-coupon-today','en-noon-coupon-dubai']){
            const path='/en/articles/'+slug,resp=await fetch(origin+path),body=await resp.text();
            const checks={
              status:resp.status===200,
              enHeader:resp.headers.get('content-language')==='en',
              canaryHeader:resp.headers.get('x-english-canary')==='v1',
              rescue:resp.headers.get('x-r2-rescue')==='new-account-readonly-v1',
              htmlLang:body.includes('<html lang="en-AE" dir="ltr">'),
              canonical:body.includes('<link rel="canonical" href="'+canonical+path+'">'),
              englishAlternate:body.includes('hreflang="en-AE" href="'+canonical+path+'"'),
              arabicAlternate:body.includes('hreflang="ar-AE" href="'+canonical+'/uae"'),
              defaultAlternate:body.includes('hreflang="x-default" href="'+canonical+path+'"'),
              copyCode:body.includes('data-copy-code='),
              cta:body.includes('Copy '),
              noon:body.includes('href="https://www.noon.com/'),
              meta:body.includes('name="description"'),
              cover:body.includes('<img'),
              schema:body.includes('application/ld+json')
            };
            console.log('EN_CANARY_RECOVERED='+slug+' '+JSON.stringify(checks));
            if(Object.values(checks).some(x=>!x))process.exitCode=1;
          }
          NODE
