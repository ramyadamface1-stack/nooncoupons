name: Deploy Live Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nooncoupons-production-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Validate worker source
        run: |
          set -euo pipefail
          for f in discovery-entry.js brand-runtime.js network-entry.js commerce-entry.js public-entry.js premium-entry.js auto-platform.js final-platform.js visual-platform.js platform.js seo-layer.js site.js router.js index.js commerce-pages-v2.js commerce-taxonomy.js svg-engine.js approved-coupons.js admin-page.js english-canary.js indexnow.js article-quality-runtime.js article-corpus-audit.js article-audit-lock.js coupon-r2-migration.js; do node --check "$f"; done
          grep -Fq '"main": "discovery-entry.js"' wrangler.jsonc
          grep -Fq '"BULK_DAILY_TARGET": "40000"' wrangler.jsonc
          grep -Fq '"BULK_BATCH_SIZE": "48"' wrangler.jsonc
          grep -Fq '"BULK_CATCHUP_TOTAL": "30000"' wrangler.jsonc
          grep -Fq '"BULK_CATCHUP_BATCH_SIZE": "64"' wrangler.jsonc
          grep -Fq '"BULK_CATCHUP_MIN_BATCH_SIZE": "32"' wrangler.jsonc
          grep -Fq '"BULK_CATCHUP_TARGET_BATCH_MS": "52000"' wrangler.jsonc
          grep -Fq '"BULK_CANDIDATE_BUDGET_MS": "45000"' wrangler.jsonc
          grep -Fq '"BULK_CATCHUP_WINDOW_HOURS": "8"' wrangler.jsonc
          grep -Fq "MAX_DAILY_TARGET=40000" bulk-generator.js
          grep -Fq "MAX_BATCH_SIZE=64" bulk-generator.js
          grep -Fq "qualityThresholdFloor:95" bulk-generator.js
          grep -Fq "capacityMeetsEightHourGoal" auto-platform.js
          grep -Fq "'NOV170','NOV188','NOV174','NOV157','NOV177','NOV186','NOV163','NOV153','NOV195','NOV161'" approved-coupons.js
          node scripts/coupon-code-gate.mjs
          grep -Fq "mode:'independent-full-r2-read-v1'" coupon-r2-migration.js
          grep -Fq "source:'r2-direct-read'" coupon-r2-migration.js
          grep -Fq 'for i in $(seq 1 800)' .github/workflows/deploy-live.yml
          grep -Fq "processAuditKeys(env,keys,100)" coupon-r2-migration.js
          if grep -Fq "full-repair-scan-proof" coupon-r2-migration.js; then echo 'R2_AUDIT_SHORTCUT_PRESENT=1'; exit 1; fi
          grep -Fq "const CODES=APPROVED_COUPON_CODES" router.js
          grep -Fq "const CODES=APPROVED_COUPON_CODES" site.js
          grep -Fq "const CODES=APPROVED_COUPON_CODES" seo-layer.js
          grep -Fq "data-schema=\"country-coupon\"" seo-layer.js
