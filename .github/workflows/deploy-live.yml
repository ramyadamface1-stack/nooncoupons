          echo "UAE_ENGLISH_RUNTIME_LIVE=$(jq -c '{ok,controlled:{target:.controlled.target,published:.controlled.published,remaining:.controlled.remaining,publishedToday:.controlled.publishedToday,dailyTarget:.controlled.dailyTarget,batchSize:.controlled.batchSize,targetMarket:.controlled.targetMarket,marketPolicy:.controlled.marketPolicy,sa:.controlled.sa,ae:.controlled.ae}}' /tmp/english-health.json)"
      - name: Prove direct UAE English batch can publish
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://nooncoupons.ramychatgptgcoupons.workers.dev'
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS --connect-timeout 10 --max-time 30 "$ORIGIN/api/english-canary-health?direct-before=$GITHUB_SHA" -o /tmp/en-direct-before.json
          before_ae="$(jq -r '(.controlled.ae//0)|tonumber' /tmp/en-direct-before.json)"
          moved=0
          for i in $(seq 1 4); do
            if curl -fsS --connect-timeout 10 --max-time 32 -H "$AUTH" -H 'Content-Type: application/json' -X POST --data '{"limit":1,"timeBudgetMs":22000,"ignoreInterval":true}' "$ORIGIN/api/internal/english-batch-step?direct=$GITHUB_SHA-$i" -o /tmp/en-direct.json; then
              cat /tmp/en-direct.json
              curl -fsS --connect-timeout 10 --max-time 30 "$ORIGIN/api/english-canary-health?direct=$GITHUB_SHA-$i" -o /tmp/en-direct-health.json
              after_ae="$(jq -r '(.controlled.ae//0)|tonumber' /tmp/en-direct-health.json)"
              if [ "$after_ae" -gt "$before_ae" ]; then moved=1; break; fi
            fi
            sleep 2
          done
          [ "$moved" = 1 ] || { echo 'UAE_ENGLISH_DIRECT_BATCH_DID_NOT_MOVE'; cat /tmp/en-direct.json 2>/dev/null || true; exit 1; }
          jq -e '.ok==true and .controlled.targetMarket=="AE"' /tmp/en-direct-health.json >/dev/null
      - name: Prove UAE English publishing moves
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://nooncoupons.ramychatgptgcoupons.workers.dev'
          curl -fsS --connect-timeout 10 --max-time 30 "$ORIGIN/api/english-canary-health?before=$GITHUB_SHA" -o /tmp/en-before.json
          before="$(jq -r '.controlled.published|tonumber' /tmp/en-before.json)"
          before_ae="$(jq -r '.controlled.ae|tonumber' /tmp/en-before.json)"
          before_sched="$(jq -r '.scheduler.completedAt // ""' /tmp/en-before.json)"
          moved=false
          for i in $(seq 1 7); do
            sleep 30
            curl -fsS --connect-timeout 10 --max-time 30 "$ORIGIN/api/english-canary-health?movement=$GITHUB_SHA-$i" -o /tmp/en-after.json
            after="$(jq -r '.controlled.published|tonumber' /tmp/en-after.json)"
            after_ae="$(jq -r '.controlled.ae|tonumber' /tmp/en-after.json)"
            after_sched="$(jq -r '.scheduler.completedAt // ""' /tmp/en-after.json)"
            sched_published="$(jq -r '.scheduler.published // 0' /tmp/en-after.json)"
            echo "UAE_ENGLISH_MOVEMENT step=$i before=$before after=$after beforeAE=$before_ae afterAE=$after_ae schedulerPublished=$sched_published"
            if [ "$after" -gt "$before" ] && [ "$after_ae" -gt "$before_ae" ] && [ "$after_sched" != "$before_sched" ]; then moved=true; break; fi
          done
          [ "$moved" = true ]
          jq -e '.lastError==null and .controlled.targetMarket=="AE" and .auditLock.active==false' /tmp/en-after.json >/dev/null
      - name: Complete and audit R2 coupon migration
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://nooncoupons.ramychatgptgcoupons.workers.dev'
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          migration_done=false
          transient_failures=0
          for i in $(seq 1 320); do
            if ! curl -fsS --connect-timeout 10 --max-time 120 --retry 2 --retry-all-errors --retry-delay 2 \
              -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              --data '{"limit":500}' \
              "$ORIGIN/api/internal/coupon-migration-step?run=$GITHUB_SHA-$i" -o /tmp/migration-step.json; then
              transient_failures=$((transient_failures+1))
              echo "R2_COUPON_MIGRATION_TRANSIENT_FAILURE step=$i count=$transient_failures"
              sleep 8
              continue
            fi
            transient_failures=0
            ok="$(jq -r '.ok // false' /tmp/migration-step.json)"
            done="$(jq -r '.done // false' /tmp/migration-step.json)"
            scanned="$(jq -r '.scanned // 0' /tmp/migration-step.json)"
            updated="$(jq -r '.updated // 0' /tmp/migration-step.json)"
            replaced="$(jq -r '.replaced // 0' /tmp/migration-step.json)"
            failed_keys="$(jq -r '(.failedKeys // []) | length' /tmp/migration-step.json)"
            echo "R2_COUPON_MIGRATION_PROGRESS step=$i scanned=$scanned updated=$updated replaced=$replaced failedKeys=$failed_keys done=$done"
            [ "$ok" = true ] || { cat /tmp/migration-step.json; exit 1; }
            if [ "$done" = true ]; then migration_done=true; break; fi
            sleep 1
          done
          [ "$migration_done" = true ] || { echo 'R2_COUPON_MIGRATION_NOT_COMPLETE'; exit 1; }

          audit_done=false
          transient_failures=0
          for i in $(seq 1 800); do
            if [ "$i" = "1" ]; then
              audit_payload="$(jq -cn --arg run "$GITHUB_SHA" '{limit:500,reset:true,runId:$run}')"
            else
              audit_payload="$(jq -cn --arg run "$GITHUB_SHA" '{limit:500,runId:$run}')"
            fi
            if ! curl -fsS --connect-timeout 10 --max-time 60 --retry 1 --retry-all-errors --retry-delay 2 \
              -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              --data "$audit_payload" \
              "$ORIGIN/api/internal/coupon-r2-audit-step?run=$GITHUB_SHA-$i" -o /tmp/r2-audit-step.json; then
              transient_failures=$((transient_failures+1))
              echo "R2_COUPON_AUDIT_TRANSIENT_FAILURE step=$i count=$transient_failures"
              sleep 5
              continue
            fi
            transient_failures=0
            ok="$(jq -r '.ok // false' /tmp/r2-audit-step.json)"
            done="$(jq -r '.done // false' /tmp/r2-audit-step.json)"
            scanned="$(jq -r '.scanned // 0' /tmp/r2-audit-step.json)"
            invalid_files="$(jq -r '.invalidFiles // 0' /tmp/r2-audit-step.json)"
            invalid_tokens="$(jq -r '.invalidTokens // 0' /tmp/r2-audit-step.json)"
            failed_keys="$(jq -r '(.failedKeys // []) | length' /tmp/r2-audit-step.json)"
            echo "R2_COUPON_AUDIT_PROGRESS step=$i scanned=$scanned invalidFiles=$invalid_files invalidTokens=$invalid_tokens failedKeys=$failed_keys done=$done"
            [ "$ok" = true ] || { cat /tmp/r2-audit-step.json; exit 1; }
            if [ "$done" = true ]; then audit_done=true; break; fi
            sleep 0.1
          done
          [ "$audit_done" = true ] || { echo 'R2_COUPON_AUDIT_NOT_COMPLETE'; exit 1; }

          curl -fsS "$ORIGIN/api/coupon-migration-health?verify=$GITHUB_SHA" -o /tmp/migration-final.json
          curl -fsS "$ORIGIN/api/coupon-r2-audit-health?verify=$GITHUB_SHA" -o /tmp/r2-audit-final.json
          jq -e '.ok==true and .done==true' /tmp/migration-final.json >/dev/null
          jq -e --arg run "$GITHUB_SHA" '.ok==true and .version==5 and .mode=="independent-full-r2-read-v1" and .source=="r2-direct-read" and .runId==$run and .done==true and .scanDone==true and ((.failedKeys//[])|length)==0 and (.invalidFiles|tonumber)==0 and (.invalidTokens|tonumber)==0 and (.scanned|tonumber)>0' /tmp/r2-audit-final.json >/dev/null
          echo "R2_COUPON_MIGRATION_FINAL=$(jq -c '{scanned,updated,replaced,done,completedAt}' /tmp/migration-final.json)"
          echo "R2_COUPON_AUDIT_FINAL=$(jq -c '{version,mode,source,runId,scanned,invalidFiles,invalidTokens,failedKeys,done,completedAt}' /tmp/r2-audit-final.json)"
