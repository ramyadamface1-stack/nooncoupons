name: Deploy Live Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nooncoupons-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Validate worker source
        run: |
          set -euo pipefail
          node --check discovery-entry.js
          node --check brand-runtime.js
          node --check network-entry.js
          node --check commerce-entry.js
          node --check admin-page.js
          grep -Fq '"main": "discovery-entry.js"' wrangler.jsonc
          grep -Fq '"BULK_DAILY_TARGET": "15000"' wrangler.jsonc
          grep -Fq '"BULK_BATCH_SIZE": "16"' wrangler.jsonc
          grep -Fq '/sitemap-priority.xml' discovery-entry.js
          grep -Fq 'recentArticleLimit:500' discovery-entry.js
          grep -Fq 'discoveryLinks:true' discovery-entry.js
          grep -Fq 'discoveryLinkCount:12' discovery-entry.js
          grep -Fq 'robotsPrioritySitemap:true' discovery-entry.js
          grep -Fq "R2_COUNT_SNAPSHOT_KEY='_ops/article-count.json'" commerce-entry.js
          grep -Fq "setInterval(()=>refreshMetrics(false).catch(()=>{}),60000)" admin-page.js
          grep -Fq "refreshCountBtn" admin-page.js
          grep -Fq "/api/admin/live-overview" commerce-entry.js
      - name: Validate dedicated Cloudflare token
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
          ACCOUNT_ID: c82274152a942dea53044eae7153cfd7
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CF_TOKEN:-}" ] || { echo 'MISSING_CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1=1'; exit 10; }
          echo "::add-mask::$CF_TOKEN"
          code=$(curl -sS -o /tmp/cf-check.json -w '%{http_code}' \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/services/nooncoupons" || true)
          success=$(jq -r '.success // false' /tmp/cf-check.json 2>/dev/null || echo false)
          echo "DEDICATED_TOKEN_WORKERS_SERVICE_HTTP=$code"
          echo "DEDICATED_TOKEN_WORKERS_SERVICE_ACCESS=$success"
          if [ "$code" != '200' ] || [ "$success" != 'true' ]; then
            jq -c '{success,errors}' /tmp/cf-check.json 2>/dev/null || cat /tmp/cf-check.json || true
            echo 'DEDICATED_TOKEN_LACKS_WORKERS_SERVICE_ACCESS=1'
            exit 10
          fi
          echo "CLOUDFLARE_API_TOKEN=$CF_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "DEDICATED_TOKEN_VALID=1"
      - name: Deploy existing worker
        run: npx wrangler deploy
      - name: Verify deployed runtime and SEO layer
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_ORIGIN='https://nooncoupons.ramychatgptgcoupons.workers.dev'
          CANONICAL_ORIGIN='https://noondealsnow.com'
          ready=0
          for i in $(seq 1 8); do
            curl -fsS --connect-timeout 10 --max-time 30 "$RUNTIME_ORIGIN/api/generator-health?deploy=$GITHUB_SHA-$i" -o /tmp/g.json || true
            curl -fsS --connect-timeout 10 --max-time 60 "$RUNTIME_ORIGIN/api/content-stats?deploy=$GITHUB_SHA-$i" -o /tmp/s.json || true
            if python -c "import json; g=json.load(open('/tmp/g.json')); s=json.load(open('/tmp/s.json')); b=g.get('bulk',{}); rc=s.get('r2Count',{}); assert int(b.get('dailyTarget') or 0)==15000; assert int(b.get('batchSize') or 0)==16; assert int(s.get('dailyTargetArabic') or 0)==15000; assert s.get('r2Uploaded') is not None; assert rc.get('snapshotKey')=='_ops/article-count.json'; assert int(rc.get('ttlSeconds') or 0)==300" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          [ "$ready" = 1 ] || { echo 'LIVE_RUNTIME_DID_NOT_MATCH_DEPLOYED_CONFIG'; exit 1; }

          curl -fsS "$RUNTIME_ORIGIN/favicon.svg?deploy=$GITHUB_SHA" -D /tmp/fh -o /tmp/favicon.svg
          grep -Fqi 'content-type: image/svg+xml' /tmp/fh
          grep -Fq '<svg' /tmp/favicon.svg

          curl -fsS "$RUNTIME_ORIGIN/sitemap.xml?deploy=$GITHUB_SHA" -D /tmp/sh -o /tmp/sitemap.xml
          grep -Fq '/sitemap-priority.xml' /tmp/sitemap.xml
          grep -Fqi 'x-priority-sitemap-discovery: v1' /tmp/sh
          curl -fsS "$RUNTIME_ORIGIN/sitemap-priority.xml?deploy=$GITHUB_SHA" -D /tmp/ph -o /tmp/priority.xml
          grep -Fqi 'x-priority-sitemap: v1' /tmp/ph
          grep -Fq '/saudi-arabia/noon-coupon-code' /tmp/priority.xml
          grep -Fq '/uae/noon-coupon-code' /tmp/priority.xml
          grep -Fq '/articles/' /tmp/priority.xml

          curl -fsS "$RUNTIME_ORIGIN/robots.txt?deploy=$GITHUB_SHA" -D /tmp/rh -o /tmp/robots.txt
          grep -Fqi 'x-priority-sitemap-robots: v1' /tmp/rh
          grep -Fq 'Sitemap: https://noondealsnow.com/sitemap.xml' /tmp/robots.txt
          grep -Fq 'Sitemap: https://noondealsnow.com/sitemap-priority.xml' /tmp/robots.txt

          curl -fsS "$RUNTIME_ORIGIN/saudi-arabia/noon-coupon-code?deploy=$GITHUB_SHA" -D /tmp/mh -o /tmp/money.html
          grep -Fqi 'x-crawl-discovery-links: v1' /tmp/mh
          grep -Fq 'id="crawl-discovery-links"' /tmp/money.html
          grep -Fq '/articles/' /tmp/money.html

          ARTICLE_PATH="$(python -c "import json,urllib.parse; s=json.load(open('/tmp/s.json')); slug=(s.get('last') or {}).get('slug'); print('/articles/'+urllib.parse.quote(slug,safe='') if slug else '')")"
          if [ -z "$ARTICLE_PATH" ]; then
            ARTICLE_URL="$(grep -Eo 'https://noondealsnow.com/articles/[^<]+' /tmp/priority.xml | head -n1 || true)"
            [ -n "$ARTICLE_URL" ] || { echo 'NO_ARTICLE_URL_FOR_LIVE_VERIFY'; exit 1; }
            ARTICLE_PATH="${ARTICLE_URL#https://noondealsnow.com}"
          fi

          curl -fsS --retry 2 "$RUNTIME_ORIGIN$ARTICLE_PATH?deploy=$GITHUB_SHA" -D /tmp/h -o /tmp/a.html
          grep -Fqi 'x-brand-layer: v1' /tmp/h
          grep -Fqi 'x-article-network: v1' /tmp/h
          grep -Fqi 'x-external-link-safety: merged-v2' /tmp/h
          grep -Fqi 'x-related-manifest-cache: 120s-isolate' /tmp/h
          grep -Fq 'id="article-link-network"' /tmp/a.html
          grep -Fq 'اقرأ أيضًا قبل الشراء' /tmp/a.html
          grep -Fq 'href="/favicon.svg"' /tmp/a.html
          python - <<'PY'
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.missing=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=='img':
                      d=dict(attrs)
                      if not (d.get('alt') or '').strip(): self.missing.append(d)
          p=P(); p.feed(open('/tmp/a.html',encoding='utf-8').read())
          assert not p.missing, f'missing alt on {len(p.missing)} images'
          PY

          # One light canonical-domain probe only; no tight retry loop that can trigger 429/1027.
          canonical_code=$(curl -sS -A 'Mozilla/5.0 nooncoupons-deploy-check' --connect-timeout 10 --max-time 20 -o /tmp/canonical.html -w '%{http_code}' "$CANONICAL_ORIGIN/?deploy=$GITHUB_SHA" || true)
          echo "CANONICAL_HTTP=$canonical_code"
          case "$canonical_code" in
            200|301|302|304) ;;
            429) echo 'CANONICAL_RATE_LIMITED_BUT_WORKERS_DEV_RUNTIME_VERIFIED=1' ;;
            *) echo "CANONICAL_PROBE_FAILED=$canonical_code"; exit 1 ;;
          esac

          echo "PRODUCTION_RUNTIME_VERIFIED=1"
