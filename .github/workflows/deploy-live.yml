          if [ "$code" != '200' ] || [ "$success" != 'true' ]; then
            jq -c '{success,errors}' /tmp/cf-check.json 2>/dev/null || cat /tmp/cf-check.json || true
            echo 'DEDICATED_TOKEN_LACKS_WORKERS_SERVICE_ACCESS=1'
