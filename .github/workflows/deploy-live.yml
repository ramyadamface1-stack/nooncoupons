              cat /tmp/english-health.json
              if jq -e '.ok==true and (.controlled.target|tonumber)==50000 and (.controlled.published|tonumber)>0 and (.controlled.dailyTarget|tonumber)==34560 and (.controlled.minIntervalMinutes|tonumber)==1 and (.controlled.batchSize|tonumber)==24 and .controlled.targetMarket=="AE" and .controlled.marketPolicy=="uae-only-new-v6-batch24"' /tmp/english-health.json >/dev/null; then
