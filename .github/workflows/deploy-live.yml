name: Deploy Live Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nooncoupons-production-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Validate worker source
        run: |
          set -euo pipefail
          for f in discovery-entry.js brand-runtime.js network-entry.js commerce-entry.js public-entry.js premium-entry.js auto-platform.js final-platform.js visual-platform.js platform.js seo-layer.js site.js router.js index.js commerce-pages-v2.js commerce-taxonomy.js svg-engine.js approved-coupons.js admin-page.js english-canary.js indexnow.js; do node --check "$f"; done
          grep -Fq '"main": "discovery-entry.js"' wrangler.jsonc
          grep -Fq '"BULK_DAILY_TARGET": "32000"' wrangler.jsonc
          grep -Fq '"BULK_BATCH_SIZE": "16"' wrangler.jsonc
          grep -Fq '"BULK_CATCHUP_TOTAL": "30000"' wrangler.jsonc
          grep -Fq '"BULK_CATCHUP_BATCH_SIZE": "48"' wrangler.jsonc
          grep -Fq '"BULK_CATCHUP_WINDOW_HOURS": "8"' wrangler.jsonc
          grep -Fq "MAX_DAILY_TARGET=40000" bulk-generator.js
          grep -Fq "MAX_BATCH_SIZE=48" bulk-generator.js
          grep -Fq "qualityThresholdFloor:95" bulk-generator.js
          grep -Fq "capacityMeetsEightHourGoal" auto-platform.js
          grep -Fq "'NOV170','NOV188','NOV174','NOV157','NOV177','NOV186','NOV163','NOV153','NOV195','NOV161'" approved-coupons.js
          node scripts/coupon-code-gate.mjs
          grep -Fq "const CODES=APPROVED_COUPON_CODES" router.js
          grep -Fq "const CODES=APPROVED_COUPON_CODES" site.js
          grep -Fq "const CODES=APPROVED_COUPON_CODES" seo-layer.js
          grep -Fq "data-schema=\"country-coupon\"" seo-layer.js
          if grep -Fq 'عرض 16 بطاقة' site.js; then echo 'STALE_COUPON_CARD_COUNT=1'; exit 1; fi
          grep -Fq "const CODES = APPROVED_COUPON_CODES" commerce-pages-v2.js
          grep -Fq "categoryAlternates" commerce-pages-v2.js
          grep -Fq "hreflang=\"ar-SA\"" commerce-pages-v2.js
          grep -Fq 'data-schema="english-collection"' commerce-pages-v2.js
          grep -Fq 'data-english-eeat="v1"' commerce-pages-v2.js
          grep -Fq '${CODES.length} أكواد معتمدة فقط' commerce-pages-v2.js
          if grep -Fq '8 أكواد معتمدة فقط' commerce-pages-v2.js; then echo 'STALE_APPROVED_COUPON_COUNT=1'; exit 1; fi
          grep -Fq 'controlled native-English expansion' final-platform.js
          grep -Fq '/sitemap-en-articles.xml' final-platform.js
          grep -Fq "privateNoindex" brand-runtime.js
          grep -Fq "Disallow: /admin" brand-runtime.js
          grep -Fq "Disallow: /api/" brand-runtime.js
          grep -Fq "indexNowKeyFile" brand-runtime.js
          grep -Fq "legacyCanonicalRedirect" brand-runtime.js
          grep -Fq '"INDEXNOW_ENABLED": "true"' wrangler.jsonc
          grep -Fq '"INDEXNOW_KEY": "' wrangler.jsonc
          grep -Fq "urlPathAware:true" indexnow.js
          grep -Fq "indexNowOnPublish:true" english-canary.js
          grep -Fq "richArticleSchema:true" english-canary.js
          grep -Fq "visibleEditorialByline:true" english-canary.js
          grep -Fq 'data-english-author="editorial-team"' english-canary.js
          grep -Fq "const indexNow=await submitIndexNow(env,[record])" english-canary.js
          grep -Fq "ProfilePage" site.js
          grep -Fq 'editorial-team-profile' site.js
          grep -Fq 'Noon Deals Now Editorial Team' site.js
          grep -Fq "rssEnglish(origin,env)" final-platform.js
          grep -Fq "/feed-en.xml" final-platform.js
          grep -Fq "owner-approved-nov-v1-strict-copy" coupon-registry.js
          grep -Fq '/sitemap-priority.xml' discovery-entry.js
          grep -Fq 'recentArticleLimit:500' discovery-entry.js
          grep -Fq 'discoveryLinks:true' discovery-entry.js
          grep -Fq 'discoveryLinkCount:12' discovery-entry.js
          grep -Fq 'robotsPrioritySitemap:true' discovery-entry.js
          grep -Fq 'englishPriorityDiscovery:true' discovery-entry.js
          grep -Fq 'englishPriorityArticleLimit:200' discovery-entry.js
          grep -Fq 'englishCategoryEvidenceMin:3' discovery-entry.js
          grep -Fq "R2_COUNT_SNAPSHOT_KEY='_ops/article-count.json'" commerce-entry.js
          grep -Fq "setInterval(()=>refreshMetrics(false).catch(()=>{}),60000)" admin-page.js
          grep -Fq "refreshCountBtn" admin-page.js
          grep -Fq "/api/admin/live-overview" commerce-entry.js
          grep -Fq "normalizeArticleHeadingDensity" auto-platform.js
          grep -Fq 'data-schema="blog-collection"' auto-platform.js
          grep -Fq "x-blog-schema':'collection-v1'" auto-platform.js
          grep -Fq "RESEARCH_UPDATED_AT='2026-09-18'" router.js
          grep -Fq "RESEARCH_DATA_VERSION='2026-09-18.v1'" router.js
          grep -Fq '${CODES.length} أكواد' router.js
          if grep -Fq '10 أكواد' router.js; then echo 'HARDCODED_COUPON_COUNT_ROUTER=1'; exit 1; fi
          if grep -Fq 'الأكواد العشرة' router.js; then echo 'HARDCODED_COUPON_WORD_COUNT_ROUTER=1'; exit 1; fi
          grep -Fq "h2_structure" workers-ai-generator.js
          grep -Fq "h2Count>=6&&h2Count<=10" generator-core-v2.js
          grep -Fq "R2_GENERATOR_STATUS_KEY='_ops/generator-status.json'" admin-runtime.js
          grep -Fq "backend:'r2-v1'" admin-runtime.js
          grep -Fq "ctx.waitUntil(bulkTick(env))" auto-platform.js
      - name: Validate dedicated Cloudflare token
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
          ACCOUNT_ID: c82274152a942dea53044eae7153cfd7
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CF_TOKEN:-}" ] || { echo 'MISSING_CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1=1'; exit 10; }
          echo "::add-mask::$CF_TOKEN"
          code=$(curl -sS -o /tmp/cf-check.json -w '%{http_code}' \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/services/nooncoupons" || true)
          success=$(jq -r '.success // false' /tmp/cf-check.json 2>/dev/null || echo false)
          echo "DEDICATED_TOKEN_WORKERS_SERVICE_HTTP=$code"
          echo "DEDICATED_TOKEN_WORKERS_SERVICE_ACCESS=$success"
          if [ "$code" != '200' ] || [ "$success" != 'true' ]; then
            jq -c '{success,errors}' /tmp/cf-check.json 2>/dev/null || cat /tmp/cf-check.json || true
            echo 'DEDICATED_TOKEN_LACKS_WORKERS_SERVICE_ACCESS=1'
            exit 10
          fi
          echo "CLOUDFLARE_API_TOKEN=$CF_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "DEDICATED_TOKEN_VALID=1"
      - name: Deploy existing worker
        run: npx wrangler deploy
      - name: Complete and audit R2 coupon migration
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://nooncoupons.ramychatgptgcoupons.workers.dev'
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          migration_done=false
          transient_failures=0
          for i in $(seq 1 320); do
            if ! curl -fsS --connect-timeout 10 --max-time 120 --retry 2 --retry-all-errors --retry-delay 2 \
              -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              --data '{"limit":500}' \
              "$ORIGIN/api/internal/coupon-migration-step?run=$GITHUB_SHA-$i" -o /tmp/migration-step.json; then
              transient_failures=$((transient_failures+1))
              echo "R2_COUPON_MIGRATION_TRANSIENT_FAILURE step=$i count=$transient_failures"
              sleep 8
              continue
            fi
            transient_failures=0
            ok="$(jq -r '.ok // false' /tmp/migration-step.json)"
            done="$(jq -r '.done // false' /tmp/migration-step.json)"
            scanned="$(jq -r '.scanned // 0' /tmp/migration-step.json)"
            updated="$(jq -r '.updated // 0' /tmp/migration-step.json)"
            replaced="$(jq -r '.replaced // 0' /tmp/migration-step.json)"
            failed_keys="$(jq -r '(.failedKeys // []) | length' /tmp/migration-step.json)"
            echo "R2_COUPON_MIGRATION_PROGRESS step=$i scanned=$scanned updated=$updated replaced=$replaced failedKeys=$failed_keys done=$done"
            [ "$ok" = true ] || { cat /tmp/migration-step.json; exit 1; }
            if [ "$done" = true ]; then migration_done=true; break; fi
            sleep 1
          done
          [ "$migration_done" = true ] || { echo 'R2_COUPON_MIGRATION_NOT_COMPLETE'; exit 1; }

          audit_done=false
          transient_failures=0
          for i in $(seq 1 320); do
            if ! curl -fsS --connect-timeout 10 --max-time 120 --retry 2 --retry-all-errors --retry-delay 2 \
              -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              --data '{"limit":500}' \
              "$ORIGIN/api/internal/coupon-r2-audit-step?run=$GITHUB_SHA-$i" -o /tmp/r2-audit-step.json; then
              transient_failures=$((transient_failures+1))
              echo "R2_COUPON_AUDIT_TRANSIENT_FAILURE step=$i count=$transient_failures"
              sleep 8
              continue
            fi
            transient_failures=0
            ok="$(jq -r '.ok // false' /tmp/r2-audit-step.json)"
            done="$(jq -r '.done // false' /tmp/r2-audit-step.json)"
            scanned="$(jq -r '.scanned // 0' /tmp/r2-audit-step.json)"
            invalid_files="$(jq -r '.invalidFiles // 0' /tmp/r2-audit-step.json)"
            invalid_tokens="$(jq -r '.invalidTokens // 0' /tmp/r2-audit-step.json)"
            failed_keys="$(jq -r '(.failedKeys // []) | length' /tmp/r2-audit-step.json)"
            echo "R2_COUPON_AUDIT_PROGRESS step=$i scanned=$scanned invalidFiles=$invalid_files invalidTokens=$invalid_tokens failedKeys=$failed_keys done=$done"
            [ "$ok" = true ] || { cat /tmp/r2-audit-step.json; exit 1; }
            if [ "$done" = true ]; then audit_done=true; break; fi
            sleep 1
          done
          [ "$audit_done" = true ] || { echo 'R2_COUPON_AUDIT_NOT_COMPLETE'; exit 1; }

          curl -fsS "$ORIGIN/api/coupon-migration-health?verify=$GITHUB_SHA" -o /tmp/migration-final.json
          curl -fsS "$ORIGIN/api/coupon-r2-audit-health?verify=$GITHUB_SHA" -o /tmp/r2-audit-final.json
          jq -e '.ok==true and .done==true' /tmp/migration-final.json >/dev/null
          jq -e '.ok==true and .done==true and (.invalidFiles|tonumber)==0 and (.invalidTokens|tonumber)==0' /tmp/r2-audit-final.json >/dev/null
          echo "R2_COUPON_MIGRATION_FINAL=$(jq -c '{scanned,updated,replaced,done,completedAt}' /tmp/migration-final.json)"
          echo "R2_COUPON_AUDIT_FINAL=$(jq -c '{scanned,invalidFiles,invalidTokens,done,completedAt}' /tmp/r2-audit-final.json)"
      - name: Verify deployed runtime and SEO layer
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_ORIGIN='https://nooncoupons.ramychatgptgcoupons.workers.dev'
          CANONICAL_ORIGIN='https://noondealsnow.com'
          ready=0
          for i in $(seq 1 8); do
            curl -fsS --connect-timeout 10 --max-time 30 "$RUNTIME_ORIGIN/api/generator-health?deploy=$GITHUB_SHA-$i" -o /tmp/g.json || true
            curl -fsS --connect-timeout 10 --max-time 60 "$RUNTIME_ORIGIN/api/content-stats?deploy=$GITHUB_SHA-$i" -o /tmp/s.json || true
            if python -c "import json; g=json.load(open('/tmp/g.json')); s=json.load(open('/tmp/s.json')); b=g.get('bulk',{}); p=b.get('catchupPlan') or {}; rc=s.get('r2Count',{}); assert int(b.get('dailyTarget') or 0)==32000; assert int(b.get('batchSize') or 0)==16; assert int(p.get('target') or 0)==30000; assert int(p.get('catchupBatchSize') or 0)==48; assert int(p.get('effectiveBatchSize') or 0) in (16,48); assert int(p.get('windowHours') or 0)==8; assert p.get('capacityMeetsEightHourGoal') is True or int(p.get('remaining') or 0)==0; assert float(p.get('qualityThresholdFloor') or 0)>=95; assert int(p.get('minArticleWords') or 0)>=1000; assert int(s.get('dailyTargetArabic') or 0)==32000; assert s.get('r2Uploaded') is not None; assert rc.get('snapshotKey')=='_ops/article-count.json'; assert int(rc.get('ttlSeconds') or 0)==300" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          [ "$ready" = 1 ] || { echo 'LIVE_RUNTIME_DID_NOT_MATCH_DEPLOYED_CONFIG'; exit 1; }

          echo "VERIFY_ROUTE=favicon"
          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 "$RUNTIME_ORIGIN/favicon.svg?deploy=$GITHUB_SHA" -D /tmp/fh -o /tmp/favicon.svg
          grep -Fqi 'content-type: image/svg+xml' /tmp/fh
          grep -Fq '<svg' /tmp/favicon.svg

          echo "VERIFY_ROUTE=sitemap"
          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 "$RUNTIME_ORIGIN/sitemap.xml?deploy=$GITHUB_SHA" -D /tmp/sh -o /tmp/sitemap.xml
          grep -Fq '/sitemap-priority.xml' /tmp/sitemap.xml
          grep -Fqi 'x-priority-sitemap-discovery: v1' /tmp/sh
          echo "VERIFY_ROUTE=sitemap-priority"
          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 "$RUNTIME_ORIGIN/sitemap-priority.xml?deploy=$GITHUB_SHA" -D /tmp/ph -o /tmp/priority.xml
          grep -Fqi 'x-priority-sitemap: v2' /tmp/ph
          grep -Fqi 'x-english-priority-count:' /tmp/ph
          grep -Fqi 'x-english-priority-hubs:' /tmp/ph
          grep -Fq '/saudi-arabia/noon-coupon-code' /tmp/priority.xml
          grep -Fq '/uae/noon-coupon-code' /tmp/priority.xml
          grep -Fq '/articles/' /tmp/priority.xml

          INDEXNOW_KEY=$(node -e "const fs=require('fs');const t=fs.readFileSync('wrangler.jsonc','utf8');const m=t.match(/\"INDEXNOW_KEY\"\s*:\s*\"([^\"]+)\"/);process.stdout.write(m?m[1]:'')")
          [ -n "$INDEXNOW_KEY" ] || { echo 'INDEXNOW_KEY_MISSING'; exit 1; }
          echo "VERIFY_ROUTE=indexnow-key"
          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 "$RUNTIME_ORIGIN/$INDEXNOW_KEY.txt?deploy=$GITHUB_SHA" -D /tmp/ikh -o /tmp/indexnow-key.txt
          grep -Fqi 'x-indexnow-key-file: v1' /tmp/ikh
          grep -Fxq "$INDEXNOW_KEY" /tmp/indexnow-key.txt
          echo "INDEXNOW_DEPLOY_PING=START"
          export INDEXNOW_KEY
          node -e "const fs=require('fs');const key=process.env.INDEXNOW_KEY;const urls=['https://noondealsnow.com/','https://noondealsnow.com/coupons','https://noondealsnow.com/blog','https://noondealsnow.com/saudi','https://noondealsnow.com/uae','https://noondealsnow.com/saudi/categories','https://noondealsnow.com/uae/categories','https://noondealsnow.com/saudi-arabia/noon-coupon-code','https://noondealsnow.com/uae/noon-coupon-code','https://noondealsnow.com/coupon-verification','https://noondealsnow.com/editorial-policy','https://noondealsnow.com/authors/editorial-team'];fs.writeFileSync('/tmp/indexnow-payload.json',JSON.stringify({host:'noondealsnow.com',key,keyLocation:'https://noondealsnow.com/'+key+'.txt',urlList:urls}))"
          INDEXNOW_HTTP=$(curl -sS -o /tmp/indexnow-submit.json -w '%{http_code}' -H 'Content-Type: application/json; charset=utf-8' --data-binary @/tmp/indexnow-payload.json https://api.indexnow.org/indexnow || true)
          echo "INDEXNOW_DEPLOY_PING_HTTP=$INDEXNOW_HTTP"
          if [ "$INDEXNOW_HTTP" != "200" ] && [ "$INDEXNOW_HTTP" != "202" ]; then
            echo "INDEXNOW_DEPLOY_PING_WARNING=1"
            cat /tmp/indexnow-submit.json || true
          fi

          echo "VERIFY_ROUTE=robots"
          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 "$RUNTIME_ORIGIN/robots.txt?deploy=$GITHUB_SHA" -D /tmp/rh -o /tmp/robots.txt
          grep -Fqi 'x-priority-sitemap-robots: v1' /tmp/rh
          grep -Fq 'Sitemap: https://noondealsnow.com/sitemap.xml' /tmp/robots.txt
          grep -Fq 'Sitemap: https://noondealsnow.com/sitemap-priority.xml' /tmp/robots.txt

          echo "VERIFY_ROUTE=llms"
          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 "$RUNTIME_ORIGIN/llms.txt?deploy=$GITHUB_SHA" -o /tmp/llms.txt
          grep -Fq 'controlled native-English expansion' /tmp/llms.txt
          grep -Fq 'English Saudi hub: https://noondealsnow.com/en/saudi' /tmp/llms.txt
          grep -Fq 'English article sitemap: https://noondealsnow.com/sitemap-en-articles.xml' /tmp/llms.txt
          grep -Fq 'English RSS: https://noondealsnow.com/feed-en.xml' /tmp/llms.txt

          echo "VERIFY_ROUTE=editorial-team"
          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 "$RUNTIME_ORIGIN/authors/editorial-team?deploy=$GITHUB_SHA" -D /tmp/team.h -o /tmp/team.html
          grep -Fq 'data-schema="editorial-team-profile"' /tmp/team.html
          grep -Fq '"@type":"ProfilePage"' /tmp/team.html
          grep -Fq '"name":"Noon Deals Now Editorial Team"' /tmp/team.html
          grep -Fq 'معايير المراجعة' /tmp/team.html
          grep -Fq '/editorial-policy' /tmp/team.html
          grep -Fq '/coupon-verification' /tmp/team.html
          grep -Fq '/research' /tmp/team.html

          echo "VERIFY_ROUTE=research"
          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 "$RUNTIME_ORIGIN/research?deploy=$GITHUB_SHA" -o /tmp/research.html
          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 "$RUNTIME_ORIGIN/research.json?deploy=$GITHUB_SHA" -o /tmp/research.json
          grep -Fq '"@type":"Dataset"' /tmp/research.html
          grep -Fq '"@type":"FAQPage"' /tmp/research.html
          python - <<'PY'
          import json,re
          allowed={'NOV170','NOV188','NOV174','NOV157','NOV177','NOV186','NOV163','NOV153','NOV195','NOV161'}
          x=json.load(open('/tmp/research.json'))
          assert x.get('approvedCouponCount')==10
          assert set(x.get('approvedCouponCodes') or [])==allowed
          assert x.get('updatedAt')=='2026-09-18'
          assert x.get('version')=='2026-09-18.v1'
          text=open('/tmp/research.html',encoding='utf-8').read()
          found={t.upper() for t in re.findall(r'\b(?:OPS\d+|NOV\d+)\b',text,re.I)}
          assert found<=allowed, sorted(found-allowed)
          PY

          echo "VERIFY_ROUTE=blog"
          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 "$RUNTIME_ORIGIN/blog?deploy=$GITHUB_SHA" -D /tmp/blog.h -o /tmp/blog.html
          grep -Fqi 'x-blog-schema: collection-v1' /tmp/blog.h
          grep -Fqi 'x-blog-page-size: 12' /tmp/blog.h
          grep -Fq 'data-schema="blog-collection"' /tmp/blog.html
          grep -Fq '"@type":"CollectionPage"' /tmp/blog.html
          grep -Fq '"@type":"ItemList"' /tmp/blog.html
          grep -Fq 'type="application/rss+xml"' /tmp/blog.html
          grep -Fq 'href="https://noondealsnow.com/feed.xml"' /tmp/blog.html

          echo "VERIFY_ROUTE=saudi-money"
          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 "$RUNTIME_ORIGIN/saudi-arabia/noon-coupon-code?deploy=$GITHUB_SHA" -D /tmp/mh -o /tmp/money.html
          grep -Fqi 'x-crawl-discovery-links: v1' /tmp/mh
          grep -Fq 'id="crawl-discovery-links"' /tmp/money.html
          grep -Fq '/articles/' /tmp/money.html

          echo "VERIFY_ROUTE=country-coupon-schema"
          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 "$RUNTIME_ORIGIN/saudi-arabia/coupon/nov170?deploy=$GITHUB_SHA" -D /tmp/coupon-detail.h -o /tmp/coupon-detail.html
          grep -Fq 'data-schema="country-coupon"' /tmp/coupon-detail.html
          grep -Fq '"@type":"FAQPage"' /tmp/coupon-detail.html
          grep -Fq '"@type":"BreadcrumbList"' /tmp/coupon-detail.html
          grep -Fq 'aria-label="نسخ كود نون NOV170"' /tmp/coupon-detail.html

          ARTICLE_PATH="$(python -c "import json,urllib.parse; s=json.load(open('/tmp/s.json')); slug=(s.get('last') or {}).get('slug'); print('/articles/'+urllib.parse.quote(slug,safe='') if slug else '')")"
          if [ -z "$ARTICLE_PATH" ]; then
            ARTICLE_URL="$(grep -Eo 'https://noondealsnow.com/articles/[^<]+' /tmp/priority.xml | head -n1 || true)"
            [ -n "$ARTICLE_URL" ] || { echo 'NO_ARTICLE_URL_FOR_LIVE_VERIFY'; exit 1; }
            ARTICLE_PATH="${ARTICLE_URL#https://noondealsnow.com}"
          fi

          echo "VERIFY_ROUTE=latest-article path=$ARTICLE_PATH"
          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 "$RUNTIME_ORIGIN$ARTICLE_PATH?deploy=$GITHUB_SHA" -D /tmp/h -o /tmp/a.html
          grep -Fqi 'x-brand-layer: v1' /tmp/h
          grep -Fqi 'x-article-network: v1' /tmp/h
          grep -Fqi 'x-external-link-safety: merged-v2' /tmp/h
          grep -Fqi 'x-related-manifest-cache: 120s-isolate' /tmp/h
          grep -Fq 'id="article-link-network"' /tmp/a.html
          grep -Fq 'اقرأ أيضًا قبل الشراء' /tmp/a.html
          grep -Fq 'href="/favicon.svg"' /tmp/a.html
          echo "VERIFY_ROUTE=legacy-redirects"
          code=$(curl -sS -o /dev/null -D /tmp/lrh -w '%{http_code}' "$RUNTIME_ORIGIN/saudi/noon-coupon-code?deploy=$GITHUB_SHA")
          [ "$code" = "301" ]
          grep -Fqi 'location: https://noondealsnow.com/saudi-arabia/noon-coupon-code' /tmp/lrh
          code=$(curl -sS -o /dev/null -D /tmp/larh -w '%{http_code}' "$RUNTIME_ORIGIN/saudi-arabia/article/legacy-test?deploy=$GITHUB_SHA")
          [ "$code" = "301" ]
          grep -Fqi 'location: https://noondealsnow.com/articles/legacy-test' /tmp/larh

          echo "VERIFY_ROUTE=coupon-integrity"
