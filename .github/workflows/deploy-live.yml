name: Deploy Live Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nooncoupons-production-v3
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Audit current production source
        shell: bash
        run: |
          set -euo pipefail
          files=(
            discovery-entry.js
            brand-runtime.js
            network-entry.js
            commerce-entry.js
            commerce-pages-v2.js
            commerce-taxonomy.js
            public-entry.js
            premium-entry.js
            auto-platform.js
            final-platform.js
            site.js
            router.js
            index.js
            english-canary.js
            campaign-calendar.js
            search-demand-policy.js
            quality-index.js
            bulk-generator.js
            keyword-pages.js
            indexnow.js
          )
          for f in "${files[@]}"; do
            node --check "$f"
          done
          npx wrangler deploy --dry-run --outdir /tmp/wrangler-dry
          grep -Fq '"main": "discovery-entry.js"' wrangler.jsonc
          grep -Fq '"BULK_DAILY_TARGET": "12000"' wrangler.jsonc
          grep -Fq '"BULK_BATCH_SIZE": "34"' wrangler.jsonc
          grep -Fq '"ENGLISH_MIN_INTERVAL_MINUTES": "1"' wrangler.jsonc
          grep -Fq '"ENGLISH_DAILY_TARGET": "8000"' wrangler.jsonc
          grep -Fq '"ENGLISH_BATCH_SIZE": "23"' wrangler.jsonc
          grep -Fq '"R2_SAVER_MODE": "true"' wrangler.jsonc
          grep -Fq "u.hostname.toLowerCase()==='www.noondealsnow.com'" discovery-entry.js
          grep -Fq "'x-canonical-host-redirect':'www-to-apex-v1'" discovery-entry.js
          grep -Fq '"CPU_SAVER_MODE": "true"' wrangler.jsonc
          grep -Fq '"BULK_CANDIDATE_BUDGET_MS": "12000"' wrangler.jsonc
          grep -Fq '"ENGLISH_CPU_BUDGET_MS": "12000"' wrangler.jsonc
          grep -Fq '"*/4 * * * *"' wrangler.jsonc
          grep -Fq '"head_sampling_rate": 0.05' wrangler.jsonc
          grep -Fq 'cpuEarlyExitExactCollisions:true' quality-index.js
          grep -Fq 'lowYieldCandidateThrottle:true' bulk-generator.js
          grep -Fq 'cpuSaverMode:true' english-canary.js
          grep -Fq '"R2_CLUSTER_FLUSH_MINUTES": "30"' wrangler.jsonc
          grep -Fq '"R2_DAYS_INDEX_FLUSH_MINUTES": "10"' wrangler.jsonc
          grep -Fq "operationalStateBackend:'durable-object'" bulk-generator.js
          grep -Fq "englishStateWritesPerBatch:1" english-canary.js
          grep -Fq "stateBackend:'durable-object'" indexnow.js
          grep -Fq '/api/revision' discovery-entry.js
          grep -Fq '/api/sitemap-health' discovery-entry.js
          grep -Fq '/sitemap-core.xml' discovery-entry.js
          grep -Fq '/sitemap-images.xml' discovery-entry.js
          grep -Fq '/api/generation-freshness' auto-platform.js
          grep -Fq 'pickRescueTopic' generator-core-v2.js
          grep -Fq "policy:'quality-gated-no-idle-v2'" auto-platform.js
          grep -Fq "rescueMode:true" auto-platform.js
          grep -Fq 'repairFloor=rescueMode?80:90' workers-ai-generator.js
          grep -Fq 'GENERATOR_LOCK_TTL_MS=120*1000' admin-runtime.js
          grep -Fq "lock_busy_retry_next_cron" auto-platform.js
          grep -Fq '/llms-full.txt' final-platform.js
          grep -Fq 'global_title_cannibalization' quality-index.js
          grep -Fq 'hubOwnedHeadTermsBlocked:true' english-canary.js
          grep -Fq 'broad-buying-owned-by-country-guide' search-demand-policy.js
          grep -Fq 'campaignAwareGeneration:true' bulk-generator.js
          grep -Fq 'campaignAwareProfileTargeting:true' english-canary.js
          grep -Fq '/en/uae/saving-guide' commerce-pages-v2.js
          grep -Fq '/guide/noon-refund-credit' keyword-pages.js
          echo 'SOURCE_AUDIT=PASS'

      - name: Validate Cloudflare deploy token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1 }}
          ACCOUNT_ID: c82274152a942dea53044eae7153cfd7
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CF_TOKEN:-}" ] || { echo 'MISSING_CLOUDFLARE_NOONCOUPONS_DEPLOY_TOKEN1=1'; exit 10; }
          echo "::add-mask::$CF_TOKEN"
          code=$(curl -sS -o /tmp/cf-check.json -w '%{http_code}'             -H "Authorization: Bearer $CF_TOKEN"             -H 'Content-Type: application/json'             "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/services/nooncoupons" || true)
          success=$(jq -r '.success // false' /tmp/cf-check.json 2>/dev/null || echo false)
          echo "CLOUDFLARE_WORKER_ACCESS_HTTP=$code success=$success"
          if [ "$code" != '200' ] || [ "$success" != 'true' ]; then
            jq -c '{success,errors}' /tmp/cf-check.json 2>/dev/null || true
            exit 10
          fi
          echo "CLOUDFLARE_API_TOKEN=$CF_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy existing Worker
        run: npx wrangler deploy

      - name: Verify deployed Worker runtime
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://nooncoupons.ramychatgptgcoupons.workers.dev'
          token="deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          get_ok(){
            local path="$1" out="$2" headers="$3"
            local ok=0
            for i in $(seq 1 12); do
              code=$(curl -sS --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 35 \
                -A 'NoonDealsNow-worker-verifier' -D "$headers" -o "$out" -w '%{http_code}' \
                "$ORIGIN$path?verify=$token-$i" || true)
              if [ "$code" = '200' ]; then ok=1; break; fi
              sleep 4
            done
            [ "$ok" = 1 ] || { echo "WORKER_ROUTE_FAILED=$path"; exit 1; }
          }

          get_ok '/api/revision' /tmp/revision.json /tmp/revision.h
          jq -e '.ok==true and .layer=="discovery-entry" and .sitemapHealth==true and .imageSitemap==true and .noIdleGenerationGuard==true and .titleCannibalizationGate==true' /tmp/revision.json >/dev/null
          grep -Fqi 'x-runtime-revision:' /tmp/revision.h

          get_ok '/sitemap-core.xml' /tmp/core.xml /tmp/core.h
          grep -Fq '<urlset' /tmp/core.xml
          grep -Fq '/coupons' /tmp/core.xml
          grep -Fq '/saudi-arabia/noon-coupon-code' /tmp/core.xml
          grep -Fq '/uae/noon-coupon-code' /tmp/core.xml

          get_ok '/sitemap.xml' /tmp/root.xml /tmp/root.h
          grep -Fq '/sitemap-core.xml' /tmp/root.xml
          grep -Fq '/sitemap-priority.xml' /tmp/root.xml
          grep -Fq '/sitemap-hubs.xml' /tmp/root.xml
          grep -Fq '/sitemap-images.xml' /tmp/root.xml

          get_ok '/api/sitemap-health' /tmp/sitemap-health.json /tmp/sitemap-health.h
          jq -e '.ok==true and (.rows|length>=14)' /tmp/sitemap-health.json >/dev/null
          jq -e '[.rows[]|select(.status!=200 or .ok!=true)]|length==0' /tmp/sitemap-health.json >/dev/null

          get_ok '/api/generation-freshness' /tmp/fresh.json /tmp/fresh.h
          jq -e '.ok==true and .targetMaxIdleMinutes==60 and .rescueStartsAfterMinutes==40 and .rescueCooldownMinutes==8 and .rescueAttemptsBeforeHour==3 and .rescueQualityFloor==95 and .rescueMinWords==1500' /tmp/fresh.json >/dev/null

          campaign_health_ok=0
          for i in $(seq 1 8); do
            get_ok '/api/platform-health' /tmp/platform-health.json /tmp/platform-health.h
            if jq -e '.ok==true and .campaignCalendar.version=="noon-core-oct-2026-v1" and .campaignCalendar.timezone=="Africa/Cairo" and .campaignCalendar.slotShare==75 and .campaignCalendar.publicKeywordInjection=="exact-dated-campaigns-only"' /tmp/platform-health.json >/dev/null 2>&1; then
              campaign_health_ok=1
              break
            fi
            sleep 3
          done
          if [ "$campaign_health_ok" != '1' ]; then
            cat /tmp/platform-health.json || true
            exit 1
          fi

          get_ok '/coupons' /tmp/coupons.html /tmp/coupons.h
          grep -Fq 'كود خصم نون' /tmp/coupons.html

          get_ok '/en/uae/saving-guide' /tmp/saving.html /tmp/saving.h
          grep -Fq 'Noon UAE Saving Guide' /tmp/saving.html

          get_ok '/guide/noon-refund-credit' /tmp/refund.html /tmp/refund.h
          grep -Fq 'استرجاع رصيد نون' /tmp/refund.html

          get_ok '/llms-full.txt' /tmp/llms-full.txt /tmp/llms-full.h
          grep -Fq '## Intent ownership' /tmp/llms-full.txt
          grep -Fq '/saudi-arabia/noon-coupon-code' /tmp/llms-full.txt
          grep -Fq '/en/uae/category/grocery' /tmp/llms-full.txt
          grep -Fq '## Citation and answer rules' /tmp/llms-full.txt

          get_ok '/' /tmp/home.html /tmp/home.h
          grep -Fq 'googletagmanager.com/gtag/js?id=G-1551Z7DJ2C' /tmp/home.html
          grep -Fq "gtag('config','G-1551Z7DJ2C')" /tmp/home.html
          grep -Fq 'name="google-site-verification"' /tmp/home.html
          grep -Fq 'LmU-uUjdxfArIxwpCxeSn7eKDIcUrc3zU2CqS8zmxrQ' /tmp/home.html

          http_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 'http://noondealsnow.com/' || true)
          http_location=$(curl -sSI --max-time 20 'http://noondealsnow.com/' | awk 'BEGIN{IGNORECASE=1}/^location:/{gsub("\r",""); print $2; exit}' || true)
          case "$http_code" in 301|302|307|308) ;; *) echo "HTTP_TO_HTTPS_BAD_CODE=$http_code"; exit 1;; esac
          [[ "$http_location" == https://noondealsnow.com/* ]] || { echo "HTTP_TO_HTTPS_BAD_LOCATION=$http_location"; exit 1; }

          echo 'WORKER_DEPLOY_VERIFY=PASS'

      - name: Ensure www custom domain
        shell: bash
        run: |
          set -euo pipefail
          HOST='www.noondealsnow.com'
          SERVICE='nooncoupons'
          ZONE='noondealsnow.com'

          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -o /tmp/cf-domains-www.json

          if jq -e --arg h "$HOST" '.success==true and any(.result[]?; ((.hostname // .name // "")|ascii_downcase)==($h|ascii_downcase))' /tmp/cf-domains-www.json >/dev/null; then
            echo 'WWW_CUSTOM_DOMAIN_ALREADY_PRESENT=1'
          else
            body=$(jq -cn --arg hostname "$HOST" --arg service "$SERVICE" --arg zone_name "$ZONE" '{hostname:$hostname,service:$service,zone_name:$zone_name}')
            code=$(curl -sS -o /tmp/cf-www-attach.json -w '%{http_code}' \
              -X PUT \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$body" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains")
            echo "WWW_CUSTOM_DOMAIN_ATTACH_HTTP=$code"
            jq -c '{success,result:{id:.result.id,hostname:.result.hostname,service:.result.service,zone_name:.result.zone_name},errors}' /tmp/cf-www-attach.json
            test "$code" = '200'
            jq -e '.success==true and ((.result.hostname // "")|ascii_downcase)=="www.noondealsnow.com" and .result.service=="nooncoupons"' /tmp/cf-www-attach.json >/dev/null
          fi

          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -o /tmp/cf-domains-www-after.json
          jq -e --arg h "$HOST" '.success==true and any(.result[]?; ((.hostname // .name // "")|ascii_downcase)==($h|ascii_downcase) and .service=="nooncoupons")' /tmp/cf-domains-www-after.json >/dev/null
          echo 'WWW_CUSTOM_DOMAIN_BOUND=1'

      - name: Diagnose custom-domain attachment and reachability
        shell: bash
        run: |
          set -euo pipefail
          CUSTOM='https://noondealsnow.com'
          echo 'CUSTOM_DOMAIN=noondealsnow.com'

          domain_code=$(curl -sS -o /tmp/cf-domains.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" || true)
          echo "CF_WORKERS_DOMAINS_HTTP=$domain_code"
          if [ "$domain_code" = '200' ] && jq -e '.success==true' /tmp/cf-domains.json >/dev/null 2>&1; then
            jq -c '[.result[]? | select(((.hostname // .name // "")|ascii_downcase)=="noondealsnow.com")]' /tmp/cf-domains.json
          else
            jq -c '{success,errors}' /tmp/cf-domains.json 2>/dev/null || true
          fi

          echo 'DNS_PUBLIC_NS'
          dig +short NS noondealsnow.com || true
          echo 'DNS_PUBLIC_A_SYSTEM'
          getent ahosts noondealsnow.com || true
          echo 'DNS_PUBLIC_A_CLOUDFLARE'
          dig +short A noondealsnow.com @1.1.1.1 || true
          echo 'DNS_PUBLIC_A_GOOGLE'
          dig +short A noondealsnow.com @8.8.8.8 || true
          echo 'DNS_PUBLIC_AAAA'
          dig +short AAAA noondealsnow.com @1.1.1.1 || true

          zone_id=$(jq -r '.result[]? | select(((.hostname // .name // "")|ascii_downcase)=="noondealsnow.com") | .zone_id' /tmp/cf-domains.json | head -n1)
          echo "CF_CUSTOM_DOMAIN_ZONE_ID_PRESENT=$([ -n "$zone_id" ] && echo yes || echo no)"
          if [ -n "$zone_id" ]; then
            dns_code=$(curl -sS -o /tmp/cf-dns.json -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=noondealsnow.com" || true)
            echo "CF_DNS_RECORDS_HTTP=$dns_code"
            if [ "$dns_code" = '200' ]; then
              jq -c '[.result[]? | {id,type,name,content,proxied,ttl}]' /tmp/cf-dns.json
            else
              jq -c '{success,errors}' /tmp/cf-dns.json 2>/dev/null || true
            fi
          fi

          code=$(curl -sS --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 \
            -A 'NoonDealsNow-custom-domain-verifier' -o /tmp/custom-revision.json -w '%{http_code}' \
            "$CUSTOM/api/revision?verify=${GITHUB_RUN_ID}" || true)
          echo "CUSTOM_DOMAIN_REVISION_HTTP=$code"
          if [ "$code" = '200' ] && jq -e '.ok==true and .layer=="discovery-entry"' /tmp/custom-revision.json >/dev/null 2>&1; then
            echo 'CUSTOM_DOMAIN_LIVE_VERIFY=PASS'
          else
            echo 'CUSTOM_DOMAIN_LIVE_VERIFY=BLOCKED_FROM_GITHUB_RUNNER'
            echo 'Worker deployment remains verified on workers.dev; custom-domain verification must remain a separate gate.'
          fi
