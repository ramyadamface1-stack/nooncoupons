          grep -Fq '${CODES.length} أكواد معتمدة فقط' commerce-pages-v2.js
          if grep -Fq '8 أكواد معتمدة فقط' commerce-pages-v2.js; then echo 'STALE_APPROVED_COUPON_COUNT=1'; exit 1; fi
