name: Deploy Live Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nooncoupons-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Validate worker source
        run: |
          set -euo pipefail
          node --check discovery-entry.js
          node --check brand-runtime.js
          node --check network-entry.js
          grep -Fq '"main": "discovery-entry.js"' wrangler.jsonc
          grep -Fq '"BULK_DAILY_TARGET": "15000"' wrangler.jsonc
          grep -Fq '"BULK_BATCH_SIZE": "16"' wrangler.jsonc
          grep -Fq '/sitemap-priority.xml' discovery-entry.js
          grep -Fq 'recentArticleLimit:500' discovery-entry.js
      - name: Select Cloudflare token with Workers access
        id: cf
        env:
          CF_TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TOKEN_2: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_TOKEN_3: ${{ secrets.CF_API_TOKEN }}
          ACCOUNT_ID: c82274152a942dea53044eae7153cfd7
        shell: bash
        run: |
          set -euo pipefail
          selected=''
          slot=''
          for name in CF_TOKEN_1 CF_TOKEN_2 CF_TOKEN_3; do
            token="${!name:-}"
            [ -n "$token" ] || continue
            echo "::add-mask::$token"
            code=$(curl -sS -o /tmp/cf-check.json -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/services/nooncoupons" || true)
            success=$(jq -r '.success // false' /tmp/cf-check.json 2>/dev/null || echo false)
            echo "${name}_WORKERS_SERVICE_HTTP=$code"
            echo "${name}_WORKERS_SERVICE_ACCESS=$success"
            if [ "$code" = '200' ] && [ "$success" = 'true' ]; then
              selected="$token"
              slot="$name"
              break
            fi
          done
          if [ -z "$selected" ]; then
            echo 'NO_TOKEN_WITH_WORKERS_SERVICE_ACCESS=1'
            echo 'Required Cloudflare permission: Account > Workers Scripts > Edit (and account read access as needed by Wrangler).'
            exit 10
          fi
          echo "CLOUDFLARE_API_TOKEN=$selected" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_TOKEN_SLOT=$slot" >> "$GITHUB_ENV"
          echo "SELECTED_TOKEN_SLOT=$slot"
      - name: Deploy existing worker
        run: npx wrangler deploy
      - name: Verify deployed runtime and SEO layer
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://noondealsnow.com'
          ready=0
          for i in $(seq 1 24); do
            curl -fsS --retry 2 --connect-timeout 10 --max-time 20 "$ORIGIN/api/generator-health?deploy=$GITHUB_SHA-$i" -o /tmp/g.json || true
            curl -fsS --retry 2 --connect-timeout 10 --max-time 20 "$ORIGIN/api/content-stats?deploy=$GITHUB_SHA-$i" -o /tmp/s.json || true
            if python -c "import json; g=json.load(open('/tmp/g.json')); s=json.load(open('/tmp/s.json')); b=g.get('bulk',{}); assert int(b.get('dailyTarget') or 0)==15000; assert int(b.get('batchSize') or 0)==16; assert int(s.get('dailyTargetArabic') or 0)==15000" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 5
          done
          [ "$ready" = 1 ] || { echo 'LIVE_RUNTIME_DID_NOT_MATCH_DEPLOYED_CONFIG'; exit 1; }

          curl -fsS "$ORIGIN/favicon.svg?deploy=$GITHUB_SHA" -D /tmp/fh -o /tmp/favicon.svg
          grep -Fqi 'content-type: image/svg+xml' /tmp/fh
          grep -Fq '<svg' /tmp/favicon.svg

          curl -fsS "$ORIGIN/sitemap.xml?deploy=$GITHUB_SHA" -D /tmp/sh -o /tmp/sitemap.xml
          grep -Fq '/sitemap-priority.xml' /tmp/sitemap.xml
          grep -Fqi 'x-priority-sitemap-discovery: v1' /tmp/sh
          curl -fsS "$ORIGIN/sitemap-priority.xml?deploy=$GITHUB_SHA" -D /tmp/ph -o /tmp/priority.xml
          grep -Fqi 'x-priority-sitemap: v1' /tmp/ph
          grep -Fq '/saudi-arabia/noon-coupon-code' /tmp/priority.xml
          grep -Fq '/uae/noon-coupon-code' /tmp/priority.xml
          grep -Fq '/articles/' /tmp/priority.xml

          ARTICLE_PATH="$(python -c "import json,urllib.parse; s=json.load(open('/tmp/s.json')); slug=(s.get('last') or {}).get('slug'); print('/articles/'+urllib.parse.quote(slug,safe='') if slug else '')")"
          if [ -z "$ARTICLE_PATH" ]; then
            ARTICLE_URL="$(grep -Eo 'https://noondealsnow.com/articles/[^<]+' /tmp/priority.xml | head -n1 || true)"
            [ -n "$ARTICLE_URL" ] || { echo 'NO_ARTICLE_URL_FOR_LIVE_VERIFY'; exit 1; }
            ARTICLE_PATH="${ARTICLE_URL#$ORIGIN}"
          fi

          curl -fsS --retry 3 "$ORIGIN$ARTICLE_PATH?deploy=$GITHUB_SHA" -D /tmp/h -o /tmp/a.html
          grep -Fqi 'x-brand-layer: v1' /tmp/h
          grep -Fqi 'x-article-network: v1' /tmp/h
          grep -Fqi 'x-external-link-safety: merged-v2' /tmp/h
          grep -Fqi 'x-related-manifest-cache: 120s-isolate' /tmp/h
          grep -Fq 'id="article-link-network"' /tmp/a.html
          grep -Fq 'اقرأ أيضًا قبل الشراء' /tmp/a.html
          grep -Fq 'href="/favicon.svg"' /tmp/a.html
          python - <<'PY'
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.missing=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=='img':
                      d=dict(attrs)
                      if not (d.get('alt') or '').strip(): self.missing.append(d)
          p=P(); p.feed(open('/tmp/a.html',encoding='utf-8').read())
          assert not p.missing, f'missing alt on {len(p.missing)} images'
          PY
          echo "PRODUCTION_RUNTIME_VERIFIED=1"
