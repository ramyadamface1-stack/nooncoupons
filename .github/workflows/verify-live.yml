name: Verify Live Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and provider isolation checks
        run: |
          node --check auto-platform.js
          node --check workers-ai-generator.js
          node --check bulk-generator.js
          node --check generator-core-v2.js
          node --check generator-core.js
          node --check platform.js
          node --check admin-runtime.js
          node --check admin-page.js
          if grep -E -n 'generativelanguage\.googleapis\.com|api\.x\.ai|api\.groq\.com|GEMINI_API_KEY|XAI_API_KEY|GROQ_API_KEY' auto-platform.js workers-ai-generator.js bulk-generator.js generator-core-v2.js generator-core.js platform.js admin-runtime.js; then
            echo 'EXTERNAL_AI_REFERENCE_FOUND_IN_ACTIVE_RUNTIME'
            exit 1
          fi
          grep -Fq '@cf/zai-org/glm-4.7-flash' workers-ai-generator.js
          grep -Fq '@cf/google/gemma-4-26b-a4b-it' workers-ai-generator.js
          grep -Fq 'WORKERS_AI_FALLBACK_MODEL' wrangler.jsonc
          grep -Fq '"BULK_DAILY_TARGET": "2000"' wrangler.jsonc
          grep -Fq '"BULK_BATCH_SIZE": "2"' wrangler.jsonc
      - name: Verify deployed Worker and bulk pipeline
        id: live
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee /tmp/live-verify.log) 2>&1
          ORIGIN="https://nooncoupons.ramychatgptgcoupons.workers.dev"
          rc=0
          check_contains(){
            name="$1"; text="$2"; needle="$3"
            if grep -Fq -- "$needle" <<< "$text"; then echo "PASS $name"; else echo "FAIL $name :: $needle"; rc=1; fi
          }
          health=""
          for i in $(seq 1 30); do
            health="$(curl -sS --max-time 20 "$ORIGIN/api/generator-health" 2>&1 || true)"
            if grep -Fq 'generator-4.1-bulk-2000-live' <<< "$health"; then break; fi
            sleep 10
          done
          # Give the minute cron enough time to publish at least one bulk batch.
          for i in $(seq 1 12); do
            health="$(curl -sS --max-time 20 "$ORIGIN/api/generator-health" 2>&1 || true)"
            if python -c 'import json,sys; d=json.loads(sys.stdin.read()); raise SystemExit(0 if int(d.get("bulk",{}).get("publishedTotal",0))>0 else 1)' <<< "$health"; then break; fi
            sleep 10
          done
          platform="$(curl -sS --max-time 20 "$ORIGIN/api/platform-health" 2>&1 || true)"
          state="$(curl -sS --max-time 20 "$ORIGIN/api/state" 2>&1 || true)"
          sitemap="$(curl -sS --max-time 20 "$ORIGIN/sitemap.xml" 2>&1 || true)"
          printf '%s\n' "$health" > /tmp/generator-health.json
          printf '%s\n' "$platform" > /tmp/platform-health.json
          printf '%s\n' "$state" > /tmp/state.json
          printf '%s\n' "$sitemap" > /tmp/sitemap.xml
          echo '--- GENERATOR HEALTH ---'; cat /tmp/generator-health.json
          check_contains generator_version "$health" 'generator-4.1-bulk-2000-live'
          check_contains preferred_provider "$health" '"preferredProvider": "workers-ai"'
          check_contains external_false "$health" '"external": false'
          check_contains programmatic_provider "$health" '"programmaticCloudflare": true'
          check_contains bulk_target "$health" '"dailyTarget": 2000'
          check_contains bulk_batch "$health" '"batchSize": 2'
          python - <<'PY' /tmp/generator-health.json
          import json,sys
          d=json.load(open(sys.argv[1]))
          b=d.get('bulk',{})
          print('bulk=',json.dumps(b,ensure_ascii=False))
          assert int(b.get('publishedTotal',0)) > 0, b
          assert int(b.get('dailyTarget',0)) == 2000, b
          assert int(b.get('batchSize',0)) == 2, b
          assert not b.get('lastError'), b
          PY
          if [ "$?" -eq 0 ]; then echo 'PASS bulk_live_publish'; else echo 'FAIL bulk_live_publish'; rc=1; fi
          echo '--- PLATFORM HEALTH ---'; cat /tmp/platform-health.json
          check_contains platform_version "$platform" 'platform-1.5-cloudflare-bulk-live'
          check_contains bulk_platform "$platform" '"bulkProgrammatic": true'
          echo '--- STATE SETTINGS ---'
          python - <<'PY' /tmp/state.json
          import json,sys
          d=json.load(open(sys.argv[1]))
          print(json.dumps(d.get('settings',{}),ensure_ascii=False,indent=2))
          assert d.get('settings',{}).get('aiPrimary')=='workers-ai'
          assert d.get('settings',{}).get('aiFallback') is None
          assert d.get('settings',{}).get('qualityThreshold')==95
          assert d.get('settings',{}).get('minWords')==1000
          PY
          if [ "$?" -eq 0 ]; then echo 'PASS state_settings'; else echo 'FAIL state_settings'; rc=1; fi
          code="$(curl -sS -o /tmp/legacy.json -w '%{http_code}' -X POST "$ORIGIN/api/ai/generate" || true)"
          echo "legacy_generate_http=$code"; cat /tmp/legacy.json 2>/dev/null || true
          if [ "$code" = "410" ]; then echo 'PASS legacy_410'; else echo 'FAIL legacy_410'; rc=1; fi
          if curl -sS --max-time 30 "$ORIGIN/blog" -o /tmp/blog.html && grep -q 'مدونة كوبونات نون' /tmp/blog.html && grep -q 'Programmatic Cloudflare' /tmp/blog.html; then echo 'PASS bulk_blog'; else echo 'FAIL bulk_blog'; rc=1; fi
          check_contains bulk_sitemap "$sitemap" 'sitemap-articles-'
          slug="$(python -c 'import json; d=json.load(open("/tmp/generator-health.json")); print(d.get("bulk",{}).get("lastSlug") or "")')"
          if [ -n "$slug" ]; then
            urlslug="$(python -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe="-"))' "$slug")"
            if curl -sS --max-time 30 "$ORIGIN/articles/$urlslug" -o /tmp/bulk-article.html && grep -q 'Programmatic Cloudflare' /tmp/bulk-article.html; then echo 'PASS bulk_article_route'; else echo 'FAIL bulk_article_route'; rc=1; fi
          else
            echo 'FAIL bulk_article_route :: missing lastSlug'; rc=1
          fi
          echo "FINAL_RC=$rc"
          exit "$rc"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-verify-diagnostics
          path: |
            /tmp/live-verify.log
            /tmp/generator-health.json
            /tmp/platform-health.json
            /tmp/state.json
            /tmp/legacy.json
            /tmp/blog.html
            /tmp/bulk-article.html
            /tmp/sitemap.xml
          if-no-files-found: ignore
          retention-days: 1
