name: Verify Live Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Source and quality invariants
        run: |
          set -euo pipefail
          for f in commerce-entry.js commerce-pages-v2.js commerce-taxonomy.js commerce-generator-taxonomy.js landing-content-v3.js public-entry.js premium-entry.js auto-platform.js final-platform.js workers-ai-generator.js quality-criteria.js quality-audit.js quality-index.js coupon-registry.js schema-validator.js indexation-gate.js editorial-trust-layer.js indexnow.js bulk-content-engine.js bulk-generator.js legacy-upgrader-v2.js bulk-selftest.js generator-core-v2.js generator-core.js platform.js admin-runtime.js admin-page.js; do node --check "$f"; done
          if grep -E -n 'generativelanguage\.googleapis\.com|api\.x\.ai|api\.groq\.com|GEMINI_API_KEY|XAI_API_KEY|GROQ_API_KEY' commerce-entry.js commerce-generator-taxonomy.js auto-platform.js workers-ai-generator.js bulk-generator.js generator-core-v2.js platform.js admin-runtime.js; then
            echo 'EXTERNAL_AI_REFERENCE_FOUND_IN_ACTIVE_RUNTIME'; exit 1
          fi
          echo CHECK_WRANGLER_MAIN; grep -Fq '"main": "commerce-entry.js"' wrangler.jsonc
          echo CHECK_BULK_TARGET; grep -Fq '"BULK_DAILY_TARGET": "10000"' wrangler.jsonc
          echo CHECK_BULK_BATCH; grep -Fq '"BULK_BATCH_SIZE": "10"' wrangler.jsonc
          echo CHECK_CATCHUP_TOTAL; grep -Fq '"BULK_CATCHUP_TOTAL": "8000"' wrangler.jsonc
          echo CHECK_CATCHUP_BATCH; grep -Fq '"BULK_CATCHUP_BATCH_SIZE": "48"' wrangler.jsonc
          echo CHECK_CATCHUP_LOGIC; grep -Fq 'publishedTotal<catchupGoal?catchupBatch:steadyBatch' admin-runtime.js
          echo CHECK_BATCH_CEILING; grep -Fq 'Math.min(48,Number(batchSize||3))' bulk-generator.js
          echo CHECK_QUALITY_THRESHOLD; grep -Fq '"QUALITY_PUBLISH_THRESHOLD": "95"' wrangler.jsonc
          echo CHECK_MIN_WORDS; grep -Fq '"MIN_ARTICLE_WORDS": "1000"' wrangler.jsonc
          echo CHECK_INDEXNOW_ENABLED; grep -Fq '"INDEXNOW_ENABLED": "true"' wrangler.jsonc
          echo CHECK_CRON; grep -Fq '"* * * * *"' wrangler.jsonc
          echo CHECK_TAXONOMY; grep -Fq "mode:'explicit-generator-taxonomy'" commerce-generator-taxonomy.js
          echo CHECK_CATEGORY_METADATA; grep -Fq 'categoryKey' bulk-generator.js
          echo CHECK_LANDING_METADATA; grep -Fq 'landingPath' generator-core-v2.js
          echo CHECK_LANDING_WORD_FLOOR; grep -Fq 'minWords:5000' landing-content-v3.js
          echo CHECK_INDEXNOW_INTEGRATION; grep -Fq 'submitIndexNow' bulk-generator.js
          echo SOURCE_INVARIANTS_PASS

      - name: Verify live commerce and generator runtime
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="https://noondealsnow.com"
          fetch(){ curl -fsS --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 25 "$1" -o "$2"; }
          checked_fetch(){ echo "CHECK_FETCH $1"; fetch "$ORIGIN$1?v=catchup8k" /tmp/page || { echo "FETCH_FAILED $1"; exit 1; }; }
          ready=0
          for i in $(seq 1 30); do
            fetch "$ORIGIN/api/generator-health?v=catchup8k-$i" /tmp/generator.json 2>/dev/null || true
            fetch "$ORIGIN/api/commerce-health?v=catchup8k-$i" /tmp/commerce.json 2>/dev/null || true
            fetch "$ORIGIN/api/content-stats?v=catchup8k-$i" /tmp/stats.json 2>/dev/null || true
            if python -c "import json; g=json.load(open('/tmp/generator.json')); c=json.load(open('/tmp/commerce.json')); s=json.load(open('/tmp/stats.json')); b=g.get('bulk',{}); gt=c.get('generatorTaxonomy',{}); lc=c.get('landingContent',{}); assert c.get('ok') is True; assert s.get('ok') is True; assert int(c.get('routes') or 0)>=276; assert gt.get('mode')=='explicit-generator-taxonomy'; assert int(gt.get('version') or 0)>=3; assert int(lc.get('minWords') or 0)>=5000; assert int(b.get('dailyTarget') or 0)==10000; assert int(b.get('batchSize') or 0)==10; assert int(s.get('dailyTargetArabic') or 0)==10000" 2>/dev/null; then
              ready=1
              echo "RUNTIME_READY attempt=$i"
              break
            fi
            sleep 6
          done
          if [ "$ready" != 1 ]; then
            echo LIVE_RUNTIME_NOT_READY
            cat /tmp/generator.json 2>/dev/null || true
            cat /tmp/commerce.json 2>/dev/null || true
            cat /tmp/stats.json 2>/dev/null || true
            exit 1
          fi

          for path in /saudi/categories /saudi/category/mobiles /saudi/category/shoes /uae/category/bags /saudi/brand/apple /saudi/model/apple/iphone-pro /saudi/compare/iphone-vs-galaxy /blog /sitemap.xml /sitemap-commerce.xml /api/generator-health /api/commerce-health /api/content-stats; do
            checked_fetch "$path"
          done

          echo CHECK_SITEMAPS
          fetch "$ORIGIN/sitemap.xml?v=catchup8k" /tmp/sitemap.xml
          fetch "$ORIGIN/sitemap-commerce.xml?v=catchup8k" /tmp/sitemap-commerce.xml
          if grep -Fq '<sitemapindex' /tmp/sitemap.xml; then
            grep -Fq '/sitemap-commerce.xml' /tmp/sitemap.xml || { echo MISSING_COMMERCE_CHILD_SITEMAP; exit 1; }
          else
            grep -Fq '/saudi/category/shoes' /tmp/sitemap.xml || { echo MISSING_DIRECT_COMMERCE_URLS; exit 1; }
          fi
          for needle in '/saudi/category/shoes' '/uae/category/bags' '/saudi/brand/apple' '/saudi/model/apple/iphone-pro' '/saudi/compare/iphone-vs-galaxy'; do
            grep -Fq "$needle" /tmp/sitemap-commerce.xml || { echo "MISSING_COMMERCE_SITEMAP $needle"; exit 1; }
          done
          count="$(grep -o '<url>' /tmp/sitemap-commerce.xml | wc -l | tr -d ' ')"
          [ "$count" -ge 276 ] || { echo "COMMERCE_SITEMAP_ROUTE_COUNT $count"; exit 1; }

          echo CHECK_SHOES_V3
          fetch "$ORIGIN/saudi/category/shoes?v=catchup8k" /tmp/shoes.html
          grep -Fq 'landing-depth-v3' /tmp/shoes.html || { echo MISSING_LANDING_V3; exit 1; }
          grep -Fq 'FAQPage' /tmp/shoes.html || { echo MISSING_FAQ_SCHEMA; exit 1; }
          grep -Eq 'OPS(32|56|47|48|43|41|38|58)' /tmp/shoes.html || { echo MISSING_OWNER_OFFER_CODE; exit 1; }

          echo CHECK_FINAL_HEALTH_ASSERTIONS
          python - <<'PY'
          import json
          g=json.load(open('/tmp/generator.json'))
          c=json.load(open('/tmp/commerce.json'))
          s=json.load(open('/tmp/stats.json'))
          b=g.get('bulk',{}); gt=c.get('generatorTaxonomy',{}); lc=c.get('landingContent',{})
          print('LIVE_VALUES',json.dumps({'routes':c.get('routes'),'landingContent':lc,'metadataCoverage':c.get('metadataCoverage'),'bulk':b,'contentStats':s,'providers':g.get('providers',{})},ensure_ascii=False))
          assert c.get('ok') is True and int(c.get('routes') or 0)>=276, 'commerce health/routes'
          assert gt.get('mode')=='explicit-generator-taxonomy' and gt.get('internalLinks') is True, 'generator taxonomy'
          assert gt.get('metadata')==['categoryKey','brandKey','modelKey','comparisonKey','landingPath'], 'metadata contract'
          assert int(lc.get('minWords') or 0)>=5000 and lc.get('seo') is True and lc.get('geoAeo') is True and lc.get('eeat') is True, 'landing quality contract'
          assert int(b.get('dailyTarget') or 0)==10000 and int(b.get('batchSize') or 0)==10, 'bulk target/batch'
          assert int(s.get('dailyTargetArabic') or 0)==10000, 'instant stats target'
          assert int(s.get('total') or 0)==int(s.get('arabic') or 0)+int(s.get('english') or 0), 'content stats total'
          q=b.get('lastQuality')
          if q is not None: assert float(q)>=95, f'last quality {q}'
          w=b.get('lastWordCount')
          if w is not None: assert 1000<=int(w)<=2000, f'last words {w}'
          providers=g.get('providers',{})
          if 'external' in providers: assert providers.get('external') is False, 'external provider active'
          print('FINAL_LIVE_PASS',{'routes':c.get('routes'),'bulk':{'target':b.get('dailyTarget'),'batch':b.get('batchSize'),'quality':q,'words':w,'publishedToday':b.get('publishedToday'),'publishedTotal':b.get('publishedTotal')},'contentStats':s})
          PY
