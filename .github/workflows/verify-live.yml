name: Verify Live Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Source and quality invariants
        run: |
          set -euo pipefail
          for f in discovery-entry.js brand-runtime.js network-entry.js commerce-entry.js commerce-pages-v2.js commerce-taxonomy.js commerce-generator-taxonomy.js landing-content-v3.js public-entry.js premium-entry.js auto-platform.js final-platform.js visual-platform.js svg-engine.js seo-layer.js site.js router.js index.js approved-coupons.js workers-ai-generator.js quality-criteria.js quality-audit.js quality-index.js coupon-registry.js schema-validator.js indexation-gate.js editorial-trust-layer.js indexnow.js bulk-content-engine.js bulk-generator.js legacy-upgrader-v2.js bulk-selftest.js generator-core-v2.js generator-core.js platform.js admin-runtime.js admin-page.js; do node --check "$f"; done
          if grep -E -n 'generativelanguage\.googleapis\.com|api\.x\.ai|api\.groq\.com|GEMINI_API_KEY|XAI_API_KEY|GROQ_API_KEY' discovery-entry.js brand-runtime.js network-entry.js commerce-entry.js commerce-generator-taxonomy.js auto-platform.js workers-ai-generator.js bulk-generator.js generator-core-v2.js platform.js admin-runtime.js; then
            echo 'EXTERNAL_AI_REFERENCE_FOUND_IN_ACTIVE_RUNTIME'; exit 1
          fi
          echo CHECK_WRANGLER_MAIN; grep -Fq '"main": "discovery-entry.js"' wrangler.jsonc
          echo CHECK_DISCOVERY_CHAIN; grep -Fq "import app from './brand-runtime.js'" discovery-entry.js
          grep -Fq 'prioritySitemap' discovery-entry.js
          grep -Fq 'robotsPrioritySitemap:true' discovery-entry.js
          echo CHECK_RUNTIME_CHAIN; grep -Fq "import app from './network-entry.js'" brand-runtime.js
          echo CHECK_BRAND_LAYER; grep -Fq "organizationLogoRepair:true" brand-runtime.js; grep -Fq "favicon:true" brand-runtime.js
          echo CHECK_ARTICLE_NETWORK; grep -Fq 'id="article-link-network"' network-entry.js
          grep -Fq 'relatedArticles:6' network-entry.js
          grep -Fq 'x-alt-fallback' network-entry.js
          grep -Fq 'x-external-link-safety' network-entry.js
          echo CHECK_BULK_TARGET; grep -Fq '"BULK_DAILY_TARGET": "32000"' wrangler.jsonc
          echo CHECK_BULK_BATCH; grep -Fq '"BULK_BATCH_SIZE": "16"' wrangler.jsonc
          echo CHECK_CATCHUP_TOTAL; grep -Fq '"BULK_CATCHUP_TOTAL": "30000"' wrangler.jsonc
          echo CHECK_CATCHUP_BATCH; grep -Fq '"BULK_CATCHUP_BATCH_SIZE": "64"' wrangler.jsonc
          grep -Fq '"BULK_CATCHUP_MIN_BATCH_SIZE": "32"' wrangler.jsonc
          grep -Fq '"BULK_CATCHUP_TARGET_BATCH_MS": "52000"' wrangler.jsonc
          grep -Fq '"BULK_CANDIDATE_BUDGET_MS": "38000"' wrangler.jsonc
          grep -Fq 'chooseAdaptiveBulkBatch' admin-runtime.js
          echo CHECK_CATCHUP_WINDOW; grep -Fq '"BULK_CATCHUP_WINDOW_HOURS": "8"' wrangler.jsonc
          echo CHECK_CATCHUP_LOGIC
          grep -Fq 'export function chooseAdaptiveBulkBatch' admin-runtime.js
          grep -Fq "reason='cold_start_max'" admin-runtime.js
          grep -Fq 'lastPublished*targetMs/lastDurationMs' admin-runtime.js
          grep -Fq "mode:'catchup-adaptive'" admin-runtime.js
          echo CHECK_BULK_RUN_LOCK; grep -Fq 'BULK_RUN_LOCK_MS=5*60*1000' admin-runtime.js
          echo CHECK_BATCH_CEILING; grep -Fq 'MAX_BATCH_SIZE=64' bulk-generator.js
          grep -Fq 'MAX_DAILY_TARGET=40000' bulk-generator.js
          grep -Fq 'qualityThresholdFloor:95' bulk-generator.js
          echo CHECK_QUALITY_THRESHOLD; grep -Fq '"QUALITY_PUBLISH_THRESHOLD": "95"' wrangler.jsonc
          echo CHECK_MIN_WORDS; grep -Fq '"MIN_ARTICLE_WORDS": "1000"' wrangler.jsonc
          echo CHECK_INDEXNOW_ENABLED; grep -Fq '"INDEXNOW_ENABLED": "true"' wrangler.jsonc
          echo CHECK_CRON; grep -Fq '"* * * * *"' wrangler.jsonc
          echo CHECK_TAXONOMY; grep -Fq "mode:'explicit-generator-taxonomy'" commerce-generator-taxonomy.js
          echo CHECK_CATEGORY_METADATA; grep -Fq 'categoryKey' bulk-generator.js
          echo CHECK_LANDING_METADATA; grep -Fq 'landingPath' generator-core-v2.js
          echo CHECK_LANDING_WORD_FLOOR; grep -Fq 'minWords:5000' landing-content-v3.js
          echo CHECK_INDEXNOW_INTEGRATION; grep -Fq 'submitIndexNow' bulk-generator.js
          echo CHECK_PREFLIGHT_DEDUPE; grep -Fq 'preflightGlobalGate' bulk-generator.js
          grep -Fq 'preflightGate:true' quality-index.js
          grep -Fq 'twoStagePreflight:true' bulk-generator.js
          grep -Fq 'parallelPostPublication:true' bulk-generator.js
          grep -Fq 'parallelCatalogShards:true' bulk-generator.js
          grep -Fq 'batchStageTelemetry:true' bulk-generator.js
          grep -Fq 'candidateTimeBudget:true' bulk-generator.js
          grep -Fq 'defaultCandidateBudgetMs:38000' bulk-generator.js
          grep -Fq 'semanticPreAudit:true' bulk-generator.js
          grep -Fq 'cooperativeYieldEveryTries:8' bulk-generator.js
          grep -Fq 'preAuditSemanticGate' quality-audit.js
          grep -Fq 'articleWriteConcurrency:16' bulk-generator.js
          grep -Fq 'clusterWriteConcurrency:16' quality-index.js
          grep -Fq 'r2ReadRetry:3' bulk-generator.js
          grep -Fq 'r2CatalogFailClosed:true' bulk-generator.js
          grep -Fq 'r2WriteRetry:3' bulk-generator.js
          grep -Fq 'r2HeadRetry:3' bulk-generator.js
          grep -Fq 'r2_status_read_failed' admin-runtime.js
          grep -Fq 'failClosedOnClusterRead:true' quality-index.js
          grep -Fq 'r2_status_put_failed' admin-runtime.js
          grep -Fq 'query-modifier-v4' bulk-content-engine.js
          grep -Fq 'diversityVersion:4' bulk-content-engine.js
          grep -Fq 'fullGlobalGatePreserved:true' bulk-generator.js
          echo SOURCE_INVARIANTS_PASS

      - name: Verify live commerce and generator runtime
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="https://noondealsnow.com"
          fetch(){ curl -fsS --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 25 "$1" -o "$2"; }
          checked_fetch(){ echo "CHECK_FETCH $1"; fetch "$ORIGIN$1?v=brand-v1" /tmp/page || { echo "FETCH_FAILED $1"; exit 1; }; }
          ready=0
          for i in $(seq 1 30); do
            fetch "$ORIGIN/api/generator-health?v=brand-v1-$i" /tmp/generator.json 2>/dev/null || true
            fetch "$ORIGIN/api/commerce-health?v=brand-v1-$i" /tmp/commerce.json 2>/dev/null || true
            fetch "$ORIGIN/api/content-stats?v=brand-v1-$i" /tmp/stats.json 2>/dev/null || true
            if python -c "import json; g=json.load(open('/tmp/generator.json')); c=json.load(open('/tmp/commerce.json')); s=json.load(open('/tmp/stats.json')); b=g.get('bulk',{}); p=b.get('catchupPlan') or {}; gt=c.get('generatorTaxonomy',{}); lc=c.get('landingContent',{}); assert c.get('ok') is True; assert s.get('ok') is True; assert int(c.get('routes') or 0)>=276; assert gt.get('mode')=='explicit-generator-taxonomy'; assert int(gt.get('version') or 0)>=3; assert int(lc.get('minWords') or 0)>=5000; assert int(b.get('dailyTarget') or 0)==32000; assert int(b.get('batchSize') or 0)==16; assert int(p.get('target') or 0)==30000; assert int(p.get('catchupBatchSize') or 0)==64; assert 16<=int(p.get('effectiveBatchSize') or 0)<=64; assert int(p.get('adaptiveBatchSize') or 0)==int(p.get('effectiveBatchSize') or 0); assert int(p.get('targetBatchDurationMs') or 0)==52000; assert int(p.get('windowHours') or 0)==8; assert int(s.get('dailyTargetArabic') or 0)==32000" 2>/dev/null; then
              ready=1
              echo "RUNTIME_READY attempt=$i"
              break
            fi
            sleep 6
          done
          if [ "$ready" != 1 ]; then
            echo LIVE_RUNTIME_NOT_READY
            cat /tmp/generator.json 2>/dev/null || true
            cat /tmp/commerce.json 2>/dev/null || true
            cat /tmp/stats.json 2>/dev/null || true
            exit 1
          fi

          for path in /saudi/categories /saudi/category/mobiles /saudi/category/shoes /uae/category/bags /saudi/brand/apple /saudi/model/apple/iphone-pro /saudi/compare/iphone-vs-galaxy /blog /sitemap.xml /sitemap-commerce.xml /api/generator-health /api/commerce-health /api/content-stats /favicon.svg; do
            checked_fetch "$path"
          done

          echo CHECK_SITEMAPS
          fetch "$ORIGIN/sitemap.xml?v=brand-v1" /tmp/sitemap.xml
          fetch "$ORIGIN/sitemap-commerce.xml?v=brand-v1" /tmp/sitemap-commerce.xml
          if grep -Fq '<sitemapindex' /tmp/sitemap.xml; then
            grep -Fq '/sitemap-commerce.xml' /tmp/sitemap.xml || { echo MISSING_COMMERCE_CHILD_SITEMAP; exit 1; }
            grep -Fq '/sitemap-money.xml' /tmp/sitemap.xml || { echo MISSING_MONEY_CHILD_SITEMAP; exit 1; }
          else
            grep -Fq '/saudi/category/shoes' /tmp/sitemap.xml || { echo MISSING_DIRECT_COMMERCE_URLS; exit 1; }
          fi
          for needle in '/saudi/category/shoes' '/uae/category/bags' '/saudi/brand/apple' '/saudi/model/apple/iphone-pro' '/saudi/compare/iphone-vs-galaxy'; do
            grep -Fq "$needle" /tmp/sitemap-commerce.xml || { echo "MISSING_COMMERCE_SITEMAP $needle"; exit 1; }
          done
          count="$(grep -o '<url>' /tmp/sitemap-commerce.xml | wc -l | tr -d ' ')"
          [ "$count" -ge 276 ] || { echo "COMMERCE_SITEMAP_ROUTE_COUNT $count"; exit 1; }

          echo CHECK_SAUDI_REDIRECT
          code="$(curl -sS -o /dev/null -w '%{http_code}' "$ORIGIN/saudi/noon-coupon-code")"
          [ "$code" = "301" ] || { echo "SAUDI_OLD_PATH_NOT_301 code=$code"; exit 1; }

          echo CHECK_BRAND_RUNTIME
          curl -fsS "$ORIGIN/favicon.svg?v=brand-v1" -D /tmp/favicon_headers -o /tmp/favicon.svg
          grep -Fqi 'content-type: image/svg+xml' /tmp/favicon_headers
          grep -Fq '<svg' /tmp/favicon.svg

          echo CHECK_ARTICLE_NETWORK_LIVE
          ARTICLE_PATH="$(python -c "import json,urllib.parse; s=json.load(open('/tmp/stats.json')); slug=(s.get('last') or {}).get('slug'); print('/articles/'+urllib.parse.quote(slug,safe='') if slug else '')")"
          if [ -z "$ARTICLE_PATH" ]; then
            ARTICLE_SITEMAP="$(grep -Eo 'https://noondealsnow.com/sitemap-articles-[^<]+' /tmp/sitemap.xml | head -n1 || true)"
            [ -n "$ARTICLE_SITEMAP" ] || ARTICLE_SITEMAP="$ORIGIN/sitemap-articles.xml"
            fetch "$ARTICLE_SITEMAP?v=brand-v1" /tmp/articles.xml
            ARTICLE_URL="$(grep -Eo 'https://noondealsnow.com/articles/[^<]+' /tmp/articles.xml | head -n1 || true)"
            [ -n "$ARTICLE_URL" ] || { echo NO_ARTICLE_URL_FOR_LIVE_VERIFY; exit 1; }
            ARTICLE_PATH="${ARTICLE_URL#$ORIGIN}"
          fi
          curl -fsS --retry 3 "$ORIGIN$ARTICLE_PATH?v=brand-v1" -D /tmp/article_headers -o /tmp/article.html
          grep -Fqi 'x-brand-layer: v1' /tmp/article_headers || { echo MISSING_BRAND_LAYER_HEADER; exit 1; }
          grep -Fqi 'x-article-network: v1' /tmp/article_headers || { echo MISSING_ARTICLE_NETWORK_HEADER; exit 1; }
          grep -Fq 'href="/favicon.svg"' /tmp/article.html || { echo MISSING_FAVICON_LINK; exit 1; }
          grep -Fq 'id="article-link-network"' /tmp/article.html || { echo MISSING_RELATED_ARTICLE_BLOCK; exit 1; }
          grep -Fq 'اقرأ أيضًا قبل الشراء' /tmp/article.html || { echo MISSING_RELATED_ARTICLE_COPY; exit 1; }
          python - <<'PY'
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.missing=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=='img':
                      d=dict(attrs)
                      if not (d.get('alt') or '').strip(): self.missing.append(d)
          p=P(); p.feed(open('/tmp/article.html',encoding='utf-8').read())
          assert not p.missing, f'ARTICLE_IMAGES_MISSING_ALT {len(p.missing)}'
          PY

          echo CHECK_FINAL_HEALTH_ASSERTIONS
          python - <<'PY'
          import json
          g=json.load(open('/tmp/generator.json'))
          c=json.load(open('/tmp/commerce.json'))
          s=json.load(open('/tmp/stats.json'))
          b=g.get('bulk',{}); gt=c.get('generatorTaxonomy',{}); lc=c.get('landingContent',{})
          print('LIVE_VALUES',json.dumps({'routes':c.get('routes'),'landingContent':lc,'metadataCoverage':c.get('metadataCoverage'),'bulk':b,'contentStats':s,'providers':g.get('providers',{})},ensure_ascii=False))
          assert c.get('ok') is True and int(c.get('routes') or 0)>=276, 'commerce health/routes'
          assert gt.get('mode')=='explicit-generator-taxonomy' and gt.get('internalLinks') is True, 'generator taxonomy'
          assert gt.get('metadata')==['categoryKey','brandKey','modelKey','comparisonKey','landingPath'], 'metadata contract'
          assert int(lc.get('minWords') or 0)>=5000 and lc.get('seo') is True and lc.get('geoAeo') is True and lc.get('eeat') is True, 'landing quality contract'
          assert int(b.get('dailyTarget') or 0)==32000 and int(b.get('batchSize') or 0)==16, 'bulk target/batch'
          p=b.get('catchupPlan') or {}
          assert int(p.get('target') or 0)==30000 and int(p.get('catchupBatchSize') or 0)==64 and int(p.get('windowHours') or 0)==8, '30k catchup plan'
          if int(p.get('remaining') or 0)>0:
              assert 32<=int(p.get('effectiveBatchSize') or 0)<=64, 'adaptive effective batch'
              assert int(p.get('adaptiveBatchSize') or 0)==int(p.get('effectiveBatchSize') or 0), 'adaptive batch health'
              assert int(p.get('targetBatchDurationMs') or 0)==52000, 'adaptive target ms'
          assert float(p.get('qualityThresholdFloor') or 0)>=95 and int(p.get('minArticleWords') or 0)>=1000, 'catchup quality floor'
          if int(p.get('remaining') or 0)>0: assert p.get('capacityMeetsEightHourGoal') is True, '8h catchup capacity'
          assert int(s.get('dailyTargetArabic') or 0)==32000, 'instant stats target'
          assert int(s.get('total') or 0)==int(s.get('arabic') or 0)+int(s.get('english') or 0), 'content stats total'
          q=b.get('lastQuality')
          if q is not None: assert float(q)>=95, f'last quality {q}'
          w=b.get('lastWordCount')
          if w is not None: assert 1000<=int(w)<=2000, f'last words {w}'
          providers=g.get('providers',{})
          if 'external' in providers: assert providers.get('external') is False, 'external provider active'
          print('FINAL_LIVE_PASS',{'routes':c.get('routes'),'bulk':{'target':b.get('dailyTarget'),'batch':b.get('batchSize'),'quality':q,'words':w,'publishedToday':b.get('publishedToday'),'publishedTotal':b.get('publishedTotal')},'contentStats':s})
          PY
