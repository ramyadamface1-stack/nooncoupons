name: Verify Live Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and provider isolation checks
        run: |
          node --check auto-platform.js
          node --check workers-ai-generator.js
          node --check generator-core-v2.js
          node --check generator-core.js
          node --check platform.js
          node --check admin-runtime.js
          node --check admin-page.js
          if grep -E -n 'generativelanguage\.googleapis\.com|api\.x\.ai|api\.groq\.com|GEMINI_API_KEY|XAI_API_KEY|GROQ_API_KEY' auto-platform.js workers-ai-generator.js generator-core-v2.js generator-core.js platform.js admin-runtime.js; then
            echo 'EXTERNAL_AI_REFERENCE_FOUND_IN_ACTIVE_RUNTIME'
            exit 1
          fi
      - name: Verify deployed Worker
        id: live
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee /tmp/live-verify.log) 2>&1
          ORIGIN="https://nooncoupons.ramychatgptgcoupons.workers.dev"
          rc=0
          check_contains(){ name="$1"; text="$2"; needle="$3"; if printf '%s' "$text" | grep -q "$needle"; then echo "PASS $name"; else echo "FAIL $name :: $needle"; rc=1; fi; }
          health=""
          for i in $(seq 1 24); do
            health="$(curl -sS --max-time 20 "$ORIGIN/api/generator-health" 2>&1 || true)"
            if printf '%s' "$health" | grep -q 'generator-3.2-cloudflare-only-clean'; then break; fi
            sleep 10
          done
          platform="$(curl -sS --max-time 20 "$ORIGIN/api/platform-health" 2>&1 || true)"
          state="$(curl -sS --max-time 20 "$ORIGIN/api/state" 2>&1 || true)"
          printf '%s\n' "$health" > /tmp/generator-health.json
          printf '%s\n' "$platform" > /tmp/platform-health.json
          printf '%s\n' "$state" > /tmp/state.json
          echo '--- GENERATOR HEALTH ---'; cat /tmp/generator-health.json
          check_contains generator_version "$health" 'generator-3.2-cloudflare-only-clean'
          check_contains preferred_provider "$health" '"preferredProvider": "workers-ai"'
          check_contains external_false "$health" '"external": false'
          check_contains legacy_removed "$health" '"legacyProvidersRemoved": true'
          check_contains quota_field "$health" '"quotaBlocked"'
          echo '--- PLATFORM HEALTH ---'; cat /tmp/platform-health.json
          check_contains platform_version "$platform" 'platform-1.3-cloudflare-only'
          check_contains platform_legacy_removed "$platform" '"legacyProvidersRemoved": true'
          echo '--- STATE ---'; head -c 4000 /tmp/state.json || true; echo
          check_contains state_primary "$state" '"aiPrimary": "workers-ai"'
          check_contains state_fallback "$state" '"aiFallback": null'
          code="$(curl -sS -o /tmp/legacy.json -w '%{http_code}' -X POST "$ORIGIN/api/ai/generate" || true)"
          echo "legacy_generate_http=$code"; cat /tmp/legacy.json 2>/dev/null || true
          if [ "$code" = "410" ]; then echo 'PASS legacy_410'; else echo 'FAIL legacy_410'; rc=1; fi
          if curl -sS --max-time 30 "$ORIGIN/blog" -o /tmp/blog.html && grep -q 'مدونة كوبونات نون' /tmp/blog.html; then echo 'PASS blog'; else echo 'FAIL blog'; rc=1; fi
          echo "FINAL_RC=$rc"
          exit "$rc"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-verify-diagnostics
          path: |
            /tmp/live-verify.log
            /tmp/generator-health.json
            /tmp/platform-health.json
            /tmp/state.json
            /tmp/legacy.json
            /tmp/blog.html
          if-no-files-found: ignore
          retention-days: 1
