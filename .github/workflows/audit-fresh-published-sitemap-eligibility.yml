name: Audit Fresh Published Articles Missing from Quality Sitemaps
on:
  push:
    branches: [audit/do-restore-and-r2-parity-20261021]
    paths: ['.github/workflows/audit-fresh-published-sitemap-eligibility.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check public ControlPlane 24-hour articles for SEO eligibility, never publish or write
        shell: bash
        run: |
          python3 -u - <<'PY'
          import urllib.request,urllib.parse,json,collections,datetime
          q=urllib.request.Request('https://noondealsnow.com/api/state',headers={'Accept':'application/json','User-Agent':'ReadOnly-Fresh-Sitemap-Eligibility'})
          with urllib.request.urlopen(q,timeout=20) as r:state=json.loads(r.read(45000000))
          rows=state.get('articles') or []
          now=datetime.datetime.now(datetime.timezone.utc)
          recent=[];valid=[];excluded=collections.Counter()
          for a in rows:
            if not isinstance(a,dict):continue
            if a.get('status')!='published':continue
            date=a.get('publishedAt') or a.get('createdAt') or a.get('updatedAt')
            try:t=datetime.datetime.fromisoformat(str(date).replace('Z','+00:00'))
            except Exception:continue
            if t>now or now-t>datetime.timedelta(hours=48):continue
            slug=str(a.get('slug') or '')
            if not slug or len(slug)>280 or '/' in slug or '..' in slug:continue
            recent.append(a)
            quality=int(a.get('quality') or a.get('seoScore') or 0)
            words=int(a.get('wordCount') or a.get('words') or 0)
            if quality<95:excluded['quality_or_missing']+=1;continue
            if words<1500:excluded['word_count_or_missing']+=1;continue
            valid.append(a)
          print('FRESH_DO_AUDIT='+json.dumps({'totalArticleRecords':len(rows),'recentPublished48h':len(recent),'eligibleStrict':len(valid),'excluded':dict(excluded),'fieldSamples':[{k:a.get(k) for k in ('slug','country','quality','seoScore','wordCount','words','createdAt','publishedAt') if k in a} for a in recent[:8]]},ensure_ascii=False),flush=True)
          tested=0
          for a in recent[:8]:
            slug=str(a.get('slug'));prefix='/en/articles/' if slug.startswith('en-') else '/articles/'
            url='https://noondealsnow.com'+prefix+urllib.parse.quote(slug)
            req=urllib.request.Request(url,headers={'User-Agent':'ReadOnly-Fresh-Article-Test'})
            try:
              with urllib.request.urlopen(req,timeout=18) as r:status=r.status;payload=r.read(15000)
            except Exception as e:status=type(e).__name__;payload=b''
            print('FRESH_ARTICLE_CHECK='+json.dumps({'slug':slug[:100],'status':status,'bytesSample':len(payload)},ensure_ascii=False),flush=True)
            tested+=1
          print('FRESH_AUDIT_NO_WRITES=true')
          PY
